<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConstructPM — Shop Display Board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap');

:root {
  --bg: #0a0c10; --bg2: #13161d; --bg3: #1c2029;
  --text: #e8eaed; --text2: #8b92a5; --text3: #555b6e;
  --green: #34d399; --green-bg: rgba(52,211,153,.12);
  --yellow: #fbbf24; --yellow-bg: rgba(251,191,36,.12);
  --red: #f87171; --red-bg: rgba(248,113,113,.12);
  --blue: #60a5fa; --blue-bg: rgba(96,165,250,.1);
  --orange: #fb923c;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'IBM Plex Sans',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; }

.board { display:grid; grid-template-rows:auto 1fr auto; height:100vh; }

/* Header */
.header { display:flex; justify-content:space-between; align-items:center; padding:20px 32px; border-bottom:1px solid var(--bg3); }
.header h1 { font-size:28px; font-weight:700; letter-spacing:-.5px; }
.header h1 span { color:var(--blue); }
.header-right { display:flex; align-items:center; gap:24px; }
.clock { font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:500; color:var(--text); }
.date { font-size:14px; color:var(--text2); }
.refresh-dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Stats bar */
.stats { display:flex; gap:2px; padding:12px 32px; background:var(--bg2); }
.stat { flex:1; text-align:center; padding:8px; }
.stat .num { font-size:36px; font-weight:700; font-family:'JetBrains Mono',monospace; }
.stat .label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text2); margin-top:2px; }

/* Main grid */
.content { display:grid; grid-template-columns:2fr 1fr; gap:2px; overflow:hidden; }
.column { overflow-y:auto; padding:20px 24px; }
.column:first-child { background:var(--bg); }
.column:last-child { background:var(--bg2); }

.section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--text2); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--bg3); }

/* Tickets */
.ticket { background:var(--bg2); border-radius:10px; padding:16px 20px; margin-bottom:10px; border-left:4px solid var(--text3); position:relative; }
.ticket.open { border-left-color:var(--red); }
.ticket.partially_filled { border-left-color:var(--yellow); }
.ticket.filled { border-left-color:var(--green); }
.ticket-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.ticket-project { font-size:18px; font-weight:700; }
.ticket-badge { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.5px; }
.ticket.open .ticket-badge { background:var(--red-bg); color:var(--red); }
.ticket.partially_filled .ticket-badge { background:var(--yellow-bg); color:var(--yellow); }
.ticket.filled .ticket-badge { background:var(--green-bg); color:var(--green); }
.ticket-meta { font-size:12px; color:var(--text2); margin-bottom:10px; }
.ticket-items { display:flex; flex-direction:column; gap:4px; }
.ticket-item { display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0; }
.ticket-item .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.ticket-item .dot.pending { background:var(--red); }
.ticket-item .dot.assigned { background:var(--green); }
.ticket-item .barcode { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--blue); margin-left:auto; }
.ticket-progress { display:flex; gap:3px; margin-top:10px; }
.ticket-progress .bar { height:4px; border-radius:2px; flex:1; }
.ticket-progress .bar.done { background:var(--green); }
.ticket-progress .bar.todo { background:var(--bg3); }

/* Carryover */
.carryover .ticket { opacity:.7; }
.carryover .section-title { color:var(--orange); }

/* Right column items */
.activity-item { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--bg3); font-size:13px; }
.activity-item .icon { font-size:18px; }
.activity-item .name { font-weight:600; }
.activity-item .detail { color:var(--text2); font-size:12px; }
.activity-item .time { font-size:11px; color:var(--text3); margin-left:auto; font-family:'JetBrains Mono',monospace; }

.alert-item { background:var(--red-bg); border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:13px; }
.alert-item .alert-title { font-weight:700; color:var(--red); }
.alert-item .alert-detail { color:var(--text2); font-size:12px; margin-top:2px; }

.maint-item { background:var(--yellow-bg); border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:13px; }
.maint-item .maint-title { font-weight:700; color:var(--yellow); }

/* Footer */
.footer { padding:8px 32px; background:var(--bg2); border-top:1px solid var(--bg3); display:flex; justify-content:space-between; font-size:11px; color:var(--text3); }

/* No data state */
.empty { text-align:center; padding:40px 20px; color:var(--text3); }
.empty .icon { font-size:48px; margin-bottom:12px; }
.empty .msg { font-size:16px; }
</style>
</head>
<body>
<div class="board">
  <div class="header">
    <h1><span>■</span> Equipment Display Board</h1>
    <div class="header-right">
      <div><span class="date" id="d-date"></span></div>
      <div class="clock" id="d-clock"></div>
      <div class="refresh-dot" title="Auto-refreshing"></div>
    </div>
  </div>

  <div id="d-stats" class="stats"></div>

  <div class="content">
    <div class="column" id="d-tickets"></div>
    <div class="column" id="d-sidebar"></div>
  </div>

  <div class="footer">
    <span>ConstructPM Display Board</span>
    <span id="d-refresh-time">Refreshing...</span>
  </div>
</div>

<script>
const TOKEN = new URLSearchParams(window.location.search).get('token') || 'shopfloor';
const REFRESH_MS = 30000; // 30 seconds

function fmt(d) { return new Date(d).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d) { return new Date(d).toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'}); }

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('d-clock').textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('d-date').textContent = fmtDate(now);
}
setInterval(updateClock, 1000);
updateClock();

async function loadBoard() {
  try {
    const r = await fetch(`/api/display/board?token=${TOKEN}`);
    if (!r.ok) throw new Error('Auth failed');
    const data = await r.json();
    render(data);
    document.getElementById('d-refresh-time').textContent = `Last refresh: ${fmt(new Date())}`;
  } catch (e) {
    document.getElementById('d-tickets').innerHTML = `<div class="empty"><div class="icon">⚠️</div><div class="msg">${e.message}<br>URL: /display.html?token=YOUR_TOKEN</div></div>`;
  }
}

function render(data) {
  // Stats bar
  const s = data.stats || {};
  document.getElementById('d-stats').innerHTML = `
    <div class="stat"><div class="num" style="color:var(--text)">${s.total||0}</div><div class="label">Total Equipment</div></div>
    <div class="stat"><div class="num" style="color:var(--green)">${s.available||0}</div><div class="label">Available</div></div>
    <div class="stat"><div class="num" style="color:var(--blue)">${s.checked_out||0}</div><div class="label">Checked Out</div></div>
    <div class="stat"><div class="num" style="color:var(--yellow)">${s.needs_maintenance||0}</div><div class="label">Needs Maintenance</div></div>
    <div class="stat"><div class="num" style="color:var(--red)">${data.requests_today.filter(r=>r.status==='open').length}</div><div class="label">Open Orders</div></div>
    <div class="stat"><div class="num" style="color:var(--green)">${data.checkouts_today.length}</div><div class="label">Checkouts Today</div></div>
  `;

  // Left column — tickets
  const tickets = document.getElementById('d-tickets');
  tickets.innerHTML = '';

  if (data.requests_today.length === 0 && data.requests_carryover.length === 0) {
    tickets.innerHTML = '<div class="empty"><div class="icon">✅</div><div class="msg">No open equipment requests</div></div>';
  } else {
    // Today's requests
    if (data.requests_today.length > 0) {
      tickets.innerHTML += '<div class="section-title">Today\'s Orders</div>';
      data.requests_today.forEach(r => { tickets.innerHTML += renderTicket(r); });
    }

    // Carryover (unfilled from previous days)
    if (data.requests_carryover.length > 0) {
      tickets.innerHTML += '<div class="carryover"><div class="section-title">⚠ Carryover (Unfilled from Previous Days)</div>';
      data.requests_carryover.forEach(r => { tickets.innerHTML += renderTicket(r); });
      tickets.innerHTML += '</div>';
    }
  }

  // Right column — activity + alerts
  const sidebar = document.getElementById('d-sidebar');
  sidebar.innerHTML = '';

  // Maintenance alerts
  if (data.maintenance_items.length > 0) {
    sidebar.innerHTML += '<div class="section-title">🔧 Maintenance Required</div>';
    data.maintenance_items.forEach(item => {
      sidebar.innerHTML += `<div class="maint-item"><div class="maint-title">${item.equipment_name}</div><div style="font-size:12px;color:var(--text2)">${item.barcode_id} · ${item.equipment_type||'—'}</div></div>`;
    });
  }

  // Cert expirations
  if (data.expiring_certs.length > 0) {
    sidebar.innerHTML += '<div class="section-title" style="margin-top:16px">📋 Certs Expiring Soon</div>';
    data.expiring_certs.forEach(item => {
      const days = Math.ceil((new Date(item.certification_date) - new Date()) / 86400000);
      sidebar.innerHTML += `<div class="alert-item"><div class="alert-title">${item.equipment_name}</div><div class="alert-detail">${item.barcode_id} · ${days <= 0 ? 'EXPIRED' : days + ' days left'}</div></div>`;
    });
  }

  // Today's checkouts
  if (data.checkouts_today.length > 0) {
    sidebar.innerHTML += '<div class="section-title" style="margin-top:16px">📤 Checked Out Today</div>';
    data.checkouts_today.forEach(co => {
      sidebar.innerHTML += `<div class="activity-item"><span class="icon">📤</span><div><div class="name">${co.equipment_name}</div><div class="detail">${co.barcode_id} → ${co.project_name}</div></div><span class="time">${fmt(co.checked_out_at)}</span></div>`;
    });
  }

  // Today's returns
  if (data.returns_today.length > 0) {
    sidebar.innerHTML += '<div class="section-title" style="margin-top:16px">📥 Returned Today</div>';
    data.returns_today.forEach(ret => {
      sidebar.innerHTML += `<div class="activity-item"><span class="icon">📥</span><div><div class="name">${ret.equipment_name}</div><div class="detail">${ret.barcode_id} ← ${ret.project_name}</div></div><span class="time">${fmt(ret.returned_at)}</span></div>`;
    });
  }

  if (sidebar.innerHTML === '') {
    sidebar.innerHTML = '<div class="empty"><div class="icon">📋</div><div class="msg">No activity yet today</div></div>';
  }
}

function renderTicket(r) {
  const statusLabel = r.status === 'filled' ? 'FILLED' : r.status === 'partially_filled' ? `${r.filled_lines}/${r.total_lines} FILLED` : 'OPEN';
  let items = '';
  (r.lines || []).forEach(line => {
    const assigned = !!line.assigned_equipment_id;
    items += `<div class="ticket-item"><span class="dot ${assigned?'assigned':'pending'}"></span><span>${line.item_description}${line.quantity > 1 ? ' ×' + line.quantity : ''}</span>${assigned ? `<span class="barcode">${line.barcode_id||''} ${line.assigned_equipment_name||''}</span>` : ''}</div>`;
  });

  let progress = '';
  if (r.total_lines > 0) {
    progress = '<div class="ticket-progress">';
    for (let i = 0; i < r.total_lines; i++) {
      progress += `<div class="bar ${i < r.filled_lines ? 'done' : 'todo'}"></div>`;
    }
    progress += '</div>';
  }

  return `<div class="ticket ${r.status}"><div class="ticket-header"><span class="ticket-project">${r.project_name}</span><span class="ticket-badge">${statusLabel}</span></div><div class="ticket-meta">Requested by ${r.requested_by_name}${r.personnel_name ? ' for ' + r.personnel_name : ''}</div><div class="ticket-items">${items}</div>${progress}</div>`;
}

// Initial load + auto-refresh
loadBoard();
setInterval(loadBoard, REFRESH_MS);
</script>
</body>
</html>
