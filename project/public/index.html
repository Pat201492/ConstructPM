// DATA EXPORT (cross-table query builder)
// ═══════════════════════════════════════════════════════════
async function renderExports(main) {
  main.append(h('div',{className:'page-header'},[h('h1',{},'Data Export')]));

  const sources=await api('/exports/builder/sources');
  let selectedSource=null;
  let selectedColumns=[];

  // Top bar: source + dates
  const topBar=h('div',{style:'display:flex;gap:12px;align-items:end;margin-bottom:20px;flex-wrap:wrap'});
  const sourceSel=h('select',{id:'exp-source',style:'width:220px'});
  sourceSel.append(h('option',{value:''},'Choose source...'));
  Object.entries(sources).forEach(([key,src])=>sourceSel.append(h('option',{value:key},src.label)));
  topBar.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Data Source'),sourceSel]));
  const startInput=makeDateInput({id:'exp-start',style:'width:150px'});
  const endInput=makeDateInput({id:'exp-end',style:'width:150px'});
  topBar.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'From'),startInput]));
  topBar.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'To'),endInput]));
  main.append(topBar);

  // Two-panel layout
  const panels=h('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:20px'});
  const leftPanel=h('div',{id:'exp-left'});
  const rightPanel=h('div',{id:'exp-right'});
  panels.append(leftPanel); panels.append(rightPanel);
  main.append(panels);

  function updateSelected() {
    selectedColumns=[];
    $$('#exp-left input.exp-col:checked').forEach(cb=>selectedColumns.push(cb.dataset.col));
    renderSelectedPanel();
  }

  function renderSelectedPanel() {
    rightPanel.innerHTML='';
    rightPanel.append(h('div',{style:'font-size:14px;font-weight:700;margin-bottom:12px'},'Selected Columns ('+selectedColumns.length+')'));
    if(selectedColumns.length===0) {
      rightPanel.append(h('p',{style:'color:var(--text3);font-size:13px'},'Check columns from the tables on the left.'));
      return;
    }
    const src=sources[selectedSource];
    const allCols=[]; src.groups.forEach(g=>g.columns.forEach(c=>allCols.push(c)));
    const selList=h('div',{style:'margin-bottom:16px;max-height:300px;overflow-y:auto'});
    selectedColumns.forEach(colKey=>{
      const def=allCols.find(c=>c.key===colKey);
      const row=h('div',{style:'display:flex;align-items:center;justify-content:space-between;padding:4px 8px;margin-bottom:2px;background:var(--bg3);border-radius:4px;font-size:12px'});
      const tbl=colKey.split('.')[0].replace('users_pm','PM').replace('users_est','Estimator').replace('customer_contacts','Contact');
      row.append(h('span',{},[h('span',{style:'color:var(--primary);font-weight:600'},tbl+'. '),document.createTextNode(def?def.label:colKey.split('.')[1])]));
      row.append(h('span',{style:'cursor:pointer;color:var(--red);padding:0 4px',onclick:()=>{
        const cb=document.querySelector('input[data-col="'+colKey+'"]');
        if(cb) cb.checked=false;
        updateSelected();
      }},'×'));
      selList.append(row);
    });
    rightPanel.append(selList);
    const actions=h('div',{style:'display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap'});
    actions.append(h('button',{className:'btn',onclick:doDownload},'Download CSV'));
    actions.append(h('button',{className:'btn-outline',onclick:doPreview},'Preview'));
    actions.append(h('button',{className:'btn-outline',style:'margin-left:auto',onclick:()=>{
      $$('#exp-left input.exp-col').forEach(cb=>{cb.checked=false;});
      updateSelected();
    }},'Clear All'));
    rightPanel.append(actions);
    rightPanel.append(h('div',{id:'exp-preview-area'}));
  }

  sourceSel.onchange=()=>{
    selectedSource=sourceSel.value;
    leftPanel.innerHTML=''; rightPanel.innerHTML='';
    if(!selectedSource) return;
    const src=sources[selectedSource];
    selectedColumns=[];
    leftPanel.append(h('div',{style:'font-size:14px;font-weight:700;margin-bottom:12px'},'Available Tables'));
    src.groups.forEach((group,gi)=>{
      const card=h('div',{style:'background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden'});
      const header=h('div',{style:'display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg3);cursor:pointer;user-select:none'});
      const allCb=h('input',{type:'checkbox',style:'width:auto'});
      const arrow=h('span',{style:'color:var(--text3);font-size:11px'},(gi===0)?'▼':'▶');
      header.append(allCb);
      header.append(arrow);
      header.append(h('span',{style:'font-weight:700;font-size:13px;color:var(--primary)'},group.group));
      header.append(h('span',{style:'font-size:11px;color:var(--text3);margin-left:auto'},group.columns.length+' cols'));
      card.append(header);
      const body=h('div',{style:'padding:8px 12px;display:'+(gi===0?'block':'none')});
      const colCbs=[];
      group.columns.forEach(col=>{
        const row=h('label',{style:'display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;cursor:pointer'});
        const cb=h('input',{type:'checkbox',className:'exp-col',style:'width:auto'});
        cb.dataset.col=col.key;
        if(gi===0) cb.checked=true;
        cb.onchange=()=>{ allCb.checked=colCbs.every(c=>c.checked); updateSelected(); };
        colCbs.push(cb);
        row.append(cb); row.append(document.createTextNode(col.label));
        body.append(row);
      });
      card.append(body);
      header.onclick=(e)=>{
        if(e.target===allCb) return;
        const show=body.style.display==='none';
        body.style.display=show?'block':'none';
        arrow.textContent=show?'▼':'▶';
      };
      allCb.checked=gi===0;
      allCb.onclick=(e)=>{ e.stopPropagation(); colCbs.forEach(cb=>{cb.checked=allCb.checked;}); updateSelected(); };
      leftPanel.append(card);
    });
    updateSelected();
  };

  async function doPreview() {
    if(!selectedSource||selectedColumns.length===0) return alert('Select a source and columns');
    const area=document.getElementById('exp-preview-area'); if(!area) return;
    area.innerHTML='Loading...';
    try {
      const result=await api('/exports/builder/preview',{method:'POST',body:JSON.stringify({
        source:selectedSource,columns:selectedColumns,
        filters:{start_date:readDateInput(startInput)||undefined,end_date:readDateInput(endInput)||undefined}})});
      area.innerHTML='';
      area.append(h('p',{style:'font-size:11px;color:var(--text3);margin-bottom:6px'},result.rows.length+' of '+result.total+' rows'));
      area.append(makeTable(result.headers,result.rows.map(r=>r.map(v=>v==null?'':String(v).substring(0,40)))));
    } catch(e) { area.innerHTML='<p style="color:var(--red)">'+e.message+'</p>'; }
  }

  async function doDownload() {
    if(!selectedSource||selectedColumns.length===0) return alert('Select a source and columns');
    try {
      const resp=await fetch('/api/exports/builder/download',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.token},
        body:JSON.stringify({source:selectedSource,columns:selectedColumns,
          filters:{start_date:readDateInput(startInput)||undefined,end_date:readDateInput(endInput)||undefined}})});
      const blob=await resp.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=selectedSource+'_export_'+new Date().toISOString().split('T')[0]+'.csv';
      document.body.append(a);a.click();a.remove();
      URL.revokeObjectURL(url);
    } catch(e) { alert(e.message); }
  }
}

// ═══════════════════════════════════════════════════════════
// FILE DROP / PASTE ZONE
// ═══════════════════════════════════════════════════════════
//
// Unified file-input helper: supports click-to-pick, drag-and-drop,
// and clipboard paste. Used by all four inbox cards (and reusable
// elsewhere). Returns a container element + an API to read staged
// files at upload time.
//
// Mirrors the multi-method file input pattern most chat tools use
// (drop a file, paste a screenshot, or click to choose) so that
// users can pick whichever feels natural.
//
// Usage:
//   const zone = fileDropPasteZone({
//     accept: '.pdf,.png,.jpg,.jpeg,.tiff,.webp',
//     multiple: true,
//     placeholder: 'Drop a PDF or screenshot, paste from clipboard, or click to choose',
//   });
//   card.append(zone.container);
//   // ... at upload time:
//   const files = zone.getFiles();
//
// Notes:
//   - Pasted images are renamed `pasted_<ts>_<rand>.<ext>` (originals
//     don't have filenames). Dropped/picked files keep their names.
//   - Files are filtered against `accept` regardless of input method;
//     unsupported drops/pastes are skipped silently and the user is
//     told via an inline notice (not a modal alert).
//   - Object URLs for image previews are revoked when the user removes
//     a thumbnail to free memory.
//
function fileDropPasteZone({ accept = '', multiple = true, placeholder = '', maxFiles = 20 } = {}) {
  const staged = [];        // File[]
  const previewUrls = new Map(); // file -> object URL (for revoke)

  // Parse `accept` into an extension set + a MIME prefix list, used
  // for filtering paste/drop-injected files (the file picker does
  // its own filtering via the accept attribute, but we re-validate
  // in case the browser is loose about it).
  const acceptParsed = (() => {
    const exts = new Set();
    const mimes = [];
    for (const part of (accept || '').split(',').map(s => s.trim()).filter(Boolean)) {
      if (part.startsWith('.')) exts.add(part.toLowerCase());
      else if (part.endsWith('/*')) mimes.push(part.slice(0, -1)); // "image/*" -> "image/"
      else mimes.push(part.toLowerCase());
    }
    return { exts, mimes };
  })();

  function fileMatchesAccept(file) {
    if (acceptParsed.exts.size === 0 && acceptParsed.mimes.length === 0) return true;
    const name = (file.name || '').toLowerCase();
    for (const ext of acceptParsed.exts) {
      if (name.endsWith(ext)) return true;
    }
    const type = (file.type || '').toLowerCase();
    for (const mime of acceptParsed.mimes) {
      if (mime.endsWith('/')) { if (type.startsWith(mime)) return true; }
      else if (type === mime) return true;
    }
    return false;
  }

  // Hidden native input — opens file picker on zone click.
  const input = h('input', { type: 'file', accept: accept || '', style: 'display:none' });
  if (multiple) input.setAttribute('multiple', 'multiple');

  // Inline notice line (for "skipped N files" messages — non-blocking).
  const notice = h('div', { style: 'font-size:11px;color:var(--yellow);min-height:14px;margin-top:6px' });
  let noticeTimer = null;
  function showNotice(msg) {
    notice.textContent = msg;
    if (noticeTimer) clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { notice.textContent = ''; }, 4000);
  }

  // Drop / paste / click zone — visually a dashed-bordered area.
  const zone = h('div', {
    tabindex: '0',
    style: 'border:2px dashed var(--border);border-radius:var(--radius);padding:18px 16px;text-align:center;cursor:pointer;background:var(--bg2);transition:border-color 0.15s, background 0.15s;outline:none',
  });

  const labelDefault = placeholder
    || 'Click to focus, paste (Ctrl+V), drop a file, or double-click to choose';
  const labelEl = h('div', { style: 'color:var(--text2);font-size:13px;line-height:1.5' });
  labelEl.innerHTML = `📎 <strong>Click</strong> here, then <strong>paste</strong> (Ctrl+V) &nbsp;·&nbsp; <strong>drop</strong> a file &nbsp;·&nbsp; <strong>double-click</strong> to browse<br><span style="font-size:11px;color:var(--text3)">${escapeHtml(labelDefault)}</span>`;
  zone.append(labelEl);

  // Thumbnail strip — rendered on each staged change.
  const thumbs = h('div', { style: 'display:flex;flex-wrap:wrap;gap:8px;margin-top:10px' });

  function renderThumbs() {
    // Revoke any URLs that no longer point at staged files
    for (const [file, url] of previewUrls.entries()) {
      if (!staged.includes(file)) {
        try { URL.revokeObjectURL(url); } catch {}
        previewUrls.delete(file);
      }
    }
    thumbs.innerHTML = '';
    if (staged.length === 0) return;

    staged.forEach((file, idx) => {
      const tile = h('div', { style: 'position:relative;width:78px;height:78px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center' });

      if (file.type && file.type.startsWith('image/')) {
        let url = previewUrls.get(file);
        if (!url) { url = URL.createObjectURL(file); previewUrls.set(file, url); }
        tile.append(h('img', { src: url, style: 'width:100%;height:100%;object-fit:cover' }));
      } else {
        // PDF or other — generic icon
        const ext = (file.name || '').split('.').pop().toLowerCase();
        const icon = ext === 'pdf' ? '📕' : '📄';
        tile.append(h('div', { style: 'font-size:24px' }, icon));
      }

      // Caption (truncated filename)
      tile.append(h('div', {
        title: file.name || '',
        style: 'position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);color:#fff;font-size:10px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
      }, file.name || 'pasted'));

      // Remove button
      const x = h('button', {
        type: 'button',
        title: 'Remove',
        style: 'position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0',
      }, '×');
      x.onclick = (e) => {
        e.stopPropagation();
        const removed = staged.splice(idx, 1)[0];
        if (removed && previewUrls.has(removed)) {
          try { URL.revokeObjectURL(previewUrls.get(removed)); } catch {}
          previewUrls.delete(removed);
        }
        renderThumbs();
      };
      tile.append(x);

      thumbs.append(tile);
    });
  }

  function addFiles(fileList) {
    if (!fileList || fileList.length === 0) return;
    let rejected = 0;
    let added = 0;
    for (const f of fileList) {
      if (!fileMatchesAccept(f)) { rejected++; continue; }
      if (staged.length >= maxFiles) break;
      staged.push(f);
      added++;
    }
    renderThumbs();
    if (rejected > 0) showNotice(`${rejected} file${rejected > 1 ? 's' : ''} skipped — type not accepted here.`);
    else if (added > 0 && staged.length >= maxFiles) showNotice(`Reached ${maxFiles}-file limit; remove some to add more.`);
  }

  // Click → focus the zone so paste (Ctrl+V) works against this surface.
  // Double-click → open the file picker. The previous behavior (single
  // click = picker) made paste choppy: every click into the zone fired
  // the OS dialog instead of letting the browser route the next paste
  // event to the zone. Now the zone behaves like an active text field —
  // tap once to "land" on it, then paste, drop, or double-click to pick.
  zone.onclick = (e) => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'IMG') return;
    zone.focus();
  };
  zone.ondblclick = (e) => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'IMG') return;
    input.click();
  };
  // Visual cue: when focused, the zone shows it can take a paste.
  zone.addEventListener('focus', () => {
    zone.style.borderColor = 'var(--primary)';
    zone.style.borderStyle = 'solid';
  });
  zone.addEventListener('blur', () => {
    zone.style.borderColor = 'var(--border)';
    zone.style.borderStyle = 'dashed';
  });
  input.onchange = () => {
    addFiles(input.files);
    input.value = ''; // allow picking the same file again
  };

  // ── Paste (works when zone has focus) ───────────────────────
  zone.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    const pasted = [];
    for (const item of items) {
      if (item.kind === 'file' && (item.type || '').startsWith('image/')) {
        const blob = item.getAsFile();
        if (blob) {
          const ts = new Date().toISOString().replace(/[:.]/g, '-');
          const rand = Math.random().toString(36).slice(2, 6);
          const ext = (blob.type.split('/')[1] || 'png').split('+')[0]; // svg+xml → svg
          const renamed = new File([blob], `pasted_${ts}_${rand}.${ext}`, { type: blob.type });
          pasted.push(renamed);
        }
      }
    }
    if (pasted.length > 0) {
      e.preventDefault();
      addFiles(pasted);
    }
  });

  // ── Drag & drop ─────────────────────────────────────────────
  let dragDepth = 0; // tracks nested dragenter/dragleave so we don't flicker on inner elements
  zone.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    zone.style.borderColor = 'var(--primary)';
    zone.style.background = 'var(--primary-bg)';
  });
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  });
  zone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) {
      zone.style.borderColor = 'var(--border)';
      zone.style.background = 'var(--bg2)';
    }
  });
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    zone.style.borderColor = 'var(--border)';
    zone.style.background = 'var(--bg2)';
    const files = e.dataTransfer && e.dataTransfer.files;
    addFiles(files);
  });

  zone.append(input);

  const container = h('div', { style: 'margin-bottom:12px' });
  container.append(zone);
  container.append(thumbs);
  container.append(notice);

  return {
    container,
    getFiles: () => staged.slice(),
    clear: () => {
      // Revoke all preview URLs
      for (const url of previewUrls.values()) { try { URL.revokeObjectURL(url); } catch {} }
      previewUrls.clear();
      staged.length = 0;
      renderThumbs();
    },
    addFiles,
  };
}

// Tiny HTML escaper used by the zone helper
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ═══════════════════════════════════════════════════════════
// INBOX (centralized document upload)
// ═══════════════════════════════════════════════════════════
async function renderInbox(main) {
  main.append(h('div',{className:'page-header'},[h('h1',{},'Document Inbox')]));
  main.append(h('p',{style:'color:var(--text2);margin-bottom:20px'},'Upload documents to centralized inboxes. AI will extract data, match to a project, and notify the right person for verification.'));

  const inboxes = [
    { type:'timesheets', label:'Timesheets', desc:'AI extracts fields. Admin verifies; PM gets notified after.', icon:'⏱️',
      projectPicker: 'never',
      accept: '.pdf,.png,.jpg,.jpeg,.tiff,.webp,.csv,.xlsx' },
    { type:'invoices', label:'Invoices', desc:'AI extracts vendor + amount + project number. PM verifies and confirms.', icon:'💰',
      projectPicker: 'optional',
      accept: '.pdf,.png,.jpg,.jpeg,.tiff,.webp,.csv,.xlsx' },
    { type:'purchase-orders', label:'Purchase Orders', desc:'AI extracts vendor + line items + project number. PM verifies and confirms.', icon:'📦',
      projectPicker: 'optional',
      accept: '.pdf,.png,.jpg,.jpeg,.tiff,.webp,.csv,.xlsx' },
    { type:'vendor-quotes', label:'Vendor Quotes & Carts', desc:'Upload a PDF quote OR paste/upload a screenshot of a vendor\u2019s website cart (Home Depot, Grainger, McMaster, Amazon Business, etc.). The source is discarded after extraction \u2014 only the data flows to a new PO draft.', icon:'📋',
      projectPicker: 'required',
      accept: '.pdf,.png,.jpg,.jpeg,.tiff,.webp' },
  ];

  inboxes.forEach(inbox=>{
    const card=h('div',{className:'card',style:'margin-bottom:16px;padding:20px'});
    card.append(h('h3',{style:'margin-bottom:8px'},inbox.icon+' '+inbox.label));
    card.append(h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:12px'},inbox.desc));

    // Project picker — three modes:
    //   'never'    → no picker, AI auto-detects (timesheets)
    //   'optional' → picker shown but not required; AI fills in if user skips (invoices, POs)
    //   'required' → picker shown and required (vendor quotes — quotes have no project info)
    let projField = null;
    if (inbox.projectPicker !== 'never') {
      projField = smartFilter({
        id: 'inbox-proj-' + inbox.type,
        label: inbox.projectPicker === 'required' ? 'Project (required)' : 'Project (optional — AI will detect if you skip)',
        kind: 'projects',
        displayFn: p => `${p.project_number || p.name}${p.project_number ? ' — ' + p.name : ''}`,
        helpText: inbox.projectPicker === 'required'
          ? 'Required — vendor quotes do not carry project information.'
          : 'AI will auto-detect the project from the document. Pick here only to override.',
      });
      projField.input.placeholder = 'Type project number or name...';
      let projCache = null;
      async function getProjects() {
        if (!projCache) {
          try {
            const r = await api('/projects?limit=200&status=active');
            projCache = r.projects || [];
          } catch { projCache = []; }
        }
        return projCache;
      }
      projField.input.oninput = async () => {
        const q = projField.input.value.trim().toLowerCase();
        const all = await getProjects();
        const matches = q
          ? all.filter(p => (p.project_number || '').toLowerCase().includes(q) || (p.name || '').toLowerCase().includes(q)).slice(0, 10)
          : all.slice(0, 10);
        const list = projField.group.querySelector('div[id$="-list"]');
        list.innerHTML = '';
        if (matches.length === 0) {
          list.append(h('div', {style:'padding:8px 10px;font-size:13px;color:var(--text3);font-style:italic'}, 'No matching projects'));
        } else {
          matches.forEach(p => {
            const opt = h('div', {
              style: 'padding:6px 10px;cursor:pointer;font-size:13px;border-top:1px solid var(--border)',
              onmousedown: (e) => {
                e.preventDefault();
                projField.setValue(p);
                list.style.display = 'none';
              },
            }, `${p.project_number || ''} ${p.name}`);
            opt.onmouseenter = () => opt.style.background = 'var(--bg3)';
            opt.onmouseleave = () => opt.style.background = '';
            list.append(opt);
          });
        }
        list.style.display = 'block';
      };
      projField.input.onfocus = projField.input.oninput;
      card.append(projField.group);
    }

    // File input zone — supports click-to-focus + paste, drag & drop, double-click to browse.
    const placeholder = inbox.type === 'vendor-quotes'
      ? 'Click here, then paste a screenshot — or drop a PDF, or double-click to browse'
      : 'Click here, then paste — or drop a file, or double-click to browse';
    const zone = fileDropPasteZone({
      accept: inbox.accept,
      multiple: true,
      placeholder,
      maxFiles: 20,
    });
    card.append(zone.container);

    card.append(h('button',{className:'btn btn-sm',onclick:async()=>{
      const files = zone.getFiles();
      if(!files || !files.length) return alert('Add at least one file (click, drag, or paste).');
      // Required-picker types: must have a project chosen client-side
      if (inbox.projectPicker === 'required' && projField && !projField.getId()) {
        return alert('Pick a project first \u2014 vendor quotes & carts do not contain project info, so the firm employee must assign it at upload time.');
      }
      const fd=new FormData();
      for(const f of files) fd.append('files',f);
      if (projField && projField.getId()) fd.append('project_id', projField.getId());
      try {
        const r=await apiUpload('/inbox/'+inbox.type,fd);
        const ok=r.results?.filter(x=>x.status==='processed').length||0;
        const err=r.results?.filter(x=>x.status==='error').length||0;
        alert(`${ok} processed, ${err} errors`);
        zone.clear();
        navigate('inbox');
      } catch(e) { alert(e.message); }
    }},'Upload & Process'));
    main.append(card);
  });

  // Show pending extractions
  try {
    const {extractions}=await api('/extractions?status=pending&limit=20');
    if(extractions.length>0) {
      main.append(h('h2',{style:'margin:24px 0 12px'},'Pending Verifications'));
      main.append(makeTable(['File','Type','Project','Confidence','Action'],extractions.map(e=>[
        e.file_name,
        h('span',{className:'status status-pending'},e.doc_type),
        e.project_name||'⚠️ Not matched',
        (e.overall_confidence||0)+'%',
        h('button',{className:'btn btn-sm',onclick:()=>navigate('extraction-verify',{id:e.id})},'Verify'),
      ])));
    }
  } catch{}
}

// ═══════════════════════════════════════════════════════════
// EXTRACTION VERIFICATION (checkbox confirmation)
// ═══════════════════════════════════════════════════════════
async function renderExtractionVerify(main) {
  // API returns { extraction: {...}, file_url: ... } — unwrap to get the row.
  // Bug history: this used to dereference the wrapper directly (`ext.project_id`),
  // which silently returned undefined, so the project dropdown never preselected
  // even when the upload had explicitly bound a project_id.
  const resp = await api('/extractions/'+S.params.id);
  if (!resp) return main.append(h('p',{},'Extraction not found'));
  const ext = resp.extraction || resp; // tolerate either shape
  if (!ext || !ext.id) return main.append(h('p',{},'Extraction not found'));

  main.append(h('div',{className:'page-header'},[
    h('h1',{},`Verify: ${ext.file_name}`),
    h('span',{className:'status status-'+ext.status},ext.status),
  ]));

  const data=typeof ext.extracted_data==='string'?JSON.parse(ext.extracted_data):ext.extracted_data||{};
  const conf=typeof ext.confidence_scores==='string'?JSON.parse(ext.confidence_scores):ext.confidence_scores||{};

  // Project assignment
  main.append(h('h3',{style:'margin-bottom:8px'},'Project Assignment'));
  const projGroup=h('div',{className:'form-group',style:'margin-bottom:16px'});
  projGroup.append(h('label',{},'Project (matched: '+(ext.project_name||'NONE')+')'));

  let projects=[];
  try { const r=await api('/projects?limit=200'); projects=r.projects; } catch{}
  const projSelect=h('select',{id:'ev-project'});
  projSelect.append(h('option',{value:''},'— Select project —'));
  projects.forEach(p=>{
    const opt=h('option',{value:p.id},p.name);
    if(p.id===ext.project_id) opt.selected=true;
    projSelect.append(opt);
  });
  projGroup.append(projSelect);
  main.append(projGroup);

  // Extracted fields with checkboxes
  main.append(h('h3',{style:'margin-bottom:8px'},'Extracted Fields'));
  const form=h('div',{className:'form-grid'});

  function addField(key, value, confidence) {
    if(key==='entries'||key==='line_items') return; // Handle arrays separately
    const g=h('div',{className:'form-group'});
    const lbl=h('div',{style:'display:flex;align-items:center;gap:8px'});
    lbl.append(h('input',{type:'checkbox',checked:true,style:'width:auto'}));
    lbl.append(h('label',{},key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())));
    if(confidence) {
      const confColor=confidence==='high'?'var(--green)':confidence==='medium'?'var(--yellow)':'var(--red)';
      lbl.append(h('span',{style:`font-size:10px;color:${confColor};margin-left:auto`},confidence));
    }
    g.append(lbl);
    g.append(h('input',{id:'ev-'+key,value:value!=null?String(value):''}));
    form.append(g);
  }

  Object.entries(data).forEach(([key,val])=>{
    if(Array.isArray(val)) return;
    addField(key,val,conf[key]);
  });
  main.append(form);

  // Line items (if present)
  const lineItems=data.line_items||data.entries||[];
  if(lineItems.length>0) {
    main.append(h('h3',{style:'margin:16px 0 8px'},'Line Items / Entries'));
    if(data.entries) {
      main.append(makeTable(['Project #','Worker','Classification','Date','ST','OT','DT','Miles'],
        lineItems.map(e=>[e.project_number||'',e.worker_name||'',e.classification||'',fmtDtClick(e.work_date),
          e.st_hours||0,e.ot_hours||0,e.dt_hours||0,e.miles_driven||0])));
    } else {
      main.append(makeTable(['Description','Qty','Unit Price','Total'],
        lineItems.map(e=>[e.description||'',e.quantity||'',e.unit_price?'$'+e.unit_price:'',e.total?'$'+e.total:''])));
    }
  }

  // Action buttons
  const btns=h('div',{style:'display:flex;gap:12px;margin-top:20px'});
  btns.append(h('button',{className:'btn btn-green',onclick:async()=>{
    const confirmed={};
    Object.keys(data).forEach(key=>{
      if(Array.isArray(data[key])) { confirmed[key]=data[key]; return; }
      const el=$('#ev-'+key);
      if(el) confirmed[key]=el.value;
    });
    const projectId=$('#ev-project').value;
    if(!projectId) return alert('Please select a project');
    try {
      await api('/extractions/'+ext.id+'/confirm',{method:'POST',body:JSON.stringify({data:confirmed,project_id:projectId})});
      alert('Confirmed and saved!');
      navigate('inbox');
    } catch(e) { alert(e.message); }
  }},'Confirm & Save'));
  btns.append(h('button',{className:'btn-red btn',onclick:async()=>{
    const reason=prompt('Rejection reason (optional):');
    try {
      await api('/extractions/'+ext.id+'/reject',{method:'POST',body:JSON.stringify({reason})});
      navigate('inbox');
    } catch(e) { alert(e.message); }
  }},'Reject'));
  btns.append(h('button',{className:'btn-outline',onclick:()=>navigate('inbox')},'Back'));
  main.append(btns);
}

// ═══════════════════════════════════════════════════════════
// TIMESHEETS
// ═══════════════════════════════════════════════════════════
async function renderTimesheets(main) {
  const hdr=h('div',{className:'page-header'});
  hdr.append(h('h1',{},'Timesheets'));
  const groupBtns=h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'});
  groupBtns.append(h('button',{className:'btn btn-sm',onclick:()=>loadTimesheets('entries')},'All Entries'));
  groupBtns.append(h('button',{className:'btn-outline btn-sm',onclick:()=>loadTimesheets('project')},'By Project'));
  groupBtns.append(h('button',{className:'btn-outline btn-sm',onclick:()=>loadTimesheets('worker')},'By Worker'));
  hdr.append(groupBtns);
  main.append(hdr);

  // Payroll export bar — admins and accounting only see this section
  const canExport = ['admin','accounting','project_manager'].includes(S.user?.role);
  if (canExport) {
    const exportBar = h('div', {style:'background:var(--bg3);padding:12px 16px;border-radius:8px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end'});
    exportBar.append(h('div',{style:'font-weight:600;font-size:13px;width:100%;margin-bottom:4px'},'Payroll Export'));

    const startGroup = h('div',{className:'form-group',style:'flex:1;min-width:140px;margin-bottom:0'});
    startGroup.append(h('label',{style:'font-size:11px;color:var(--text2)'},'Start date'));
    const startInput = makeDateInput({id:'ts-export-start'});
    startGroup.append(startInput);
    exportBar.append(startGroup);

    const endGroup = h('div',{className:'form-group',style:'flex:1;min-width:140px;margin-bottom:0'});
    endGroup.append(h('label',{style:'font-size:11px;color:var(--text2)'},'End date'));
    const endInput = makeDateInput({id:'ts-export-end'});
    endGroup.append(endInput);
    exportBar.append(endGroup);

    const viewGroup = h('div',{className:'form-group',style:'min-width:160px;margin-bottom:0'});
    viewGroup.append(h('label',{style:'font-size:11px;color:var(--text2)'},'View'));
    const viewSel = h('select',{id:'ts-export-view'});
    viewSel.append(h('option',{value:'detailed'},'Detailed (one row per entry)'));
    viewSel.append(h('option',{value:'by_worker'},'By Worker (totals)'));
    viewGroup.append(viewSel);
    exportBar.append(viewGroup);

    const csvBtn = h('button',{
      className:'btn-outline btn-sm',
      onclick: () => downloadPayroll('csv'),
    },'Export CSV');

    const xlsxBtn = h('button',{
      className:'btn btn-sm',
      onclick: () => downloadPayroll('xlsx'),
    },'Export XLSX');

    exportBar.append(csvBtn);
    exportBar.append(xlsxBtn);
    main.append(exportBar);

    async function downloadPayroll(format) {
      const params = new URLSearchParams();
      params.set('format', format);
      const view = $('#ts-export-view')?.value;
      if (view) params.set('view', view);
      const start = readDateInput($('#ts-export-start'));
      const end = readDateInput($('#ts-export-end'));
      if (start) params.set('start_date', start);
      if (end) params.set('end_date', end);
      try {
        const r = await fetch('/api/timesheets/payroll-export?' + params.toString(), {
          headers: {'Authorization': 'Bearer ' + S.token},
        });
        if (!r.ok) {
          const errText = await r.text();
          return alert('Export failed: ' + errText);
        }
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `payroll_timesheets_${(start||'all')}_to_${(end||'now')}.${format}`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) { alert('Export error: ' + e.message); }
    }
  }

  const content=h('div',{id:'ts-content'});
  main.append(content);
  await loadTimesheets('entries');

  async function loadTimesheets(mode) {
    content.innerHTML='Loading...';
    try {
      if(mode==='entries') {
        const {timesheets}=await api('/timesheets?limit=50');
        if(!timesheets.length) { content.innerHTML='<p style="color:var(--text2)">No timesheets yet.</p>'; return; }
        content.innerHTML='';
        // Revenue intentionally NOT shown here — it's a derived figure that
        // belongs on the project financial card, not on individual timesheet
        // rows where it implies double-counting against invoices.
        content.append(makeTable(['Week Ending','Worker','Classification','Project','Days','ST','OT','DT','Miles','Per Diem'],timesheets.map(t=>[
          fmtDtClick(t.week_ending||t.work_date),t.worker_name||'—',t.classification||'—',t.project_name||'—',
          t.days_worked||'5',
          parseFloat(t.st_hours||0).toFixed(1),parseFloat(t.ot_hours||0).toFixed(1),parseFloat(t.dt_hours||0).toFixed(1),
          parseFloat(t.miles_driven||0).toFixed(0),
          parseFloat(t.per_diem_total||0)>0?fmtD(t.per_diem_total):'—',
        ])));
      } else if(mode==='project') {
        const {groups}=await api('/timesheets?group_by=project');
        content.innerHTML='';
        content.append(makeTable(['Project','Workers','Entries','ST','OT','DT','Mileage'],groups.map(g=>[
          g.project_name,g.worker_count,g.entry_count,
          parseFloat(g.total_st||0).toFixed(1),parseFloat(g.total_ot||0).toFixed(1),parseFloat(g.total_dt||0).toFixed(1),
          fmtD(g.total_mileage),
        ])));
      } else {
        const {groups}=await api('/timesheets?group_by=worker');
        content.innerHTML='';
        content.append(makeTable(['Worker','Classification','Projects','Entries','ST','OT','DT'],groups.map(g=>[
          g.worker_name||'—',g.classification||'—',g.project_count,g.entry_count,
          parseFloat(g.total_st||0).toFixed(1),parseFloat(g.total_ot||0).toFixed(1),parseFloat(g.total_dt||0).toFixed(1),
        ])));
      }
    } catch(e) { content.innerHTML='<p>'+e.message+'</p>'; }
  }
}

// ═══════════════════════════════════════════════════════════
// SUPERADMIN — Pat-only feature toggles
// ═══════════════════════════════════════════════════════════
//
// Two-tier admin model:
//   - firm Admin: handles users/roles/templates/etc. for the firm
//   - Superadmin (Pat): controls which feature MODULES the firm sees
//
// This page is the only entry point for the Feature Toggles UI and is
// gated by S.isSuperadmin client-side; the PUT /admin/globals/:key
// endpoint independently enforces the same restriction server-side for
// any key starting with `feature.` (see src/routes/admin.js).
//
// Toggles are stored in global_variables with the `feature.` prefix.
// Saving forces a page reload so the sidebar re-renders without the
// hidden tabs.
async function renderSuperadmin(main) {
  // Defense in depth: even though the sidebar shouldn't show this tab
  // to non-superadmins, guard the render in case a user navigates by
  // URL or has a stale boot state.
  if (!S.isSuperadmin) {
    main.append(h('div',{className:'page-header'},[h('h1',{},'Superadmin')]));
    main.append(h('div',{style:'background:var(--bg3);padding:24px;border-radius:8px;color:var(--text2)'},
      'This area is restricted to superadmins.'));
    return;
  }

  main.append(h('div',{className:'page-header'},[h('h1',{},'Superadmin')]));
  main.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:18px'},
    'Pat-only controls. Firm admins do not see this tab.'));

  // For now: just the Feature Toggles section. Easy to add more
  // superadmin-only sub-tabs later (license management, system-wide
  // diagnostics, etc.) without disturbing the firm Admin page.
  const c = h('div');
  main.append(c);
  await superadminFeatureToggles(c);
}

async function superadminFeatureToggles(c) {
  c.innerHTML = '<h2 style="margin-bottom:8px">Feature Toggles</h2><p>Loading…</p>';

  let rows = [];
  try {
    const r = await api('/admin/globals');
    // GET /admin/globals returns `{ variables: [...] }` (see
    // src/routes/admin.js). Earlier draft guessed `globals` or a bare
    // array fallback — both wrong, hence the "filter is not a function"
    // error when feature toggles loaded. Fixed to use the correct key.
    const list = Array.isArray(r) ? r : (r.variables || r.globals || []);
    rows = list.filter(g => g.key && g.key.startsWith('feature.'));
  } catch (err) {
    c.innerHTML = '';
    c.append(h('div',{style:'color:var(--red)'},'Could not load: ' + err.message));
    return;
  }

  c.innerHTML = '';
  c.append(h('h2',{style:'margin-bottom:6px'},'Feature Toggles'));
  c.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:14px'},
    'Hide entire feature areas from the sidebar and project detail page without redeploying. Changes take effect after Save — the page reloads automatically so the navigation updates.'));

  if (rows.length === 0) {
    c.append(h('div',{style:'background:var(--bg3);padding:18px;border-radius:6px;color:var(--text2)'},
      'No feature flags found. Run pending migrations and reload.'));
    return;
  }

  // Friendly labels for each flag key (the description from the seed is
  // also shown as a smaller subtitle).
  const friendlyLabels = {
    'feature.invoices_enabled':        'Invoices',
    'feature.purchase_orders_enabled': 'Purchase Orders',
    'feature.timesheets_enabled':      'Timesheets',
    'feature.inbox_enabled':           'Inbox & AI Extraction',
    'feature.oil_samples_enabled':     'Oil Samples',
    'feature.field_notes_enabled':     'Field Notes',
  };

  const form = h('div',{style:'background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;max-width:640px'});
  const checkboxes = {}; // key → input element

  rows.forEach(g => {
    const row = h('div',{style:'padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px'});
    const cb = h('input',{type:'checkbox',style:'width:auto;margin-top:3px'});
    cb.checked = g.value === 'true';
    checkboxes[g.key] = cb;
    const lbl = h('label',{style:'flex:1;cursor:pointer'});
    lbl.append(cb);
    lbl.append(h('span',{style:'margin-left:8px;font-weight:600'}, friendlyLabels[g.key] || g.key));
    lbl.append(h('div',{style:'margin-left:26px;font-size:11px;color:var(--text3)'}, g.description || ''));
    row.append(lbl);
    form.append(row);
  });

  // Save button — sends one PUT per flag that changed, then forces reload
  form.append(h('button',{className:'btn',style:'margin-top:14px',onclick:async()=>{
    try {
      const tasks = [];
      rows.forEach(g => {
        const newVal = checkboxes[g.key].checked ? 'true' : 'false';
        if (newVal !== g.value) {
          tasks.push(api('/admin/globals/' + encodeURIComponent(g.key), {
            method: 'PUT',
            body: JSON.stringify({ value: newVal, description: g.description || '' }),
          }));
        }
      });
      if (tasks.length === 0) return alert('No changes to save.');
      await Promise.all(tasks);
      alert(`Saved ${tasks.length} change${tasks.length === 1 ? '' : 's'}. Reloading so the sidebar updates…`);
      // Hard reload — easiest way to repopulate S.features, re-render
      // sidebar everywhere, and ensure no stale state. The user's token
      // persists in localStorage so they stay logged in.
      location.reload();
    } catch (err) { alert(err.message); }
  }},'Save Changes'));

  c.append(form);
}

async function renderAdmin(main) {
  main.append(h('div',{className:'page-header'},[h('h1',{},'Admin')]));

  const tabs=['Users','Roles','Locations','Vendors','Rate Sheet','Global Variables','Templates','Form Templates','Inbox Access','Delegates','Bulk Import','Audit Log'];
  const tabBar=h('div',{style:'display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap'});

  tabs.forEach((t,i)=>{
    tabBar.append(h('button',{className:i===0?'btn':'btn-outline',onclick:async(e)=>{
      $$('button',tabBar).forEach(b=>b.className='btn-outline');
      e.target.className='btn';

      switch(t) {
        case 'Users': await adminUsers(tabContent); break;

async function adminUsers(c) {
  c.innerHTML='';
  const {roles: allRoles}=await api('/admin/roles');

  // Add user form
  const form=h('div',{style:'background:var(--bg3);padding:16px;border-radius:8px;margin-bottom:20px'});
  const formInner=h('div');
  formInner.innerHTML=`<h3 style="margin-bottom:12px">Add New User</h3>
    <div class="form-grid">
      <div class="form-group"><label>First Name</label><input id="au-first" placeholder="First name"></div>
      <div class="form-group"><label>Last Name</label><input id="au-last" placeholder="Last name"></div>
      <div class="form-group"><label>Email</label><input id="au-email" type="email" placeholder="user@company.com"></div>
      <div class="form-group"><label>Initials</label><input id="au-initials" placeholder="e.g. MT" style="text-transform:uppercase" maxlength="4"></div>
      <div class="form-group"><label>PM Code <span style="color:var(--text3);font-weight:normal;font-size:11px">(single letter, PMs only)</span></label><input id="au-pmcode" placeholder="e.g. M" style="text-transform:uppercase" maxlength="1"></div>
      <div class="form-group"><label>Password</label><input id="au-pass" type="password" placeholder="Min 8 characters"></div>
      <div class="form-group"><label>Role</label><select id="au-role"></select></div>
    </div>`;
  form.append(formInner);
  setTimeout(()=>{
    const sel=$('#au-role');
    if(sel) allRoles.forEach(r=>sel.append(h('option',{value:r.role_name},r.display_name)));
  },0);

  const addBtn=h('button',{className:'btn',style:'margin-top:8px',onclick:async()=>{
    const first=$('#au-first').value, last=$('#au-last').value, email=$('#au-email').value;
    if(!first||!last||!email) return alert('First name, last name, and email are required');
    const pass=$('#au-pass').value;
    if(!pass||pass.length<8) return alert('Password must be at least 8 characters');
    try {
      const pmCode=($('#au-pmcode').value||'').trim().toUpperCase();
      const body={
        first_name:first, last_name:last, email:email,
        initials:($('#au-initials').value||first[0]+last[0]).toUpperCase(),
        password:pass, role:$('#au-role').value
      };
      if (pmCode) body.pm_code=pmCode;
      await api('/users',{method:'POST',body:JSON.stringify(body)});
      adminUsers(c);
    } catch(e) { alert(e.message); }
  }},'Create User');
  form.append(addBtn);
  c.append(form);

  // User list
  try {
    const data=await api('/users');
    const users=data.users||data||[];
    c.append(makeTable(['Name','Email','Initials','Role','On Schedule','Active','Last Login','',''],users.map(u=>[
      `${u.first_name} ${u.last_name}`,
      u.email,
      u.initials||'—',
      h('span',{className:'status status-'+(u.role==='admin'?'active':u.role==='project_manager'?'pending':'completed')},u.role.replace(/_/g,' ')),
      u.on_schedule ? '✓' : '—',
      u.active?'Yes':'No',
      u.last_login_at ? fmtDtClick(u.last_login_at) : 'Never',
      h('button',{className:'btn-outline btn-sm',onclick:()=>showEditUserModal(u,allRoles,c)},'Edit'),
      h('button',{className:'btn-outline btn-sm',onclick:()=>showUserAccessModal(u.id,u.first_name+' '+u.last_name,c)},'Access'),
    ])));
  } catch(e) { c.append(h('p',{},e.message)); }
}

function showEditUserModal(user, allRoles, parentC) {
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:500px'});
  modal.append(h('h2',{},`Edit: ${user.first_name} ${user.last_name}`));

  // Editable fields
  const form=h('div',{className:'form-grid'});
  form.innerHTML=`
    <div class="form-group"><label>First Name</label><input id="eu-first" value="${user.first_name||''}"></div>
    <div class="form-group"><label>Last Name</label><input id="eu-last" value="${user.last_name||''}"></div>
    <div class="form-group"><label>Email</label><input id="eu-email" type="email" value="${user.email||''}"></div>
    <div class="form-group"><label>Initials</label><input id="eu-initials" value="${user.initials||''}" style="text-transform:uppercase" maxlength="4"></div>
    <div class="form-group"><label>PM Code <span style="color:var(--text3);font-weight:normal;font-size:11px">(single letter, PMs only)</span></label><input id="eu-pmcode" value="${user.pm_code||''}" style="text-transform:uppercase" maxlength="1"></div>
    <div class="form-group"><label>Phone</label><input id="eu-phone" value="${user.phone||''}"></div>
  `;
  modal.append(form);

  // Role dropdown
  const roleGroup=h('div',{className:'form-group',style:'margin-top:12px'});
  roleGroup.append(h('label',{},'Role'));
  const roleSel=h('select',{id:'eu-role'});
  allRoles.forEach(r=>{const o=h('option',{value:r.role_name},r.display_name);if(r.role_name===user.role)o.selected=true;roleSel.append(o);});
  roleGroup.append(roleSel);
  modal.append(roleGroup);

  // Active toggle
  const activeGroup=h('div',{style:'margin-top:12px'});
  const activeCb=h('input',{type:'checkbox',id:'eu-active',style:'width:auto'});
  activeCb.checked=user.active;
  const activeLbl=h('label',{style:'display:flex;align-items:center;gap:8px;cursor:pointer'});
  activeLbl.append(activeCb);
  activeLbl.append(document.createTextNode('Active (uncheck to deactivate user)'));
  activeGroup.append(activeLbl);
  modal.append(activeGroup);

  // On Schedule toggle — controls whether this user appears in the
  // scheduler grid (rows in By-Worker view + assignable to projects in
  // calendar/grid pickers). Default inherits from the user's role
  // configuration on creation; can be overridden per-user here.
  const onSchedGroup=h('div',{style:'margin-top:8px'});
  const onSchedCb=h('input',{type:'checkbox',id:'eu-on-schedule',style:'width:auto'});
  onSchedCb.checked=!!user.on_schedule;
  const onSchedLbl=h('label',{style:'display:flex;align-items:center;gap:8px;cursor:pointer'});
  onSchedLbl.append(onSchedCb);
  onSchedLbl.append(document.createTextNode('On Schedule (this user appears in the scheduler)'));
  onSchedGroup.append(onSchedLbl);
  modal.append(onSchedGroup);

  // Default markup
  const markupGroup=h('div',{className:'form-group',style:'margin-top:12px;max-width:200px'});
  markupGroup.append(h('label',{},'Default Markup %'));
  markupGroup.append(h('input',{id:'eu-markup',type:'number',step:'0.5',value:user.default_markup_pct||15}));
  modal.append(markupGroup);

  // Save button
  modal.append(h('button',{className:'btn',style:'margin-top:16px',onclick:async()=>{
    try {
      const pmCode=($('#eu-pmcode').value||'').trim().toUpperCase();
      await api('/users/'+user.id,{method:'PATCH',body:JSON.stringify({
        first_name:$('#eu-first').value,
        last_name:$('#eu-last').value,
        email:$('#eu-email').value,
        initials:$('#eu-initials').value,
        pm_code: pmCode || null,
        phone:$('#eu-phone').value,
        role:$('#eu-role').value,
        active:$('#eu-active').checked,
        on_schedule:$('#eu-on-schedule').checked,
        default_markup_pct:parseFloat($('#eu-markup').value)||0,
      })});
      alert('User updated');
      overlay.remove();
      adminUsers(parentC);
    }catch(e){alert(e.message)}
  }},'Save Changes'));

  // Password reset section
  modal.append(h('div',{style:'border-top:1px solid var(--border);margin-top:20px;padding-top:16px'}));
  modal.append(h('h3',{style:'margin-bottom:8px'},'Send Password Reset Link'));
  modal.append(h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:8px'},'Generates a one-time reset link. If email is configured, it will be sent to the user automatically. Otherwise the link is printed to the server console and shown here so you can copy it. User\'s current password stays active until they use the link.'));
  const linkBtn=h('button',{className:'btn-outline btn-sm',onclick:async()=>{
    linkBtn.disabled=true; const prev=linkBtn.textContent; linkBtn.textContent='Generating…';
    try {
      const r=await api('/admin/users/'+user.id+'/password-reset',{method:'POST'});
      if (r.delivery==='email') {
        alert(r.message || 'Reset link emailed to '+user.email);
      } else {
        // Show the link inline so admin can copy and share it
        linkBox.style.display='block';
        linkInput.value=r.link;
        linkExpiry.textContent='Expires: '+new Date(r.expiresAt).toLocaleString();
        linkInput.select();
      }
    } catch(e) { alert(e.message); }
    finally { linkBtn.disabled=false; linkBtn.textContent=prev; }
  }},'Send Reset Link');
  modal.append(linkBtn);

  // Box where the link appears when email is not configured
  const linkBox=h('div',{style:'display:none;margin-top:12px;padding:10px;background:var(--bg3);border-radius:4px;border:1px solid var(--accent,#C55A11)'});
  linkBox.append(h('p',{style:'font-size:12px;font-weight:600;color:var(--accent,#C55A11);margin-bottom:6px'},'⚠️ Email not configured — copy this link and send it to the user:'));
  const linkInput=h('input',{type:'text',readonly:true,style:'width:100%;font-family:monospace;font-size:11px;padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:4px'});
  linkBox.append(linkInput);
  const copyBtn=h('button',{className:'btn-outline btn-sm',style:'margin-top:6px',onclick:()=>{
    linkInput.select();
    try { document.execCommand('copy'); copyBtn.textContent='Copied!'; setTimeout(()=>copyBtn.textContent='Copy Link',1500); }
    catch { /* no-op */ }
  }},'Copy Link');
  linkBox.append(copyBtn);
  const linkExpiry=h('p',{style:'font-size:11px;color:var(--text2);margin-top:6px'},'');
  linkBox.append(linkExpiry);
  modal.append(linkBox);

  // Manual password reset section (admin types new password directly)
  modal.append(h('div',{style:'border-top:1px solid var(--border);margin-top:20px;padding-top:16px'}));
  modal.append(h('h3',{style:'margin-bottom:8px'},'Set Password Directly'));
  modal.append(h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:8px'},'Set a new temporary password. The user will need to change it after logging in.'));
  const passRow=h('div',{style:'display:flex;gap:8px'});
  passRow.append(h('input',{id:'eu-newpass',type:'password',placeholder:'New password (min 8 chars)',style:'flex:1'}));
  passRow.append(h('button',{className:'btn-outline btn-sm',onclick:async()=>{
    const newPass=$('#eu-newpass').value;
    if(!newPass||newPass.length<8) return alert('Password must be at least 8 characters');
    try {
      await api('/users/'+user.id,{method:'PATCH',body:JSON.stringify({password:newPass})});
      alert('Password reset successfully. User will need to log in with the new password.');
      $('#eu-newpass').value='';
    }catch(e){alert(e.message)}
  }},'Set Password'));
  modal.append(passRow);

  // Close
  modal.append(h('button',{className:'btn-outline',style:'margin-top:16px;display:block',onclick:()=>overlay.remove()},'Cancel'));

  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.append(modal);
  document.body.append(overlay);
}

// Per-user access configuration modal
async function showUserAccessModal(userId, userName, parentContainer) {
  const data=await api('/admin/users/'+userId+'/access');
  const {user, role_defaults, user_tab_overrides, user_access_config, bid_assignments, project_assignments, available_tabs}=data;

  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:700px;max-height:90vh;overflow-y:auto'});
  modal.append(h('h2',{},`Access: ${userName}`));
  modal.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:16px'},`Role: ${user.role} — Override role defaults below, or leave blank to use role template.`));

  // ── TAB ACCESS ──
  modal.append(h('h3',{style:'font-size:14px;margin-bottom:8px'},'Tab Access'));
  const useOverride=h('label',{style:'display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer'});
  const overrideCb=h('input',{type:'checkbox',style:'width:auto'});
  overrideCb.checked=!!user_tab_overrides;
  useOverride.append(overrideCb);
  useOverride.append(document.createTextNode('Override role default tabs'));
  modal.append(useOverride);

  const roleTabs=(role_defaults?.allowed_tabs)||[];
  const effectiveTabs=user_tab_overrides||roleTabs;
  const tabGrid=h('div',{style:'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px'});
  const tabCbs=[];
  available_tabs.forEach(tab=>{
    const lbl=h('label',{style:'display:flex;align-items:center;gap:4px;font-size:13px;padding:4px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--border);cursor:pointer'});
    const cb=h('input',{type:'checkbox',style:'width:auto'});
    cb.checked=effectiveTabs.includes(tab.id);
    cb.dataset.tabId=tab.id;
    if(!overrideCb.checked){cb.disabled=true;lbl.style.opacity='0.5';}
    tabCbs.push(cb);
    lbl.append(cb);lbl.append(document.createTextNode(tab.label));
    tabGrid.append(lbl);
  });
  overrideCb.onchange=()=>{
    tabCbs.forEach(cb=>{cb.disabled=!overrideCb.checked;cb.parentElement.style.opacity=overrideCb.checked?'1':'0.5';});
  };
  modal.append(tabGrid);

  // ── VISIBILITY OVERRIDES ──
  modal.append(h('h3',{style:'font-size:14px;margin-bottom:8px'},'Visibility Overrides'));
  modal.append(h('p',{style:'font-size:12px;color:var(--text3);margin-bottom:8px'},`Role defaults: Bids=${role_defaults?.bid_visibility||'own'}, Projects=${role_defaults?.project_visibility||'own'}. Select "Use role default" to not override.`));

  const visRow=h('div',{style:'display:flex;gap:16px;margin-bottom:20px'});
  const bidVisSel=h('select',{style:'width:180px'});
  bidVisSel.append(h('option',{value:''},'Use role default'));
  ['own','all','assigned','none'].forEach(v=>{const o=h('option',{value:v},v.charAt(0).toUpperCase()+v.slice(1));if(user_access_config.bid_visibility===v)o.selected=true;bidVisSel.append(o);});
  visRow.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Bid Visibility'),bidVisSel]));

  const projVisSel=h('select',{style:'width:180px'});
  projVisSel.append(h('option',{value:''},'Use role default'));
  ['own','all','assigned','none'].forEach(v=>{const o=h('option',{value:v},v.charAt(0).toUpperCase()+v.slice(1));if(user_access_config.project_visibility===v)o.selected=true;projVisSel.append(o);});
  visRow.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Project Visibility'),projVisSel]));
  modal.append(visRow);

  // ── BID ASSIGNMENTS ──
  modal.append(h('h3',{style:'font-size:14px;margin-bottom:8px'},'Bid Assignments (for "Assigned" visibility)'));
  const bidList=h('div',{style:'margin-bottom:8px'});
  bid_assignments.forEach(ba=>{
    const row=h('div',{style:'display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px'});
    row.append(h('span',{},`${ba.bid_number} — ${ba.project_scope||''}`));
    row.append(h('button',{className:'btn-red btn-sm',style:'padding:1px 6px;font-size:11px',onclick:async()=>{
      await api('/admin/users/'+userId+'/bid-assignments/'+ba.bid_id,{method:'DELETE'});
      showUserAccessModal(userId,userName,parentContainer);
    }},'×'));
    bidList.append(row);
  });
  if(bid_assignments.length===0) bidList.append(h('p',{style:'font-size:12px;color:var(--text3)'},'No bids assigned'));
  modal.append(bidList);

  // Add bid assignment
  const addBidRow=h('div',{style:'display:flex;gap:8px;margin-bottom:20px'});
  const bidInput=h('input',{placeholder:'Bid number or scope...',style:'flex:1;font-size:13px'});
  addBidRow.append(bidInput);
  addBidRow.append(h('button',{className:'btn btn-sm',onclick:async()=>{
    const search=bidInput.value;
    if(!search) return;
    try{
      const {bids}=await api('/bids?search='+encodeURIComponent(search)+'&limit=1');
      if(!bids.length) return alert('No bid found matching "'+search+'"');
      await api('/admin/users/'+userId+'/bid-assignments',{method:'POST',body:JSON.stringify({bid_id:bids[0].id})});
      showUserAccessModal(userId,userName,parentContainer);
    }catch(e){alert(e.message)}
  }},'Add Bid'));
  modal.append(addBidRow);

  // ── PROJECT ASSIGNMENTS ──
  modal.append(h('h3',{style:'font-size:14px;margin-bottom:8px'},'Project Assignments (for "Assigned" visibility)'));
  const projList=h('div',{style:'margin-bottom:8px'});
  project_assignments.forEach(pa=>{
    const row=h('div',{style:'display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px'});
    row.append(h('span',{},pa.name));
    row.append(h('button',{className:'btn-red btn-sm',style:'padding:1px 6px;font-size:11px',onclick:async()=>{
      await api('/admin/users/'+userId+'/project-assignments/'+pa.project_id,{method:'DELETE'});
      showUserAccessModal(userId,userName,parentContainer);
    }},'×'));
    projList.append(row);
  });
  if(project_assignments.length===0) projList.append(h('p',{style:'font-size:12px;color:var(--text3)'},'No projects assigned'));
  modal.append(projList);

  const addProjRow=h('div',{style:'display:flex;gap:8px;margin-bottom:20px'});
  const projInput=h('input',{placeholder:'Project name...',style:'flex:1;font-size:13px'});
  addProjRow.append(projInput);
  addProjRow.append(h('button',{className:'btn btn-sm',onclick:async()=>{
    const search=projInput.value;
    if(!search) return;
    try{
      const {projects}=await api('/projects?search='+encodeURIComponent(search)+'&limit=1');
      if(!projects.length) return alert('No project found matching "'+search+'"');
      await api('/admin/users/'+userId+'/project-assignments',{method:'POST',body:JSON.stringify({project_id:projects[0].id})});
      showUserAccessModal(userId,userName,parentContainer);
    }catch(e){alert(e.message)}
  }},'Add Project'));
  modal.append(addProjRow);

  // ── SAVE + CLOSE ──
  const btns=h('div',{style:'display:flex;gap:8px;margin-top:16px;border-top:1px solid var(--border);padding-top:16px'});
  btns.append(h('button',{className:'btn',onclick:async()=>{
    try {
      const updates={};
      // Tab overrides
      if(overrideCb.checked) {
        updates.tab_overrides=tabCbs.filter(cb=>cb.checked).map(cb=>cb.dataset.tabId);
      } else {
        updates.tab_overrides=null;
      }
      // Visibility overrides
      const ac={};
      if(bidVisSel.value) ac.bid_visibility=bidVisSel.value;
      if(projVisSel.value) ac.project_visibility=projVisSel.value;
      updates.access_config=Object.keys(ac).length>0?ac:null;

      await api('/admin/users/'+userId+'/access',{method:'PATCH',body:JSON.stringify(updates)});
      alert('Access updated for '+userName);
      overlay.remove();
    }catch(e){alert(e.message)}
  }},'Save Access Config'));
  btns.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  btns.append(h('button',{className:'btn-outline',style:'margin-left:auto',onclick:async()=>{
    try{
      await api('/admin/users/'+userId+'/access',{method:'PATCH',body:JSON.stringify({tab_overrides:null,access_config:null})});
      alert('Reset to role defaults');
      overlay.remove();
    }catch(e){alert(e.message)}
  }},'Reset to Role Defaults'));
  modal.append(btns);

  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.append(modal);
  document.body.append(overlay);
}

async function adminRoles(c) {
  c.innerHTML='';
  const {roles, available_tabs}=await api('/admin/roles');

  // Create new role form
  const form=h('div',{style:'background:var(--bg3);padding:16px;border-radius:8px;margin-bottom:20px'});
  form.innerHTML=`<h3 style="margin-bottom:12px">Create Custom Role</h3>
    <div class="form-grid">
      <div class="form-group"><label>Role ID (lowercase, no spaces)</label><input id="nr-name" placeholder="e.g. superintendent"></div>
      <div class="form-group"><label>Display Name</label><input id="nr-display" placeholder="e.g. Superintendent"></div>
      <div class="form-group full"><label>Description</label><input id="nr-desc" placeholder="What this role does"></div>
    </div>`;
  form.append(h('button',{className:'btn',style:'margin-top:8px',onclick:async()=>{
    const name=$('#nr-name').value, display=$('#nr-display').value;
    if(!name||!display) return alert('Role ID and Display Name required');
    try {
      await api('/admin/roles',{method:'POST',body:JSON.stringify({role_name:name,display_name:display,description:$('#nr-desc').value,allowed_tabs:['notifications']})});
      adminRoles(c);
    } catch(e) { alert(e.message); }
  }},'Create Role'));
  c.append(form);

  // Role list with editable tab checkboxes
  for (const role of roles) {
    const card=h('div',{className:'card',style:'margin-bottom:16px;padding:16px'});
    const header=h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px'});
    header.append(h('div',{},[
      h('span',{style:'font-size:16px;font-weight:700'},role.display_name),
      h('span',{style:'font-size:12px;color:var(--text3);margin-left:8px'},role.role_name),
      role.is_system?h('span',{style:'font-size:10px;color:var(--text3);margin-left:8px;background:var(--bg3);padding:2px 6px;border-radius:4px'},'SYSTEM')
        :h('button',{className:'btn-red btn-sm',style:'margin-left:8px',onclick:async()=>{
          if(!confirm('Delete role "'+role.display_name+'"?')) return;
          try{await api('/admin/roles/'+role.role_name,{method:'DELETE'});adminRoles(c);}catch(e){alert(e.message)}
        }},'Delete'),
    ]));
    card.append(header);

    if(role.description) card.append(h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:12px'},role.description));

    // Tab checkboxes
    const tabGrid=h('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px'});
    const currentTabs=role.allowed_tabs||[];
    const checkboxes=[];

    available_tabs.forEach(tab=>{
      const lbl=h('label',{style:'display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:4px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--border)'});
      const cb=h('input',{type:'checkbox',style:'width:auto'});
      cb.checked=currentTabs.includes(tab.id);
      cb.dataset.tabId=tab.id;
      checkboxes.push(cb);
      lbl.append(cb);
      lbl.append(document.createTextNode(tab.label));
      tabGrid.append(lbl);
    });
    card.append(tabGrid);

    // Visibility dropdowns
    card.append(h('div',{style:'font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;margin-top:8px'},'Data Visibility'));
    const visGrid=h('div',{style:'display:flex;gap:16px;margin-bottom:12px'});
    const bidVisSel=h('select',{style:'width:180px'});
    ['own','all','assigned','none'].forEach(v=>{const o=h('option',{value:v},v.charAt(0).toUpperCase()+v.slice(1));if(role.bid_visibility===v)o.selected=true;bidVisSel.append(o);});
    visGrid.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Bids'),bidVisSel]));
    const projVisSel=h('select',{style:'width:180px'});
    ['own','all','assigned','originated','none'].forEach(v=>{const o=h('option',{value:v},v.charAt(0).toUpperCase()+v.slice(1));if(role.project_visibility===v)o.selected=true;projVisSel.append(o);});
    visGrid.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Projects'),projVisSel]));
    card.append(visGrid);

    // On Schedule default — controls whether new users assigned this role
    // start with on_schedule=true. Doesn't retroactively change existing
    // users (they have their own per-user override on the user edit form).
    const onSchedRoleGroup=h('div',{style:'margin-top:8px;font-size:13px'});
    const onSchedRoleCb=h('input',{type:'checkbox',style:'width:auto;margin-right:6px'});
    onSchedRoleCb.checked=!!role.on_schedule_default;
    const onSchedRoleLbl=h('label',{style:'display:inline-flex;align-items:center;cursor:pointer'});
    onSchedRoleLbl.append(onSchedRoleCb);
    onSchedRoleLbl.append(document.createTextNode('On Schedule by default (new users in this role appear in the scheduler)'));
    onSchedRoleGroup.append(onSchedRoleLbl);
    card.append(onSchedRoleGroup);

    // Save button for this role
    const roleNameCopy=role.role_name;
    card.append(h('button',{className:'btn btn-sm',style:'margin-top:8px',onclick:async()=>{
      const newTabs=checkboxes.filter(cb=>cb.checked).map(cb=>cb.dataset.tabId);
      try{await api('/admin/roles/'+roleNameCopy,{method:'PATCH',body:JSON.stringify({allowed_tabs:newTabs,bid_visibility:bidVisSel.value,project_visibility:projVisSel.value,on_schedule_default:onSchedRoleCb.checked})});
        alert('Role "'+roleNameCopy+'" updated');
      }catch(e){alert(e.message)}
    }},'Save Role Settings'));

    c.append(card);
  }
}

  uploadRow.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Annotated Image'),fileInput]));

    uploadBtn.disabled=true;
    try{

      fd.append('template_image',file);
      fd.append('form_type',$('#ft-type').value);
      fd.append('name',$('#ft-name').value);

      const data=await resp.json();
      if(!resp.ok) throw new Error(data.error);
      alert(data.message);
      adminFormTemplates(c);
    }catch(e){alert(e.message);}finally{uploadBtn.textContent='Upload & Analyze';uploadBtn.disabled=false;}
  }},'Upload & Analyze');
  uploadRow.append(uploadBtn);
  c.append(uploadRow);

  // List existing templates
  try {
    const {templates}=await api('/form-templates');
    if(!templates?.length) { c.append(h('p',{style:'color:var(--text3)'},'No form templates yet.')); return; }

    templates.forEach(t=>{
      const fieldMap=typeof t.field_map==='string'?JSON.parse(t.field_map||'[]'):(t.field_map||[]);
      const card=h('div',{className:'card',style:'padding:16px;margin-bottom:12px'});

      // Header
      const hdr=h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'});
      hdr.append(h('div',{},[
        h('span',{style:'font-weight:700'},t.name),
        h('span',{style:'font-size:12px;color:var(--text3);margin-left:8px'},'Type: '+t.form_type),
        t.active?h('span',{className:'status status-active',style:'margin-left:8px'},'ACTIVE'):h('span',{className:'status status-draft',style:'margin-left:8px'},'Inactive'),
      ]));
      hdr.append(h('span',{style:'font-size:11px;color:var(--text3)'},fieldMap.length+' fields | '+(t.created_by_name||'Unknown')));
      card.append(hdr);

      // Field list
      if(fieldMap.length>0) {
        const fieldTable=h('div',{style:'margin-bottom:12px'});
        fieldTable.append(makeTable(
          ['#','Field Name','Label','Type','Description'],
          fieldMap.map((f,i)=>[i+1,f.field_name,f.label_text||'—',f.data_type||'text',f.description||'—'])
        ));
        card.append(fieldTable);
      } else {
        card.append(h('p',{style:'color:var(--text3);font-size:13px'},'No fields detected. Edit the field map manually.'));
      }

      // Actions
      const actions=h('div',{style:'display:flex;gap:8px'});

      // Edit fields button
      actions.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
        showFieldMapEditor(t.id,fieldMap,()=>adminFormTemplates(c));
      }},'Edit Fields'));

      // Activate/Deactivate
      if(!t.active) {
        actions.append(h('button',{className:'btn btn-sm',onclick:async()=>{
          if(!confirm('Activate "'+t.name+'"? This deactivates any other active template for '+t.form_type+'.'))return;
          try{await api('/form-templates/'+t.id+'/activate',{method:'POST'});adminFormTemplates(c);}catch(e){alert(e.message)}
        }},'Activate'));
        actions.append(h('button',{className:'btn-red btn-sm',onclick:async()=>{
          if(!confirm('Delete "'+t.name+'"?'))return;
          try{await api('/form-templates/'+t.id,{method:'DELETE'});adminFormTemplates(c);}catch(e){alert(e.message)}
        }},'Delete'));
      } else {
        actions.append(h('button',{className:'btn-outline btn-sm',onclick:async()=>{
          try{await api('/form-templates/'+t.id+'/deactivate',{method:'POST'});adminFormTemplates(c);}catch(e){alert(e.message)}
        }},'Deactivate'));
      }
      card.append(actions);
      c.append(card);
    });
  }catch(e){c.append(h('p',{style:'color:var(--red)'},e.message));}
}

function showFieldMapEditor(templateId,fieldMap,onSaved) {
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:800px;max-height:90vh;overflow-y:auto'});
  modal.append(h('h2',{},'Edit Field Map'));
  modal.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:16px'},
    'Edit field names, types, and descriptions. These define what the vision AI extracts from submitted forms.'));

  let fields=[...fieldMap];
  const container=h('div',{id:'fme-list'});
  modal.append(container);

  function renderFields() {
    container.innerHTML='';
    const validTypes=['text','number','date','checkbox','filled_circle'];

    fields.forEach((f,i)=>{
      const row=h('div',{style:'display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap'});
      row.append(h('span',{style:'font-size:12px;color:var(--text3);width:20px'},String(i+1)));
      row.append(h('input',{value:f.field_name,style:'width:150px;font-size:13px',placeholder:'field_name',
        oninput:(e)=>{fields[i].field_name=e.target.value;}}));
      row.append(h('input',{value:f.label_text||'',style:'width:180px;font-size:13px',placeholder:'Label text',
        oninput:(e)=>{fields[i].label_text=e.target.value;}}));
      const sel=h('select',{style:'width:120px;font-size:13px',onchange:(e)=>{fields[i].data_type=e.target.value;}});
      validTypes.forEach(vt=>{const o=h('option',{value:vt},vt);if(vt===f.data_type)o.selected=true;sel.append(o);});
      row.append(sel);
      row.append(h('input',{value:f.description||'',style:'width:200px;font-size:13px',placeholder:'Description',
        oninput:(e)=>{fields[i].description=e.target.value;}}));
      row.append(h('button',{className:'btn-red btn-sm',style:'padding:2px 8px',onclick:()=>{
        fields.splice(i,1);renderFields();
      }},'×'));
      container.append(row);
    });
  }
  renderFields();

  // Add field button
  modal.append(h('button',{className:'btn-outline btn-sm',style:'margin-bottom:16px',onclick:()=>{
    fields.push({field_name:'new_field',label_text:'',data_type:'text',description:''});
    renderFields();
  }},'+ Add Field'));

  // Save / Cancel
  const btns=h('div',{style:'display:flex;gap:8px'});
  btns.append(h('button',{className:'btn',onclick:async()=>{
    // Validate
    for(const f of fields){if(!f.field_name){alert('All fields need a name');return;}}
    try{
      await api('/form-templates/'+templateId+'/field-map',{method:'PUT',body:JSON.stringify({field_map:fields})});
      overlay.remove();
      if(onSaved)onSaved();
    }catch(e){alert(e.message)}
  }},'Save Field Map'));
  btns.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  modal.append(btns);

  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.append(modal);document.body.append(overlay);
}
