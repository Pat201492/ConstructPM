async function renderEquipmentTickets(main) {
  main.innerHTML = '';
  main.append(h('div',{className:'page-header'},[h('h1',{},'Equipment Tickets')]));

  const subtabs = ['Equipment Request','Equipment Maintenance','Active Tickets'];
  let active = S.params?.sub || 'Equipment Request';
  if (!subtabs.includes(active)) active = 'Equipment Request';

  const tabBar = h('div',{style:'display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px'});
  const body = h('div');

  function selectTab(name){
    active = name;
    [...tabBar.children].forEach(c=>{
      const on = c.textContent === name;
      c.style.borderBottom = on ? '2px solid var(--primary)' : '2px solid transparent';
      c.style.color = on ? 'var(--text)' : 'var(--text2)';
      c.style.fontWeight = on ? '600' : '400';
    });
    body.innerHTML='';
    if(name==='Equipment Request') etRequest(body);
    else if(name==='Equipment Maintenance') etMaintenance(body);
    else etActiveTickets(body);
  }
  subtabs.forEach(name=>{
    tabBar.append(h('div',{
      style:'padding:10px 16px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent',
      onclick:()=>selectTab(name),
    }, name));
  });
  main.append(tabBar);
  main.append(body);
  selectTab(active);
}

// ── Subtab 1: Equipment Request ──────────────────────────────
async function etRequest(c){
  c.innerHTML='<p>Loading…</p>';
  let projects=[];
  try { const r=await api('/projects?limit=500'); projects=r.projects||r||[]; } catch{}

  c.innerHTML='';
  c.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:14px'},
    'Create an equipment ticket. Pick a project to auto-fill location + site contact, then add equipment lines (quantity defaults to 1).'));

  // ── Ticket / project header fields ──
  const grid=h('div',{className:'form-grid'});
  // Searchable project picker — type a number/name to filter the list
  // instead of scrolling a flat <select>. Same pattern as the bid form's
  // contact/customer/location pickers.
  const projDrop = searchDrop('etr-project', 'Project', projects,
    p => (p.primary_number || p.name || p.id));

  // Pickup-person picker — searchable user list. Carries the user's id
  // via the hidden field so the server can ping their email when the
  // ticket goes ready-for-pickup. Falls back to the matched display
  // string for the denormalised pickup_person text column.
  let users = [];
  try { users = (await api('/users')).users || []; } catch {}
  const userLabel = u => `${u.first_name || ''} ${u.last_name || ''}`.trim() + (u.email ? ` (${u.email})` : '');
  // Strict active===true matches the server's `active: true` lookup —
  // a soft `!== false` here would let the picker show users whose
  // active column is undefined/null and the server would 400 them.
  const pickupDrop = searchDrop('etr-pickup', 'Pick Up Person', users.filter(u => u.active === true), userLabel);

  const requestor=h('input',{id:'etr-requestor',placeholder:'Requestor name',value:(S.user?`${S.user.firstName||S.user.first_name||''} ${S.user.lastName||S.user.last_name||''}`.trim():'')});
  const locName=h('input',{id:'etr-locname',placeholder:'Location name'});
  const locAddr=h('input',{id:'etr-locaddr',placeholder:'Location address'});
  const scName=h('input',{id:'etr-scname',placeholder:'Site contact name'});
  const scPhone=h('input',{id:'etr-scphone',placeholder:'Site contact phone'});

  // Auto-fill location + site contact when a project is chosen
  projDrop.input.onselect = async (p) => {
    try {
      const r = await api('/projects/' + p.id);
      const proj = r.project || r;
      locName.value = proj.location_name || proj.address || '';
      locAddr.value = proj.address || '';
      scName.value = proj.site_contact_name || '';
      scPhone.value = proj.site_contact_phone || '';
    } catch {}
  };

  grid.append(projDrop.group);
  grid.append(pickupDrop.group);
  [['Requestor',requestor],
   ['Location Name',locName],['Location Address',locAddr],
   ['Site Contact Name',scName],['Site Contact Phone',scPhone]].forEach(([lab,el])=>{
    grid.append(h('div',{className:'form-group'},[h('label',{},lab),el]));
  });
  c.append(grid);

  // ── Cascading equipment line items (quick-bid style) ──
  c.append(h('h3',{style:'margin:18px 0 8px'},'Equipment'));
  let opts={types:[],names:[],items:[]};
  try { opts=await api('/equipment-tickets/equipment-options'); }
  catch{ try{ opts=await api('/equipment-tickets/equipment-options'); }catch{} }

  const lines=[{quantity:1,equipment_type:'',equipment_name:'',manufacturer:''}];
  const tbl=h('table',{className:'data-table',style:'width:100%'});
  const tb=h('tbody');
  tbl.innerHTML='<thead><tr><th style="width:60px">Qty</th><th>Type</th><th>Equipment Name</th><th>Manufacturer</th><th></th></tr></thead>';
  tbl.append(tb);
  c.append(tbl);

  // Datalist-backed inputs so the picker filters as you type. The three
  // equipment fields are bidirectional: changing any one narrows the
  // pool of matching items, and if exactly one item is left we backfill
  // the other two from it. Lets users start from whichever field they
  // know best (name, manufacturer, type...) without re-picking the
  // cascade top-down.
  function datalistOptions(arr){
    return [...new Set(arr.filter(Boolean))].sort().map(v=>`<option value="${(v+'').replace(/"/g,'&quot;')}"></option>`).join('');
  }
  function matchingItems(line){
    return (opts.items||[]).filter(it =>
      (!line.equipment_type || it.equipment_type === line.equipment_type) &&
      (!line.equipment_name || it.equipment_name === line.equipment_name) &&
      (!line.manufacturer || it.manufacturer === line.manufacturer)
    );
  }
  function filteredOpts(line){
    const items = matchingItems(line);
    return {
      types: [...new Set(items.map(i=>i.equipment_type))],
      names: [...new Set(items.map(i=>i.equipment_name))],
      manufacturers: [...new Set(items.map(i=>i.manufacturer))],
    };
  }
  function renderLines(){
    tb.innerHTML='';
    lines.forEach((ln,i)=>{
      const fo=filteredOpts(ln);
      const tr=h('tr');
      tr.innerHTML=`
        <td><input type="text" inputmode="numeric" value="${parseInt(ln.quantity)||1}" data-i="${i}" data-f="quantity" style="width:50px"></td>
        <td><input data-i="${i}" data-f="equipment_type" list="etr-types-${i}" value="${(ln.equipment_type||'').replace(/"/g,'&quot;')}" placeholder="Type to filter…" style="max-width:160px">
            <datalist id="etr-types-${i}">${datalistOptions(fo.types)}</datalist></td>
        <td><input data-i="${i}" data-f="equipment_name" list="etr-names-${i}" value="${(ln.equipment_name||'').replace(/"/g,'&quot;')}" placeholder="Type to filter…" style="max-width:240px">
            <datalist id="etr-names-${i}">${datalistOptions(fo.names)}</datalist></td>
        <td><input data-i="${i}" data-f="manufacturer" list="etr-mfrs-${i}" value="${(ln.manufacturer||'').replace(/"/g,'&quot;')}" placeholder="Type to filter…" style="max-width:160px">
            <datalist id="etr-mfrs-${i}">${datalistOptions(fo.manufacturers)}</datalist></td>
        <td><button class="btn-red btn-sm" data-del="${i}" style="padding:2px 8px">×</button></td>`;
      tb.append(tr);
    });

    // Bind. `change` fires when a datalist suggestion is committed (or
    // the field blurs); `input` covers free-type filtering. We only
    // re-render + auto-fill on `change` to avoid a render thrash on every
    // keystroke — the datalist itself handles live filtering already.
    tb.querySelectorAll('input[data-f]').forEach(el => {
      const commit = () => {
        const i = parseInt(el.dataset.i), f = el.dataset.f;
        if (f === 'quantity') {
          lines[i][f] = parseInt(el.value) || 1;
          return;
        }
        lines[i][f] = el.value;
        // After any equipment-field commit, look at all items matching
        // every filled field. If exactly one item is left, the user has
        // implicitly identified the row — fill the unset fields.
        const fields = ['equipment_type','equipment_name','manufacturer'];
        const match = matchingItems(lines[i]);
        if (match.length === 1) {
          fields.forEach(k => {
            if (!lines[i][k] && match[0][k]) lines[i][k] = match[0][k];
          });
        }
        renderLines();
      };
      el.onchange = commit;
      // Also handle blur for the keyboard-typed case where the user
      // typed a value that matches a datalist option exactly but didn't
      // click it (some browsers don't fire `change` then).
      el.onblur = commit;
    });
    tb.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      lines.splice(parseInt(b.dataset.del),1);
      if (lines.length === 0) lines.push({quantity:1,equipment_type:'',equipment_name:'',manufacturer:''});
      renderLines();
    });
  }
  renderLines();

  const addBtn=h('button',{className:'btn-outline btn-sm',style:'margin-top:8px',onclick:()=>{
    lines.push({quantity:1,equipment_type:'',equipment_name:'',manufacturer:''});
    renderLines();
  }},'+ Add line');
  c.append(addBtn);

  const submit=h('button',{className:'btn',style:'margin-top:16px;display:block',onclick:async()=>{
    const projId = $('#etr-project').value;
    if (!projId) return alert('Pick a project before submitting the ticket.');
    const valid=lines.filter(l=>l.equipment_name||l.equipment_type);
    if(valid.length===0) return alert('Add at least one equipment line.');
    try {
      const r=await api('/equipment-tickets',{method:'POST',body:JSON.stringify({
        project_id: projId,
        // pickup_person_id (hidden id from searchDrop). Server denormalises
        // the display name into pickup_person so the active-board cards
        // and pickup PDF read it without a join. Pickup user gets the
        // ticket-ready email automatically.
        pickup_person_id: $('#etr-pickup').value || null,
        requestor_name:$('#etr-requestor').value,
        location_name:$('#etr-locname').value,
        location_address:$('#etr-locaddr').value,
        site_contact_name:$('#etr-scname').value,
        site_contact_phone:$('#etr-scphone').value,
        lines:valid,
      })});
      alert('Ticket #'+r.ticket_number+' created.');
      navigate('equipment-tickets',{sub:'Active Tickets'});
    } catch(e){ alert(e.message); }
  }},'Submit Ticket');
  c.append(submit);
}

// ── Subtab 2: Equipment Maintenance ──────────────────────────
async function etMaintenance(c){
  c.innerHTML='<p>Loading…</p>';
  let equip=[];
  // /api/equipment returns { items, days_ahead }. The old fallback to
  // `r` itself produced a truthy non-array (the wrapper object) and the
  // tab silently rendered empty.
  try { const r=await api('/equipment'); equip=r.items||r.equipment||(Array.isArray(r)?r:[]); } catch{}

  // Threshold settings (for the warning colors)
  let thr={};
  try {
    const g=await api('/admin/globals');
    const list=Array.isArray(g)?g:(g.variables||g.globals||[]);
    list.forEach(v=>{ if(v.key&&v.key.startsWith('equipment.')) thr[v.key.replace('equipment.','')]=parseInt(v.value,10); });
  } catch{}
  const certG=thr.cert_green_days??30, certY=thr.cert_yellow_days??14, certR=thr.cert_red_days??3;

  function daysUntil(d){ if(!d) return null; const t=new Date(); t.setHours(0,0,0,0);
    const x=new Date(String(d).slice(0,10)+'T00:00:00'); return Math.round((x-t)/86400000); }
  function certColor(d){ const n=daysUntil(d); if(n===null) return null;
    if(n<=certR) return 'var(--red,#c62828)'; if(n<=certY) return '#e6a700'; if(n<=certG) return '#2e7d32'; return null; }

  c.innerHTML='';

  // Warning banner — count of equipment with a cert in the alert window
  const warned=equip.map(e=>({e,col:certColor(e.rolled_cert_date||e.certification_date)})).filter(x=>x.col);
  if(warned.length){
    const red=warned.filter(w=>w.col.includes('c62828')||w.col.includes('red')).length;
    const banner=h('div',{style:`padding:12px 16px;border-radius:8px;margin-bottom:16px;font-weight:600;color:#fff;background:${red>0?'var(--red,#c62828)':'#e6a700'}`},
      `⚠ ${warned.length} piece(s) of equipment need certification attention`);
    const detail=h('div',{style:'display:none;margin-top:8px;font-weight:400;font-size:12px'});
    warned.forEach(w=>detail.append(h('div',{},
      `#${w.e.barcode_id} · ${w.e.equipment_name} · ${w.e.equipment_type||'—'} · cert ${String(w.e.rolled_cert_date||w.e.certification_date||'—').slice(0,10)}`)));
    banner.style.cursor='pointer';
    banner.onclick=()=>{ detail.style.display=detail.style.display==='none'?'block':'none'; };
    banner.append(detail);
    c.append(banner);
  }

  // Search + scan-to-jump. Mobile's MaintenanceScreen pops the records
  // modal as soon as a barcode scan resolves; this is the web parallel —
  // type or paste an exact barcode and hit Enter to jump straight to
  // that piece's record modal without scrolling the table.
  const searchRow=h('div',{style:'display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center'});
  const sId=h('input',{placeholder:'Equipment ID (Enter to scan)',style:'width:200px'});
  const sType=h('input',{placeholder:'Type',style:'width:140px'});
  searchRow.append(sId,sType);
  c.append(searchRow);

  sId.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const code = sId.value.trim();
    if (!code) return;
    // Exact match first (case-insensitive). Falls back to a single
    // partial match — typing "5" with EQ-005 the only match should
    // still resolve, but ambiguous prefixes leave the user filtering.
    const lowered = code.toLowerCase();
    const exact = equip.find(eq => String(eq.barcode_id||'').toLowerCase() === lowered);
    let target = exact;
    if (!target) {
      const partial = equip.filter(eq => String(eq.barcode_id||'').toLowerCase().includes(lowered));
      if (partial.length === 1) target = partial[0];
    }
    if (target) {
      showMaintRecords(target, () => etMaintenance(c));
    } else {
      sId.style.outline = '2px solid var(--red)';
      setTimeout(() => { sId.style.outline = ''; }, 1000);
    }
  });

  const listDiv=h('div');
  c.append(listDiv);

  function draw(){
    const fId=sId.value.toLowerCase(), fT=sType.value.toLowerCase();
    const rows=equip.filter(e=>
      (!fId||String(e.barcode_id||'').toLowerCase().includes(fId))&&
      (!fT||String(e.equipment_type||'').toLowerCase().includes(fT)));
    listDiv.innerHTML='';
    if(rows.length===0){ listDiv.append(h('p',{style:'color:var(--text2);font-style:italic'},'No equipment matches.')); return; }
    listDiv.append(makeTable(['ID','Name','Type','Service','Cert','Flag',''],rows.map(e=>{
      const flagDot = e.flag
        ? h('span',{title:'Click to clear flag',style:`display:inline-block;width:14px;height:14px;border-radius:50%;cursor:pointer;background:${e.flag==='red'?'var(--red,#c62828)':'#e6a700'}`,
            onclick:async()=>{ if(!confirm('Clear the flag on '+e.barcode_id+'?')) return;
              try{ await api('/equipment/'+e.id+'/clear-flag',{method:'POST'}); etMaintenance(c); }catch(err){alert(err.message);} }})
        : '—';
      return [
        e.barcode_id, e.equipment_name, e.equipment_type||'—',
        String(e.service_date||'—').slice(0,10),
        h('span',{style:certColor(e.rolled_cert_date||e.certification_date)?`color:${certColor(e.rolled_cert_date||e.certification_date)};font-weight:600`:''},String(e.rolled_cert_date||e.certification_date||'—').slice(0,10)),
        flagDot,
        h('button',{className:'btn-outline btn-sm',onclick:()=>showMaintRecords(e, () => etMaintenance(c))},'Records'),
      ];
    })));
  }
  [sId,sType].forEach(i=>i.oninput=draw);
  draw();
}

async function showMaintRecords(equip, onSaved){
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:640px'});
  modal.append(h('p',{},'Loading…'));
  overlay.append(modal); document.body.append(overlay);
  let data;
  try { data=await api('/equipment/'+equip.id+'/maintenance-records'); }
  catch(e){ modal.innerHTML=''; modal.append(h('p',{style:'color:var(--red)'},e.message)); return; }
  // Refresh equip's rolled_cert_date from the latest server state so the
  // header doesn't show a stale date after an add. The maintenance-records
  // GET returns the equipment block alongside the records list.
  if (data.equipment) equip = { ...equip, ...data.equipment };

  modal.innerHTML='';
  modal.append(h('h2',{},`${equip.barcode_id} — Maintenance Record`));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:12px'},
    `${equip.equipment_name} · ${equip.equipment_type||'—'}`));

  // Add entry — date defaults today, name defaults current user (editable),
  // cert copied from most recent record
  const lastCert=data.records[0]?.cert_date||'';
  const addBox=h('div',{style:'background:var(--bg3);padding:12px;border-radius:6px;margin-bottom:14px'});
  const dDate=makeDateInput({id:'mr-date',value:new Date().toISOString().slice(0,10)});
  const dName=h('input',{id:'mr-name',value:(S.user?`${S.user.firstName||S.user.first_name||''} ${S.user.lastName||S.user.last_name||''}`.trim():''),placeholder:'Entered by'});
  const dCert=makeDateInput({id:'mr-cert',value:lastCert?String(lastCert).slice(0,10):''});
  const dNotes=h('textarea',{id:'mr-notes',placeholder:'Notes',style:'width:100%;min-height:54px;margin-top:6px'});
  const dFlag=h('select',{id:'mr-flag'});
  ['','red','yellow'].forEach(f=>dFlag.append(h('option',{value:f},f?('Flag: '+f):'No flag')));
  const ar=h('div',{className:'form-grid'});
  ar.append(h('div',{className:'form-group'},[h('label',{},'Date of service'),dDate]));
  ar.append(h('div',{className:'form-group'},[h('label',{},'Entered by'),dName]));
  ar.append(h('div',{className:'form-group'},[h('label',{},'Cert date'),dCert]));
  ar.append(h('div',{className:'form-group'},[h('label',{},'Flag'),dFlag]));
  addBox.append(ar); addBox.append(dNotes);
  addBox.append(h('button',{className:'btn btn-sm',style:'margin-top:8px',onclick:async()=>{
    try {
      await api('/equipment/'+equip.id+'/maintenance-records',{method:'POST',body:JSON.stringify({
        date_of_service:readDateInput($('#mr-date'))||null,
        entered_by_name:$('#mr-name').value,
        cert_date:readDateInput($('#mr-cert'))||null,
        notes:$('#mr-notes').value,
        flag:$('#mr-flag').value||null,
      })});
      // Re-render the maintenance table behind the modal so the cert
      // color band updates without a manual page refresh — was the bug
      // Pat hit where the green/yellow/red dot lagged the data.
      if (onSaved) onSaved();
      overlay.remove();
      showMaintRecords(equip, onSaved);
    } catch(e){ alert(e.message); }
  }},'Add Entry'));
  modal.append(addBox);

  if(data.records.length===0){
    modal.append(h('p',{style:'color:var(--text2);font-style:italic'},'No maintenance records yet.'));
  } else {
    modal.append(makeTable(['Date','By','Cert','Flag','Notes'],data.records.map(r=>[
      String(r.date_of_service).slice(0,10),
      r.entered_by_name||'—',
      r.cert_date?String(r.cert_date).slice(0,10):'—',
      r.flag||'—',
      r.notes||'—',
    ])));
  }
  const close=h('div',{style:'display:flex;justify-content:flex-end;margin-top:14px'});
  close.append(h('button',{className:'btn-outline',onclick:()=>{
    overlay.remove();
    if (onSaved) onSaved();
  }},'Close'));
  modal.append(close);
}

// ── Subtab 3: Active Tickets (McDonald's board) ──────────────
//
// Polls every 5s for mobile-scan updates so the board reflects new
// scanned items without the user hitting refresh. The interval self-
// cancels when its container is detached (sub-tab change or page
// navigation) — see the document.contains check inside the loop.
async function etActiveTickets(c){
  c.innerHTML='<p>Loading…</p>';
  let lastSignature = '';

  async function load() {
    let data={count:0,tickets:[]};
    try { data=await api('/equipment-tickets/active'); }
    catch(e){ c.innerHTML=''; c.append(h('p',{style:'color:var(--red)'},e.message)); return; }

    // Cheap change-detection so polling doesn't churn the DOM (which
    // would steal focus from any input the user happens to be editing).
    const sig = JSON.stringify(data.tickets.map(t => [
      t.ticket_number, t.status, t.total_quantity,
      t.lines.map(l => l.filled_items),
    ]));
    if (sig === lastSignature) return;
    lastSignature = sig;

    c.innerHTML='';
    const hdr=h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px'});
    hdr.append(h('div',{style:'color:var(--text2);font-size:13px'},
      'Tap a ticket to expand. Mobile scans and manual entries flow in below; mark picked up when the crew collects it.'));
    hdr.append(h('div',{style:'background:var(--primary);color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;font-size:16px'},
      `${data.count} Active`));
    c.append(hdr);

    // Return / scan-back-in panel — covers the case where equipment
    // comes back from a job and the shop needs to put it back in
    // circulation without going through the mobile app. Flips status
    // to 'available' + clears current_project_id via /mobile/return.
    const scanBack = h('div',{style:'background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap'});
    scanBack.append(h('strong',{style:'font-size:13px'},'Return Equipment'));
    scanBack.append(h('span',{style:'color:var(--text2);font-size:12px;flex:1;min-width:200px'},
      'Scan or type a barcode to return a piece of equipment to the shop.'));
    const rbInput = h('input',{placeholder:'Barcode / equipment ID', style:'width:200px'});
    const rbStatus = h('span',{style:'font-size:12px;color:var(--text2);min-width:160px'});
    const rbBtn = h('button',{className:'btn-outline btn-sm',onclick:async()=>{
      const code = rbInput.value.trim();
      if (!code) return;
      rbBtn.disabled = true; rbStatus.textContent = 'Returning…';
      try {
        const r = await api('/equipment/mobile/return',{method:'POST',
          body: JSON.stringify({ barcode_id: code })});
        rbInput.value = '';
        rbStatus.textContent = `✓ ${r.barcode_id} → shop`;
        rbStatus.style.color = 'var(--green)';
        setTimeout(() => { rbStatus.textContent = ''; rbStatus.style.color = 'var(--text2)'; }, 3000);
      } catch (e) {
        rbStatus.textContent = e.message;
        rbStatus.style.color = 'var(--red)';
      }
      rbBtn.disabled = false;
    }},'Return');
    rbInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); rbBtn.click(); } });
    scanBack.append(rbInput); scanBack.append(rbBtn); scanBack.append(rbStatus);
    c.append(scanBack);

    if(data.tickets.length===0){
      c.append(h('p',{style:'color:var(--text2);font-style:italic'},'No active tickets.'));
      return;
    }

    const board=h('div',{style:'display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start'});
    data.tickets.forEach(t=>{
      const card=h('div',{style:'background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;width:260px;cursor:pointer'});
      const top=h('div',{style:'display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px'});
      top.append(h('span',{},'#'+t.ticket_number+' · '+(t.project_number||'—')));
      top.append(h('span',{style:'background:var(--primary);color:#fff;border-radius:12px;padding:1px 9px;font-size:12px'},String(t.total_quantity)));
      card.append(top);
      if(t.status==='filled') card.append(h('div',{style:'font-size:11px;color:#2e7d32;margin-bottom:6px'},'✓ Filled'));
      if(t.status==='ready_for_pickup') card.append(h('div',{style:'font-size:11px;color:#b26a00;margin-bottom:6px;font-weight:600'},'🛎 Ready for pick-up'));
      const mini=h('table',{style:'width:100%;font-size:12px'});
      t.lines.slice(0,6).forEach(l=>{
        const tr=h('tr');
        tr.innerHTML=`<td style="width:30px">${l.quantity}</td><td>${l.equipment_name||l.equipment_type||'—'}</td>`;
        mini.append(tr);
      });
      card.append(mini);
      let filled=[];
      if(t.lines[0]){ try{ filled=typeof t.lines[0].filled_items==='string'?JSON.parse(t.lines[0].filled_items):(t.lines[0].filled_items||[]); }catch{} }
      if(filled.length){
        card.append(h('div',{style:'margin-top:8px;font-size:11px;color:var(--text2);border-top:1px solid var(--border);padding-top:6px'},
          'Scanned: '+filled.map(f=>f.equipment_number||f.barcode_id).filter(Boolean).join(', ')));
      }
      card.onclick=()=>showTicketFull(t.ticket_number);
      board.append(card);
    });
    c.append(board);
  }

  await load();
  // Self-terminating poll. Every tick verifies the container is still
  // in the DOM — when the user changes sub-tab or navigates away the
  // body element is detached and the loop exits.
  (async function poll() {
    while (document.contains(c)) {
      await new Promise(r => setTimeout(r, 5000));
      if (!document.contains(c)) break;
      try { await load(); } catch {}
    }
  })();
}

async function showTicketFull(tn){
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:720px;max-height:90vh;overflow-y:auto'});
  modal.append(h('p',{},'Loading…'));
  overlay.append(modal); document.body.append(overlay);

  async function render() {
    let d;
    try { d=await api('/equipment-tickets/'+tn); }
    catch(e){ modal.innerHTML=''; modal.append(h('p',{style:'color:var(--red)'},e.message)); return; }

    const p=d.project;
    // Decode the current scanned/filled-items list. Same shape as the
    // mobile /fill payload — { equipment_number, equipment_name?,
    // source? } — so web entries and mobile scans live in the same list.
    let filled=[];
    if(d.lines && d.lines[0]){
      try {
        filled = typeof d.lines[0].filled_items==='string'
          ? JSON.parse(d.lines[0].filled_items) : (d.lines[0].filled_items||[]);
      } catch {}
    }

    modal.innerHTML='';
    modal.append(h('h2',{},'Ticket #'+tn));
    const info=h('div',{style:'font-size:13px;line-height:1.7;margin-bottom:14px'});
    info.innerHTML=`
      <strong>Project:</strong> ${p.project_number||'—'}<br>
      <strong>Pick Up Person:</strong> ${p.pickup_person||'—'}<br>
      <strong>Requestor:</strong> ${p.requestor_name||'—'}<br>
      <strong>Location:</strong> ${p.location_name||'—'}<br>
      <strong>Address:</strong> ${p.location_address||'—'}<br>
      <strong>Site Contact:</strong> ${p.site_contact_name||'—'} ${p.site_contact_phone||''}<br>
      <strong>Status:</strong> ${p.status}` +
      (p.ready_at ? `<br><strong>Ready since:</strong> ${new Date(p.ready_at).toLocaleString()}` : '');
    modal.append(info);

    const reqHeader = h('div',{style:'display:flex;align-items:center;gap:8px;margin:8px 0 6px'});
    reqHeader.append(h('h3',{style:'font-size:14px;margin:0;flex:1'},'Requested'));
    reqHeader.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      // Edit-lines flow: swap the read-only table for an editable one.
      // Mirrors the etRequest form's structure (plain inputs, not the
      // full cascading datalist — for typo fixes / late additions
      // after the ticket is already in the shop's queue). Saving
      // resets the ticket's filled list (per backend contract) — warn
      // the user if anything is already tagged.
      showTicketEditLines(d, () => render());
    }},'✎ Edit Lines'));
    modal.append(reqHeader);
    modal.append(makeTable(['Qty','Type','Equipment','Manufacturer'],
      d.lines.map(l=>[l.quantity,l.equipment_type||'—',l.equipment_name||'—',l.manufacturer||'—'])));

    // ─── Scanned / Tagged-Out section ─────────────────────────
    // Lists every equipment ID flowing in from mobile scans or web
    // manual entries. Polled by etActiveTickets every 5s; the modal
    // also auto-refreshes on add so the latest list is always visible.
    modal.append(h('h3',{style:'font-size:14px;margin:18px 0 6px'},
      `Tagged out (${filled.length})`));
    if (filled.length === 0) {
      modal.append(h('p',{style:'color:var(--text2);font-style:italic;font-size:13px;margin-bottom:8px'},
        'Nothing tagged yet. Mobile scans appear here; add manually with the input below.'));
    } else {
      modal.append(makeTable(['#','Equipment ID','Source',''],
        filled.map((f,idx)=>[
          idx+1,
          h('span',{style:'font-family:JetBrains Mono;font-size:12px'},
            String(f.equipment_number||f.barcode_id||'—')),
          h('span',{style:'color:var(--text2);font-size:12px'}, f.source||'mobile'),
          h('button',{className:'btn-red btn-sm',style:'padding:2px 8px',onclick:async()=>{
            const next = filled.filter((_,i)=>i!==idx);
            try {
              await api('/equipment-tickets/'+tn+'/fill',{method:'POST',
                body: JSON.stringify({items: next})});
              await render();
            } catch(e){ alert(e.message); }
          }},'×'),
        ])));
    }

    // Searchable picker scoped to in-shop equipment (status=available),
    // minus anything already tagged on this ticket so the same piece
    // can't be double-added. Items show as "barcode — name" so a user
    // can find a piece by either the label or the friendly name. When
    // the pool is empty (nothing in the shop, or already all on this
    // ticket) the picker is replaced with an inline empty-state.
    let inShop = [];
    try {
      const r = await api('/equipment?status=available&limit=500');
      inShop = r.items || [];
    } catch {}
    const onTicket = new Set(filled.map(f => String(f.equipment_number || f.barcode_id || '').toLowerCase()));
    const pool = inShop.filter(e => !onTicket.has(String(e.barcode_id||'').toLowerCase()));

    if (pool.length === 0) {
      modal.append(h('p',{
        style:'background:var(--bg3);padding:10px 12px;border-radius:6px;color:var(--text2);font-size:13px;margin:8px 0 14px;font-style:italic',
      }, inShop.length === 0
        ? 'No equipment left in shop.'
        : 'All in-shop equipment is already tagged on this ticket.'));
    } else {
      const addRow = h('div',{style:'display:flex;gap:6px;margin:8px 0 14px;align-items:flex-end'});
      // Picker-only — no free-text barcodes typed in. User picks from
      // the in-shop pool; the hidden value carries the equipment.id and
      // we look it up on Add to grab the barcode + name for the payload.
      const drop = searchDrop('et-add-eq', `Add equipment (${pool.length} in shop)`,
        pool, e => `${e.barcode_id} — ${e.equipment_name}`);
      drop.group.style.flex = '1';
      drop.group.style.marginBottom = '0';
      let selected = null;
      drop.input.onselect = (item) => { selected = item; };
      const addBtn = h('button',{className:'btn btn-sm',onclick:async()=>{
        if (!selected) return alert('Pick an item from the list first.');
        const next = [...filled, {
          equipment_number: selected.barcode_id,
          equipment_name: selected.equipment_name,
          source: 'web',
        }];
        try {
          await api('/equipment-tickets/'+tn+'/fill',{method:'POST',
            body: JSON.stringify({items: next})});
          await render();
        } catch(e){ alert(e.message); }
      }},'+ Add');
      addRow.append(drop.group);
      addRow.append(addBtn);
      modal.append(addRow);
    }

    const actions=h('div',{style:'display:flex;gap:8px;justify-content:flex-end;margin-top:16px'});
    actions.append(h('button',{className:'btn-outline',onclick:()=>{ stopPoll=true; overlay.remove(); }},'Close'));
    // "Ready for Pick-up" — manual gate between filled and picked up.
    // Triggers a notification (in-app + email) to the requestor + admins.
    // Hidden once the ticket is already in ready_for_pickup or beyond.
    if (p.status === 'filled') {
      actions.append(h('button',{className:'btn-outline',style:'border-color:#b26a00;color:#b26a00',onclick:async()=>{
        if(!confirm('Mark ticket #'+tn+' as ready for pick-up? This notifies the requestor (in-app + email).')) return;
        try {
          await api('/equipment-tickets/'+tn+'/ready',{method:'POST'});
          await render();
        } catch(e){ alert(e.message); }
      }},'🛎 Ready for Pick-up'));
    }
    actions.append(h('button',{className:'btn',onclick:async()=>{
      if(!confirm('Mark ticket #'+tn+' as picked up? This sets equipment locations to the project, archives the ticket, generates the PDF, and removes it from the active board.')) return;
      try {
        await api('/equipment-tickets/'+tn+'/pickup',{method:'POST'});
        stopPoll=true;
        overlay.remove();
        navigate('equipment-tickets',{sub:'Active Tickets'});
      } catch(e){ alert(e.message); }
    }},'Mark as Picked Up'));
    modal.append(actions);
  }

  await render();

  // Light polling inside the modal too so a mobile scan that happens
  // while the modal is open surfaces immediately. Stops when the modal
  // closes (stopPoll) or the overlay is detached for any other reason.
  let stopPoll = false;
  (async function poll(){
    while (!stopPoll && document.body.contains(overlay)) {
      await new Promise(r => setTimeout(r, 5000));
      if (stopPoll || !document.body.contains(overlay)) break;
      // Skip re-render if the user is mid-typing in the add input so
      // we don't yank focus.
      const active = document.activeElement;
      if (active && active.tagName === 'INPUT' && active.value.trim()) continue;
      try { await render(); } catch {}
    }
  })();
}

// Edit ticket lines after submission. Backend route resets filled_items
// to [] on any line change, so any equipment currently tagged out via
// /fill reverts to status='available' (handled server-side in
// syncTicketStatus). We surface the impact in a confirm so the user
// knows.
function showTicketEditLines(detail, onSaved) {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:680px;max-height:90vh;overflow-y:auto'});
  modal.append(h('h2',{},'Edit ticket #' + detail.project.ticket_number));

  // Snapshot filled_items so we can warn if the user is about to wipe
  // a list of already-tagged equipment.
  let priorFilled = 0;
  if (detail.lines && detail.lines[0]?.filled_items) {
    try {
      const arr = typeof detail.lines[0].filled_items === 'string'
        ? JSON.parse(detail.lines[0].filled_items) : detail.lines[0].filled_items;
      priorFilled = (arr || []).length;
    } catch {}
  }
  if (priorFilled > 0) {
    modal.append(h('p',{
      style:'background:rgba(212,179,76,0.12);border:1px solid var(--yellow);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--yellow);margin-bottom:12px',
    }, `⚠ Saving will clear the ${priorFilled} item${priorFilled===1?'':'s'} already tagged out on this ticket. Those pieces revert to "available" in the shop.`));
  }

  // Editable copy. Plain inputs — not the cascading datalist from
  // etRequest — to keep this fast for the common case (qty fix or
  // add a missing line). Power-users can still delete and re-create
  // the ticket if they need the full picker.
  const lines = (detail.lines || []).map(l => ({
    quantity: parseInt(l.quantity,10) || 1,
    equipment_type: l.equipment_type || '',
    equipment_name: l.equipment_name || '',
    manufacturer: l.manufacturer || '',
  }));

  const tbl = h('table',{className:'data-table',style:'width:100%'});
  tbl.innerHTML = '<thead><tr><th style="width:60px">Qty</th><th>Type</th><th>Equipment Name</th><th>Manufacturer</th><th></th></tr></thead>';
  const tb = h('tbody');
  tbl.append(tb);
  function drawLines() {
    tb.innerHTML = '';
    lines.forEach((ln, i) => {
      const tr = h('tr');
      tr.innerHTML = `
        <td><input type="text" inputmode="numeric" value="${parseInt(ln.quantity)||1}" data-i="${i}" data-f="quantity" style="width:50px"></td>
        <td><input data-i="${i}" data-f="equipment_type" value="${(ln.equipment_type||'').replace(/"/g,'&quot;')}" style="max-width:160px"></td>
        <td><input data-i="${i}" data-f="equipment_name" value="${(ln.equipment_name||'').replace(/"/g,'&quot;')}" style="max-width:240px"></td>
        <td><input data-i="${i}" data-f="manufacturer" value="${(ln.manufacturer||'').replace(/"/g,'&quot;')}" style="max-width:160px"></td>
        <td><button class="btn-red btn-sm" data-del="${i}" style="padding:2px 8px">×</button></td>`;
      tb.append(tr);
    });
    tb.querySelectorAll('input[data-f]').forEach(el => {
      el.oninput = () => {
        const i = parseInt(el.dataset.i), f = el.dataset.f;
        if (f === 'quantity') lines[i][f] = parseInt(el.value) || 1;
        else lines[i][f] = el.value;
      };
    });
    tb.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      lines.splice(parseInt(b.dataset.del), 1);
      if (lines.length === 0) lines.push({quantity:1,equipment_type:'',equipment_name:'',manufacturer:''});
      drawLines();
    });
  }
  drawLines();
  modal.append(tbl);

  modal.append(h('button',{className:'btn-outline btn-sm',style:'margin-top:8px',onclick:()=>{
    lines.push({quantity:1,equipment_type:'',equipment_name:'',manufacturer:''});
    drawLines();
  }},'+ Add line'));

  const btns = h('div',{style:'display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--border);padding-top:12px'});
  btns.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  btns.append(h('button',{className:'btn',onclick:async()=>{
    const valid = lines.filter(l => l.equipment_name || l.equipment_type);
    if (valid.length === 0) return alert('At least one line is required.');
    if (priorFilled > 0 && !confirm(`This clears ${priorFilled} tagged-out item${priorFilled===1?'':'s'}. Proceed?`)) return;
    try {
      await api('/equipment-tickets/' + detail.project.ticket_number + '/lines', {
        method:'PATCH', body: JSON.stringify({ lines: valid }),
      });
      overlay.remove();
      if (onSaved) onSaved();
    } catch (e) { alert(e.message); }
  }},'Save Lines'));
  modal.append(btns);

  overlay.append(modal); document.body.append(overlay);
}

async function refreshEquipmentList(content, canManage) {
  content.innerHTML = '';

  // Add-equipment form (admin + shop_staff only)
  if (canManage) {
    const form = h('div',{style:'background:var(--bg3);padding:16px;border-radius:8px;margin-bottom:20px'});
    form.append(h('h3',{style:'margin-bottom:12px'},'Add New Equipment'));
    form.innerHTML += `<div class="form-grid">
      <div class="form-group"><label>Barcode / Serial *</label><input id="eq-barcode" placeholder="Required"></div>
      <div class="form-group"><label>Name *</label><input id="eq-name" placeholder="e.g. Milwaukee M18 Drill"></div>
      <div class="form-group"><label>Manufacturer</label><input id="eq-mfr"></div>
      <div class="form-group"><label>Type</label><input id="eq-type" placeholder="e.g. Power Tool" list="eq-type-suggestions"></div>
      <div class="form-group"><label>Cert Date</label><input id="eq-cert" type="date"></div>
    </div>
    <datalist id="eq-type-suggestions"></datalist>`;

    const submitBtn = h('button',{className:'btn',style:'margin-top:8px',onclick:async()=>{
      const barcode = $('#eq-barcode').value.trim();
      const name = $('#eq-name').value.trim();
      if (!barcode) return alert('Barcode/serial is required.');
      if (!name) return alert('Name is required.');
      try {
        await api('/equipment',{method:'POST',body:JSON.stringify({
          barcode_id: barcode,
          equipment_name: name,
          manufacturer: $('#eq-mfr').value || null,
          equipment_type: $('#eq-type').value || null,
          certification_date: $('#eq-cert').value || null,
        })});
        await refreshEquipmentList(content, canManage);
      } catch (e) { alert(e.message); }
    }},'+ Create Equipment');
    form.append(submitBtn);
    content.append(form);
  }

  // Equipment list
  try {
    // Use the flat (non-grouped) list for the management view — sorting/
    // filtering is more useful when everything is in one table.
    const data = await api('/equipment');
    // /api/equipment returns { items, days_ahead }. Older callers expected
    // { equipment: [...] }; keep both as fallbacks so a future shape change
    // doesn't silently blank the page like it did before.
    const items = data.items || data.equipment || (Array.isArray(data) ? data : []);

    // Populate type-suggestions datalist for the add form
    if (canManage) {
      const types = [...new Set(items.map(e => e.equipment_type).filter(Boolean))].sort();
      const dl = document.getElementById('eq-type-suggestions');
      if (dl) types.forEach(t => dl.append(h('option',{value:t})));
    }

    if (items.length === 0) {
      content.append(h('p',{style:'color:var(--text2);font-style:italic;padding:8px'},
        canManage ? 'No equipment yet — add your first item above.' : 'No equipment yet.'));
      return;
    }

    const headers = ['Barcode','Name','Manufacturer','Type','Status','Cert Date'];
    if (canManage) headers.push('');  // action column
    content.append(makeConfigTable('equipment_management',
      headers,
      items.map(e => {
        const row = [
          h('span',{style:'font-family:JetBrains Mono;font-size:12px'}, e.barcode_id),
          e.equipment_name,
          e.manufacturer || '—',
          e.equipment_type || '—',
          h('span',{className:'status status-'+e.status}, e.status),
          fmtDtClick(e.certification_date),
        ];
        if (canManage) {
          const actions = h('div', {style:'display:flex;gap:4px'});
          actions.append(h('button',{
            className:'btn-outline btn-sm',
            style:'padding:2px 8px',
            onclick:()=>showEquipmentEditPopup(e, ()=>refreshEquipmentList(content, canManage)),
          },'Edit'));
          actions.append(h('button',{
            className:'btn-red btn-sm',
            style:'padding:2px 8px',
            onclick:async()=>{
              if (!confirm(`Delete equipment "${e.equipment_name}" (${e.barcode_id})?\n\nThis cannot be undone. Equipment with checkout history may be retired instead.`)) return;
              try {
                await api('/equipment/'+e.id,{method:'DELETE'});
                await refreshEquipmentList(content, canManage);
              } catch (err) { alert(err.message); }
            },
          },'Delete'));
          row.push(actions);
        }
        return row;
      })
    ));
  } catch (err) {
    console.error('[Equipment]', err);
    content.append(h('div', {style:'background:var(--red-bg);border:1px solid var(--red);padding:12px;border-radius:6px;color:var(--red);font-size:13px'},
      'Could not load equipment: ' + (err.message || 'unknown error')));
  }
}

// ═══════════════════════════════════════════════════════════
// SCHEDULE — calendar view
// ═══════════════════════════════════════════════════════════
//
// Phase 1 of the project scheduler (per docs/FUTURE_REFINEMENTS/06).
// Renders a month-grid calendar with each scheduled project drawn as a
// horizontal band spanning the days it occupies (start_date through
// start_date + project_length_days, skipping non-working days per the
// project's schedule overrides).
//
// Click any band → opens ScheduleEditPopup for that project (start date,
// working day toggles).
//
// Notification deep-link: PMs receive a notification when start_date is
// set; the action_url is `/#/schedule?edit=<projectId>`. The hash-param
// is read at render time and auto-opens the pop-up.

const scheduleState = {
  // First-of-month being viewed; persists across re-renders within session
  monthAnchor: null,
};

async function renderSchedule(main) {
  if (!scheduleState.monthAnchor) {
    const t = new Date();
    scheduleState.monthAnchor = new Date(t.getFullYear(), t.getMonth(), 1);
  }
  const anchor = scheduleState.monthAnchor;

  // Header with month label + nav
  const hdr = h('div',{className:'page-header'});
  hdr.append(h('h1',{},'Schedule'));
  hdr.append(h('div',{style:'margin-left:auto;display:flex;gap:8px;align-items:center'}, [
    h('button',{className:'btn-outline btn-sm',onclick:()=>{
      scheduleState.monthAnchor = new Date(anchor.getFullYear(), anchor.getMonth() - 1, 1);
      main.innerHTML=''; renderSchedule(main);
    }},'◀ Prev'),
    h('strong',{style:'min-width:140px;text-align:center'}, anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'})),
    h('button',{className:'btn-outline btn-sm',onclick:()=>{
      scheduleState.monthAnchor = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1);
      main.innerHTML=''; renderSchedule(main);
    }},'Next ▶'),
    h('button',{className:'btn-outline btn-sm',style:'margin-left:8px',onclick:()=>{
      const t = new Date();
      scheduleState.monthAnchor = new Date(t.getFullYear(), t.getMonth(), 1);
      main.innerHTML=''; renderSchedule(main);
    }},'Today'),
  ]));
  main.append(hdr);

  // Compute window: pad to full weeks for the grid (Sun-start week)
  const firstOfMonth = anchor;
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay()); // back to Sunday
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridEnd.getDate() + 41); // 6 weeks × 7 days - 1
  const fmt = (d) => d.toISOString().split('T')[0];

  // Loading placeholder
  const cal = h('div',{style:'background:var(--bg2);border-radius:8px;padding:12px'});
  cal.textContent = 'Loading…';
  main.append(cal);

  let projects = [];
  try {
    const r = await api(`/projects/scheduled-list?from=${fmt(gridStart)}&to=${fmt(gridEnd)}`);
    projects = r.projects || [];
  } catch (err) {
    cal.innerHTML = '';
    cal.append(h('div',{style:'color:var(--red);padding:12px'}, 'Could not load schedule: ' + err.message));
    return;
  }

  // Visible diagnostic — if 0 projects come back, the issue is server-side
  // (filter, permissions, missing start_date). If >0 but no cards render,
  // it's the day-occupation check below.
  console.log('[Schedule] Fetched projects:', projects);
  cal.innerHTML = '';
  const status = h('div',{style:'font-size:12px;color:var(--text2);padding:4px 0 8px'},
    `${projects.length} project${projects.length === 1 ? '' : 's'} scheduled in this view`);
  cal.append(status);

  // Build grid: 7 cols (Sun..Sat) × 6 rows
  const grid = h('div',{style:'display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)'});

  // Day-name header row
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(name => {
    const cell = h('div',{style:'background:var(--bg3);padding:6px 8px;font-size:11px;font-weight:600;color:var(--text2);text-align:center'}, name);
    grid.append(cell);
  });

  // Date helpers — kept local to avoid the classic JS timezone bug where
  // `new Date("2026-05-15")` parses as UTC midnight (8 PM the previous
  // day in EDT). PostgreSQL returns dates in YYYY-MM-DD form; we parse
  // the integer parts ourselves to get a local-midnight Date object that
  // compares correctly against the calendar's local-time day cells.
  function parseLocalDate(s) {
    if (!s) return null;
    const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) {
      const d = new Date(s);
      return isNaN(d) ? null : d;
    }
    return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
  }

  // Pre-compute, per project, the set of calendar dates that fall inside
  // its working-day window. This is the right place to do the work because
  // `project_length_days` is in WORKING days (M-F by default, plus Sat/Sun
  // if overrides enable them), not calendar days. The earlier interpretation
  // — calendar days — produced cards that ended on the wrong weekday: a
  // 10-day project starting Tuesday should end on the second Monday after
  // skipping two weekends, not the second Thursday after counting all days.
  //
  // We walk forward from start_date, only counting days that match the
  // project's working-day rules, until we've collected `length` of them.
  // A safety cap (length × 10 calendar days) prevents infinite loops on
  // pathological data (e.g., zero working days configured).
  const projectWorkingDays = new Map(); // projectId → Set<"YYYY-M-D">
  projects.forEach(p => {
    const start = parseLocalDate(p.start_date);
    if (!start) return;
    const length = parseInt(p.project_length_days, 10) || 1;
    const set = new Set();
    let d = new Date(start);
    let safety = 0;
    while (set.size < length && safety < length * 10 + 7) {
      const dow = d.getDay(); // 0=Sun..6=Sat
      const isWorking = p.weekend_only
        ? (dow === 0 || dow === 6)
        : (dow >= 1 && dow <= 5)
          || (dow === 0 && !!p.works_sunday)
          || (dow === 6 && !!p.works_saturday);
      if (isWorking) {
        set.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`);
      }
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      safety++;
    }
    projectWorkingDays.set(p.id, set);
  });

  function projectOccupiesDay(p, dayDate) {
    const set = projectWorkingDays.get(p.id);
    if (!set) return false;
    return set.has(`${dayDate.getFullYear()}-${dayDate.getMonth()}-${dayDate.getDate()}`);
  }

  // Helper: deterministic color from project id
  function colorForProject(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360}, 40%, 36%)`;
  }

  for (let i = 0; i < 42; i++) {
    const day = new Date(gridStart);
    day.setDate(day.getDate() + i);
    const isCurrentMonth = day.getMonth() === firstOfMonth.getMonth();
    const isToday = day.toDateString() === new Date().toDateString();

    const cell = h('div',{style:`
      background:var(--bg2);
      min-height:90px;
      padding:4px;
      opacity:${isCurrentMonth ? 1 : 0.45};
      ${isToday ? 'box-shadow:inset 0 0 0 2px var(--primary);' : ''}
    `});
    cell.append(h('div',{style:`font-size:11px;color:${isToday ? 'var(--primary)' : 'var(--text2)'};font-weight:${isToday ? 700 : 400};margin-bottom:2px`}, String(day.getDate())));

    projects.filter(p => projectOccupiesDay(p, day)).forEach(p => {
      const card = h('div',{
        title: `${p.primary_number || p.name} — ${p.customer_name || ''} (PM: ${p.pm_name || '—'})\nStart: ${p.start_date} • Length: ${p.project_length_days || '?'}d • Personnel: ${p.manpower || '?'}` + (p.address ? `\nAddress: ${p.address}` : ''),
        style: `
          background:${colorForProject(p.id)};
          color:#fff;
          padding:2px 6px;
          margin-bottom:2px;
          border-radius:3px;
          font-size:10px;
          line-height:1.3;
          cursor:pointer;
          overflow:hidden;
          text-overflow:ellipsis;
          white-space:nowrap;
        `,
      }, (p.primary_number || p.name || 'Project') + (p.customer_name ? ' · ' + p.customer_name : ''));
      card.onclick = () => showScheduleEditPopup(p.id, () => { main.innerHTML=''; renderSchedule(main); });
      cell.append(card);
    });

    grid.append(cell);
  }

  cal.append(grid);

  // Legend / hint
  main.append(h('p',{style:'color:var(--text2);font-size:12px;margin-top:12px'},
    'Click any project card to edit start date, working days (Sat / Sun, or Weekend only), and review the schedule. Default working days are Mon-Fri.'));

  // Auto-open edit pop-up if URL has ?edit=<projectId> (notification deep link)
  // S.params is populated by the router; we also accept the legacy hash form
  if (S.params && S.params.edit) {
    showScheduleEditPopup(S.params.edit, () => { main.innerHTML=''; renderSchedule(main); });
  }
}

// Schedule edit pop-up — start date + working day overrides for one project.
// onSaved fires after successful PATCH so the calendar can refresh.
async function showScheduleEditPopup(projectId, onSaved) {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:520px'});

  const loading = h('p',{},'Loading…');
  modal.append(loading);
  overlay.append(modal);
  document.body.append(overlay);

  let project, schedule;
  try {
    const projResp = await api('/projects/' + projectId);
    project = projResp.project;
    schedule = await api('/projects/' + projectId + '/schedule');
  } catch (err) {
    loading.textContent = 'Could not load: ' + err.message;
    return;
  }

  modal.innerHTML = '';
  modal.append(h('h2',{},'Schedule: ' + (project.name || 'Project')));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:6px'},
    `Customer: ${project.customer_name || '—'} • PM: ${project.pm_name || '—'}`));
  if (project.address) {
    modal.append(h('p',{style:'color:var(--text);font-size:12px;margin-bottom:14px'},[
      h('strong',{},'Address: '),
      document.createTextNode(project.address),
    ]));
  }

  // Two-column form for the four scheduling inputs
  const formGrid = h('div',{className:'form-grid'});
  formGrid.append(h('div',{className:'form-group'},[
    h('label',{},'Start date'),
    makeDateInput({id:'sch-start', value: project.start_date ? String(project.start_date).split('T')[0] : ''}),
  ]));
  // Length editable here too — Pat asked for this so the calendar card
  // can grow/shrink without leaving the schedule pop-up. Same field as
  // on the project edit pop-up; whichever was changed last wins.
  formGrid.append(h('div',{className:'form-group'},[
    h('label',{},'Project length (days)'),
    h('input',{id:'sch-length', type:'number', min:'0', step:'1', value: project.project_length_days || ''}),
  ]));
  formGrid.append(h('div',{className:'form-group'},[
    h('label',{},'Manpower'),
    h('input',{id:'sch-manpower', type:'number', min:'0', step:'1', value: project.manpower || ''}),
  ]));
  modal.append(formGrid);

  const wdLabel = h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:8px'},'Working days (default Mon-Fri)');
  modal.append(wdLabel);
  // Weekend-only mode: schedules on Sat + Sun only and skips Mon-Fri.
  // When on, the Sat/Sun checkboxes are irrelevant (both days work) and
  // are visually dimmed; their stored values are preserved so toggling
  // weekend-only off restores the user's prior preferences.
  const wdRow = h('div',{style:'display:flex;flex-direction:column;gap:6px;margin-top:4px;align-items:flex-start'});
  const satCb = h('input',{type:'checkbox',id:'sch-sat'}); satCb.checked = !!schedule.works_saturday;
  const sunCb = h('input',{type:'checkbox',id:'sch-sun'}); sunCb.checked = !!schedule.works_sunday;
  const weCb  = h('input',{type:'checkbox',id:'sch-weekend-only'}); weCb.checked = !!schedule.weekend_only;
  const satLabel = h('label',{style:'display:flex;align-items:center;gap:6px;cursor:pointer'},[ satCb, h('span',{},'Saturday') ]);
  const sunLabel = h('label',{style:'display:flex;align-items:center;gap:6px;cursor:pointer'},[ sunCb, h('span',{},'Sunday') ]);
  const weLabel  = h('label',{style:'display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap'},[ weCb,  h('span',{},'Weekend Only') ]);
  const satSunRow = h('div',{style:'display:flex;gap:14px;align-items:center'});
  satSunRow.append(satLabel);
  satSunRow.append(sunLabel);
  wdRow.append(satSunRow);
  wdRow.append(weLabel);
  modal.append(wdRow);
  function syncWeekendOnlyUi() {
    const on = weCb.checked;
    satCb.disabled = on;
    sunCb.disabled = on;
    satLabel.style.opacity = on ? '0.45' : '1';
    sunLabel.style.opacity = on ? '0.45' : '1';
  }
  weCb.addEventListener('change', syncWeekendOnlyUi);
  syncWeekendOnlyUi();

  // Day Notes — per-(project, start-date) note. This is the crew-facing
  // channel (the same notes the Email Day to Staff button sends), NOT
  // the project-wide payment/admin notes. Keyed to the start date shown
  // above; if the start date changes the note re-loads for the new date
  // on next open. Saved alongside the schedule on Save.
  const startISO = project.start_date ? String(project.start_date).split('T')[0] : null;
  modal.append(h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:14px'},
    'Day notes' + (startISO ? ` (for ${isoToShort(startISO)})` : ' (set a start date first)')));
  const dayNoteTA = h('textarea',{
    id:'sch-daynote',
    style:'width:100%;min-height:70px;margin-top:4px;padding:8px;font-family:inherit;font-size:13px;resize:vertical',
    placeholder: startISO ? 'Crew-facing note for this day — gate code, pre-shift meeting, etc.' : 'Save a start date, reopen to add a day note',
  });
  dayNoteTA.disabled = !startISO;
  modal.append(dayNoteTA);
  // Load any existing day note for the start date
  if (startISO) {
    api(`/projects/${projectId}/day-notes/${startISO}`)
      .then(r => { dayNoteTA.value = r?.notes || ''; })
      .catch(() => {});
  }

  const actions = h('div',{style:'display:flex;gap:8px;justify-content:flex-end;margin-top:18px'});
  actions.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  actions.append(h('button',{className:'btn',onclick:async()=>{
    const newStart = readDateInput($('#sch-start')) || null;
    const newLength = parseInt($('#sch-length').value, 10);
    const newManpower = parseInt($('#sch-manpower').value, 10);
    try {
      // Two PATCHes — project fields + working-day overrides. Sending
      // length/manpower from this pop-up too so the user can adjust the
      // calendar card's span without leaving the schedule view.
      await api('/projects/' + projectId, {
        method: 'PATCH',
        body: JSON.stringify({
          start_date: newStart,
          project_length_days: Number.isFinite(newLength) && newLength > 0 ? newLength : null,
          manpower: Number.isFinite(newManpower) && newManpower > 0 ? newManpower : null,
        }),
      });
      await api('/projects/' + projectId + '/schedule', {
        method: 'PATCH',
        body: JSON.stringify({
          works_saturday: $('#sch-sat').checked,
          works_sunday: $('#sch-sun').checked,
          weekend_only: $('#sch-weekend-only').checked,
        }),
      });
      // Save the day note against the effective start date (the new one
      // if the PM just changed it, else the original). Skipped silently
      // if there's no start date to key it to.
      const dayNoteVal = $('#sch-daynote') ? $('#sch-daynote').value : '';
      const effectiveStart = newStart || startISO;
      if (effectiveStart) {
        try {
          await api(`/projects/${projectId}/day-notes/${effectiveStart}`, {
            method: 'PUT',
            body: JSON.stringify({ notes: dayNoteVal }),
          });
        } catch (e) { /* non-fatal — schedule already saved */ }
      }
      overlay.remove();
      if (onSaved) onSaved();
    } catch (err) { alert(err.message); }
  }},'Save'));
  modal.append(actions);
}

// ═══════════════════════════════════════════════════════════
// SCHEDULER — phase 2A: calendar-style By-Project assignment
// ═══════════════════════════════════════════════════════════
//
// Permission gate: tab is admin + scheduler. Per Pat's clarification,
// the Scheduler tab is essentially a CLONE of the Schedule tab's
// calendar view, with these tweaks:
//
//   - Each project's calendar card shows assigned/manpower count
//   - Green ✓ at the front when the project is marked Fully Staffed
//   - Clicking a card opens a per-day panel with: project info, the
//     workers assigned for THAT specific day, an "Assign Workers"
//     pop-up, a "Copy this day's crew to all working days" button, and
//     a Fully Staffed toggle
//
// By-Worker view (rows = workers, cols = days, with extended/simplified
// toggle and drag-reorder) is phase 2A.2 — placeholder still routes to
// a "coming soon" message.

const schedulerState = {
  monthAnchor: null,
  weekAnchor: null, // Sunday of the visible week — used by the By-Worker view
  view: 'by-project',
  byWorkerMode: 'extended',
  sortByDateKey: null, // when set, By-Worker rows sort by assignment on this date
  sortDir: 'asc',      // 'asc' = blanks first, 'desc' = blanks last
};

async function renderScheduler(main) {
  if (!schedulerState.monthAnchor) {
    const t = new Date();
    schedulerState.monthAnchor = new Date(t.getFullYear(), t.getMonth(), 1);
  }
  if (!schedulerState.weekAnchor) {
    // Sunday of the current week — the By-Worker view is weekly, so the
    // anchor is a single Sunday rather than the first of a month.
    const t = new Date();
    const sunday = new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay());
    schedulerState.weekAnchor = sunday;
  }
  const isByWorker = schedulerState.view === 'by-worker';

  const hdr = h('div',{className:'page-header'});
  hdr.append(h('h1',{},'Scheduler'));
  const navWrap = h('div',{style:'margin-left:auto;display:flex;gap:8px;align-items:center'});

  if (isByWorker) {
    // By-Worker: week nav. Anchor = Sunday; label = "Mar 15 – Mar 21".
    const wk = schedulerState.weekAnchor;
    const wkEnd = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate() + 6);
    const lbl = `${wk.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${wkEnd.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      schedulerState.weekAnchor = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate() - 7);
      main.innerHTML=''; renderScheduler(main);
    }},'◀ Prev'));
    navWrap.append(h('strong',{style:'min-width:180px;text-align:center'}, lbl));
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      schedulerState.weekAnchor = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate() + 7);
      main.innerHTML=''; renderScheduler(main);
    }},'Next ▶'));
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      const t = new Date();
      schedulerState.weekAnchor = new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay());
      main.innerHTML=''; renderScheduler(main);
    }},'Today'));
  } else {
    const anchor = schedulerState.monthAnchor;
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      schedulerState.monthAnchor = new Date(anchor.getFullYear(), anchor.getMonth() - 1, 1);
      main.innerHTML=''; renderScheduler(main);
    }},'◀ Prev'));
    navWrap.append(h('strong',{style:'min-width:140px;text-align:center'}, anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'})));
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      schedulerState.monthAnchor = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1);
      main.innerHTML=''; renderScheduler(main);
    }},'Next ▶'));
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      const t = new Date();
      schedulerState.monthAnchor = new Date(t.getFullYear(), t.getMonth(), 1);
      main.innerHTML=''; renderScheduler(main);
    }},'Today'));
  }
  hdr.append(navWrap);
  main.append(hdr);

  // View toggle — By Project (calendar of project cards w/ crew counts)
  // vs By Worker (grid of workers × dates with project numbers per cell).
  // Active button uses .btn class, inactive uses .btn-outline.
  // Email Day to Staff lives next to the toggles — promoted out of the
  // per-day popup so the scheduler can fire a day's email without
  // drilling into a project card first.
  const seg = h('div',{style:'display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap'});
  const byProjBtn = h('button',{
    className: schedulerState.view === 'by-project' ? 'btn' : 'btn-outline',
    style: 'padding:8px 18px;font-size:13px',
    onclick: () => { schedulerState.view = 'by-project'; main.innerHTML=''; renderScheduler(main); },
  }, 'By Project');
  const byWorkerBtn = h('button',{
    className: schedulerState.view === 'by-worker' ? 'btn' : 'btn-outline',
    style: 'padding:8px 18px;font-size:13px',
    onclick: () => { schedulerState.view = 'by-worker'; main.innerHTML=''; renderScheduler(main); },
  }, 'By Worker');
  seg.append(byProjBtn); seg.append(byWorkerBtn);
  seg.append(h('button',{
    className:'btn-outline',
    style:'padding:8px 14px;font-size:13px;margin-left:auto',
    onclick: () => showEmailDayPickerPopup(),
  }, '✉ Email Day to Staff'));
  main.append(seg);

  if (schedulerState.view === 'by-worker') {
    await renderSchedulerByWorker(main);
    return;
  }

  // By-Project (calendar of project cards)
  const cal = h('div',{style:'background:var(--bg2);border-radius:8px;padding:12px'});
  cal.textContent = 'Loading…';
  main.append(cal);

  // Compute window: pad to full weeks
  const firstOfMonth = schedulerState.monthAnchor;
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridEnd.getDate() + 41);
  const fmt = (d) => d.toISOString().split('T')[0];

  let projects = [];
  let assignmentCounts = {}; // {`projectId|YYYY-MM-DD`: count}
  try {
    const r = await api(`/projects/scheduled-list?from=${fmt(gridStart)}&to=${fmt(gridEnd)}`);
    projects = r.projects || [];
    // Aggregate assignment counts per (project, date) so cards can show
    // "N/M" without N+1 fetches. One round-trip per project — small N
    // (only scheduled projects in this 6-week window), acceptable.
    await Promise.all(projects.map(async p => {
      try {
        const a = await api('/projects/' + p.id + '/assignments');
        (a.assignments || []).forEach(row => {
          const dateKey = String(row.work_date).slice(0, 10);
          const k = `${p.id}|${dateKey}`;
          assignmentCounts[k] = (assignmentCounts[k] || 0) + 1;
        });
      } catch {}
    }));
  } catch (err) {
    cal.innerHTML = '';
    cal.append(h('div',{style:'color:var(--red);padding:12px'},'Could not load: ' + err.message));
    return;
  }

  cal.innerHTML = '';
  cal.append(h('div',{style:'font-size:12px;color:var(--text2);padding:4px 0 8px'},
    `${projects.length} project${projects.length === 1 ? '' : 's'} scheduled in this view`));

  // Date helpers (timezone-safe — see Schedule tab for context)
  function parseLocalDate(s) {
    if (!s) return null;
    const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) { const d = new Date(s); return isNaN(d) ? null : d; }
    return new Date(parseInt(m[1],10), parseInt(m[2],10) - 1, parseInt(m[3],10));
  }
  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // Pre-compute working-day set per project (working days, not calendar days)
  const projectWorkingDays = new Map();
  projects.forEach(p => {
    const start = parseLocalDate(p.start_date);
    if (!start) return;
    const length = parseInt(p.project_length_days, 10) || 1;
    const set = new Set();
    let d = new Date(start);
    let safety = 0;
    while (set.size < length && safety < length * 10 + 7) {
      const dow = d.getDay();
      const isWorking = p.weekend_only
        ? (dow === 0 || dow === 6)
        : (dow >= 1 && dow <= 5)
          || (dow === 0 && !!p.works_sunday)
          || (dow === 6 && !!p.works_saturday);
      if (isWorking) set.add(dateKey(d));
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      safety++;
    }
    projectWorkingDays.set(p.id, set);
  });

  function colorForProject(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360}, 40%, 36%)`;
  }

  const grid = h('div',{style:'display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)'});
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(name => {
    grid.append(h('div',{style:'background:var(--bg3);padding:6px 8px;font-size:11px;font-weight:600;color:var(--text2);text-align:center'}, name));
  });

  for (let i = 0; i < 42; i++) {
    const day = new Date(gridStart);
    day.setDate(day.getDate() + i);
    const dKey = dateKey(day);
    const isCurrentMonth = day.getMonth() === firstOfMonth.getMonth();
    const isToday = day.toDateString() === new Date().toDateString();

    const cell = h('div',{style:`
      background:var(--bg2);
      min-height:90px;
      padding:4px;
      opacity:${isCurrentMonth ? 1 : 0.45};
      ${isToday ? 'box-shadow:inset 0 0 0 2px var(--primary);' : ''}
    `});
    cell.append(h('div',{style:`font-size:11px;color:${isToday ? 'var(--primary)' : 'var(--text2)'};font-weight:${isToday ? 700 : 400};margin-bottom:2px`}, String(day.getDate())));

    projects.forEach(p => {
      const set = projectWorkingDays.get(p.id);
      if (!set || !set.has(dKey)) return;
      const assigned = assignmentCounts[`${p.id}|${dKey}`] || 0;
      const target = parseInt(p.manpower, 10) || 0;
      // Per-day fully_staffed: pulled from /scheduled-list's
      // fully_staffed_dates array. The legacy project-wide field is
      // ignored in the UI — Pat's rule, only Copy-Day propagates.
      const fsDays = new Set(p.fully_staffed_dates || []);
      const isFullyStaffedDay = fsDays.has(dKey);
      const stamp = isFullyStaffedDay ? '✅ ' : '';
      const countLabel = target > 0 ? ` (${assigned}/${target})` : ` (${assigned})`;
      const card = h('div',{
        title: `${stamp}${p.primary_number || p.name}${countLabel}\n${p.customer_name || ''}` + (p.address ? `\nAddress: ${p.address}` : '') + `\nClick to manage crew for ${dKey}`,
        style: `
          background:${colorForProject(p.id)};
          color:#fff;
          padding:2px 6px;
          margin-bottom:2px;
          border-radius:3px;
          font-size:10px;
          line-height:1.3;
          cursor:pointer;
          overflow:hidden;
          text-overflow:ellipsis;
          white-space:nowrap;
        `,
      }, stamp + (p.primary_number || p.name || 'Project') + countLabel);
      card.onclick = () => showSchedulerDayPopup(p, dKey, () => { main.innerHTML=''; renderScheduler(main); });
      cell.append(card);
    });

    grid.append(cell);
  }

  cal.append(grid);

  main.append(h('p',{style:'color:var(--text2);font-size:12px;margin-top:12px'},
    'Click any project card to manage that day\u2019s crew. Counts show "assigned / target manpower". Green ✓ = that day is marked Fully Staffed (per-day; Copy-Day propagates across all working days).'));
}

// Per-day scheduler pop-up — opens when a calendar card is clicked.
// Replaces the simpler showScheduleEditPopup for this tab; that one
// stays in use for the Schedule tab where there's no crew management.
async function showSchedulerDayPopup(project, dateKey, onSaved) {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:640px;max-height:90vh;overflow-y:auto'});

  const loading = h('p',{},'Loading…');
  modal.append(loading);
  overlay.append(modal); document.body.append(overlay);

  let allAssignments = [], schedule = {}, dayState = { fully_staffed: false, notes: '' };
  try {
    [allAssignments, schedule, dayState] = await Promise.all([
      api('/projects/' + project.id + '/assignments').then(r => r.assignments || []),
      api('/projects/' + project.id + '/schedule'),
      api(`/projects/${project.id}/day-notes/${dateKey}`).catch(() => ({ fully_staffed: false, notes: '' })),
    ]);
  } catch (err) {
    loading.textContent = 'Could not load: ' + err.message;
    return;
  }

  const dayAssignments = allAssignments.filter(a => String(a.work_date).slice(0, 10) === dateKey);

  modal.innerHTML = '';
  modal.append(h('h2',{},(dayState.fully_staffed ? '✅ ' : '') + (project.primary_number ? project.primary_number + ' — ' : '') + (project.name || 'Project')));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:6px'},
    `Customer: ${project.customer_name || '—'} • PM: ${project.pm_name || '—'} • Length: ${project.project_length_days || '?'} working days • Manpower target: ${project.manpower || '?'}`));
  if (project.address) {
    // Full site address (including zip) — kept on its own line so PMs can
    // copy it cleanly into Maps / share with the crew. Falls back silently
    // when a project hasn't been geocoded yet.
    modal.append(h('p',{style:'color:var(--text);font-size:12px;margin-bottom:6px'},[
      h('strong',{},'Address: '),
      document.createTextNode(project.address),
    ]));
  }
  modal.append(h('p',{style:'color:var(--text);font-size:13px;font-weight:600;margin-bottom:12px'},
    `Crew for ${dateKey}: ${dayAssignments.length} worker${dayAssignments.length === 1 ? '' : 's'} assigned`));

  // Fully Staffed toggle — per-day state. Only marks THIS date as fully
  // staffed; the project-wide green ✓ stamp only appears across all
  // working days when the scheduler hits "Copy this day's crew to all
  // working days" (which also propagates fully_staffed). Per Pat's rule.
  const fsRow = h('div',{style:'background:var(--bg3);padding:10px;border-radius:6px;margin-bottom:12px;display:flex;align-items:center;gap:10px'});
  const fsCb = h('input',{type:'checkbox',style:'width:auto'});
  fsCb.checked = !!dayState.fully_staffed;
  fsCb.onchange = async () => {
    try {
      await api(`/projects/${project.id}/day-notes/${dateKey}`, {
        method: 'PUT',
        body: JSON.stringify({ fully_staffed: fsCb.checked }),
      });
      dayState.fully_staffed = fsCb.checked;
      const h2 = modal.querySelector('h2');
      if (h2) h2.textContent = (fsCb.checked ? '✅ ' : '') + (project.primary_number ? project.primary_number + ' — ' : '') + (project.name || 'Project');
    } catch (err) { alert(err.message); fsCb.checked = !fsCb.checked; }
  };
  const fsLbl = h('label',{style:'display:flex;align-items:center;gap:8px;cursor:pointer'});
  fsLbl.append(fsCb);
  fsLbl.append(h('span',{style:'font-weight:600'},'Fully Staffed for ' + dateKey));
  fsLbl.append(h('span',{style:'font-size:12px;color:var(--text2)'},'(per-day; use Copy-Day to broadcast)'));
  fsRow.append(fsLbl);
  modal.append(fsRow);

  // Workers assigned for this date — list with Remove buttons
  const crewSection = h('div',{style:'margin-bottom:12px'});
  crewSection.append(h('h3',{style:'font-size:13px;margin-bottom:6px'},`Workers on ${dateKey}`));
  if (dayAssignments.length === 0) {
    crewSection.append(h('p',{style:'color:var(--text2);font-style:italic;font-size:13px'},'No workers assigned on this day.'));
  } else {
    const list = h('div',{style:'display:flex;flex-direction:column;gap:4px'});
    dayAssignments.forEach(a => {
      const row = h('div',{style:'display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg3);border-radius:4px;font-size:13px'});
      row.append(h('span',{style:'flex:1'}, a.worker_name || '—'));
      row.append(h('span',{style:'font-size:11px;color:var(--text3)'}, (a.worker_role || '').replace(/_/g,' ')));
      row.append(h('button',{className:'btn-red btn-sm',style:'padding:2px 8px',onclick:async()=>{
        try {
          await api(`/projects/${project.id}/assignments/${a.id}`, {method:'DELETE'});
          showSchedulerDayPopup(project, dateKey, onSaved); // re-open with fresh data
          overlay.remove();
        } catch (err) { alert(err.message); }
      }},'×'));
      list.append(row);
    });
    crewSection.append(list);
  }
  modal.append(crewSection);

  // Action buttons
  const actions = h('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px'});

  // Assign Workers — adds to THIS day specifically
  actions.append(h('button',{className:'btn btn-sm',onclick:()=>{
    showAssignWorkersPopup(project, [dateKey], () => {
      overlay.remove();
      showSchedulerDayPopup(project, dateKey, onSaved);
    });
  }},'+ Assign for ' + dateKey));

  // Copy this day's crew to all working days
  actions.append(h('button',{
    className:'btn-outline btn-sm',
    title: dayAssignments.length === 0 ? 'Assign at least one worker first' : '',
    onclick: async () => {
      if (dayAssignments.length === 0) return alert('Assign workers to this day first, then copy to the rest.');
      if (!confirm(`Copy ${dayAssignments.length} worker${dayAssignments.length === 1 ? '' : 's'} from ${dateKey} to every other working day of "${project.name}"?\n\nExisting assignments on those other days will be REPLACED.`)) return;
      try {
        const r = await api(`/projects/${project.id}/assignments/copy-day`, {
          method: 'POST',
          body: JSON.stringify({source_date: dateKey}),
        });
        alert(`Copied to ${r.target_dates} other working day${r.target_dates === 1 ? '' : 's'} (${r.assignments_created} new assignments).`);
        overlay.remove();
        if (onSaved) onSaved();
      } catch (err) { alert(err.message); }
    },
  }, '⎘ Copy this day\u2019s crew to all working days'));

  // Edit schedule (start, length, manpower, working-day toggles)
  actions.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
    overlay.remove();
    showScheduleEditPopup(project.id, onSaved);
  }},'Edit Schedule'));

  modal.append(actions);

  // ─── Day notes ──────────────────────────────────────────────
  //
  // Per-(project, date) note. Stored independently from project-wide
  // notes (those live on the project record). Saved on click of the
  // Save Note button; does NOT auto-broadcast — the scheduler decides
  // when to push to the crew via Email Day to Staff.
  const dayNotesSection = h('div',{style:'background:var(--bg3);padding:12px;border-radius:6px;margin-bottom:12px'});
  dayNotesSection.append(h('h3',{style:'font-size:13px;margin-bottom:6px'},`Day notes for ${dateKey}`));
  dayNotesSection.append(h('p',{style:'color:var(--text3);font-size:11px;margin-bottom:6px'},
    'Notes specific to this day. Saved silently — click Email Day to Staff to actually push to the crew.'));
  const dayNoteTA = h('textarea',{
    id: 'sch-day-note-ta',
    style: 'width:100%;min-height:60px;padding:6px;font-family:inherit;font-size:12px;resize:vertical',
    placeholder: 'Optional — special instructions, gate code, pre-shift meeting time, etc.',
  });
  dayNoteTA.value = dayState?.notes || '';
  dayNotesSection.append(dayNoteTA);
  const dayNoteSaveBtn = h('button',{className:'btn-outline btn-sm',style:'margin-top:6px',onclick:async()=>{
    try {
      await api(`/projects/${project.id}/day-notes/${dateKey}`, {
        method: 'PUT',
        body: JSON.stringify({ notes: $('#sch-day-note-ta').value }),
      });
      dayNoteSaveBtn.textContent = '✓ Saved';
      setTimeout(()=>{ dayNoteSaveBtn.textContent = 'Save Note'; }, 1500);
    } catch (err) { alert(err.message); }
  }},'Save Note');
  dayNotesSection.append(dayNoteSaveBtn);
  modal.append(dayNotesSection);

  // Email Day to Staff used to live here; moved up to the Scheduler tab
  // top-level header so it's reachable without opening a day card. See
  // showEmailDayPickerPopup.

  // Close button — re-renders the calendar so any assignment/fully-staffed
  // changes made inside the modal show up on the cards without a manual
  // refresh. Was the bug Pat hit where the title-card crew count stayed
  // at 0/x after the first assignment until the page was reloaded.
  const closeRow = h('div',{style:'display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:10px'});
  closeRow.append(h('button',{className:'btn-outline',onclick:()=>{
    overlay.remove();
