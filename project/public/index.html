// ═══════════════════════════════════════════════════════════
// SCHEDULE — calendar view
// ═══════════════════════════════════════════════════════════
//
// Phase 1 of the project scheduler (per docs/FUTURE_REFINEMENTS/06).
// Renders a month-grid calendar with each scheduled project drawn as a
// horizontal band spanning the days it occupies (start_date through
// start_date + project_length_days, skipping non-working days per the
// project's schedule overrides).
//
// Click any band → opens ScheduleEditPopup for that project (start date,
// working day toggles).
//
// Notification deep-link: PMs receive a notification when start_date is
// set; the action_url is `/#/schedule?edit=<projectId>`. The hash-param
// is read at render time and auto-opens the pop-up.

const scheduleState = {
  // First-of-month being viewed; persists across re-renders within session
  monthAnchor: null,
};

async function renderSchedule(main) {
  if (!scheduleState.monthAnchor) {
    const t = new Date();
    scheduleState.monthAnchor = new Date(t.getFullYear(), t.getMonth(), 1);
  }
  const anchor = scheduleState.monthAnchor;

  // Header with month label + nav
  const hdr = h('div',{className:'page-header'});
  hdr.append(h('h1',{},'Schedule'));
  hdr.append(h('div',{style:'margin-left:auto;display:flex;gap:8px;align-items:center'}, [
    h('button',{className:'btn-outline btn-sm',onclick:()=>{
      scheduleState.monthAnchor = new Date(anchor.getFullYear(), anchor.getMonth() - 1, 1);
      main.innerHTML=''; renderSchedule(main);
    }},'◀ Prev'),
    h('strong',{style:'min-width:140px;text-align:center'}, anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'})),
    h('button',{className:'btn-outline btn-sm',onclick:()=>{
      scheduleState.monthAnchor = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1);
      main.innerHTML=''; renderSchedule(main);
    }},'Next ▶'),
    h('button',{className:'btn-outline btn-sm',style:'margin-left:8px',onclick:()=>{
      const t = new Date();
      scheduleState.monthAnchor = new Date(t.getFullYear(), t.getMonth(), 1);
      main.innerHTML=''; renderSchedule(main);
    }},'Today'),
  ]));
  main.append(hdr);

  // Compute window: pad to full weeks for the grid (Sun-start week)
  const firstOfMonth = anchor;
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay()); // back to Sunday
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridEnd.getDate() + 41); // 6 weeks × 7 days - 1
  const fmt = (d) => d.toISOString().split('T')[0];

  // Loading placeholder
  const cal = h('div',{style:'background:var(--bg2);border-radius:8px;padding:12px'});
  cal.textContent = 'Loading…';
  main.append(cal);

  let projects = [];
  try {
    const r = await api(`/projects/scheduled-list?from=${fmt(gridStart)}&to=${fmt(gridEnd)}`);
    projects = r.projects || [];
  } catch (err) {
    cal.innerHTML = '';
    cal.append(h('div',{style:'color:var(--red);padding:12px'}, 'Could not load schedule: ' + err.message));
    return;
  }

  // Visible diagnostic — if 0 projects come back, the issue is server-side
  // (filter, permissions, missing start_date). If >0 but no cards render,
  // it's the day-occupation check below.
  console.log('[Schedule] Fetched projects:', projects);
  cal.innerHTML = '';
  const status = h('div',{style:'font-size:12px;color:var(--text2);padding:4px 0 8px'},
    `${projects.length} project${projects.length === 1 ? '' : 's'} scheduled in this view`);
  cal.append(status);

  // Build grid: 7 cols (Sun..Sat) × 6 rows
  const grid = h('div',{style:'display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)'});

  // Day-name header row
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(name => {
    const cell = h('div',{style:'background:var(--bg3);padding:6px 8px;font-size:11px;font-weight:600;color:var(--text2);text-align:center'}, name);
    grid.append(cell);
  });

  // Date helpers — kept local to avoid the classic JS timezone bug where
  // `new Date("2026-05-15")` parses as UTC midnight (8 PM the previous
  // day in EDT). PostgreSQL returns dates in YYYY-MM-DD form; we parse
  // the integer parts ourselves to get a local-midnight Date object that
  // compares correctly against the calendar's local-time day cells.
  function parseLocalDate(s) {
    if (!s) return null;
    const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) {
      const d = new Date(s);
      return isNaN(d) ? null : d;
    }
    return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
  }

  // Pre-compute, per project, the set of calendar dates that fall inside
  // its working-day window. This is the right place to do the work because
  // `project_length_days` is in WORKING days (M-F by default, plus Sat/Sun
  // if overrides enable them), not calendar days. The earlier interpretation
  // — calendar days — produced cards that ended on the wrong weekday: a
  // 10-day project starting Tuesday should end on the second Monday after
  // skipping two weekends, not the second Thursday after counting all days.
  //
  // We walk forward from start_date, only counting days that match the
  // project's working-day rules, until we've collected `length` of them.
  // A safety cap (length × 10 calendar days) prevents infinite loops on
  // pathological data (e.g., zero working days configured).
  const projectWorkingDays = new Map(); // projectId → Set<"YYYY-M-D">
  projects.forEach(p => {
    const start = parseLocalDate(p.start_date);
    if (!start) return;
    const length = parseInt(p.project_length_days, 10) || 1;
    const set = new Set();
    let d = new Date(start);
    let safety = 0;
    while (set.size < length && safety < length * 10 + 7) {
      const dow = d.getDay(); // 0=Sun..6=Sat
      const isWorking = (dow >= 1 && dow <= 5)
        || (dow === 0 && !!p.works_sunday)
        || (dow === 6 && !!p.works_saturday);
      if (isWorking) {
        set.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`);
      }
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      safety++;
    }
    projectWorkingDays.set(p.id, set);
  });

  function projectOccupiesDay(p, dayDate) {
    const set = projectWorkingDays.get(p.id);
    if (!set) return false;
    return set.has(`${dayDate.getFullYear()}-${dayDate.getMonth()}-${dayDate.getDate()}`);
  }

  // Helper: deterministic color from project id
  function colorForProject(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360}, 40%, 36%)`;
  }

  for (let i = 0; i < 42; i++) {
    const day = new Date(gridStart);
    day.setDate(day.getDate() + i);
    const isCurrentMonth = day.getMonth() === firstOfMonth.getMonth();
    const isToday = day.toDateString() === new Date().toDateString();

    const cell = h('div',{style:`
      background:var(--bg2);
      min-height:90px;
      padding:4px;
      opacity:${isCurrentMonth ? 1 : 0.45};
      ${isToday ? 'box-shadow:inset 0 0 0 2px var(--primary);' : ''}
    `});
    cell.append(h('div',{style:`font-size:11px;color:${isToday ? 'var(--primary)' : 'var(--text2)'};font-weight:${isToday ? 700 : 400};margin-bottom:2px`}, String(day.getDate())));

    projects.filter(p => projectOccupiesDay(p, day)).forEach(p => {
      const card = h('div',{
        title: `${p.primary_number || p.name} — ${p.customer_name || ''} (PM: ${p.pm_name || '—'})\nStart: ${p.start_date} • Length: ${p.project_length_days || '?'}d • Personnel: ${p.manpower || '?'}`,
        style: `
          background:${colorForProject(p.id)};
          color:#fff;
          padding:2px 6px;
          margin-bottom:2px;
          border-radius:3px;
          font-size:10px;
          line-height:1.3;
          cursor:pointer;
          overflow:hidden;
          text-overflow:ellipsis;
          white-space:nowrap;
        `,
      }, (p.primary_number || p.name || 'Project') + (p.customer_name ? ' · ' + p.customer_name : ''));
      card.onclick = () => showScheduleEditPopup(p.id, () => { main.innerHTML=''; renderSchedule(main); });
      cell.append(card);
    });

    grid.append(cell);
  }

  cal.append(grid);

  // Legend / hint
  main.append(h('p',{style:'color:var(--text2);font-size:12px;margin-top:12px'},
    'Click any project card to edit start date, working days (Sat / Sun), and review the schedule. Default working days are Mon-Fri.'));

  // Auto-open edit pop-up if URL has ?edit=<projectId> (notification deep link)
  // S.params is populated by the router; we also accept the legacy hash form
  if (S.params && S.params.edit) {
    showScheduleEditPopup(S.params.edit, () => { main.innerHTML=''; renderSchedule(main); });
  }
}

// Schedule edit pop-up — start date + working day overrides for one project.
// onSaved fires after successful PATCH so the calendar can refresh.
async function showScheduleEditPopup(projectId, onSaved) {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:520px'});

  const loading = h('p',{},'Loading…');
  modal.append(loading);
  overlay.append(modal);
  document.body.append(overlay);

  let project, schedule;
  try {
    const projResp = await api('/projects/' + projectId);
    project = projResp.project;
    schedule = await api('/projects/' + projectId + '/schedule');
  } catch (err) {
    loading.textContent = 'Could not load: ' + err.message;
    return;
  }

  modal.innerHTML = '';
  modal.append(h('h2',{},'Schedule: ' + (project.name || 'Project')));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:14px'},
    `Customer: ${project.customer_name || '—'} • PM: ${project.pm_name || '—'}`));

  // Two-column form for the four scheduling inputs
  const formGrid = h('div',{className:'form-grid'});
  formGrid.append(h('div',{className:'form-group'},[
    h('label',{},'Start date'),
    makeDateInput({id:'sch-start', value: project.start_date ? String(project.start_date).split('T')[0] : ''}),
  ]));
  // Length editable here too — Pat asked for this so the calendar card
  // can grow/shrink without leaving the schedule pop-up. Same field as
  // on the project edit pop-up; whichever was changed last wins.
  formGrid.append(h('div',{className:'form-group'},[
    h('label',{},'Project length (days)'),
    h('input',{id:'sch-length', type:'number', min:'0', step:'1', value: project.project_length_days || ''}),
  ]));
  formGrid.append(h('div',{className:'form-group'},[
    h('label',{},'Manpower'),
    h('input',{id:'sch-manpower', type:'number', min:'0', step:'1', value: project.manpower || ''}),
  ]));
  modal.append(formGrid);

  const wdLabel = h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:8px'},'Working days (default Mon-Fri)');
  modal.append(wdLabel);
  const wdRow = h('div',{style:'display:flex;gap:14px;margin-top:4px'});
  const satCb = h('input',{type:'checkbox',id:'sch-sat'}); satCb.checked = !!schedule.works_saturday;
  const sunCb = h('input',{type:'checkbox',id:'sch-sun'}); sunCb.checked = !!schedule.works_sunday;
  wdRow.append(h('label',{style:'display:flex;align-items:center;gap:6px;cursor:pointer'},[ satCb, h('span',{},'Saturday') ]));
  wdRow.append(h('label',{style:'display:flex;align-items:center;gap:6px;cursor:pointer'},[ sunCb, h('span',{},'Sunday') ]));
  modal.append(wdRow);

  // Day Notes — per-(project, start-date) note. This is the crew-facing
  // channel (the same notes the Email Day to Staff button sends), NOT
  // the project-wide payment/admin notes. Keyed to the start date shown
  // above; if the start date changes the note re-loads for the new date
  // on next open. Saved alongside the schedule on Save.
  const startISO = project.start_date ? String(project.start_date).split('T')[0] : null;
  modal.append(h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:14px'},
    'Day notes' + (startISO ? ` (for ${isoToShort(startISO)})` : ' (set a start date first)')));
  const dayNoteTA = h('textarea',{
    id:'sch-daynote',
    style:'width:100%;min-height:70px;margin-top:4px;padding:8px;font-family:inherit;font-size:13px;resize:vertical',
    placeholder: startISO ? 'Crew-facing note for this day — gate code, pre-shift meeting, etc.' : 'Save a start date, reopen to add a day note',
  });
  dayNoteTA.disabled = !startISO;
  modal.append(dayNoteTA);
  // Load any existing day note for the start date
  if (startISO) {
    api(`/projects/${projectId}/day-notes/${startISO}`)
      .then(r => { dayNoteTA.value = r?.notes || ''; })
      .catch(() => {});
  }

  const actions = h('div',{style:'display:flex;gap:8px;justify-content:flex-end;margin-top:18px'});
  actions.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  actions.append(h('button',{className:'btn',onclick:async()=>{
    const newStart = readDateInput($('#sch-start')) || null;
    const newLength = parseInt($('#sch-length').value, 10);
    const newManpower = parseInt($('#sch-manpower').value, 10);
    try {
      // Two PATCHes — project fields + working-day overrides. Sending
      // length/manpower from this pop-up too so the user can adjust the
      // calendar card's span without leaving the schedule view.
      await api('/projects/' + projectId, {
        method: 'PATCH',
        body: JSON.stringify({
          start_date: newStart,
          project_length_days: Number.isFinite(newLength) && newLength > 0 ? newLength : null,
          manpower: Number.isFinite(newManpower) && newManpower > 0 ? newManpower : null,
        }),
      });
      await api('/projects/' + projectId + '/schedule', {
        method: 'PATCH',
        body: JSON.stringify({
          works_saturday: $('#sch-sat').checked,
          works_sunday: $('#sch-sun').checked,
        }),
      });
      // Save the day note against the effective start date (the new one
      // if the PM just changed it, else the original). Skipped silently
      // if there's no start date to key it to.
      const dayNoteVal = $('#sch-daynote') ? $('#sch-daynote').value : '';
      const effectiveStart = newStart || startISO;
      if (effectiveStart) {
        try {
          await api(`/projects/${projectId}/day-notes/${effectiveStart}`, {
            method: 'PUT',
            body: JSON.stringify({ notes: dayNoteVal }),
          });
        } catch (e) { /* non-fatal — schedule already saved */ }
      }
      overlay.remove();
      if (onSaved) onSaved();
    } catch (err) { alert(err.message); }
  }},'Save'));
  modal.append(actions);
}

// ═══════════════════════════════════════════════════════════
// SCHEDULER — phase 2A: calendar-style By-Project assignment
// ═══════════════════════════════════════════════════════════
//
// Permission gate: tab is admin + scheduler. Per Pat's clarification,
// the Scheduler tab is essentially a CLONE of the Schedule tab's
// calendar view, with these tweaks:
//
//   - Each project's calendar card shows assigned/manpower count
//   - Green ✓ at the front when the project is marked Fully Staffed
//   - Clicking a card opens a per-day panel with: project info, the
//     workers assigned for THAT specific day, an "Assign Workers"
//     pop-up, a "Copy this day's crew to all working days" button, and
//     a Fully Staffed toggle
//
// By-Worker view (rows = workers, cols = days, with extended/simplified
// toggle and drag-reorder) is phase 2A.2 — placeholder still routes to
// a "coming soon" message.

const schedulerState = {
  monthAnchor: null,
  weekAnchor: null, // Sunday of the visible week — used by the By-Worker view
  view: 'by-project',
  byWorkerMode: 'extended',
  sortByDateKey: null, // when set, By-Worker rows sort by assignment on this date
  sortDir: 'asc',      // 'asc' = blanks first, 'desc' = blanks last
};

async function renderScheduler(main) {
  if (!schedulerState.monthAnchor) {
    const t = new Date();
    schedulerState.monthAnchor = new Date(t.getFullYear(), t.getMonth(), 1);
  }
  if (!schedulerState.weekAnchor) {
    // Sunday of the current week — the By-Worker view is weekly, so the
    // anchor is a single Sunday rather than the first of a month.
    const t = new Date();
    const sunday = new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay());
    schedulerState.weekAnchor = sunday;
  }
  const isByWorker = schedulerState.view === 'by-worker';

  const hdr = h('div',{className:'page-header'});
  hdr.append(h('h1',{},'Scheduler'));
  const navWrap = h('div',{style:'margin-left:auto;display:flex;gap:8px;align-items:center'});

  if (isByWorker) {
    // By-Worker: week nav. Anchor = Sunday; label = "Mar 15 – Mar 21".
    const wk = schedulerState.weekAnchor;
    const wkEnd = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate() + 6);
    const lbl = `${wk.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${wkEnd.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      schedulerState.weekAnchor = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate() - 7);
      main.innerHTML=''; renderScheduler(main);
    }},'◀ Prev'));
    navWrap.append(h('strong',{style:'min-width:180px;text-align:center'}, lbl));
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      schedulerState.weekAnchor = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate() + 7);
      main.innerHTML=''; renderScheduler(main);
    }},'Next ▶'));
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      const t = new Date();
      schedulerState.weekAnchor = new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay());
      main.innerHTML=''; renderScheduler(main);
    }},'Today'));
  } else {
    const anchor = schedulerState.monthAnchor;
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      schedulerState.monthAnchor = new Date(anchor.getFullYear(), anchor.getMonth() - 1, 1);
      main.innerHTML=''; renderScheduler(main);
    }},'◀ Prev'));
    navWrap.append(h('strong',{style:'min-width:140px;text-align:center'}, anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'})));
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      schedulerState.monthAnchor = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1);
      main.innerHTML=''; renderScheduler(main);
    }},'Next ▶'));
    navWrap.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
      const t = new Date();
      schedulerState.monthAnchor = new Date(t.getFullYear(), t.getMonth(), 1);
      main.innerHTML=''; renderScheduler(main);
    }},'Today'));
  }
  hdr.append(navWrap);
  main.append(hdr);

  // View toggle — By Project (calendar of project cards w/ crew counts)
  // vs By Worker (grid of workers × dates with project numbers per cell).
  // Active button uses .btn class, inactive uses .btn-outline.
  // Email Day to Staff lives next to the toggles — promoted out of the
  // per-day popup so the scheduler can fire a day's email without
  // drilling into a project card first.
  const seg = h('div',{style:'display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap'});
  const byProjBtn = h('button',{
    className: schedulerState.view === 'by-project' ? 'btn' : 'btn-outline',
    style: 'padding:8px 18px;font-size:13px',
    onclick: () => { schedulerState.view = 'by-project'; main.innerHTML=''; renderScheduler(main); },
  }, 'By Project');
  const byWorkerBtn = h('button',{
    className: schedulerState.view === 'by-worker' ? 'btn' : 'btn-outline',
    style: 'padding:8px 18px;font-size:13px',
    onclick: () => { schedulerState.view = 'by-worker'; main.innerHTML=''; renderScheduler(main); },
  }, 'By Worker');
  seg.append(byProjBtn); seg.append(byWorkerBtn);
  seg.append(h('button',{
    className:'btn-outline',
    style:'padding:8px 14px;font-size:13px;margin-left:auto',
    onclick: () => showEmailDayPickerPopup(),
  }, '✉ Email Day to Staff'));
  main.append(seg);

  if (schedulerState.view === 'by-worker') {
    await renderSchedulerByWorker(main);
    return;
  }

  // By-Project (calendar of project cards)
  const cal = h('div',{style:'background:var(--bg2);border-radius:8px;padding:12px'});
  cal.textContent = 'Loading…';
  main.append(cal);

  // Compute window: pad to full weeks
  const firstOfMonth = schedulerState.monthAnchor;
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridEnd.getDate() + 41);
  const fmt = (d) => d.toISOString().split('T')[0];

  let projects = [];
  let assignmentCounts = {}; // {`projectId|YYYY-MM-DD`: count}
  try {
    const r = await api(`/projects/scheduled-list?from=${fmt(gridStart)}&to=${fmt(gridEnd)}`);
    projects = r.projects || [];
    // Aggregate assignment counts per (project, date) so cards can show
    // "N/M" without N+1 fetches. One round-trip per project — small N
    // (only scheduled projects in this 6-week window), acceptable.
    await Promise.all(projects.map(async p => {
      try {
        const a = await api('/projects/' + p.id + '/assignments');
        (a.assignments || []).forEach(row => {
          const dateKey = String(row.work_date).slice(0, 10);
          const k = `${p.id}|${dateKey}`;
          assignmentCounts[k] = (assignmentCounts[k] || 0) + 1;
        });
      } catch {}
    }));
  } catch (err) {
    cal.innerHTML = '';
    cal.append(h('div',{style:'color:var(--red);padding:12px'},'Could not load: ' + err.message));
    return;
  }

  cal.innerHTML = '';
  cal.append(h('div',{style:'font-size:12px;color:var(--text2);padding:4px 0 8px'},
    `${projects.length} project${projects.length === 1 ? '' : 's'} scheduled in this view`));

  // Date helpers (timezone-safe — see Schedule tab for context)
  function parseLocalDate(s) {
    if (!s) return null;
    const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) { const d = new Date(s); return isNaN(d) ? null : d; }
    return new Date(parseInt(m[1],10), parseInt(m[2],10) - 1, parseInt(m[3],10));
  }
  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // Pre-compute working-day set per project (working days, not calendar days)
  const projectWorkingDays = new Map();
  projects.forEach(p => {
    const start = parseLocalDate(p.start_date);
    if (!start) return;
    const length = parseInt(p.project_length_days, 10) || 1;
    const set = new Set();
    let d = new Date(start);
    let safety = 0;
    while (set.size < length && safety < length * 10 + 7) {
      const dow = d.getDay();
      const isWorking = (dow >= 1 && dow <= 5)
        || (dow === 0 && !!p.works_sunday)
        || (dow === 6 && !!p.works_saturday);
      if (isWorking) set.add(dateKey(d));
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      safety++;
    }
    projectWorkingDays.set(p.id, set);
  });

  function colorForProject(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360}, 40%, 36%)`;
  }

  const grid = h('div',{style:'display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)'});
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(name => {
    grid.append(h('div',{style:'background:var(--bg3);padding:6px 8px;font-size:11px;font-weight:600;color:var(--text2);text-align:center'}, name));
  });

  for (let i = 0; i < 42; i++) {
    const day = new Date(gridStart);
    day.setDate(day.getDate() + i);
    const dKey = dateKey(day);
    const isCurrentMonth = day.getMonth() === firstOfMonth.getMonth();
    const isToday = day.toDateString() === new Date().toDateString();

    const cell = h('div',{style:`
      background:var(--bg2);
      min-height:90px;
      padding:4px;
      opacity:${isCurrentMonth ? 1 : 0.45};
      ${isToday ? 'box-shadow:inset 0 0 0 2px var(--primary);' : ''}
    `});
    cell.append(h('div',{style:`font-size:11px;color:${isToday ? 'var(--primary)' : 'var(--text2)'};font-weight:${isToday ? 700 : 400};margin-bottom:2px`}, String(day.getDate())));

    projects.forEach(p => {
      const set = projectWorkingDays.get(p.id);
      if (!set || !set.has(dKey)) return;
      const assigned = assignmentCounts[`${p.id}|${dKey}`] || 0;
      const target = parseInt(p.manpower, 10) || 0;
      // Per-day fully_staffed: pulled from /scheduled-list's
      // fully_staffed_dates array. The legacy project-wide field is
      // ignored in the UI — Pat's rule, only Copy-Day propagates.
      const fsDays = new Set(p.fully_staffed_dates || []);
      const isFullyStaffedDay = fsDays.has(dKey);
      const stamp = isFullyStaffedDay ? '✅ ' : '';
      const countLabel = target > 0 ? ` (${assigned}/${target})` : ` (${assigned})`;
      const card = h('div',{
        title: `${stamp}${p.primary_number || p.name}${countLabel}\n${p.customer_name || ''}\nClick to manage crew for ${dKey}`,
        style: `
          background:${colorForProject(p.id)};
          color:#fff;
          padding:2px 6px;
          margin-bottom:2px;
          border-radius:3px;
          font-size:10px;
          line-height:1.3;
          cursor:pointer;
          overflow:hidden;
          text-overflow:ellipsis;
          white-space:nowrap;
        `,
      }, stamp + (p.primary_number || p.name || 'Project') + countLabel);
      card.onclick = () => showSchedulerDayPopup(p, dKey, () => { main.innerHTML=''; renderScheduler(main); });
      cell.append(card);
    });

    grid.append(cell);
  }

  cal.append(grid);

  main.append(h('p',{style:'color:var(--text2);font-size:12px;margin-top:12px'},
    'Click any project card to manage that day\u2019s crew. Counts show "assigned / target manpower". Green ✓ = that day is marked Fully Staffed (per-day; Copy-Day propagates across all working days).'));
}

// Per-day scheduler pop-up — opens when a calendar card is clicked.
// Replaces the simpler showScheduleEditPopup for this tab; that one
// stays in use for the Schedule tab where there's no crew management.
async function showSchedulerDayPopup(project, dateKey, onSaved) {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:640px;max-height:90vh;overflow-y:auto'});

  const loading = h('p',{},'Loading…');
  modal.append(loading);
  overlay.append(modal); document.body.append(overlay);

  let allAssignments = [], schedule = {}, dayState = { fully_staffed: false, notes: '' };
  try {
    [allAssignments, schedule, dayState] = await Promise.all([
      api('/projects/' + project.id + '/assignments').then(r => r.assignments || []),
      api('/projects/' + project.id + '/schedule'),
      api(`/projects/${project.id}/day-notes/${dateKey}`).catch(() => ({ fully_staffed: false, notes: '' })),
    ]);
  } catch (err) {
    loading.textContent = 'Could not load: ' + err.message;
    return;
  }

  const dayAssignments = allAssignments.filter(a => String(a.work_date).slice(0, 10) === dateKey);

  modal.innerHTML = '';
  modal.append(h('h2',{},(dayState.fully_staffed ? '✅ ' : '') + (project.primary_number ? project.primary_number + ' — ' : '') + (project.name || 'Project')));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:6px'},
    `Customer: ${project.customer_name || '—'} • PM: ${project.pm_name || '—'} • Length: ${project.project_length_days || '?'} working days • Manpower target: ${project.manpower || '?'}`));
  modal.append(h('p',{style:'color:var(--text);font-size:13px;font-weight:600;margin-bottom:12px'},
    `Crew for ${dateKey}: ${dayAssignments.length} worker${dayAssignments.length === 1 ? '' : 's'} assigned`));

  // Fully Staffed toggle — per-day state. Only marks THIS date as fully
  // staffed; the project-wide green ✓ stamp only appears across all
  // working days when the scheduler hits "Copy this day's crew to all
  // working days" (which also propagates fully_staffed). Per Pat's rule.
  const fsRow = h('div',{style:'background:var(--bg3);padding:10px;border-radius:6px;margin-bottom:12px;display:flex;align-items:center;gap:10px'});
  const fsCb = h('input',{type:'checkbox',style:'width:auto'});
  fsCb.checked = !!dayState.fully_staffed;
  fsCb.onchange = async () => {
    try {
      await api(`/projects/${project.id}/day-notes/${dateKey}`, {
        method: 'PUT',
        body: JSON.stringify({ fully_staffed: fsCb.checked }),
      });
      dayState.fully_staffed = fsCb.checked;
      const h2 = modal.querySelector('h2');
      if (h2) h2.textContent = (fsCb.checked ? '✅ ' : '') + (project.primary_number ? project.primary_number + ' — ' : '') + (project.name || 'Project');
    } catch (err) { alert(err.message); fsCb.checked = !fsCb.checked; }
  };
  const fsLbl = h('label',{style:'display:flex;align-items:center;gap:8px;cursor:pointer'});
  fsLbl.append(fsCb);
  fsLbl.append(h('span',{style:'font-weight:600'},'Fully Staffed for ' + dateKey));
  fsLbl.append(h('span',{style:'font-size:12px;color:var(--text2)'},'(per-day; use Copy-Day to broadcast)'));
  fsRow.append(fsLbl);
  modal.append(fsRow);

  // Workers assigned for this date — list with Remove buttons
  const crewSection = h('div',{style:'margin-bottom:12px'});
  crewSection.append(h('h3',{style:'font-size:13px;margin-bottom:6px'},`Workers on ${dateKey}`));
  if (dayAssignments.length === 0) {
    crewSection.append(h('p',{style:'color:var(--text2);font-style:italic;font-size:13px'},'No workers assigned on this day.'));
  } else {
    const list = h('div',{style:'display:flex;flex-direction:column;gap:4px'});
    dayAssignments.forEach(a => {
      const row = h('div',{style:'display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg3);border-radius:4px;font-size:13px'});
      row.append(h('span',{style:'flex:1'}, a.worker_name || '—'));
      row.append(h('span',{style:'font-size:11px;color:var(--text3)'}, (a.worker_role || '').replace(/_/g,' ')));
      row.append(h('button',{className:'btn-red btn-sm',style:'padding:2px 8px',onclick:async()=>{
        try {
          await api(`/projects/${project.id}/assignments/${a.id}`, {method:'DELETE'});
          showSchedulerDayPopup(project, dateKey, onSaved); // re-open with fresh data
          overlay.remove();
        } catch (err) { alert(err.message); }
      }},'×'));
      list.append(row);
    });
    crewSection.append(list);
  }
  modal.append(crewSection);

  // Action buttons
  const actions = h('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px'});

  // Assign Workers — adds to THIS day specifically
  actions.append(h('button',{className:'btn btn-sm',onclick:()=>{
    showAssignWorkersPopup(project, [dateKey], () => {
      overlay.remove();
      showSchedulerDayPopup(project, dateKey, onSaved);
    });
  }},'+ Assign for ' + dateKey));

  // Copy this day's crew to all working days
  actions.append(h('button',{
    className:'btn-outline btn-sm',
    title: dayAssignments.length === 0 ? 'Assign at least one worker first' : '',
    onclick: async () => {
      if (dayAssignments.length === 0) return alert('Assign workers to this day first, then copy to the rest.');
      if (!confirm(`Copy ${dayAssignments.length} worker${dayAssignments.length === 1 ? '' : 's'} from ${dateKey} to every other working day of "${project.name}"?\n\nExisting assignments on those other days will be REPLACED.`)) return;
      try {
        const r = await api(`/projects/${project.id}/assignments/copy-day`, {
          method: 'POST',
          body: JSON.stringify({source_date: dateKey}),
        });
        alert(`Copied to ${r.target_dates} other working day${r.target_dates === 1 ? '' : 's'} (${r.assignments_created} new assignments).`);
        overlay.remove();
        if (onSaved) onSaved();
      } catch (err) { alert(err.message); }
    },
  }, '⎘ Copy this day\u2019s crew to all working days'));

  // Edit schedule (start, length, manpower, working-day toggles)
  actions.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
    overlay.remove();
    showScheduleEditPopup(project.id, onSaved);
  }},'Edit Schedule'));

  modal.append(actions);

  // ─── Day notes ──────────────────────────────────────────────
  //
  // Per-(project, date) note. Stored independently from project-wide
  // notes (those live on the project record). Saved on click of the
  // Save Note button; does NOT auto-broadcast — the scheduler decides
  // when to push to the crew via Email Day to Staff.
  const dayNotesSection = h('div',{style:'background:var(--bg3);padding:12px;border-radius:6px;margin-bottom:12px'});
  dayNotesSection.append(h('h3',{style:'font-size:13px;margin-bottom:6px'},`Day notes for ${dateKey}`));
  dayNotesSection.append(h('p',{style:'color:var(--text3);font-size:11px;margin-bottom:6px'},
    'Notes specific to this day. Saved silently — click Email Day to Staff to actually push to the crew.'));
  const dayNoteTA = h('textarea',{
    id: 'sch-day-note-ta',
    style: 'width:100%;min-height:60px;padding:6px;font-family:inherit;font-size:12px;resize:vertical',
    placeholder: 'Optional — special instructions, gate code, pre-shift meeting time, etc.',
  });
  dayNoteTA.value = dayState?.notes || '';
  dayNotesSection.append(dayNoteTA);
  const dayNoteSaveBtn = h('button',{className:'btn-outline btn-sm',style:'margin-top:6px',onclick:async()=>{
    try {
      await api(`/projects/${project.id}/day-notes/${dateKey}`, {
        method: 'PUT',
        body: JSON.stringify({ notes: $('#sch-day-note-ta').value }),
      });
      dayNoteSaveBtn.textContent = '✓ Saved';
      setTimeout(()=>{ dayNoteSaveBtn.textContent = 'Save Note'; }, 1500);
    } catch (err) { alert(err.message); }
  }},'Save Note');
  dayNotesSection.append(dayNoteSaveBtn);
  modal.append(dayNotesSection);

  // Email Day to Staff used to live here; moved up to the Scheduler tab
  // top-level header so it's reachable without opening a day card. See
  // showEmailDayPickerPopup.

  // Close button — re-renders the calendar so any assignment/fully-staffed
  // changes made inside the modal show up on the cards without a manual
  // refresh. Was the bug Pat hit where the title-card crew count stayed
  // at 0/x after the first assignment until the page was reloaded.
  const closeRow = h('div',{style:'display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:10px'});
  closeRow.append(h('button',{className:'btn-outline',onclick:()=>{
    overlay.remove();
    if (onSaved) onSaved();
  }},'Close'));
  modal.append(closeRow);
}

// ═══════════════════════════════════════════════════════════
// SCHEDULER — By-Worker grid view
// ═══════════════════════════════════════════════════════════
//
// Rows = on-schedule workers; columns = days in the visible window.
// Each cell shows the project number(s) the worker is assigned to that
// day. Two display modes:
//
//   - SIMPLIFIED (default): cell shows the project number when a worker
//     has 1 assignment, "Multiple" in a bright color when ≥ 2. Row
//     stays at standard height.
//   - EXTENDED: row grows to stack each project number on its own line.
//     Numbers render in order_index sequence (1st, 2nd, 3rd, ...) and
//     can be dragged to reorder; reorder persists per worker per day.
//
// Window: same 6-week pad as the calendar so the two views stay in
// sync visually when the user toggles.

async function renderSchedulerByWorker(main) {
  // Weekly window — 7 days starting from weekAnchor (Sunday). Switched
  // from the previous 6-week pad so the grid fits one screen and the
  // navigation buttons step by week instead of by month.
  const gridStart = new Date(schedulerState.weekAnchor);
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridEnd.getDate() + 6);
  const fmt = (d) => d.toISOString().split('T')[0];

  // Mode toggle (extended / simplified)
  const modeRow = h('div',{style:'display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px'});
  modeRow.append(h('span',{style:'color:var(--text2)'},'Display:'));
  ['simplified','extended'].forEach(mode => {
    const b = h('button',{
      className: schedulerState.byWorkerMode === mode ? 'btn btn-sm' : 'btn-outline btn-sm',
      style: 'padding:4px 12px',
      onclick: () => { schedulerState.byWorkerMode = mode; main.innerHTML=''; renderScheduler(main); },
    }, mode.charAt(0).toUpperCase() + mode.slice(1));
    modeRow.append(b);
  });
  if (schedulerState.byWorkerMode === 'extended') {
    modeRow.append(h('span',{style:'color:var(--text3);font-size:11px;margin-left:8px'},
      'Drag to Reorder'));
  }
  main.append(modeRow);

  const wrap = h('div',{style:'background:var(--bg2);border-radius:8px;padding:12px;overflow-x:auto'});
  wrap.textContent = 'Loading…';
  main.append(wrap);

  let workers = [], assignments = [];
  try {
    const r = await api(`/scheduler/by-worker?from=${fmt(gridStart)}&to=${fmt(gridEnd)}`);
    workers = r.workers || [];
    assignments = r.assignments || [];
  } catch (err) {
    wrap.innerHTML = '';
    wrap.append(h('div',{style:'color:var(--red);padding:12px'}, 'Could not load: ' + err.message));
    return;
  }

  if (workers.length === 0) {
    wrap.innerHTML = '';
    wrap.append(h('div',{style:'background:var(--bg3);padding:24px;border-radius:8px;text-align:center;color:var(--text2)'}, [
      h('p',{style:'margin-bottom:8px'},'No on-schedule users found.'),
      h('p',{style:'font-size:12px;color:var(--text3)'},'Mark users as "On Schedule" via Admin → Users to populate this grid.'),
    ]));
    return;
  }

  wrap.innerHTML = '';

  // Pivot assignments → {workerId: {dateKey: [{id, project_id, project_number, project_name, order_index}]}}
  const byWorkerByDate = new Map();
  assignments.forEach(a => {
    const wid = a.worker_id;
    const dk = String(a.work_date).slice(0, 10);
    if (!byWorkerByDate.has(wid)) byWorkerByDate.set(wid, new Map());
    const dateMap = byWorkerByDate.get(wid);
    if (!dateMap.has(dk)) dateMap.set(dk, []);
    dateMap.get(dk).push(a);
  });
  // Sort each cell by order_index then id (stable)
  byWorkerByDate.forEach(dateMap => dateMap.forEach(arr => arr.sort((x,y) => (x.order_index - y.order_index) || x.id.localeCompare(y.id))));

  // Build grid: Worker col + 7 day cols.
  const dayCols = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(gridStart);
    d.setDate(d.getDate() + i);
    dayCols.push(d);
  }
  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // Color helper for project consistency across views
  function colorForProject(id) {
    let hh = 0;
    for (let i = 0; i < id.length; i++) hh = (hh * 31 + id.charCodeAt(i)) >>> 0;
    return `hsl(${hh % 360}, 40%, 36%)`;
  }

  const tbl = h('table',{style:'border-collapse:collapse;font-size:12px;width:100%'});
  // Header: weekday + date (clickable to sort)
  const thead = h('thead');
  const trDows = h('tr');
  trDows.append(h('th',{style:'position:sticky;left:0;background:var(--bg3);width:110px;min-width:110px;max-width:110px;padding:4px 8px;text-align:left;z-index:2'},'Worker'));
  dayCols.forEach(d => {
    trDows.append(h('th',{style:`
      background:var(--bg3);
      padding:4px;
      font-size:11px;
      color:var(--text2);
      font-weight:600;
      border-left:1px solid var(--border);
    `}, d.toLocaleDateString(undefined,{weekday:'short'})));
  });
  thead.append(trDows);
  const trDays = h('tr');
  trDays.append(h('th',{style:'position:sticky;left:0;background:var(--bg3);padding:2px 8px;text-align:left;z-index:2'},
    h('span',{style:'font-size:10px;color:var(--text3);font-weight:400'},'Click a date to sort')));
  dayCols.forEach(d => {
    const isToday = d.toDateString() === new Date().toDateString();
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const dk = dateKey(d);
    const isSortKey = schedulerState.sortByDateKey === dk;
    const arrow = isSortKey ? (schedulerState.sortDir === 'desc' ? ' ▼' : ' ▲') : '';
    trDays.append(h('th',{
      style:`
        background:${isToday ? 'var(--primary)' : 'var(--bg3)'};
        color:${isToday ? '#fff' : (isWeekend ? 'var(--text3)' : 'var(--text2)')};
        padding:4px;
        font-size:13px;
        font-weight:${isToday ? 700 : 600};
        cursor:pointer;
        ${isSortKey ? 'outline:2px solid var(--primary);outline-offset:-2px;' : ''}
      `,
      title: 'Click to sort workers by what they’re assigned to on this date (blanks first)',
      onclick: () => {
        if (schedulerState.sortByDateKey === dk) {
          schedulerState.sortDir = schedulerState.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          schedulerState.sortByDateKey = dk;
          schedulerState.sortDir = 'asc';
        }
        main.innerHTML=''; renderScheduler(main);
      },
    }, String(d.getDate()) + arrow));
  });
  thead.append(trDays);
  tbl.append(thead);

  const tbody = h('tbody');

  // Row height management: extended mode rows can grow tall; simplified
  // stays compact. We let CSS handle it via a class so re-renders don't
  // need to recompute heights.
  const rowBase = schedulerState.byWorkerMode === 'extended' ? 'min-height:36px;vertical-align:top' : 'height:28px';

  // Click-to-sort: when a date column header is clicked, reorder workers
  // by what's assigned to them on that date. Blank cells (no assignment)
  // sort first in 'asc' mode and last in 'desc' mode — so a scheduler
  // hunting for unstaffed slots can pull all the empties to the top.
  let sortedWorkers = workers.slice();
  if (schedulerState.sortByDateKey) {
    const dk = schedulerState.sortByDateKey;
    const keyFor = (w) => {
      const list = (byWorkerByDate.get(w.id) || new Map()).get(dk) || [];
      if (list.length === 0) return '';
      return list.map(a => a.project_number || a.project_name || '').sort().join('|');
    };
    sortedWorkers.sort((a, b) => {
      const ka = keyFor(a), kb = keyFor(b);
      const aBlank = ka === '', bBlank = kb === '';
      if (aBlank !== bBlank) {
        // asc: blanks first; desc: blanks last
        return (schedulerState.sortDir === 'desc') ? (aBlank ? 1 : -1) : (aBlank ? -1 : 1);
      }
      const cmp = ka.localeCompare(kb);
      return (schedulerState.sortDir === 'desc') ? -cmp : cmp;
    });
  }

  sortedWorkers.forEach(w => {
    const tr = h('tr',{style:'border-top:1px solid var(--border)'});
    const nameCell = h('td',{style:`position:sticky;left:0;background:var(--bg2);padding:6px 8px;font-weight:500;width:110px;min-width:110px;max-width:110px;font-size:12px;${rowBase};z-index:1`});
    nameCell.append(h('div',{style:'white-space:nowrap;overflow:hidden;text-overflow:ellipsis'}, w.first_name + ' ' + w.last_name));
    nameCell.append(h('div',{style:'font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis'}, (w.role || '').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())));
    tr.append(nameCell);

    const dateMap = byWorkerByDate.get(w.id) || new Map();
    dayCols.forEach(d => {
      const dk = dateKey(d);
      const list = dateMap.get(dk) || [];
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const td = h('td',{style:`
        padding:2px;
        text-align:center;
        background:${isWeekend ? 'var(--bg3)' : 'transparent'};
        ${rowBase};
        border-left:1px solid var(--border);
        position:relative;
        cursor:pointer;
      `,
        title: list.length === 0 ? 'Click to assign a project' : 'Click to add another project',
      });
      // Click anywhere in the cell that isn't a draggable chip → open
      // the project picker. The chip drag handlers stopPropagation via
      // their own event flow, but the existence-check on the closest
      // ancestor is a belt-and-suspenders guard so picking the cell next
      // to a chip doesn't accidentally fire when the chip absorbs the drop.
      td.addEventListener('click', (e) => {
        if (e.target.closest('[data-assignment-id]')) return;
        showByWorkerCellAssignPopup(w, dk, () => { main.innerHTML=''; renderScheduler(main); });
      });
      if (list.length > 0) {
        if (schedulerState.byWorkerMode === 'simplified') {
          // Single project: show its number. Multiple: bright "Multiple"
          // label. Color the cell by the (first) project's color so visual
          // continuity with the calendar is preserved.
          if (list.length === 1) {
            const a = list[0];
            td.style.background = colorForProject(a.project_id);
            td.style.color = '#fff';
            td.title = `${a.project_number || a.project_name || 'Project'} — ${a.project_name || ''}`;
            td.append(h('span',{style:'font-size:10px;font-weight:600'}, a.project_number || '?'));
          } else {
            td.style.background = '#d97706'; // amber-ish — clearly distinct from any project hue
            td.style.color = '#fff';
            td.style.fontWeight = '700';
            td.title = list.map(a => a.project_number || a.project_name).join(' • ');
            td.append(h('span',{style:'font-size:10px'}, 'Multiple'));
          }
        } else {
          // Extended: stack project numbers, each draggable for reorder
          const stack = h('div',{style:'display:flex;flex-direction:column;gap:2px;padding:2px'});
          list.forEach((a, idx) => {
            const chip = h('div',{
              draggable: true,
              'data-assignment-id': a.id,
              style: `
                background:${colorForProject(a.project_id)};
                color:#fff;
                padding:2px 4px;
                border-radius:3px;
                font-size:10px;
                font-weight:600;
                cursor:grab;
                user-select:none;
              `,
              title: a.project_name || '',
            }, a.project_number || '?');
            // Drag handlers — reorder within this cell only
            chip.addEventListener('dragstart', (e) => {
              e.dataTransfer.setData('text/plain', a.id);
              e.dataTransfer.effectAllowed = 'move';
              chip.style.opacity = '0.4';
            });
            chip.addEventListener('dragend', () => { chip.style.opacity = '1'; });
            chip.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            chip.addEventListener('drop', async (e) => {
              e.preventDefault();
              const draggedId = e.dataTransfer.getData('text/plain');
              if (!draggedId || draggedId === a.id) return;
              // Build the new order: take current order, remove dragged
              // id, insert it at the drop target's index
              const currentIds = list.map(x => x.id);
              const fromIdx = currentIds.indexOf(draggedId);
              if (fromIdx === -1) return;
              currentIds.splice(fromIdx, 1);
              const toIdx = currentIds.indexOf(a.id);
              currentIds.splice(toIdx, 0, draggedId);
              try {
                await api('/scheduler/assignments/reorder', {
                  method: 'PATCH',
                  body: JSON.stringify({
                    worker_id: w.id, work_date: dk,
                    ordered_assignment_ids: currentIds,
                  }),
                });
                // Re-render to reflect new order
                main.innerHTML=''; renderScheduler(main);
              } catch (err) { alert(err.message); }
            });
            stack.append(chip);
          });
          td.append(stack);
        }
      }
      tr.append(td);
    });

    tbody.append(tr);
  });
  tbl.append(tbody);
  wrap.append(tbl);
}


// Top-level Email Day to Staff picker — replaces the per-day-popup
// button. Asks for a date, lists projects scheduled on that date with
// their assigned crew count, picks one, confirms, fires the email.
async function showEmailDayPickerPopup() {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:520px;max-height:80vh;display:flex;flex-direction:column'});
  modal.append(h('h2',{},'Email Day to Staff'));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:12px'},
    'Pick a date and a project. Workers assigned that day get the project info, crew list, and day note.'));

  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const dateRow = h('div',{className:'form-group',style:'margin-bottom:10px'});
  dateRow.append(h('label',{},'Date'));
  const dateInput = h('input',{type:'date',value:todayStr});
  dateRow.append(dateInput);
  modal.append(dateRow);

  const listLabel = h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-bottom:4px'},'Projects on this date');
  modal.append(listLabel);
  const listWrap = h('div',{style:'display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;min-height:120px;margin-bottom:10px'});
  modal.append(listWrap);

  const closeRow = h('div',{style:'display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:10px'});
  closeRow.append(h('button',{className:'btn-outline btn-sm',onclick:()=>overlay.remove()},'Cancel'));
  modal.append(closeRow);
  overlay.append(modal); document.body.append(overlay);

  async function loadProjects(forDate) {
    listWrap.innerHTML='';
    listWrap.append(h('div',{style:'color:var(--text2);padding:8px;font-size:13px'},'Loading…'));
    let projects = [];
    try {
      const r = await api(`/projects/scheduled-list?from=${forDate}&to=${forDate}`);
      projects = r.projects || [];
    } catch (err) {
      listWrap.innerHTML='';
      listWrap.append(h('div',{style:'color:var(--red);padding:8px'}, 'Could not load: '+err.message));
      return;
    }
    listWrap.innerHTML='';
    if (projects.length === 0) {
      listWrap.append(h('div',{style:'color:var(--text2);padding:8px;font-size:13px'},
        'No projects scheduled on this date.'));
      return;
    }
    // Per-project crew count for the date — one round-trip per project,
    // small N (only same-day projects).
    await Promise.all(projects.map(async p => {
      try {
        const a = await api('/projects/' + p.id + '/assignments');
        const count = (a.assignments || []).filter(x => String(x.work_date).slice(0,10) === forDate).length;
        p._dayCrew = count;
      } catch { p._dayCrew = 0; }
    }));
    projects.forEach(p => {
      const hasCrew = p._dayCrew > 0;
      const row = h('div',{
        style:`padding:10px;background:var(--bg3);border-radius:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;${hasCrew?'cursor:pointer':'opacity:0.55'}`,
        title: hasCrew ? '' : 'No workers assigned this day — assign a crew first',
      });
      const left = h('div');
      left.append(h('div',{style:'font-weight:600;font-size:13px'}, p.primary_number || p.name || 'Project'));
      left.append(h('div',{style:'font-size:11px;color:var(--text2)'}, p.customer_name || '—'));
      row.append(left);
      row.append(h('span',{style:'font-size:12px;color:var(--text3);white-space:nowrap'},
        `${p._dayCrew} worker${p._dayCrew===1?'':'s'}`));
      if (hasCrew) {
        row.onclick = async () => {
          if (!confirm(`Email ${p._dayCrew} worker${p._dayCrew===1?'':'s'} on "${p.primary_number || p.name}" for ${forDate}?`)) return;
          try {
            const r = await api(`/projects/${p.id}/email-day`, {
              method:'POST', body: JSON.stringify({ date: forDate }),
            });
            alert(`Sent to ${r.sent_to} worker${r.sent_to===1?'':'s'}.`);
            overlay.remove();
          } catch (err) { alert(err.message); }
        };
      }
      listWrap.append(row);
    });
  }

  dateInput.onchange = () => loadProjects(dateInput.value);
  loadProjects(todayStr);
}


// Picker for the By-Worker grid: click a cell, get a searchable list of
// projects active on that date, click one to assign this worker to it.
// Lighter-weight than the per-project popup — meant for the staff
// schedulers who think "worker first" rather than "project first".
async function showByWorkerCellAssignPopup(worker, dateKey, onSaved) {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:480px;max-height:80vh;display:flex;flex-direction:column'});
  modal.append(h('h2',{style:'margin-bottom:4px'}, `Assign ${worker.first_name} ${worker.last_name}`));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:10px'},
    `For ${dateKey} — pick a project to add this worker to.`));

  const search = h('input',{placeholder:'Search by number, name, or customer…',autocomplete:'off'});
  modal.append(search);

  const listWrap = h('div',{style:'margin-top:10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;min-height:120px'});
  listWrap.append(h('div',{style:'color:var(--text2);padding:8px;font-size:13px'}, 'Loading projects…'));
  modal.append(listWrap);

  const closeRow = h('div',{style:'display:flex;justify-content:flex-end;margin-top:10px;border-top:1px solid var(--border);padding-top:10px'});
  closeRow.append(h('button',{className:'btn-outline btn-sm',onclick:()=>overlay.remove()},'Cancel'));
  modal.append(closeRow);

  overlay.append(modal); document.body.append(overlay);

  let projects = [];
  try {
    // scheduled-list returns active projects whose working window overlaps
    // the date. Single-day query: from=to=dateKey.
    const r = await api(`/projects/scheduled-list?from=${dateKey}&to=${dateKey}`);
    projects = r.projects || [];
  } catch (err) {
    listWrap.innerHTML = '';
    listWrap.append(h('div',{style:'color:var(--red);padding:8px'}, 'Could not load: ' + err.message));
    return;
  }

  function renderList(filter='') {
    listWrap.innerHTML = '';
    const q = filter.toLowerCase().trim();
    const matched = projects.filter(p => {
      if (!q) return true;
      return (p.primary_number||'').toLowerCase().includes(q)
        || (p.name||'').toLowerCase().includes(q)
        || (p.customer_name||'').toLowerCase().includes(q);
    });
    if (matched.length === 0) {
      listWrap.append(h('div',{style:'color:var(--text2);padding:8px;font-size:13px'},
        projects.length === 0
          ? 'No projects scheduled on this date. Set a project’s start date on the calendar first.'
          : 'No matches.'));
      return;
    }
    matched.forEach(p => {
      const row = h('div',{
        style: 'padding:8px 10px;background:var(--bg3);border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px',
        onmouseover: () => { row.style.background = 'var(--bg4)'; },
        onmouseout: () => { row.style.background = 'var(--bg3)'; },
        onclick: async () => {
          try {
            await api(`/projects/${p.id}/assignments`, {
              method: 'POST',
              body: JSON.stringify({ worker_ids: [worker.id], dates: [dateKey] }),
            });
            overlay.remove();
            if (onSaved) onSaved();
          } catch (err) { alert(err.message); }
        },
      });
      const left = h('div');
      left.append(h('div',{style:'font-weight:600;font-size:13px'}, p.primary_number || p.name || 'Project'));
      left.append(h('div',{style:'font-size:11px;color:var(--text2)'},
        [p.customer_name || '—', p.name].filter(Boolean).join(' • ')));
      row.append(left);
      const target = parseInt(p.manpower, 10) || 0;
      if (target > 0) {
        row.append(h('span',{style:'font-size:11px;color:var(--text3);white-space:nowrap'}, `target ${target}`));
      }
      listWrap.append(row);
    });
  }

  renderList();
  search.oninput = () => renderList(search.value);
  setTimeout(() => search.focus(), 50);
}


// Worker assignment pop-up — multi-select on-schedule users + assign for
// the supplied date(s). Used by both the per-day and bulk assignment
// flows: pass [dateKey] for one day, or the full working-day list to
// assign for the project's whole span.
async function showAssignWorkersPopup(project, workingDates, onSaved) {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:560px'});
  modal.append(h('h2',{},'Assign Workers'));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:14px'},
    `Selected workers will be assigned to all ${workingDates.length} working day${workingDates.length === 1 ? '' : 's'} of "${project.name || 'this project'}". Re-assigning a slot already filled is a silent no-op.`));

  const loading = h('p',{},'Loading on-schedule users…');
  modal.append(loading);

  let workers = [];
  try {
    const r = await api('/users/on-schedule');
    workers = r.users || [];
  } catch (err) {
    loading.textContent = 'Could not load workers: ' + err.message;
    overlay.append(modal); document.body.append(overlay);
    return;
  }
  loading.remove();

  if (workers.length === 0) {
    modal.append(h('p',{style:'color:var(--text2)'},
      'No on-schedule users available. Mark users as "On Schedule" via Admin → Users to surface them here.'));
  } else {
    // Search box + checkbox list. Filtered by typed text.
    const search = h('input',{type:'text',placeholder:'Search workers...',style:'width:100%;margin-bottom:8px'});
    modal.append(search);

    const list = h('div',{style:'max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:4px'});
    const checkboxes = [];
    function renderList() {
      list.innerHTML = '';
      const q = search.value.toLowerCase().trim();
      workers.forEach(w => {
        const fullName = `${w.first_name} ${w.last_name}`;
        if (q && !fullName.toLowerCase().includes(q) && !(w.role || '').toLowerCase().includes(q)) return;
        const row = h('label',{style:'display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;border-radius:4px;font-size:13px'});
        row.onmouseenter = () => row.style.background = 'var(--bg3)';
        row.onmouseleave = () => row.style.background = '';
        const cb = h('input',{type:'checkbox',style:'width:auto'});
        cb.dataset.workerId = w.id;
        // Preserve checked state across re-renders triggered by typing
        const existing = checkboxes.find(c => c.dataset.workerId === w.id);
        if (existing) cb.checked = existing.checked;
        checkboxes.push(cb);
        row.append(cb);
        row.append(h('span',{style:'flex:1'}, fullName));
        row.append(h('span',{style:'font-size:11px;color:var(--text3)'}, (w.role || '').replace(/_/g,' ')));
        list.append(row);
      });
      if (list.children.length === 0) {
        list.innerHTML = '<p style="color:var(--text3);font-size:12px;text-align:center;padding:12px">No matches.</p>';
      }
    }
    search.oninput = renderList;
    renderList();
    modal.append(list);
  }

  const actions = h('div',{style:'display:flex;gap:8px;justify-content:flex-end;margin-top:14px'});
  actions.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  actions.append(h('button',{className:'btn',onclick:async()=>{
    // Collect checked worker IDs from the live DOM (the checkboxes array
    // accumulates across re-renders so dedupe by id).
    const seen = new Set();
    const ids = [];
    document.querySelectorAll('input[type="checkbox"][data-worker-id]').forEach(cb => {
      if (cb.checked && !seen.has(cb.dataset.workerId)) {
        seen.add(cb.dataset.workerId);
        ids.push(cb.dataset.workerId);
      }
    });
    if (ids.length === 0) return alert('Pick at least one worker.');
    if (workingDates.length === 0) return alert('This project has no working dates yet — set start_date and length first.');
    try {
      const r = await api(`/projects/${project.id}/assignments`, {
        method: 'POST',
        body: JSON.stringify({ worker_ids: ids, dates: workingDates }),
      });
      overlay.remove();
      if (onSaved) onSaved();
    } catch (err) { alert(err.message); }
  }},'Assign'));
  modal.append(actions);

  overlay.append(modal);
  document.body.append(overlay);
}

async function renderInvoicesPage(main) {

  main.append(hdr);

  // Summary cards and filter bar removed — the per-column filter row

    content.innerHTML='Loading...';
    const params=new URLSearchParams();

      content.innerHTML='';

async function renderPurchaseOrdersPage(main) {
  const hdr=h('div',{className:'page-header'});
  hdr.append(h('h1',{},'Purchase Orders'));
  main.append(hdr);

  // Summary cards (PO-only)
  try {
    const s=await api('/financials/summary');
    const cards=h('div',{className:'cards'});
    cards.append(makeCard('Total PO Cost',fmtD(s.total_po_cost),s.po_count+' purchase orders'));
    main.append(cards);
  } catch{}

  // Filter row
  const filterBar=h('div',{style:'display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap'});
  const searchInput=h('input',{id:'po-search',placeholder:'Search by PO #, vendor, project...',style:'flex:1;min-width:300px'});
  const statusSel=h('select',{id:'po-status',style:'width:160px'});
  statusSel.innerHTML='<option value="">All statuses</option><option value="draft">Draft</option><option value="submitted">Submitted</option><option value="received">Received</option><option value="partially_received">Partially Received</option><option value="cancelled">Cancelled</option>';
  filterBar.append(searchInput); filterBar.append(statusSel);
  filterBar.append(h('button',{className:'btn btn-sm',onclick:loadPOs},'Search'));
  main.append(filterBar);

  const content=h('div',{id:'po-content'});
  main.append(content);

  async function loadPOs() {
    content.innerHTML='Loading...';
    const params=new URLSearchParams();
    const search=$('#po-search')?.value;
    const status=$('#po-status')?.value;
    if(search) params.set('search',search);
    if(status) params.set('status',status);
    params.set('limit','100');
    try {
      const {purchase_orders}=await api('/financials/purchase-orders?'+params.toString());
      content.innerHTML='';
      if(!purchase_orders.length) { content.innerHTML='<p style="color:var(--text2)">No purchase orders found.</p>'; return; }
      content.append(makeConfigTable('purchase_orders_list',
        ['PO #','Project #','Date','Vendor','Project','Total','Delivery Date','Status'],
        purchase_orders.map(po=>[
          fmtRefDoc(po.po_number, po.external_reference),
          po.project_number ? h('code',{style:'font-family:monospace;font-weight:600;color:var(--primary)'},po.project_number) : '—',
          fmtDtClick(po.order_date),
          po.vendor||'—',
          h('a',{onclick:()=>navigate('project-detail',{id:po.project_id}),style:'cursor:pointer;color:var(--primary)'},po.project_name||'—'),
          fmtD(po.total),
          fmtDtClick(po.delivery_date),
          h('span',{className:'status status-'+po.status},po.status),
        ])
      ));
    } catch(e) { content.innerHTML='<p>'+e.message+'</p>'; }
  }
  await loadPOs();
}

async function renderTablesPage(main) {
