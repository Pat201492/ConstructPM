function showEditUserModal(user, allRoles, parentC) {
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:500px'});
  modal.append(h('h2',{},`Edit: ${user.first_name} ${user.last_name}`));

  // Editable fields
  const form=h('div',{className:'form-grid'});
  form.innerHTML=`
    <div class="form-group"><label>First Name</label><input id="eu-first" value="${user.first_name||''}"></div>
    <div class="form-group"><label>Last Name</label><input id="eu-last" value="${user.last_name||''}"></div>
    <div class="form-group"><label>Email</label><input id="eu-email" type="email" value="${user.email||''}"></div>
    <div class="form-group"><label>Initials</label><input id="eu-initials" value="${user.initials||''}" style="text-transform:uppercase" maxlength="4"></div>
    <div class="form-group"><label>PM Code <span style="color:var(--text3);font-weight:normal;font-size:11px">(single letter, PMs only)</span></label><input id="eu-pmcode" value="${user.pm_code||''}" style="text-transform:uppercase" maxlength="1"></div>
    <div class="form-group"><label>Phone</label><input id="eu-phone" value="${user.phone||''}"></div>
  `;
  modal.append(form);

  // Role dropdown
  const roleGroup=h('div',{className:'form-group',style:'margin-top:12px'});
  roleGroup.append(h('label',{},'Role'));
  const roleSel=h('select',{id:'eu-role'});
  allRoles.forEach(r=>{const o=h('option',{value:r.role_name},r.display_name);if(r.role_name===user.role)o.selected=true;roleSel.append(o);});
  roleGroup.append(roleSel);
  modal.append(roleGroup);

  // Active toggle
  const activeGroup=h('div',{style:'margin-top:12px'});
  const activeCb=h('input',{type:'checkbox',id:'eu-active',style:'width:auto'});
  activeCb.checked=user.active;
  const activeLbl=h('label',{style:'display:flex;align-items:center;gap:8px;cursor:pointer'});
  activeLbl.append(activeCb);
  activeLbl.append(document.createTextNode('Active (uncheck to deactivate user)'));
  activeGroup.append(activeLbl);
  modal.append(activeGroup);

  // On Schedule toggle — controls whether this user appears in the
  // scheduler grid (rows in By-Worker view + assignable to projects in
  // calendar/grid pickers). Default inherits from the user's role
  // configuration on creation; can be overridden per-user here.
  const onSchedGroup=h('div',{style:'margin-top:8px'});
  const onSchedCb=h('input',{type:'checkbox',id:'eu-on-schedule',style:'width:auto'});
  onSchedCb.checked=!!user.on_schedule;
  const onSchedLbl=h('label',{style:'display:flex;align-items:center;gap:8px;cursor:pointer'});
  onSchedLbl.append(onSchedCb);
  onSchedLbl.append(document.createTextNode('On Schedule (this user appears in the scheduler)'));
  onSchedGroup.append(onSchedLbl);
  modal.append(onSchedGroup);

  // Default markup — only shown when the selected role can access the
  // bids tab. Field staff / shop staff don't quote, so hiding the
  // input keeps the form tight. Toggled live on role-change so an
  // admin promoting a user into a bid-capable role sees the field
  // appear without reopening the modal. The column on `users` stays
  // populated either way (default 15 on create), so a later role
  // change doesn't lose data.
  const roleCanBid = (roleName) => {
    const r = allRoles.find(x => x.role_name === roleName);
    if (!r) return false;
    const tabs = Array.isArray(r.allowed_tabs) ? r.allowed_tabs
               : (typeof r.allowed_tabs === 'string' ? JSON.parse(r.allowed_tabs) : []);
    return tabs.includes('bids');
  };
  const markupGroup=h('div',{className:'form-group',style:'margin-top:12px;max-width:200px'});
  markupGroup.append(h('label',{},'Default Markup %'));
  markupGroup.append(h('input',{id:'eu-markup',type:'number',step:'0.5',value:user.default_markup_pct||15}));
  if (!roleCanBid(user.role)) markupGroup.style.display = 'none';
  modal.append(markupGroup);
  roleSel.addEventListener('change', () => {
    markupGroup.style.display = roleCanBid(roleSel.value) ? '' : 'none';
  });

  // Save button
  modal.append(h('button',{className:'btn',style:'margin-top:16px',onclick:async()=>{
    try {
      const pmCode=($('#eu-pmcode').value||'').trim().toUpperCase();
      const payload = {
        first_name:$('#eu-first').value,
        last_name:$('#eu-last').value,
        email:$('#eu-email').value,
        initials:$('#eu-initials').value,
        pm_code: pmCode || null,
        phone:$('#eu-phone').value,
        role:$('#eu-role').value,
        active:$('#eu-active').checked,
        on_schedule:$('#eu-on-schedule').checked,
      };
      // Only persist markup if the selected role can actually quote
      // bids — otherwise the existing column value (or default 15)
      // stays as-is and the form keeps it out of sight + out of
      // mind for non-bid roles.
      if (roleCanBid($('#eu-role').value)) {
        payload.default_markup_pct = parseFloat($('#eu-markup').value) || 0;
      }
      await api('/users/'+user.id,{method:'PATCH',body:JSON.stringify(payload)});
      alert('User updated');
      overlay.remove();
      adminUsers(parentC);
    }catch(e){alert(e.message)}
  }},'Save Changes'));

  // Password reset section
  modal.append(h('div',{style:'border-top:1px solid var(--border);margin-top:20px;padding-top:16px'}));
  modal.append(h('h3',{style:'margin-bottom:8px'},'Send Password Reset Link'));
  modal.append(h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:8px'},'Generates a one-time reset link. If email is configured, it will be sent to the user automatically. Otherwise the link is printed to the server console and shown here so you can copy it. User\'s current password stays active until they use the link.'));
  const linkBtn=h('button',{className:'btn-outline btn-sm',onclick:async()=>{
    linkBtn.disabled=true; const prev=linkBtn.textContent; linkBtn.textContent='Generating…';
    try {
      const r=await api('/admin/users/'+user.id+'/password-reset',{method:'POST'});
      if (r.delivery==='email') {
        alert(r.message || 'Reset link emailed to '+user.email);
      } else {
        // Show the link inline so admin can copy and share it
        linkBox.style.display='block';
        linkInput.value=r.link;
        linkExpiry.textContent='Expires: '+new Date(r.expiresAt).toLocaleString();
        linkInput.select();
      }
    } catch(e) { alert(e.message); }
    finally { linkBtn.disabled=false; linkBtn.textContent=prev; }
  }},'Send Reset Link');
  modal.append(linkBtn);

  // Box where the link appears when email is not configured
  const linkBox=h('div',{style:'display:none;margin-top:12px;padding:10px;background:var(--bg3);border-radius:4px;border:1px solid var(--accent,#C55A11)'});
  linkBox.append(h('p',{style:'font-size:12px;font-weight:600;color:var(--accent,#C55A11);margin-bottom:6px'},'⚠️ Email not configured — copy this link and send it to the user:'));
  const linkInput=h('input',{type:'text',readonly:true,style:'width:100%;font-family:monospace;font-size:11px;padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:4px'});
  linkBox.append(linkInput);
  const copyBtn=h('button',{className:'btn-outline btn-sm',style:'margin-top:6px',onclick:()=>{
    linkInput.select();
    try { document.execCommand('copy'); copyBtn.textContent='Copied!'; setTimeout(()=>copyBtn.textContent='Copy Link',1500); }
    catch { /* no-op */ }
  }},'Copy Link');
  linkBox.append(copyBtn);
  const linkExpiry=h('p',{style:'font-size:11px;color:var(--text2);margin-top:6px'},'');
  linkBox.append(linkExpiry);
  modal.append(linkBox);

  // Manual password reset section (admin types new password directly)
  modal.append(h('div',{style:'border-top:1px solid var(--border);margin-top:20px;padding-top:16px'}));
  modal.append(h('h3',{style:'margin-bottom:8px'},'Set Password Directly'));
  modal.append(h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:8px'},'Set a new temporary password. The user will need to change it after logging in.'));
  const passRow=h('div',{style:'display:flex;gap:8px'});
  passRow.append(h('input',{id:'eu-newpass',type:'password',placeholder:'New password (min 8 chars)',style:'flex:1'}));
  passRow.append(h('button',{className:'btn-outline btn-sm',onclick:async()=>{
    const newPass=$('#eu-newpass').value;
    if(!newPass||newPass.length<8) return alert('Password must be at least 8 characters');
    try {
      await api('/users/'+user.id,{method:'PATCH',body:JSON.stringify({password:newPass})});
      alert('Password reset successfully. User will need to log in with the new password.');
      $('#eu-newpass').value='';
    }catch(e){alert(e.message)}
  }},'Set Password'));
  modal.append(passRow);

  // Close
  modal.append(h('button',{className:'btn-outline',style:'margin-top:16px;display:block',onclick:()=>overlay.remove()},'Cancel'));

  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.append(modal);
  document.body.append(overlay);
}

// Per-user access configuration modal
async function showUserAccessModal(userId, userName, parentContainer) {
  const data=await api('/admin/users/'+userId+'/access');
  const {user, role_defaults, user_tab_overrides, user_access_config, bid_assignments, project_assignments, available_tabs}=data;

  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:700px;max-height:90vh;overflow-y:auto'});
  modal.append(h('h2',{},`Access: ${userName}`));
  modal.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:16px'},`Role: ${user.role} — Override role defaults below, or leave blank to use role template.`));

  // ── TAB ACCESS ──
  modal.append(h('h3',{style:'font-size:14px;margin-bottom:8px'},'Tab Access'));
  const useOverride=h('label',{style:'display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer'});
  const overrideCb=h('input',{type:'checkbox',style:'width:auto'});
  overrideCb.checked=!!user_tab_overrides;
  useOverride.append(overrideCb);
  useOverride.append(document.createTextNode('Override role default tabs'));
  modal.append(useOverride);

  const roleTabs=(role_defaults?.allowed_tabs)||[];
  const effectiveTabs=user_tab_overrides||roleTabs;
  const tabGrid=h('div',{style:'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px'});
  const tabCbs=[];
  available_tabs.forEach(tab=>{
    const lbl=h('label',{style:'display:flex;align-items:center;gap:4px;font-size:13px;padding:4px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--border);cursor:pointer'});
    const cb=h('input',{type:'checkbox',style:'width:auto'});
    cb.checked=effectiveTabs.includes(tab.id);
    cb.dataset.tabId=tab.id;
    if(!overrideCb.checked){cb.disabled=true;lbl.style.opacity='0.5';}
    tabCbs.push(cb);
    lbl.append(cb);lbl.append(document.createTextNode(tab.label));
    tabGrid.append(lbl);
  });
  overrideCb.onchange=()=>{
    tabCbs.forEach(cb=>{cb.disabled=!overrideCb.checked;cb.parentElement.style.opacity=overrideCb.checked?'1':'0.5';});
  };
  modal.append(tabGrid);

  // ── VISIBILITY OVERRIDES ──
  modal.append(h('h3',{style:'font-size:14px;margin-bottom:8px'},'Visibility Overrides'));
  modal.append(h('p',{style:'font-size:12px;color:var(--text3);margin-bottom:8px'},`Role defaults: Bids=${role_defaults?.bid_visibility||'own'}, Projects=${role_defaults?.project_visibility||'own'}. Select "Use role default" to not override.`));

  const visRow=h('div',{style:'display:flex;gap:16px;margin-bottom:20px'});
  const bidVisSel=h('select',{style:'width:180px'});
  bidVisSel.append(h('option',{value:''},'Use role default'));
  ['own','all','assigned','none'].forEach(v=>{const o=h('option',{value:v},v.charAt(0).toUpperCase()+v.slice(1));if(user_access_config.bid_visibility===v)o.selected=true;bidVisSel.append(o);});
  visRow.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Bid Visibility'),bidVisSel]));

  const projVisSel=h('select',{style:'width:180px'});
  projVisSel.append(h('option',{value:''},'Use role default'));
  ['own','all','assigned','none'].forEach(v=>{const o=h('option',{value:v},v.charAt(0).toUpperCase()+v.slice(1));if(user_access_config.project_visibility===v)o.selected=true;projVisSel.append(o);});
  visRow.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Project Visibility'),projVisSel]));
  modal.append(visRow);

  // ── BID ASSIGNMENTS ──
  modal.append(h('h3',{style:'font-size:14px;margin-bottom:8px'},'Bid Assignments (for "Assigned" visibility)'));
  const bidList=h('div',{style:'margin-bottom:8px'});
  bid_assignments.forEach(ba=>{
    const row=h('div',{style:'display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px'});
    row.append(h('span',{},`${ba.bid_number} — ${ba.project_scope||''}`));
    row.append(h('button',{className:'btn-red btn-sm',style:'padding:1px 6px;font-size:11px',onclick:async()=>{
      await api('/admin/users/'+userId+'/bid-assignments/'+ba.bid_id,{method:'DELETE'});
      showUserAccessModal(userId,userName,parentContainer);
    }},'×'));
    bidList.append(row);
  });
  if(bid_assignments.length===0) bidList.append(h('p',{style:'font-size:12px;color:var(--text3)'},'No bids assigned'));
  modal.append(bidList);

  // Add bid assignment
  const addBidRow=h('div',{style:'display:flex;gap:8px;margin-bottom:20px'});
  const bidInput=h('input',{placeholder:'Bid number or scope...',style:'flex:1;font-size:13px'});
  addBidRow.append(bidInput);
  addBidRow.append(h('button',{className:'btn btn-sm',onclick:async()=>{
    const search=bidInput.value;
    if(!search) return;
    try{
      const {bids}=await api('/bids?search='+encodeURIComponent(search)+'&limit=1');
      if(!bids.length) return alert('No bid found matching "'+search+'"');
      await api('/admin/users/'+userId+'/bid-assignments',{method:'POST',body:JSON.stringify({bid_id:bids[0].id})});
      showUserAccessModal(userId,userName,parentContainer);
    }catch(e){alert(e.message)}
  }},'Add Bid'));
  modal.append(addBidRow);

  // ── PROJECT ASSIGNMENTS ──
  modal.append(h('h3',{style:'font-size:14px;margin-bottom:8px'},'Project Assignments (for "Assigned" visibility)'));
  const projList=h('div',{style:'margin-bottom:8px'});
  project_assignments.forEach(pa=>{
    const row=h('div',{style:'display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px'});
    row.append(h('span',{},pa.name));
    row.append(h('button',{className:'btn-red btn-sm',style:'padding:1px 6px;font-size:11px',onclick:async()=>{
      await api('/admin/users/'+userId+'/project-assignments/'+pa.project_id,{method:'DELETE'});
      showUserAccessModal(userId,userName,parentContainer);
    }},'×'));
    projList.append(row);
  });
  if(project_assignments.length===0) projList.append(h('p',{style:'font-size:12px;color:var(--text3)'},'No projects assigned'));
  modal.append(projList);

  const addProjRow=h('div',{style:'display:flex;gap:8px;margin-bottom:20px'});
  const projInput=h('input',{placeholder:'Project name...',style:'flex:1;font-size:13px'});
  addProjRow.append(projInput);
  addProjRow.append(h('button',{className:'btn btn-sm',onclick:async()=>{
    const search=projInput.value;
    if(!search) return;
    try{
      const {projects}=await api('/projects?search='+encodeURIComponent(search)+'&limit=1');
      if(!projects.length) return alert('No project found matching "'+search+'"');
      await api('/admin/users/'+userId+'/project-assignments',{method:'POST',body:JSON.stringify({project_id:projects[0].id})});
      showUserAccessModal(userId,userName,parentContainer);
    }catch(e){alert(e.message)}
  }},'Add Project'));
  modal.append(addProjRow);

  // ── SAVE + CLOSE ──
  const btns=h('div',{style:'display:flex;gap:8px;margin-top:16px;border-top:1px solid var(--border);padding-top:16px'});
  btns.append(h('button',{className:'btn',onclick:async()=>{
    try {
      const updates={};
      // Tab overrides
      if(overrideCb.checked) {
        updates.tab_overrides=tabCbs.filter(cb=>cb.checked).map(cb=>cb.dataset.tabId);
      } else {
        updates.tab_overrides=null;
      }
      // Visibility overrides
      const ac={};
      if(bidVisSel.value) ac.bid_visibility=bidVisSel.value;
      if(projVisSel.value) ac.project_visibility=projVisSel.value;
      updates.access_config=Object.keys(ac).length>0?ac:null;

      await api('/admin/users/'+userId+'/access',{method:'PATCH',body:JSON.stringify(updates)});
      alert('Access updated for '+userName);
      overlay.remove();
    }catch(e){alert(e.message)}
  }},'Save Access Config'));
  btns.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  btns.append(h('button',{className:'btn-outline',style:'margin-left:auto',onclick:async()=>{
    try{
      await api('/admin/users/'+userId+'/access',{method:'PATCH',body:JSON.stringify({tab_overrides:null,access_config:null})});
      alert('Reset to role defaults');
      overlay.remove();
    }catch(e){alert(e.message)}
  }},'Reset to Role Defaults'));
  modal.append(btns);

  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.append(modal);
  document.body.append(overlay);
}

async function adminRoles(c) {
  c.innerHTML='';
  const {roles, available_tabs}=await api('/admin/roles');

  // Create new role form
  const form=h('div',{style:'background:var(--bg3);padding:16px;border-radius:8px;margin-bottom:20px'});
  form.innerHTML=`<h3 style="margin-bottom:12px">Create Custom Role</h3>
    <div class="form-grid">
      <div class="form-group"><label>Role ID (lowercase, no spaces)</label><input id="nr-name" placeholder="e.g. superintendent"></div>
      <div class="form-group"><label>Display Name</label><input id="nr-display" placeholder="e.g. Superintendent"></div>
      <div class="form-group full"><label>Description</label><input id="nr-desc" placeholder="What this role does"></div>
    </div>`;
  form.append(h('button',{className:'btn',style:'margin-top:8px',onclick:async()=>{
    const name=$('#nr-name').value, display=$('#nr-display').value;
    if(!name||!display) return alert('Role ID and Display Name required');
    try {
      await api('/admin/roles',{method:'POST',body:JSON.stringify({role_name:name,display_name:display,description:$('#nr-desc').value,allowed_tabs:['notifications']})});
      adminRoles(c);
    } catch(e) { alert(e.message); }
  }},'Create Role'));
  c.append(form);

  // Role list with editable tab checkboxes
  for (const role of roles) {
    const card=h('div',{className:'card',style:'margin-bottom:16px;padding:16px'});
    const header=h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px'});
    header.append(h('div',{},[
      h('span',{style:'font-size:16px;font-weight:700'},role.display_name),
      h('span',{style:'font-size:12px;color:var(--text3);margin-left:8px'},role.role_name),
      role.is_system?h('span',{style:'font-size:10px;color:var(--text3);margin-left:8px;background:var(--bg3);padding:2px 6px;border-radius:4px'},'SYSTEM')
        :h('button',{className:'btn-red btn-sm',style:'margin-left:8px',onclick:async()=>{
          if(!confirm('Delete role "'+role.display_name+'"?')) return;
          try{await api('/admin/roles/'+role.role_name,{method:'DELETE'});adminRoles(c);}catch(e){alert(e.message)}
        }},'Delete'),
    ]));
    card.append(header);

    if(role.description) card.append(h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:12px'},role.description));

    // Tab checkboxes
    const tabGrid=h('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px'});
    const currentTabs=role.allowed_tabs||[];
    const checkboxes=[];

    available_tabs.forEach(tab=>{
      const lbl=h('label',{style:'display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:4px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--border)'});
      const cb=h('input',{type:'checkbox',style:'width:auto'});
      cb.checked=currentTabs.includes(tab.id);
      cb.dataset.tabId=tab.id;
      checkboxes.push(cb);
      lbl.append(cb);
      lbl.append(document.createTextNode(tab.label));
      tabGrid.append(lbl);
    });
    card.append(tabGrid);

    // Visibility dropdowns
    card.append(h('div',{style:'font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;margin-top:8px'},'Data Visibility'));
    const visGrid=h('div',{style:'display:flex;gap:16px;margin-bottom:12px'});
    const bidVisSel=h('select',{style:'width:180px'});
    ['own','all','assigned','none'].forEach(v=>{const o=h('option',{value:v},v.charAt(0).toUpperCase()+v.slice(1));if(role.bid_visibility===v)o.selected=true;bidVisSel.append(o);});
    visGrid.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Bids'),bidVisSel]));
    const projVisSel=h('select',{style:'width:180px'});
    ['own','all','assigned','originated','none'].forEach(v=>{const o=h('option',{value:v},v.charAt(0).toUpperCase()+v.slice(1));if(role.project_visibility===v)o.selected=true;projVisSel.append(o);});
    visGrid.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Projects'),projVisSel]));
    card.append(visGrid);

    // On Schedule default — controls whether new users assigned this role
    // start with on_schedule=true. Doesn't retroactively change existing
    // users (they have their own per-user override on the user edit form).
    const onSchedRoleGroup=h('div',{style:'margin-top:8px;font-size:13px'});
    const onSchedRoleCb=h('input',{type:'checkbox',style:'width:auto;margin-right:6px'});
    onSchedRoleCb.checked=!!role.on_schedule_default;
    const onSchedRoleLbl=h('label',{style:'display:inline-flex;align-items:center;cursor:pointer'});
    onSchedRoleLbl.append(onSchedRoleCb);
    onSchedRoleLbl.append(document.createTextNode('On Schedule by default (new users in this role appear in the scheduler)'));
    onSchedRoleGroup.append(onSchedRoleLbl);
    card.append(onSchedRoleGroup);

    // Save button for this role
    const roleNameCopy=role.role_name;
    card.append(h('button',{className:'btn btn-sm',style:'margin-top:8px',onclick:async()=>{
      const newTabs=checkboxes.filter(cb=>cb.checked).map(cb=>cb.dataset.tabId);
      try{await api('/admin/roles/'+roleNameCopy,{method:'PATCH',body:JSON.stringify({allowed_tabs:newTabs,bid_visibility:bidVisSel.value,project_visibility:projVisSel.value,on_schedule_default:onSchedRoleCb.checked})});
        alert('Role "'+roleNameCopy+'" updated');
      }catch(e){alert(e.message)}
    }},'Save Role Settings'));

    c.append(card);
  }
}

function showEditLocationModal(loc, parentC) {
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal'});
  modal.append(h('h2',{},`Edit: ${loc.name}`));

  const form=h('div',{className:'form-grid'});
  form.innerHTML=`
    <div class="form-group"><label>Name</label><input id="el-name" value="${(loc.name||'').replace(/"/g,'&quot;')}"></div>
    <div class="form-group"><label>Location Code <span style="color:var(--text3);font-weight:normal;font-size:11px">(free text)</span></label><input id="el-code" value="${(loc.location_code||'').replace(/"/g,'&quot;')}" style="font-family:monospace"></div>
    <div class="form-group"><label>Street</label><input id="el-street" value="${(loc.street||'').replace(/"/g,'&quot;')}"></div>
    <div class="form-group"><label>Town</label><input id="el-town" value="${(loc.town||'').replace(/"/g,'&quot;')}"></div>
    <div class="form-group"><label>State</label><input id="el-state" value="${(loc.state||'').replace(/"/g,'&quot;')}" maxlength="2" style="text-transform:uppercase"></div>
    <div class="form-group"><label>Zip</label><input id="el-zip" value="${(loc.zip||'').replace(/"/g,'&quot;')}"></div>
    <div class="form-group"><label>Local Union</label><input id="el-union" value="${(loc.local_union||'').replace(/"/g,'&quot;')}"></div>
    <div class="form-group"><label>Miles from HQ <span style="color:var(--text3);font-weight:normal;font-size:11px">(manual override)</span></label>
      <div style="display:flex;gap:6px">
        <input id="el-miles" type="number" step="0.1" min="0" value="${loc.miles_from_hq!=null?loc.miles_from_hq:''}" style="flex:1">
        <button type="button" id="el-miles-recalc" class="btn-outline btn-sm" style="white-space:nowrap">Recalc from Maps</button>
      </div>
    </div>
  `;
  modal.append(form);

  // "Recalc from Maps" — calls the backend recalculate-miles route, which
  // uses GOOGLE_MAPS_API_KEY to compute distance from the home address.
  // If the env var isn't set this just returns null; the input stays
  // unchanged and we surface that in an alert so the user knows.
  setTimeout(() => {
    const btn = document.getElementById('el-miles-recalc');
    if (!btn) return;
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = '…';
      try {
        const r = await api('/locations/'+loc.id+'/recalculate-miles',{method:'POST'});

  const uploadBtn=h('button',{className:'btn',onclick:async()=>{

    if(!file)return alert('Select an image');
    if(!$('#ft-name').value)return alert('Enter a template name');
    uploadBtn.textContent='Analyzing...';
    uploadBtn.disabled=true;
    try{
      const fd=new FormData();
      fd.append('template_image',file);
      fd.append('form_type',$('#ft-type').value);
      fd.append('name',$('#ft-name').value);
      const resp=await fetch('/api/form-templates/upload',{method:'POST',headers:{'Authorization':'Bearer '+S.token},body:fd});
      const data=await resp.json();
      if(!resp.ok) throw new Error(data.error);
      alert(data.message);
      adminFormTemplates(c);
    }catch(e){alert(e.message);}finally{uploadBtn.textContent='Upload & Analyze';uploadBtn.disabled=false;}
  }},'Upload & Analyze');
  uploadRow.append(uploadBtn);
  c.append(uploadRow);

  // List existing templates
  try {
    const {templates}=await api('/form-templates');
    if(!templates?.length) { c.append(h('p',{style:'color:var(--text3)'},'No form templates yet.')); return; }

    templates.forEach(t=>{
      const fieldMap=typeof t.field_map==='string'?JSON.parse(t.field_map||'[]'):(t.field_map||[]);
      const card=h('div',{className:'card',style:'padding:16px;margin-bottom:12px'});

      // Header
      const hdr=h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'});
      hdr.append(h('div',{},[
        h('span',{style:'font-weight:700'},t.name),
        h('span',{style:'font-size:12px;color:var(--text3);margin-left:8px'},'Type: '+t.form_type),
        t.active?h('span',{className:'status status-active',style:'margin-left:8px'},'ACTIVE'):h('span',{className:'status status-draft',style:'margin-left:8px'},'Inactive'),
      ]));
      hdr.append(h('span',{style:'font-size:11px;color:var(--text3)'},fieldMap.length+' fields | '+(t.created_by_name||'Unknown')));
      card.append(hdr);

      // Field list
      if(fieldMap.length>0) {
        const fieldTable=h('div',{style:'margin-bottom:12px'});
        fieldTable.append(makeTable(
          ['#','Field Name','Label','Type','Description'],
          fieldMap.map((f,i)=>[i+1,f.field_name,f.label_text||'—',f.data_type||'text',f.description||'—'])
        ));
        card.append(fieldTable);
      } else {
        card.append(h('p',{style:'color:var(--text3);font-size:13px'},'No fields detected. Edit the field map manually.'));
      }

      // Actions
      const actions=h('div',{style:'display:flex;gap:8px'});

      // Edit fields button
      actions.append(h('button',{className:'btn-outline btn-sm',onclick:()=>{
        showFieldMapEditor(t.id,fieldMap,()=>adminFormTemplates(c));
      }},'Edit Fields'));

      // Activate/Deactivate
      if(!t.active) {
        actions.append(h('button',{className:'btn btn-sm',onclick:async()=>{
          if(!confirm('Activate "'+t.name+'"? This deactivates any other active template for '+t.form_type+'.'))return;
          try{await api('/form-templates/'+t.id+'/activate',{method:'POST'});adminFormTemplates(c);}catch(e){alert(e.message)}
        }},'Activate'));
        actions.append(h('button',{className:'btn-red btn-sm',onclick:async()=>{
          if(!confirm('Delete "'+t.name+'"?'))return;
          try{await api('/form-templates/'+t.id,{method:'DELETE'});adminFormTemplates(c);}catch(e){alert(e.message)}
        }},'Delete'));
      } else {
        actions.append(h('button',{className:'btn-outline btn-sm',onclick:async()=>{
          try{await api('/form-templates/'+t.id+'/deactivate',{method:'POST'});adminFormTemplates(c);}catch(e){alert(e.message)}
        }},'Deactivate'));
      }
      card.append(actions);
      c.append(card);
    });
  }catch(e){c.append(h('p',{style:'color:var(--red)'},e.message));}
}

function showFieldMapEditor(templateId,fieldMap,onSaved) {
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:800px;max-height:90vh;overflow-y:auto'});
  modal.append(h('h2',{},'Edit Field Map'));
  modal.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:16px'},
    'Edit field names, types, and descriptions. These define what the vision AI extracts from submitted forms.'));

  let fields=[...fieldMap];
  const container=h('div',{id:'fme-list'});
  modal.append(container);

  function renderFields() {
    container.innerHTML='';
    const validTypes=['text','number','date','checkbox','filled_circle'];

    fields.forEach((f,i)=>{
      const row=h('div',{style:'display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap'});
      row.append(h('span',{style:'font-size:12px;color:var(--text3);width:20px'},String(i+1)));
      row.append(h('input',{value:f.field_name,style:'width:150px;font-size:13px',placeholder:'field_name',
        oninput:(e)=>{fields[i].field_name=e.target.value;}}));
      row.append(h('input',{value:f.label_text||'',style:'width:180px;font-size:13px',placeholder:'Label text',
        oninput:(e)=>{fields[i].label_text=e.target.value;}}));
      const sel=h('select',{style:'width:120px;font-size:13px',onchange:(e)=>{fields[i].data_type=e.target.value;}});
      validTypes.forEach(vt=>{const o=h('option',{value:vt},vt);if(vt===f.data_type)o.selected=true;sel.append(o);});
      row.append(sel);
      row.append(h('input',{value:f.description||'',style:'width:200px;font-size:13px',placeholder:'Description',
        oninput:(e)=>{fields[i].description=e.target.value;}}));
      row.append(h('button',{className:'btn-red btn-sm',style:'padding:2px 8px',onclick:()=>{
        fields.splice(i,1);renderFields();
      }},'×'));
      container.append(row);
    });
  }
  renderFields();

  // Add field button
  modal.append(h('button',{className:'btn-outline btn-sm',style:'margin-bottom:16px',onclick:()=>{
    fields.push({field_name:'new_field',label_text:'',data_type:'text',description:''});
    renderFields();
  }},'+ Add Field'));

  // Save / Cancel
  const btns=h('div',{style:'display:flex;gap:8px'});
  btns.append(h('button',{className:'btn',onclick:async()=>{
    // Validate
    for(const f of fields){if(!f.field_name){alert('All fields need a name');return;}}
    try{
      await api('/form-templates/'+templateId+'/field-map',{method:'PUT',body:JSON.stringify({field_map:fields})});
      overlay.remove();
      if(onSaved)onSaved();
    }catch(e){alert(e.message)}
  }},'Save Field Map'));
  btns.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  modal.append(btns);

  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.append(modal);document.body.append(overlay);
}

  form.append(h('button',{className:'btn btn-sm',onclick:async()=>{

function showImportMapping(c,targets,target,parsed) {
  const mapping=$('#bi-mapping')||c;
  mapping.innerHTML='';
  mapping.append(h('h3',{style:'margin-bottom:8px'},`Parsed ${parsed.total_rows} rows, ${parsed.columns.length} columns`));

  // Column mapping
  const dbCols=targets[target]||[];
  const mapGrid=h('div',{className:'form-grid',style:'margin-bottom:16px'});
  parsed.columns.forEach(fileCol=>{
    const g=h('div',{className:'form-group'});
    g.append(h('label',{},fileCol+' →'));
    const sel=h('select',{className:'bi-map',dataset:{filecol:fileCol}});
    sel.append(h('option',{value:''},'— skip —'));
    dbCols.forEach(dc=>{
      const opt=h('option',{value:dc},dc);
      if(dc.toLowerCase()===fileCol.toLowerCase()||dc.includes(fileCol.toLowerCase())) opt.selected=true;
      sel.append(opt);
    });
    g.append(sel);
    mapGrid.append(g);
  });
  mapping.append(mapGrid);

  // Preview
  if(parsed.sample_rows.length>0) {
    mapping.append(h('h4',{style:'margin-bottom:8px'},'Preview (first 5 rows)'));
    mapping.append(makeTable(parsed.columns,parsed.sample_rows.slice(0,5).map(r=>parsed.columns.map(c=>r[c]||''))));
  }

  // Import button
  mapping.append(h('button',{className:'btn',style:'margin-top:12px',onclick:async()=>{
    const colMap={};
    $$('.bi-map').forEach(sel=>{
      if(sel.value) colMap[sel.dataset.filecol]=sel.value;
    });
    try {
      const r=await api('/admin/import',{method:'POST',body:JSON.stringify({target,rows:parsed.all_rows,column_map:colMap})});
      alert(`Imported: ${r.inserted} rows, ${r.skipped} skipped`);
      mapping.innerHTML='';
    } catch(e) { alert(e.message); }
  }},'Import '+parsed.total_rows+' Rows'));
}

  let templates = [];

  const left = h('div',{});
  const right = h('div',{id:'et-editor'});
  layout.append(left); layout.append(right);

      });
      item.append(h('div',{style:'font-weight:600'}, t.name));
      item.append(h('div',{style:'font-size:11px;opacity:0.75'}, t.key));
      left.append(item);
    });
  }

  function renderEditor() {
    const tpl = templates.find(t => t.key === activeKey);
    if (!tpl) return;
    right.innerHTML = '';
    right.append(h('h3',{style:'margin:0 0 10px'}, tpl.name));

    right.append(h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:4px'},'Template name'));
    const nameInp = h('input',{type:'text',value:tpl.name,style:'width:100%;margin-bottom:6px'});
    right.append(nameInp);

    right.append(h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:8px'},'Subject'));
    const subjectInp = h('input',{type:'text',value:tpl.subject,style:'width:100%;margin-bottom:6px;font-family:JetBrains Mono,monospace;font-size:12px'});
    right.append(subjectInp);

    right.append(h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:8px'},'Body (HTML)'));
    const bodyTA = h('textarea',{style:'width:100%;min-height:300px;font-family:JetBrains Mono,monospace;font-size:12px;padding:8px;resize:vertical'});
    bodyTA.value = tpl.body_html || '';
    right.append(bodyTA);

    if (tpl.variables && tpl.variables.length > 0) {
      const varsPanel = h('div',{style:'margin-top:10px;padding:8px 10px;background:var(--bg3);border-radius:4px;font-size:11px'});
      varsPanel.append(h('div',{style:'font-weight:700;margin-bottom:4px'},'Available variables'));
      tpl.variables.forEach(v => {
        const row = h('div',{style:'display:flex;gap:8px;align-items:baseline;padding:2px 0'});
        row.append(h('code',{style:'background:var(--bg);padding:1px 6px;border-radius:2px;color:var(--primary);min-width:200px'}, '{{' + v.key + '}}'));
        row.append(h('span',{style:'color:var(--text2)'}, v.label || ''));
        if (v.sample !== undefined && v.sample !== null) {
          row.append(h('span',{style:'color:var(--text3);margin-left:auto;font-family:monospace'}, '"' + String(v.sample).substring(0,40) + '"'));
        }
        varsPanel.append(row);
      });
      right.append(varsPanel);
    }

    const actions = h('div',{style:'display:flex;gap:8px;margin-top:12px'});
    actions.append(h('button',{className:'btn',onclick:async()=>{
      try {
        const r = await api('/admin/email-templates/'+tpl.key,{method:'PATCH',body:JSON.stringify({
          name: nameInp.value,
          subject: subjectInp.value,
          body_html: bodyTA.value,
        })});
        const ix = templates.findIndex(t => t.key === tpl.key);
        if (ix >= 0) templates[ix] = r.template;
        renderList(); renderEditor();
        alert('Saved.');
      } catch (e) { alert(e.message); }
    }},'Save'));
    actions.append(h('button',{className:'btn-outline',onclick:async()=>{
      try {
        const preview = await api('/admin/email-templates/'+tpl.key+'/preview',{method:'POST',body:JSON.stringify({})});
        showEmailPreviewModal(preview, tpl);
      } catch (e) { alert(e.message); }
    }},'Preview'));
    right.append(actions);

    if (TEMPLATES_WITH_STATIC_RECIPIENTS.has(tpl.key)) {
      right.append(renderRecipientsSection(tpl));
    }
  }

  renderList();
  renderEditor();
}

  const ccLbl = h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:8px'},'CC emails (comma-separated)');

  section.append(status);

  async function load() {
    try {
      const r = await api('/admin/email-templates/'+tpl.key+'/recipients');
      const rec = r.recipients || { static_emails:[], static_user_ids:[], cc_emails:[] };
      emailsInp.value = (rec.static_emails || []).join(', ');

      status.textContent = 'Saved.';

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
// makeTable — used by ~every list page in the app. As of May 2026 it
// supports per-column sort (click a header) and per-column type-to-filter
// (the blank input row beneath the headers). Behavior:
//   - Click a header to sort asc; click again for desc; third click clears.
//   - Type into the filter cell beneath any column to filter rows by that
//     column's text content. Filters across columns are AND-combined.
//   - Cells that contain HTMLElements (buttons, links, status badges) are
//     compared by their textContent — so "$1,234.56" sorts as a string,
//     which is good enough for typical use; numeric columns that need
//     true numeric sort can be made into right-aligned plain text cells.
//   - Empty-header columns ("" — used for action button columns) get
//     neither a sort handle nor a filter input; they just render blank
//     cells in the filter row.
//   - Disable sort/filter on a per-call basis with `{sortable:false}` /
//     `{filterable:false}` if a list shouldn't have them.
function makeTable(headers, rows, opts = {}) {
  const sortable = opts.sortable !== false;
  const filterable = opts.filterable !== false;

  const t = h('table');
  const thead = h('thead');

  // Header row
  const trH = h('tr');
  headers.forEach((hd, idx) => {
    const isAction = !hd || hd === '';
    const th = h('th', isAction ? {} : { 'data-col-idx': String(idx) });
    if (isAction || !sortable) {
      th.textContent = hd || '';
    } else {
      th.style.cursor = 'pointer';
      th.style.userSelect = 'none';
      th.title = 'Click to sort';
      const labelSpan = h('span', {}, hd);
      const arrow = h('span', { style: 'margin-left:4px;color:var(--text3);font-size:11px' }, '');
      th.append(labelSpan);
      th.append(arrow);
      th.dataset.arrow = '';
    }
    trH.append(th);
  });
  thead.append(trH);

  // Filter row — only if filterable AND there's something to filter
  let filterRow = null;
  if (filterable) {
    filterRow = h('tr', { className: 'filter-row' });
    headers.forEach((hd, idx) => {
      const td = h('th', { style: 'padding:2px 4px;background:var(--bg2)' });
      const isAction = !hd || hd === '';
      if (!isAction) {
        const input = h('input', {
          type: 'text',
          placeholder: 'Filter…',
          'data-col-idx': String(idx),
          style: 'width:100%;font-size:11px;padding:3px 6px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:3px',
        });
        td.append(input);
      }
      filterRow.append(td);
    });
    thead.append(filterRow);
  }
  t.append(thead);

  const tbody = h('tbody');
  // Stash {dom, cells, sortKeys[]} per row so we can sort/filter without
  // re-rendering. cells[] lets us pull text per column index quickly.
  const rowDescs = rows.map(row => {
    const tr = h('tr');
    const cells = row.map(cell => {
      const td = h('td');
      if (cell == null) {
        td.textContent = '';
      } else if (typeof cell === 'string' || typeof cell === 'number') {
        td.textContent = String(cell);
      } else {
        td.append(cell);
      }
      tr.append(td);
      return td;
    });
    tbody.append(tr);
    return { tr, cells };
  });
  t.append(tbody);

  // Helpers
  function cellText(rd, colIdx) {
    if (!rd.cells[colIdx]) return '';
    return (rd.cells[colIdx].textContent || '').trim();
  }
  // Sort comparator that's "smart" enough for mixed numeric/string — strips
  // leading $ and commas, tries Number(), falls back to localeCompare.
  function compareForSort(a, b) {
    if (a === b) return 0;
    const stripCurrency = (s) => s.replace(/[$,]/g, '').trim();
    const na = parseFloat(stripCurrency(a));
    const nb = parseFloat(stripCurrency(b));
    const aIsNum = !isNaN(na) && /^[\s$\-]*[\d.,]+\s*%?$/.test(a);
    const bIsNum = !isNaN(nb) && /^[\s$\-]*[\d.,]+\s*%?$/.test(b);
    if (aIsNum && bIsNum) return na - nb;
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
  }

  let sortState = { col: -1, dir: 0 }; // dir: 0=none, 1=asc, -1=desc

  function applySortAndFilter() {
    // Build filter map from current input values
    const filters = {};
    if (filterRow) {
      filterRow.querySelectorAll('input[data-col-idx]').forEach(inp => {
        const v = inp.value.trim().toLowerCase();
        if (v) filters[inp.dataset.colIdx] = v;
      });
    }

    // Decide visibility
    rowDescs.forEach(rd => {
      let visible = true;
      for (const colIdx in filters) {
        if (cellText(rd, colIdx).toLowerCase().indexOf(filters[colIdx]) === -1) {
          visible = false; break;
        }
      }
      rd.tr.style.display = visible ? '' : 'none';
    });

    // Sort
    if (sortState.col >= 0 && sortState.dir !== 0) {
      const col = sortState.col;
      const dir = sortState.dir;
      const sorted = rowDescs.slice().sort((a, b) => dir * compareForSort(cellText(a, col), cellText(b, col)));
      // Re-append in sorted order
      sorted.forEach(rd => tbody.append(rd.tr));
    } else {
      // Restore original order
      rowDescs.forEach(rd => tbody.append(rd.tr));
    }
  }

  // Wire header clicks for sort
  if (sortable) {
    trH.querySelectorAll('th[data-col-idx]').forEach(th => {
      th.onclick = () => {
        const idx = parseInt(th.dataset.colIdx, 10);
        if (sortState.col === idx) {
          sortState.dir = sortState.dir === 1 ? -1 : (sortState.dir === -1 ? 0 : 1);
        } else {
          sortState = { col: idx, dir: 1 };
        }
        // Update arrow indicators
        trH.querySelectorAll('th[data-col-idx]').forEach(otherTh => {
          const arrowSpan = otherTh.children[1];
          if (!arrowSpan) return;
          const oIdx = parseInt(otherTh.dataset.colIdx, 10);
          if (oIdx === sortState.col && sortState.dir !== 0) {
            arrowSpan.textContent = sortState.dir === 1 ? '▲' : '▼';
            arrowSpan.style.color = 'var(--primary)';
          } else {
            arrowSpan.textContent = '';
          }
        });
        applySortAndFilter();
      };
    });
  }

  // Wire filter inputs
  if (filterRow) {
    filterRow.querySelectorAll('input[data-col-idx]').forEach(inp => {
      // Don't propagate clicks on the input to the th sort handler
      inp.onclick = (e) => e.stopPropagation();
      let deb;
      inp.oninput = () => {
        clearTimeout(deb);
        deb = setTimeout(applySortAndFilter, 120);
      };
    });
  }

  return t;
}

/**
 * Configurable table — modal with drag-to-reorder column list.
 * Saves column order + visibility per tableId to localStorage.
 * Supports named presets: save current as preset, load, delete.
 */
// makeConfigTable — wraps makeTable with a per-table column-config UI
// (hide/reorder columns, save presets to localStorage).
//
// Signature:
//   makeConfigTable(tableId, headers, rows)
//   makeConfigTable(tableId, headers, rows, { defaultHidden: ['col name', ...] })
//
// `defaultHidden` is consulted ONLY on the very first render (when no
// localStorage config exists for this tableId). After that, the user's
// saved visibility preferences win — clearing localStorage (or hitting the
// defensive recovery when all data cols are hidden) restores defaults.
function makeConfigTable(tableId, headers, rows, opts = {}) {
  const defaultHidden = new Set(opts.defaultHidden || []);
  const storageKey='colcfg_'+tableId;
  const presetsKey='colpresets_'+tableId;

  // Empty-header columns are "action columns" — always shown, never togglable
  // (they hold buttons like Edit/Delete and would create ghost rows in the
  // column config modal if treated as data columns).
  const isActionCol = (idx) => !headers[idx] || headers[idx] === '';
  const dataIndices = headers.map((_, i) => i).filter(i => !isActionCol(i));
  const actionIndices = headers.map((_, i) => i).filter(isActionCol);

  let config;
  try { config=JSON.parse(localStorage.getItem(storageKey)); } catch{}
  // Config only covers data columns (named headers), not the action columns
  if(!config||!Array.isArray(config)||config.length!==dataIndices.length) {
    config=dataIndices.map(i=>({name:headers[i], visible: !defaultHidden.has(headers[i])}));
  }
  // Defensive recovery: if a saved config somehow has zero visible data
  // columns, the table would render only action buttons (delete/edit
  // ✕ icons) with no context — looks completely broken. This was hit in
  // May 2026 when bids list rendered as a stack of red ✕ buttons with
  // no headers. Reset to default-visibility (respecting opts.defaultHidden
  // so recovered tables don't blow open columns the user originally chose
  // to hide) and persist so the recovery sticks.
  if (dataIndices.length > 0 && config.every(c => !c.visible)) {
    config = config.map(c => ({...c, visible: !defaultHidden.has(c.name)}));
    // Edge case: if defaultHidden hides EVERY column, force at least one
    // visible to avoid an infinite recovery loop on next render.
    if (config.every(c => !c.visible)) config[0].visible = true;
    try { localStorage.setItem(storageKey, JSON.stringify(config)); } catch {}
  }

  // Load saved presets
  function getPresets() { try { return JSON.parse(localStorage.getItem(presetsKey))||{}; } catch { return {}; } }
  function savePresets(p) { localStorage.setItem(presetsKey,JSON.stringify(p)); }

  const wrapper=h('div');

  function saveConfig() { localStorage.setItem(storageKey,JSON.stringify(config)); }

  function renderTable() {
    wrapper.innerHTML='';

    // Top bar with Columns button + preset selector
    const bar=h('div',{style:'display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap'});

    // Preset dropdown
    const presets=getPresets();
    const presetNames=Object.keys(presets);
    if(presetNames.length>0) {
      const sel=h('select',{style:'font-size:12px;padding:4px 8px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:4px;width:auto'});
      sel.append(h('option',{value:''},'Load preset...'));
      presetNames.forEach(n=>sel.append(h('option',{value:n},n)));
      sel.onchange=()=>{
        if(!sel.value) return;
        const preset=presets[sel.value];
        if(preset) { config=JSON.parse(JSON.stringify(preset)); saveConfig(); renderTable(); }
      };
      bar.append(sel);
    }

    bar.append(h('button',{className:'col-config-btn',onclick:()=>showConfigModal()},'Columns'));
    wrapper.append(bar);

    // Build the visible header list — visible data cols (in their config order)
    // followed by action cols (in their original order, always shown)
    const visibleDataCols = config.filter(c=>c.visible);
    const visHeaders = visibleDataCols.map(c=>c.name).concat(actionIndices.map(()=> ''));
    const visRows = rows.map(row=>{
      const dataPart = visibleDataCols.map(c=>{
        const origIdx=headers.indexOf(c.name);
        return origIdx>=0?row[origIdx]:'';
      });
      const actionPart = actionIndices.map(idx=>row[idx]);
      return [...dataPart, ...actionPart];
    });
    wrapper.append(makeTable(visHeaders, visRows));
  }

  function showConfigModal() {
    const overlay=h('div',{className:'modal-overlay'});
    const modal=h('div',{className:'modal',style:'max-width:450px'});
    modal.append(h('h2',{},'Configure Columns'));
    modal.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:12px'},'Drag to reorder. Uncheck to hide.'));

    const list=h('ul',{className:'col-config-list'});

    function buildList() {
      list.innerHTML='';
      config.forEach((col,i)=>{
        const item=h('li',{className:'col-config-item',draggable:true});
        item.dataset.idx=i;
        const handle=h('span',{className:'drag-handle'},'☰');
        const cb=h('input',{type:'checkbox'});
        cb.checked=col.visible;
        cb.onchange=()=>{ col.visible=cb.checked; saveConfig(); };
        item.append(handle); item.append(cb); item.append(h('span',{},col.name));
        item.ondragstart=(e)=>{ e.dataTransfer.setData('text/plain',i); item.classList.add('dragging'); };
        item.ondragend=()=>item.classList.remove('dragging');
        item.ondragover=(e)=>e.preventDefault();
        item.ondrop=(e)=>{
          e.preventDefault();
          const from=parseInt(e.dataTransfer.getData('text/plain')), to=parseInt(item.dataset.idx);
          if(from===to) return;
          const moved=config.splice(from,1)[0]; config.splice(to,0,moved);
          saveConfig(); buildList();
        };
        list.append(item);
      });
    }
    buildList();
    modal.append(list);

    // Preset management
    modal.append(h('div',{style:'border-top:1px solid var(--border);margin-top:16px;padding-top:12px'}));
    modal.append(h('div',{style:'font-size:13px;font-weight:600;margin-bottom:8px'},'Presets'));

    const saveRow=h('div',{style:'display:flex;gap:8px;margin-bottom:8px'});
    const nameInput=h('input',{placeholder:'Preset name...',style:'flex:1;font-size:12px;padding:6px 8px'});
    saveRow.append(nameInput);
    saveRow.append(h('button',{className:'btn btn-sm',onclick:()=>{
      const name=nameInput.value.trim();
      if(!name) return alert('Enter a preset name');
      const presets=getPresets();
      presets[name]=JSON.parse(JSON.stringify(config));
      savePresets(presets);
      nameInput.value='';
      buildPresetList();
    }},'Save As'));
    modal.append(saveRow);

    const presetListDiv=h('div',{id:'preset-list-div'});
    function buildPresetList() {
      presetListDiv.innerHTML='';
      const presets=getPresets();
      const names=Object.keys(presets);
      if(names.length===0) { presetListDiv.append(h('p',{style:'font-size:12px;color:var(--text3)'},'No saved presets')); return; }
      names.forEach(name=>{
        const row=h('div',{style:'display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px'});
        row.append(h('span',{style:'flex:1'},name));
        row.append(h('button',{className:'btn-outline btn-sm',style:'padding:2px 8px;font-size:11px',onclick:()=>{
          config=JSON.parse(JSON.stringify(presets[name]));
          saveConfig(); buildList();
        }},'Load'));
        row.append(h('button',{className:'btn-red btn-sm',style:'padding:2px 8px;font-size:11px',onclick:()=>{
          delete presets[name]; savePresets(presets); buildPresetList();
        }},'×'));
        presetListDiv.append(row);
      });
    }
    buildPresetList();
    modal.append(presetListDiv);

    // Action buttons
    const btns=h('div',{style:'display:flex;gap:8px;margin-top:16px'});
    btns.append(h('button',{className:'btn',onclick:()=>{overlay.remove();renderTable();}},'Done'));
    btns.append(h('button',{className:'btn-outline',onclick:()=>{
      config=headers.map(hd=>({name:hd,visible:true}));
      saveConfig(); overlay.remove(); renderTable();
    }},'Reset to Default'));
    modal.append(btns);

    overlay.onclick=(e)=>{ if(e.target===overlay){overlay.remove();renderTable();} };
    overlay.append(modal);
    document.body.append(overlay);
  }

  renderTable();
  return wrapper;
}

async function renderSettings(main) {
  main.append(h('div',{className:'page-header'},[h('h1',{},'Settings')]));

  // Tab bar
  const tabs=['Column Presets','Bid Templates','Profile','My Email Preferences'];
  const tabBar=h('div',{style:'display:flex;gap:8px;margin-bottom:20px'});
  const content=h('div');
  tabs.forEach((t,i)=>{
    tabBar.append(h('button',{className:i===0?'btn':'btn-outline',onclick:async(e)=>{
      $$('button',tabBar).forEach(b=>b.className='btn-outline');
      e.target.className='btn';
      switch(t) {
        case 'Column Presets': renderPresetSettings(content); break;
        case 'Bid Templates': await renderTemplateSettings(content); break;
        case 'Profile': await renderProfileSettings(content); break;
        case 'My Email Preferences': await renderMyEmailPreferences(content); break;
      }
    }},t));
  });
  main.append(tabBar);
  main.append(content);
  renderPresetSettings(content);
}

function renderPresetSettings(c) {
  c.innerHTML='';
  c.append(h('h3',{style:'margin-bottom:8px'},'Saved Column Presets'));
  c.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:16px'},'Manage your saved column configurations for each table. Create presets from any table\'s Columns button.'));

  const tableIds=['bids','projects','fin_invoices','fin_pos'];
  const tableLabels={bids:'Bids',projects:'Projects',fin_invoices:'Invoices',fin_pos:'Purchase Orders'};

  let hasAny=false;
  tableIds.forEach(tid=>{
    const key='colpresets_'+tid;
    let presets;
    try{presets=JSON.parse(localStorage.getItem(key));}catch{}
    if(!presets||Object.keys(presets).length===0) return;
    hasAny=true;

    const sec=h('div',{style:'margin-bottom:20px'});
    sec.append(h('div',{style:'font-size:14px;font-weight:700;margin-bottom:8px'},tableLabels[tid]||tid));

    Object.entries(presets).forEach(([name,config])=>{
      const row=h('div',{style:'display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)'});
      row.append(h('span',{style:'flex:1;font-size:13px'},name));
      row.append(h('span',{style:'font-size:11px;color:var(--text3)'},config.filter(c=>c.visible).length+'/'+config.length+' columns'));
      row.append(h('button',{className:'btn-outline btn-sm',style:'font-size:11px',onclick:()=>{
        localStorage.setItem('colcfg_'+tid,JSON.stringify(config));
        alert('Preset "'+name+'" activated for '+tableLabels[tid]);
      }},'Activate'));
      row.append(h('button',{className:'btn-outline btn-sm',style:'font-size:11px',onclick:()=>{
        const newName=prompt('Rename preset:',name);
        if(!newName||newName===name) return;
        presets[newName]=presets[name]; delete presets[name];
        localStorage.setItem(key,JSON.stringify(presets));
        renderPresetSettings(c);
      }},'Rename'));
      row.append(h('button',{className:'btn-red btn-sm',style:'font-size:11px;padding:2px 8px',onclick:()=>{
        if(!confirm('Delete preset "'+name+'"?')) return;
        delete presets[name];
        localStorage.setItem(key,JSON.stringify(presets));
        renderPresetSettings(c);
      }},'×'));
      sec.append(row);
    });
    c.append(sec);
  });

  if(!hasAny) {
    c.append(h('p',{style:'color:var(--text3);padding:20px;text-align:center'},'No saved presets yet. Go to any table and click "Columns" → save a preset.'));
  }
}

async function renderTemplateSettings(c) {
  c.innerHTML='';
  c.append(h('h3',{style:'margin-bottom:8px'},'Bid Document Templates'));

  const canUpload=['admin','project_manager'].includes(S.user?.role);

  if(canUpload) {
    const form=h('div',{style:'background:var(--bg3);padding:16px;border-radius:8px;margin-bottom:20px'});
    form.append(h('p',{style:'font-size:13px;color:var(--text2);margin-bottom:12px'},'Upload a .docx template with {Field Name} merge fields. Used when generating bid documents.'));

    const uploadRow=h('div',{style:'display:flex;gap:8px;align-items:end'});
    const nameInput=h('input',{id:'st-tpl-name',placeholder:'Template name (optional)',style:'flex:1'});
    const typeSel=h('select',{id:'st-tpl-type',style:'width:120px'});
    typeSel.append(h('option',{value:'bid'},'Bid'));
    typeSel.append(h('option',{value:'invoice'},'Invoice'));
    typeSel.append(h('option',{value:'timesheet'},'Timesheet'));
    const fileInput=h('input',{type:'file',accept:'.docx',id:'st-tpl-file',style:'flex:1'});
    uploadRow.append(typeSel);
    uploadRow.append(nameInput);
    uploadRow.append(fileInput);
    uploadRow.append(h('button',{className:'btn btn-sm',onclick:async()=>{
      const file=$('#st-tpl-file').files[0];
      if(!file) return alert('Select a .docx file');
      const fd=new FormData();
      fd.append('template',file);
      fd.append('name',$('#st-tpl-name').value||file.name);
      fd.append('type',$('#st-tpl-type').value);
      try{
        await fetch('/api/users/me/templates',{method:'POST',headers:{'Authorization':'Bearer '+S.token},body:fd});
        renderTemplateSettings(c);
      }catch(e){alert(e.message)}
    }},'Upload'));
    form.append(uploadRow);

    // Merge field reference
    form.append(h('div',{style:'margin-top:12px;font-size:11px;color:var(--text3)'},
      'Bid fields: {Bid Number}, {Customer Name}, {Location Name}, {Bid Amount}, {Job Scope}, {Local Union}, {Miles from HQ}, {Project Manager}, {PM Email}, {Total Man Hours}'));
    form.append(h('div',{style:'margin-top:4px;font-size:11px;color:var(--text3)'},
      'Invoice fields: {Invoice Number}, {Invoice Date}, {Invoice Total}, {Customer Name}, {Billing Address}, {Project Name}, {Line Items}, {Labor Subtotal}, {Markup Amount}, {Markup Percent}, {Mileage Total}, {Payment Terms}, {Period Start}, {Period End}'));
    form.append(h('div',{style:'margin-top:4px;font-size:11px;color:var(--text3)'},
      'Timesheet fields: {Worker Name}, {Classification}, {Week Ending}, {Days Worked}, {ST Hours}, {OT Hours}, {DT Hours}, {Total Hours}, {ST Rate}, {OT Rate}, {DT Rate}, {ST Total}, {OT Total}, {DT Total}, {Labor Total}, {Miles Driven}, {Mileage Cost}, {Worker Total}, {Project Name}, {PM Name}'));
    c.append(form);
  } else {
    c.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:16px'},'Your role does not allow template uploads. Contact an admin or PM.'));
  }

  // List templates
  try {
    const {templates}=await api('/users/me/templates');
    if(templates.length===0) {
      c.append(h('p',{style:'color:var(--text3)'},'No templates uploaded yet.'));
    } else {
      c.append(makeTable(['Type','Name','File','Uploaded',''],templates.map(t=>[
        h('span',{className:'status status-'+(t.template_type==='invoice'?'pending':'active')},t.template_type||'bid'),
        t.template_name||'—',
        t.original_filename||'—',
        fmtDtClick(t.created_at),
        h('button',{className:'btn-red btn-sm',style:'padding:2px 8px',onclick:async()=>{
          if(!confirm('Delete template "'+t.template_name+'"?')) return;
          await api('/users/me/templates/'+t.id,{method:'DELETE'});
          renderTemplateSettings(c);
        }},'×'),
      ])));
    }
  } catch(e) { c.append(h('p',{style:'color:var(--red)'},e.message)); }
}

async function renderProfileSettings(c) {
  c.innerHTML='';
  c.append(h('h3',{style:'margin-bottom:16px'},'Profile'));

  const user=S.user||{};
  const info=h('div',{className:'form-grid',style:'max-width:600px'});
  info.innerHTML=`
    <div class="form-group"><label>Name</label><input value="${user.first_name||user.firstName||''} ${user.last_name||user.lastName||''}" readonly></div>
    <div class="form-group"><label>Email</label><input value="${user.email||''}" readonly></div>
    <div class="form-group"><label>Role</label><input value="${(user.role||'').replace(/_/g,' ')}" readonly></div>
  `;
  c.append(info);

  // Default markup — only relevant when the user's role can actually
  // create bids. Field staff / shop staff don't quote, so hiding the
  // row removes setting-page clutter for them. The column on users
  // stays populated (default 15) so promoting a user to a bid-capable
  // role later still works without backfill.
  if ((S.allowedTabs || []).includes('bids')) {
    c.append(h('h3',{style:'margin-top:24px;margin-bottom:12px'},'Default Markup %'));
    c.append(h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:8px'},'This percentage pre-fills the markup field when you create a new bid quote.'));
    const markupRow=h('div',{style:'display:flex;gap:8px;align-items:end;max-width:300px'});
    markupRow.append(h('input',{id:'sp-markup',type:'number',step:'0.5',value:user.default_markup_pct||S.defaultMarkup||15,style:'width:100px'}));
    markupRow.append(h('span',{style:'color:var(--text2);font-size:14px'},'%'));
    markupRow.append(h('button',{className:'btn btn-sm',onclick:async()=>{
      try{
        await api('/users/'+user.id,{method:'PATCH',body:JSON.stringify({default_markup_pct:parseFloat($('#sp-markup').value)||0})});
        S.defaultMarkup=parseFloat($('#sp-markup').value)||0;
        alert('Default markup updated to '+$('#sp-markup').value+'%');
      }catch(e){alert(e.message)}
    }},'Save'));
    c.append(markupRow);
  }

  // Change password
  c.append(h('h3',{style:'margin-top:24px;margin-bottom:12px'},'Change Password'));
  const passForm=h('div',{className:'form-grid',style:'max-width:400px'});
  passForm.innerHTML=`
    <div class="form-group"><label>Current Password</label><input id="sp-old" type="password"></div>
    <div class="form-group"><label>New Password</label><input id="sp-new" type="password" placeholder="Min 8 characters"></div>
    <div class="form-group"><label>Confirm New Password</label><input id="sp-confirm" type="password"></div>
  `;
  c.append(passForm);
  c.append(h('button',{className:'btn',style:'margin-top:8px',onclick:async()=>{
    const newPass=$('#sp-new').value, confirm=$('#sp-confirm').value;
    if(newPass!==confirm) return alert('Passwords do not match');
    if(newPass.length<8) return alert('Password must be at least 8 characters');
    try{
      await api('/auth/change-password',{method:'POST',body:JSON.stringify({currentPassword:$('#sp-old').value,newPassword:newPass})});
      alert('Password changed');
      $('#sp-old').value='';$('#sp-new').value='';$('#sp-confirm').value='';
    }catch(e){alert(e.message)}
  }},'Change Password'));
}

// Per-user override of admin-default email templates. The caller can
// edit subject / body for any of the templates listed in
// USER_OVERRIDABLE_TEMPLATES and the override is used in place of the
// admin default whenever the trigger sends an email on the caller's
// behalf (PR #19 wiring). Override fields left blank fall back to the
// admin row, so editing just the subject is fine.
const USER_OVERRIDABLE_TEMPLATES = [
  { key: 'bid_project_quote',   label: 'Quick Project — quote to PM' },
  { key: 'ticket_ready_pickup', label: 'Equipment ticket — ready for pickup' },
  { key: 'email_day_to_staff',  label: 'Scheduler — Email Day to Staff' },
];

async function renderMyEmailPreferences(c) {
  c.innerHTML = '';
  c.append(h('h3',{style:'margin-bottom:8px'},'My Email Preferences'));
  c.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:16px'},
    'Customise the subject and body for emails the system sends on your behalf. Empty fields fall back to the admin default. {{variable}} placeholders are substituted at send time.'));

  for (const tplMeta of USER_OVERRIDABLE_TEMPLATES) {
    c.append(await renderOverridePanel(tplMeta));
  }
}

async function renderOverridePanel({ key, label }) {
  const panel = h('div',{style:'margin-bottom:18px;padding:14px;border:1px solid var(--border);border-radius:6px'});
  panel.append(h('h4',{style:'margin:0 0 6px'}, label));
  panel.append(h('div',{style:'font-size:11px;color:var(--text3);margin-bottom:8px;font-family:JetBrains Mono,monospace'}, key));

  const status = h('div',{style:'min-height:14px;font-size:11px;color:var(--text2);margin-bottom:6px'});
  panel.append(status);

  // Load template (for variable hints) + caller's existing override.
  let tpl = null, override = null;
  try {
    const r = await api('/email-templates/' + key);
    tpl = r ? r.template : null;
  } catch (e) { /* template missing or load failed — variable hints hidden */ }
  try {
    const r = await api('/email-templates/' + key + '/my-override');
    override = r.override;
  } catch (e) { status.textContent = 'Load failed: ' + e.message; }

  panel.append(h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:4px'},'Subject (leave blank to inherit admin default)'));
  const subjInp = h('input',{type:'text',style:'width:100%;font-family:JetBrains Mono,monospace;font-size:12px;margin-bottom:6px'});
  subjInp.value = (override && override.subject != null) ? override.subject : '';
  panel.append(subjInp);

  panel.append(h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:6px'},'Body HTML (leave blank to inherit admin default)'));
  const bodyTA = h('textarea',{style:'width:100%;min-height:160px;font-family:JetBrains Mono,monospace;font-size:11px;padding:6px;resize:vertical'});
  bodyTA.value = (override && override.body_html != null) ? override.body_html : '';
  panel.append(bodyTA);

  panel.append(h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-top:6px'},'Body plain text (leave blank to inherit admin default — optional multipart fallback)'));
  const bodyTextTA = h('textarea',{style:'width:100%;min-height:80px;font-family:JetBrains Mono,monospace;font-size:11px;padding:6px;resize:vertical'});
  bodyTextTA.value = (override && override.body_text != null) ? override.body_text : '';
  panel.append(bodyTextTA);

  if (tpl && tpl.variables && tpl.variables.length > 0) {
    const varsPanel = h('div',{style:'margin-top:8px;padding:6px 8px;background:var(--bg3);border-radius:4px;font-size:11px'});
    varsPanel.append(h('div',{style:'font-weight:700;margin-bottom:4px'},'Available variables'));
    tpl.variables.forEach(v => {
      const row = h('div',{style:'display:flex;gap:8px;align-items:baseline;padding:1px 0'});
      row.append(h('code',{style:'background:var(--bg);padding:1px 6px;border-radius:2px;color:var(--primary);min-width:180px'}, '{{' + v.key + '}}'));
      row.append(h('span',{style:'color:var(--text2)'}, v.label || ''));
      varsPanel.append(row);
    });
    panel.append(varsPanel);
  }

  const actions = h('div',{style:'display:flex;gap:8px;margin-top:10px'});
  actions.append(h('button',{className:'btn',onclick:async()=>{
    const subj = subjInp.value;
    const body = bodyTA.value;
    const bodyText = bodyTextTA.value;
    const patch = {
      subject: subj.length > 0 ? subj : null,
      body_html: body.length > 0 ? body : null,
      body_text: bodyText.length > 0 ? bodyText : null,
    };
    try {
      const r = await api('/email-templates/' + key + '/my-override', { method:'PATCH', body: JSON.stringify(patch) });
      override = r.override;
      status.textContent = 'Saved.';
    } catch (e) { status.textContent = 'Save failed: ' + e.message; }
  }},'Save override'));
  actions.append(h('button',{className:'btn-outline',onclick:async()=>{
    try {
      const preview = await api('/email-templates/' + key + '/preview', { method:'POST', body: JSON.stringify({
        subject: subjInp.value || null,
        body_html: bodyTA.value || null,
        body_text: bodyTextTA.value || null,
      })});
      showEmailPreviewModal(preview, { name: label, key });
    } catch (e) { status.textContent = 'Preview failed: ' + e.message; }
  }},'Preview'));
  actions.append(h('button',{className:'btn-outline',style:'margin-left:auto',onclick:async()=>{
    if (!confirm('Clear your override and use the admin default for "' + label + '"?')) return;
    try {
      await api('/email-templates/' + key + '/my-override', { method:'DELETE' });
      subjInp.value = ''; bodyTA.value = ''; bodyTextTA.value = '';
      override = null;
      status.textContent = 'Override cleared.';
    } catch (e) { status.textContent = 'Clear failed: ' + e.message; }
  }},'Reset to default'));
  panel.append(actions);

  return panel;
}

// ═══════════════════════════════════════════════════════════
// PASSWORD RESET (public flow — reached via ?reset=<token>)
// ═══════════════════════════════════════════════════════════
async function renderResetPassword(token) {
  document.body.innerHTML='';
  const wrap=h('div',{style:'max-width:420px;margin:80px auto;padding:32px;background:var(--card,#fff);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.08);font-family:system-ui,sans-serif'});
  wrap.append(h('h1',{style:'font-size:22px;margin-bottom:8px;color:#1F4E79'},'Set a new password'));
  const status=h('p',{style:'font-size:13px;color:#666;margin-bottom:20px'},'Verifying your reset link…');
  wrap.append(status);
  document.body.append(wrap);

  // Step 1: verify token with server
  let info;
  try {
    info=await fetch('/api/auth/reset-password/verify',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token}),
    }).then(r=>r.json());
  } catch(e) {
    status.textContent='Could not reach the server. Check your connection and try again.';
    status.style.color='#c62828';
    return;
  }

  if (!info.valid) {
    const reasonMsg={
      malformed: 'This link is malformed. Ask your administrator to send a new one.',
      not_found: 'This reset link is not recognized. Ask your administrator to send a new one.',
      already_used: 'This reset link has already been used. Ask your administrator to send a new one if you need to reset your password again.',
      expired: 'This reset link has expired. Ask your administrator to send a new one.',
      invalid: 'This reset link is invalid. Ask your administrator to send a new one.',
    }[info.reason] || 'This reset link is not valid.';
    status.textContent=reasonMsg;
    status.style.color='#c62828';
    wrap.append(h('a',{href:'/',style:'display:inline-block;margin-top:16px;color:#1F4E79'},'← Back to login'));
    return;
  }

  // Step 2: show form
  status.remove();
  if (info.userName || info.userEmail) {
    wrap.append(h('p',{style:'font-size:13px;color:#555;margin-bottom:16px'},
      `Resetting password for ${info.userName || info.userEmail}.`));
  }
  wrap.append(h('p',{style:'font-size:12px;color:#777;margin-bottom:16px'},
    `This link expires ${new Date(info.expiresAt).toLocaleString()}.`));

  const fieldStyle='display:block;width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:4px;font-size:14px;box-sizing:border-box';
  wrap.append(h('label',{style:'font-size:12px;font-weight:600;color:#444'},'New password'));
  const p1=h('input',{type:'password',id:'rp-new',placeholder:'Minimum 8 characters',style:fieldStyle});
  wrap.append(p1);
  wrap.append(h('label',{style:'font-size:12px;font-weight:600;color:#444'},'Confirm new password'));
  const p2=h('input',{type:'password',id:'rp-confirm',placeholder:'Re-enter the same password',style:fieldStyle});
  wrap.append(p2);

  const err=h('p',{style:'color:#c62828;font-size:13px;margin:0 0 12px;min-height:18px'},'');
  wrap.append(err);

  const btn=h('button',{
    style:'width:100%;padding:12px;background:#1F4E79;color:#fff;border:0;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer',
    onclick:async()=>{
      err.textContent='';
      const np=p1.value,cp=p2.value;
      if (!np || np.length<8) { err.textContent='Password must be at least 8 characters.'; return; }
      if (np!==cp) { err.textContent='Passwords do not match.'; return; }
      btn.disabled=true; btn.textContent='Updating…';
      try {
        const r=await fetch('/api/auth/reset-password',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({token,newPassword:np}),
        });
        const data=await r.json();
        if (!r.ok) throw new Error(data.error||'Failed to reset password');
        wrap.innerHTML='';
        wrap.append(h('h1',{style:'font-size:22px;margin-bottom:8px;color:#2e7d32'},'Password updated'));
        wrap.append(h('p',{style:'font-size:14px;color:#555;margin-bottom:20px'},'Your password has been changed. You can now log in with your new password.'));
        wrap.append(h('a',{href:'/',style:'display:inline-block;padding:10px 20px;background:#1F4E79;color:#fff;text-decoration:none;border-radius:4px'},'Go to login'));
      } catch(e) {
        err.textContent=e.message;
        btn.disabled=false; btn.textContent='Set new password';
      }
    },
  },'Set new password');
  wrap.append(btn);
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
(async()=>{
  // Check for password reset link first — takes precedence over session
  const params=new URLSearchParams(location.search);
  const resetToken=params.get('reset');
  if (resetToken) {
    return renderResetPassword(resetToken);
  }
  if(await checkAuth()) navigate('dashboard');
  else navigate('login');
})();
</script>
