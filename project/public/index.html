// ═══════════════════════════════════════════════════════════
// BID CREATE
// ═══════════════════════════════════════════════════════════
async function renderBidCreate(main) {
  main.append(h('div',{className:'page-header'},[h('h1',{},'Create New Bid')]));

  const [customers, locations, contacts] = await Promise.all([
    api('/customers?limit=500'),api('/locations?limit=500'),api('/contacts?limit=500')
  ]);

  const form=h('div',{className:'form-grid'});

  // Searchable dropdown helper: text input + hidden value + filtered list
  function searchDrop(id, label, items, displayFn, parentGroup) {
    const group=h('div',{className:'form-group'});
    group.append(h('label',{},label));
    const row=h('div',{style:'display:flex;gap:8px'});
    const input=h('input',{id:id+'-search',placeholder:'Type to search...',autocomplete:'off',style:'flex:1'});
    const hidden=h('input',{type:'hidden',id:id});
    const listDiv=h('div',{id:id+'-list',style:'max-height:150px;overflow-y:auto;background:var(--bg3);border-radius:4px;display:none;position:absolute;z-index:50;width:100%;border:1px solid var(--border)'});
    const wrapper=h('div',{style:'position:relative;flex:1'});
    wrapper.append(input); wrapper.append(hidden); wrapper.append(listDiv);
    row.append(wrapper);

    function renderList(filter='') {
      listDiv.innerHTML='';
      const f=filter.toLowerCase();
      const matches=items.filter(item=>displayFn(item).toLowerCase().includes(f));
      if(matches.length===0){listDiv.style.display='none';return;}
      matches.slice(0,20).forEach(item=>{
        const opt=h('div',{style:'padding:6px 10px;cursor:pointer;font-size:13px',
          onmousedown:(e)=>{e.preventDefault();input.value=displayFn(item);hidden.value=item.id;listDiv.style.display='none';
            if(input.onselect) input.onselect(item);}
        },displayFn(item));
        opt.onmouseenter=()=>opt.style.background='var(--bg4)';
        opt.onmouseleave=()=>opt.style.background='';
        listDiv.append(opt);
      });
      listDiv.style.display='block';
    }

    input.onfocus=()=>renderList(input.value);
    input.oninput=()=>renderList(input.value);
    input.onblur=()=>setTimeout(()=>{listDiv.style.display='none'},200);

    return {group,row,input,hidden,renderList};
  }

  // Customer searchable dropdown + Add New
  const custDrop=searchDrop('bc-customer','Customer',customers.customers,c=>c.name);
  const custGroup=custDrop.group;
  custDrop.row.append(h('button',{className:'btn btn-sm',type:'button',onclick:()=>toggleInline('cust')},'+'));
  custGroup.append(custDrop.row);
  const custInline=h('div',{id:'inline-cust',style:'display:none;margin-top:8px;padding:10px;background:var(--bg3);border-radius:6px'});
  custInline.innerHTML=`<input id="nc-name" placeholder="Company name" style="margin-bottom:6px">
    <input id="nc-street" placeholder="Billing street" style="margin-bottom:6px">
    <div style="display:flex;gap:6px"><input id="nc-town" placeholder="Town"><input id="nc-state" placeholder="State" style="width:60px"><input id="nc-zip" placeholder="Zip" style="width:80px"></div>`;
  const custSaveBtn=h('button',{className:'btn btn-sm',style:'margin-top:6px'},'Save Customer');
  custInline.append(custSaveBtn);
  custGroup.append(custInline);
  form.append(custGroup);

  // Location searchable dropdown + Add New
  const locDrop=searchDrop('bc-location','Location',locations.locations,l=>`${l.name}${l.local_union?' — '+fmtUnion(l.local_union):''}`);
  const locGroup=locDrop.group;
  locDrop.input.onselect=function(loc){
    if(loc.local_union) $('#bc-union').value=loc.local_union;
  };
  locDrop.row.append(h('button',{className:'btn btn-sm',type:'button',onclick:()=>toggleInline('loc')},'+'));
  locGroup.append(locDrop.row);
  const locInline=h('div',{id:'inline-loc',style:'display:none;margin-top:8px;padding:10px;background:var(--bg3);border-radius:6px'});
  locInline.innerHTML=`<input id="nl-name" placeholder="Location name" style="margin-bottom:6px">
    <input id="nl-code" placeholder="Location code (free text — used in project numbers)" style="margin-bottom:6px;font-family:monospace">
    <input id="nl-street" placeholder="Street" style="margin-bottom:6px">
    <div style="display:flex;gap:6px"><input id="nl-town" placeholder="Town"><input id="nl-state" placeholder="State" style="width:60px"><input id="nl-zip" placeholder="Zip" style="width:80px"></div>
    <div style="display:flex;gap:6px;margin-top:6px"><input id="nl-union" placeholder="Local union #"><input id="nl-miles" placeholder="Miles (auto from Google Maps)" type="number" readonly style="color:var(--text2)"></div>
    <div id="nl-miles-status" style="font-size:11px;color:var(--text3);margin-top:4px"></div>`;
  const locSaveBtn=h('button',{className:'btn btn-sm',style:'margin-top:6px'},'Save Location');
  locInline.append(locSaveBtn);
  locGroup.append(locInline);
  form.append(locGroup);

  // Contact searchable dropdown + Add New
  const conDrop=searchDrop('bc-contact','Customer Contact',contacts.contacts,c=>`${c.name}${c.company?' ('+c.company+')':''}`);
  const conGroup=conDrop.group;
  conDrop.row.append(h('button',{className:'btn btn-sm',type:'button',onclick:()=>toggleInline('con')},'+'));
  conGroup.append(conDrop.row);
  const conInline=h('div',{id:'inline-con',style:'display:none;margin-top:8px;padding:10px;background:var(--bg3);border-radius:6px'});
  conInline.innerHTML=`<input id="nco-name" placeholder="Contact name" style="margin-bottom:6px">
    <div style="display:flex;gap:6px"><input id="nco-email" placeholder="Email"><input id="nco-phone" placeholder="Phone"></div>
    <input id="nco-company" placeholder="Company" style="margin-top:6px">`;
  const conSaveBtn=h('button',{className:'btn btn-sm',style:'margin-top:6px'},'Save Contact');
  conInline.append(conSaveBtn);
  conGroup.append(conInline);
  form.append(conGroup);

  // Site Contact — the on-site point of contact for the job. Defaults
  // to whatever Customer Contact is chosen (Pat's rule: site contact
  // defaults as the customer contact, editable). Same contacts pool.
  // When the user picks a customer contact and hasn't manually touched
  // site contact, mirror it. Once the user edits site contact directly,
  // stop auto-mirroring so we don't clobber their choice.
  const siteDrop=searchDrop('bc-sitecontact','Site Contact',contacts.contacts,c=>`${c.name}${c.company?' ('+c.company+')':''}`);
  const siteGroup=siteDrop.group;
  siteDrop.row.append(h('button',{className:'btn btn-sm',type:'button',onclick:()=>toggleInline('site')},'+'));
  siteGroup.append(siteDrop.row);
  const siteInline=h('div',{id:'inline-site',style:'display:none;margin-top:8px;padding:10px;background:var(--bg3);border-radius:6px'});
  siteInline.innerHTML=`<input id="nsi-name" placeholder="Contact name" style="margin-bottom:6px">
    <div style="display:flex;gap:6px"><input id="nsi-email" placeholder="Email"><input id="nsi-phone" placeholder="Phone"></div>
    <input id="nsi-company" placeholder="Company" style="margin-top:6px">`;
  const siteSaveBtn=h('button',{className:'btn btn-sm',style:'margin-top:6px'},'Save Contact');
  siteInline.append(siteSaveBtn);
  siteGroup.append(siteInline);
  form.append(siteGroup);

  let siteContactTouched=false;
  siteDrop.input.addEventListener('input',()=>{ siteContactTouched=true; });
  // Hook the customer-contact selection to mirror into site contact
  conDrop.input.onselect=(c)=>{
    if(!siteContactTouched){
      siteDrop.input.value=`${c.name}${c.company?' ('+c.company+')':''}`;
      siteDrop.hidden.value=c.id;
    }
  };

  siteSaveBtn.onclick=async function(){
    try{
      const c=await api('/contacts',{method:'POST',body:JSON.stringify({name:$('#nsi-name').value,email:$('#nsi-email').value,phone:$('#nsi-phone').value,company:$('#nsi-company').value})});
      contacts.contacts.push(c);
      // Selecting via "+" is an explicit choice — lock in site contact
      // and stop the customer-contact mirror from overwriting it.
      siteContactTouched=true;
      $('#bc-sitecontact').value=c.id;
      $('#bc-sitecontact-search').value=c.name;
      $('#inline-site').style.display='none';
    }catch(e){alert(e.message)}
  };

  // Union auto-fill + Miles + Scope
  const unionGroup=h('div',{className:'form-group'});
  unionGroup.append(h('label',{},'Local Union (auto from location)'));
  unionGroup.append(h('input',{id:'bc-union',readonly:true,placeholder:'Auto-fills from location'}));
  form.append(unionGroup);

  const scopeGroup=h('div',{className:'form-group full'});
  scopeGroup.append(h('label',{},'Scope'));
  scopeGroup.append(h('input',{id:'bc-scope',placeholder:'Brief description of work'}));
  form.append(scopeGroup);

  // Assigned PM dropdown — defaults intelligently based on who's creating the bid:
  //   - PM creating: pre-selects themselves
  //   - Estimator creating: shows "(unassigned — assign later)" by default
  //   - Admin creating: requires explicit pick (can't be admin's own id, backend rejects)
  const pmGroup=h('div',{className:'form-group full'});
  pmGroup.append(h('label',{},'Project Manager'));
  const pmHelp = h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:4px'});
  pmGroup.append(pmHelp);
  const pmSelect=h('select',{id:'bc-assigned-pm'});
  pmSelect.append(h('option',{value:''},'Loading PMs...'));
  pmGroup.append(pmSelect);
  form.append(pmGroup);

  // Load PM list and apply the right default
  (async () => {
    try {
      // Use the lightweight /users/pms endpoint — open to PM/estimator/admin
      // (the bid-creating roles). The general /users endpoint is admin-only.
      const usersData = await api('/users/pms');
      const pmList = (usersData.users || []).filter(u => u.active);
      pmSelect.innerHTML = '';

      const myRole = S.user.role;
      const iAmPM = myRole === 'project_manager';

      // Help text varies by role
      if (iAmPM) {
        pmHelp.textContent = "Defaults to you. Change if another PM is taking ownership.";
      } else if (myRole === 'estimator') {
        pmHelp.textContent = "Optional — leave unassigned to keep the bid in your queue, or pick a PM to hand it off now.";
      } else if (myRole === 'admin') {
        pmHelp.textContent = "Required — pick the PM who will own this bid and project.";
      } else {
        pmHelp.textContent = "The PM who will own this bid + project.";
      }

      // First option varies by role too
      if (iAmPM) {
        // For PMs, no "unassigned" option — they're the default. The list below will mark them selected.
        pmSelect.append(h('option',{value:''},'(none selected)'));
      } else if (myRole === 'estimator') {
        const opt = h('option',{value:''},'(unassigned — keep in my estimator queue)');
        opt.selected = true;
        pmSelect.append(opt);
      } else {
        // Admin: force a real choice
        pmSelect.append(h('option',{value:''},'-- select a PM --'));
      }

      for (const u of pmList) {
        const isMe = u.id === S.user.id;
        const opt = h('option', {value: u.id}, `${u.first_name} ${u.last_name}${isMe ? ' (me)' : ''}`);
        if (iAmPM && isMe) opt.selected = true;
        pmSelect.append(opt);
      }
    } catch(e) {
      pmSelect.innerHTML = '';
      pmSelect.append(h('option',{value:''},'Could not load PMs'));
    }
  })();

  main.append(form);

  // Inline form toggle + save functions
  function toggleInline(type){
    const el=$('#inline-'+type);
    el.style.display=el.style.display==='none'?'block':'none';
  }

  custSaveBtn.onclick=async function(){
    try{
      const c=await api('/customers',{method:'POST',body:JSON.stringify({name:$('#nc-name').value,billing_street:$('#nc-street').value,billing_town:$('#nc-town').value,billing_state:$('#nc-state').value,billing_zip:$('#nc-zip').value})});
      customers.customers.push(c);
      Cache.pushCustomer(c);
      $('#bc-customer').value=c.id;
      $('#bc-customer-search').value=c.name;
      $('#inline-cust').style.display='none';
    }catch(e){alert(e.message)}
  };

  locSaveBtn.onclick=async function(){
    try{
      $('#nl-miles-status').textContent='Calculating miles from HQ...';
      locSaveBtn.disabled=true;
      const l=await api('/locations',{method:'POST',body:JSON.stringify({name:$('#nl-name').value,location_code:$('#nl-code').value||null,street:$('#nl-street').value,town:$('#nl-town').value,state:$('#nl-state').value,zip:$('#nl-zip').value,local_union:$('#nl-union').value})});
      locations.locations.push(l);
      Cache.pushLocation(l);
      $('#bc-location').value=l.id;
      $('#bc-location-search').value=l.name;
      if(l.local_union) $('#bc-union').value=l.local_union;
      if(l.miles_from_hq) {
        $('#nl-miles').value=l.miles_from_hq;
        $('#nl-miles-status').textContent='✓ '+l.miles_from_hq+' miles (auto-calculated)';
        $('#nl-miles-status').style.color='var(--green)';
      } else {
        $('#nl-miles-status').textContent='Miles not calculated — set GOOGLE_MAPS_API_KEY and home_location_address';
        $('#nl-miles-status').style.color='var(--yellow)';
      }
      locSaveBtn.disabled=false;
      setTimeout(()=>{ $('#inline-loc').style.display='none'; },1500);
    }catch(e){alert(e.message);locSaveBtn.disabled=false;}
  };

  conSaveBtn.onclick=async function(){
    try{
      const c=await api('/contacts',{method:'POST',body:JSON.stringify({name:$('#nco-name').value,email:$('#nco-email').value,phone:$('#nco-phone').value,company:$('#nco-company').value})});
      contacts.contacts.push(c);
      $('#bc-contact').value=c.id;
      $('#bc-contact-search').value=c.name;
      $('#inline-con').style.display='none';
    }catch(e){alert(e.message)}
  };

  const actions=h('div',{style:'display:flex;gap:12px;margin-top:16px'});
  actions.append(h('button',{className:'btn',onclick:async()=>{
    const scope=$('#bc-scope').value;
    if(!scope) return alert('Scope is required');
    const assignedPmId = $('#bc-assigned-pm').value || null;
    if (S.user.role === 'admin' && !assignedPmId) {
      return alert('Please select a project manager to own this bid.');
    }
    try {
      const bid=await api('/bids',{method:'POST',body:JSON.stringify({
        customer_id:$('#bc-customer').value||null,
        location_id:$('#bc-location').value||null,
        customer_contact_id:$('#bc-contact').value||null,
        site_contact_id:$('#bc-sitecontact').value||$('#bc-contact').value||null,
        assigned_pm_id: assignedPmId,
        project_scope:scope,
      })});
      navigate('bid-quote',{id:bid.id});
    } catch(e) { alert(e.message); }
  }},'Generate Bid & Open Quoting'));
  actions.append(h('button',{className:'btn-outline',onclick:()=>navigate('bids')},'Cancel'));
  main.append(actions);
}

// ═══════════════════════════════════════════════════════════
// BID QUOTING SYSTEM
// ═══════════════════════════════════════════════════════════
async function renderBidQuote(main) {
  const bid=await api('/bids/'+S.params.id);
  main.append(h('div',{className:'page-header'},[
    h('h1',{},`Bid ${bid.bid_number} — ${bid.project_scope}`),
    h('div',{style:'display:flex;gap:8px'},[
      h('span',{className:'status status-'+bid.status},bid.status),
    ])
  ]));

  // Info cards
  const info=h('div',{className:'cards'});
  info.append(makeCard('Customer',bid.customer_name||'—',''));
  info.append(makeCard('Location',bid.location_name||'—',bid.location_address||''));
  // Customer Contact + Site Contact — surfaced here so the PM doesn't
  // have to dig through the Edit modal to confirm who to call about
  // billing vs. who's on site. Phone shown as the subtitle when present.
  info.append(makeCard('Customer Contact',bid.contact_name||'—',bid.contact_phone||''));
  info.append(makeCard('Site Contact',bid.site_contact_name||bid.contact_name||'—',bid.site_contact_phone||bid.contact_phone||''));
  info.append(makeCard('Local Union',fmtUnion(bid.local_union),''));
  info.append(makeCard('Scope',bid.project_scope||'—',''));
  // Show Estimator + Assigned PM if they're different (estimator hand-off pattern)
  if (bid.assigned_pm_name && bid.estimator_name && bid.assigned_pm_id !== bid.estimator_id) {
    info.append(makeCard('Estimator', bid.estimator_name, ''));
    info.append(makeCard('Assigned PM', bid.assigned_pm_name, ''));
  } else if (bid.estimator_name) {
    info.append(makeCard('PM', bid.estimator_name, ''));
  }
  main.append(info);

  // Edit-bid-info button — lets PM/Estimator change customer/location/contact
  // after the bid has moved past initial creation. Only allowed on draft bids.
  if (bid.status === 'draft') {
    const editBtn = h('button', {
      className: 'btn-outline btn-sm',
      style: 'margin-bottom:16px',
      onclick: () => showBidInfoEditModal(bid, () => navigate('bid-quote', {id: bid.id})),
    }, '✎ Edit Customer / Location / Scope');
    main.append(editBtn);
  }

  // Quoting controls
  const controls=h('div',{className:'form-grid',style:'margin-bottom:16px'});
  controls.innerHTML=`
    <div class="form-group"><label>Markup %</label><input id="bq-markup" type="number" step="0.5" value="${bid.markup_pct||(S.defaultMarkup||15)}"></div>
    <div class="form-group"><label>Project Length (days)</label><input id="bq-days" type="number" value="${bid.project_length_days||0}"></div>
    <div class="form-group"><label>Per Diem ($/day/worker)</label><input id="bq-perdiem" type="number" step="0.01" value="${bid.per_diem_rate||0}"></div>
  `;
  main.append(controls);

  // Load rates for this local
  // Resolve the effective local for rate lookup. Prefer bid.local_union
  // (the snapshot copied at bid creation), but fall back to the linked
  // location's current local_union if the bid's is empty — covers older
  // bids created without a location, or bids where the location was set
  // after the fact and the cascade didn't fire on the backend (older
  // tarballs). Without this fallback the quote page silently shows no
  // rates and users can't tell why.
  let effectiveLocal = bid.local_union;
  if (!effectiveLocal && bid.location_id) {
    try {
      const locResp = await api('/locations/' + bid.location_id);
      effectiveLocal = locResp?.location?.local_union || locResp?.local_union;
    } catch {}
  }

  let rates=[];
  if(effectiveLocal) {
    try { const r=await api('/admin/rate-sheet/local/'+encodeURIComponent(effectiveLocal)); rates=r.rates||[]; }
    catch{}
  }
  // Diagnostic banner — surface in plain English why the dropdown is
  // empty if rates didn't load. Three distinct failure modes:
  //   (1) bid has no local union set at all (no location, no manual entry)
  //   (2) local union is set but the rate sheet has no rows for it
  //   (3) endpoint errored (e.g., permissions) — already swallowed above
  if (rates.length === 0) {
    const banner = h('div', {style:'background:rgba(255,193,7,0.1);border:1px solid var(--yellow);border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--yellow)'});
    if (!effectiveLocal) {
      banner.textContent = '⚠ No local union set on this bid. Pick a location (or edit local_union directly) to load rates.';
    } else {
      banner.textContent = `⚠ No rate-sheet entries found for "${effectiveLocal}". Add rates in Admin → Rate Sheet, then refresh.`;
    }
    main.append(banner);
  }

  // Quoting table
  main.append(h('h2',{style:'margin-bottom:12px'},'Quote Lines'));
  const tbl=h('table',{className:'quote-table'});
  tbl.innerHTML=`<thead><tr><th>Classification</th><th>Personnel</th><th>ST Hrs</th><th>OT Hrs</th><th>DT Hrs</th><th>Total ST</th><th>Total OT</th><th>Total DT</th><th>ST Rate</th><th>OT Rate</th><th>DT Rate</th><th>Line Cost</th><th></th></tr></thead>`;
  const tbody=h('tbody',{id:'bq-tbody'});
  tbl.append(tbody);
  main.append(tbl);

  // Pre-populate from existing quote lines, or seed just the two most-common
  // classifications (foreman + journeyman). Other classes are one click away
  // via "Add Row" — pre-loading every rate-sheet row created rows users had to delete.
  const DEFAULT_BID_CLASSES=['foreman','journeyman'];
  const existingLines=bid.quote_lines||[];
  const lines=existingLines.length>0?existingLines:DEFAULT_BID_CLASSES
    .map(target=>rates.find(r=>r.classification.toLowerCase()===target))
    .filter(Boolean)
    .map(r=>({
      classification:r.classification,
      personnel:1,
      st_hours:0,ot_hours:0,dt_hours:0,
      st_rate:r.st_rate,ot_rate:r.ot_rate,dt_rate:r.dt_rate
    }));

  // If no rates and no existing lines, start with one empty row
  if(lines.length===0) lines.push({classification:'',personnel:1,st_hours:0,ot_hours:0,dt_hours:0,st_rate:0,ot_rate:0,dt_rate:0});

  function renderQuoteRows() {
    tbody.innerHTML='';
    // Build the classification dropdown options once per render. Pulled
    // from the rate-sheet rows fetched for this bid's local_union.
    // Sorted alphabetically; foreman classifications surface first
    // because they're the most common starting row.
    const sortedClassifications = [...new Set(rates.map(r => r.classification))].sort((a, b) => {
      const aForeman = a.toLowerCase().includes('foreman');
      const bForeman = b.toLowerCase().includes('foreman');
      if (aForeman !== bForeman) return aForeman ? -1 : 1;
      return a.localeCompare(b);
    });

    lines.forEach((line,i)=>{
      const tr=h('tr',{id:'qr-'+i});
      // Classification dropdown — replaces the old free-text input
      // because users typing a classification that didn't EXACTLY match
      // a rate-sheet row (case-insensitive) would leave the ST/OT/DT
      // rates at $0/hr with no warning. Dropdown forces a valid choice
      // and auto-locks the rates from the matching row.
      let classCellHTML;
      if (sortedClassifications.length === 0) {
        // Fallback: no rate sheet for this local. Keep the free-text
        // input so the user can still write something, but flag it.
        classCellHTML = `<input class="ql-inp ql-class" data-i="${i}" data-f="classification" type="text" value="${line.classification||''}" placeholder="No rates for this local" style="width:140px;border-color:var(--yellow)">`;
      } else {
        const options = sortedClassifications.map(c =>
          `<option value="${c}"${c === line.classification ? ' selected' : ''}>${c}</option>`
        ).join('');
        // Empty leading option so a fresh row doesn't auto-select the
        // first classification by accident.
        classCellHTML = `<select class="ql-inp ql-class" data-i="${i}" data-f="classification" style="width:140px">
          <option value=""${!line.classification ? ' selected' : ''}>— pick —</option>
          ${options}
        </select>`;
      }

      tr.innerHTML=`
        <td>${classCellHTML}</td>
        <td><input class="ql-inp ql-num" data-i="${i}" data-f="personnel" type="text" inputmode="numeric" value="${parseInt(line.personnel)||0}"></td>
        <td><input class="ql-inp ql-num" data-i="${i}" data-f="st_hours" type="text" inputmode="decimal" value="${parseFloat(line.st_hours)||0}"></td>
        <td><input class="ql-inp ql-num" data-i="${i}" data-f="ot_hours" type="text" inputmode="decimal" value="${parseFloat(line.ot_hours)||0}"></td>
        <td><input class="ql-inp ql-num" data-i="${i}" data-f="dt_hours" type="text" inputmode="decimal" value="${parseFloat(line.dt_hours)||0}"></td>
        <td class="num" id="qc-tst-${i}">0</td><td class="num" id="qc-tot-${i}">0</td><td class="num" id="qc-tdt-${i}">0</td>
        <td class="num" id="qc-sr-${i}">$0.00</td><td class="num" id="qc-or-${i}">$0.00</td><td class="num" id="qc-dr-${i}">$0.00</td>
        <td class="num" style="font-weight:700" id="qc-cost-${i}">$0.00</td>
        <td><button class="btn-red btn-sm ql-del" data-i="${i}" style="padding:2px 8px">×</button></td>`;
      tbody.append(tr);
    });
    updateCalcCells();
    bindQuoteInputs();
  }

  // Update only the calculated cells (no DOM rebuild, no focus loss)
  function updateCalcCells() {
    lines.forEach((line,i)=>{
      const p=parseInt(line.personnel)||0;
      const st=parseFloat(line.st_hours)||0, ot=parseFloat(line.ot_hours)||0, dt=parseFloat(line.dt_hours)||0;
      const tst=p*st, tot=p*ot, tdt=p*dt;
      const sr=parseFloat(line.st_rate)||0, or_=parseFloat(line.ot_rate)||0, dr=parseFloat(line.dt_rate)||0;
      const cost=(tst*sr)+(tot*or_)+(tdt*dr);
      const el=id=>document.getElementById(id);
      if(el('qc-tst-'+i)) el('qc-tst-'+i).textContent=tst.toFixed(1);
      if(el('qc-tot-'+i)) el('qc-tot-'+i).textContent=tot.toFixed(1);
      if(el('qc-tdt-'+i)) el('qc-tdt-'+i).textContent=tdt.toFixed(1);
      if(el('qc-sr-'+i)) el('qc-sr-'+i).textContent='$'+sr.toFixed(2);
      if(el('qc-or-'+i)) el('qc-or-'+i).textContent='$'+or_.toFixed(2);
      if(el('qc-dr-'+i)) el('qc-dr-'+i).textContent='$'+dr.toFixed(2);
      if(el('qc-cost-'+i)) el('qc-cost-'+i).textContent=fmtD(cost);
    });
  }

  function bindQuoteInputs() {
    $$('.ql-inp').forEach(inp=>{
      // Use both oninput (live text fields) and onchange (dropdowns) so
      // the rate auto-fill works whether the user is typing in a number
      // cell OR selecting from the new classification dropdown.
      const handler = ()=>{
        const i=parseInt(inp.dataset.i);
        const f=inp.dataset.f;
        if(f==='classification') {
          lines[i].classification=inp.value;
          // Exact (case-insensitive) match against rate sheet rows for
          // the bid's local_union. If empty selection, clear rates so a
          // misclick doesn't leave stale ST/OT/DT on the line.
          if (!inp.value) {
            lines[i].st_rate = 0;
            lines[i].ot_rate = 0;
            lines[i].dt_rate = 0;
          } else {
            const match=rates.find(r=>r.classification.toLowerCase()===inp.value.toLowerCase());
            if(match){
              lines[i].st_rate=parseFloat(match.st_rate);
              lines[i].ot_rate=parseFloat(match.ot_rate);
              lines[i].dt_rate=parseFloat(match.dt_rate);
            } else {
              // No match (only possible in the fallback text-input mode
              // when the local has no rate sheet). Zero the rates and
              // let the user fill manually — better than silently
              // leaving stale numbers.
              lines[i].st_rate = 0;
              lines[i].ot_rate = 0;
              lines[i].dt_rate = 0;
            }
          }
        } else if(f==='personnel') {
          lines[i].personnel=parseInt(inp.value)||0;
        } else {
          lines[i][f]=parseFloat(inp.value)||0;
        }
        updateCalcCells(); // Only update numbers, keep focus
        updateSummary();
      };
      inp.oninput = handler;
      inp.onchange = handler;
    });
    $$('.ql-del').forEach(btn=>{
      btn.onclick=()=>{ lines.splice(parseInt(btn.dataset.i),1); renderQuoteRows(); updateSummary(); };
    });
  }

  // Summary section
  const summary=h('div',{id:'bq-summary',className:'cards',style:'margin-top:16px'});
  main.append(summary);

  function updateSummary() {
    let totalLabor=0, totalPersonnel=0, totalManHours=0;
    lines.forEach(l=>{
      const p=parseInt(l.personnel)||0;
      totalPersonnel+=p;
      const sr=parseFloat(l.st_rate)||0,or_=parseFloat(l.ot_rate)||0,dr=parseFloat(l.dt_rate)||0;
      const stH=parseFloat(l.st_hours)||0, otH=parseFloat(l.ot_hours)||0, dtH=parseFloat(l.dt_hours)||0;
      totalLabor+=(p*stH*sr)+(p*otH*or_)+(p*dtH*dr);
      totalManHours+=p*(stH+otH+dtH);
    });
    const miles=parseFloat(bid.location_miles)||parseFloat(bid.miles_from_hq)||0;
    const days=parseInt($('#bq-days').value)||0;
    const mileage=miles*2*totalPersonnel*days*0.67;
    const perDiemRate=parseFloat($('#bq-perdiem').value)||0;
    const totalPerDiem=perDiemRate*totalPersonnel*days;
    const subtotal=totalLabor+mileage;
    const markup=(parseFloat($('#bq-markup').value)||0)/100;
    const markupAmt=subtotal*markup;
    const grand=subtotal+markupAmt+totalPerDiem;

    summary.innerHTML='';
    summary.append(makeCard('Labor Cost',fmtD(totalLabor),''));
    summary.append(makeCard('Mileage Cost',fmtD(mileage),`${miles}mi × 2 × ${totalPersonnel}p × ${days}d`));
    summary.append(makeCard('Per Diem',fmtD(totalPerDiem),perDiemRate>0?`$${perDiemRate}/day × ${totalPersonnel}p × ${days}d`:'None'));
    summary.append(makeCard('Subtotal',fmtD(subtotal),'Labor + Mileage'));
    summary.append(makeCard('Markup',fmtD(markupAmt),($('#bq-markup').value||0)+'%'));
    summary.append(makeCard('Bid Amount',fmtD(grand),'Subtotal + Markup + Per Diem'));

    // Length-vs-hours sanity check.
    // Calendar duration in days = total man-hours / (personnel × 8).
    // Previously divided only by 8, which gave PERSON-days instead of
    // calendar days. A 10-day project with 2 personnel × 40h each is
    // 80 man-hours → 10 person-days → 5 calendar days. Without the
    // /personnel factor the warning fired (and would have continued
    // firing as personnel scaled up). Now compares calendar-to-calendar.
    // Tolerance is a flat ±1 day — anything further off is worth
    // flagging.
    const effectivePersonnel = totalPersonnel > 0 ? totalPersonnel : 1;
    const expectedDays = totalManHours / (effectivePersonnel * 8);
    const tolerance = 1;
    const mismatch = days > 0 && totalManHours > 0 && Math.abs(days - expectedDays) > tolerance;

    const warnEl = $('#bq-length-warn');
    if (warnEl) {
      if (mismatch) {
        const direction = days > expectedDays ? 'longer' : 'shorter';
        const checkboxId = 'bq-length-ack';
        const wasChecked = $('#' + checkboxId)?.checked || false;
        warnEl.style.display = 'block';
        warnEl.innerHTML = `
          <div style="display:flex;align-items:flex-start;gap:10px">
            <span style="color:var(--yellow);font-size:18px;line-height:1">⚠</span>
            <div style="flex:1;font-size:13px">
              <strong style="color:var(--yellow)">Length / hours mismatch</strong><br>
              Quoted hours total <strong>${totalManHours.toFixed(0)}</strong> man-hours across <strong>${effectivePersonnel}</strong> personnel,
              which at 8 h/day suggests roughly <strong>${expectedDays.toFixed(1)} calendar days</strong>.
              Your project length is set to <strong>${days} days</strong> —
              that's ${direction} than expected by ${Math.abs(days - expectedDays).toFixed(1)} days.
              <br>
              <label style="display:flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer">
                <input type="checkbox" id="${checkboxId}" style="width:auto" ${wasChecked ? 'checked' : ''}>
                <span>I acknowledge this — proceed anyway (10-hour days, etc.)</span>
              </label>
            </div>
          </div>`;
      } else {
        warnEl.style.display = 'none';
        warnEl.innerHTML = '';
      }
    }
  }

  // Length-vs-hours warning panel (shown by updateSummary when mismatch detected)
  const lengthWarn = h('div', {
    id: 'bq-length-warn',
    style: 'display:none;margin-top:8px;padding:12px;background:#3a2f0a;border:1px solid var(--yellow);border-radius:6px',
  });
  main.append(lengthWarn);

  renderQuoteRows();
  updateSummary();

  // Add Line button
  const addLineBtn=h('button',{className:'btn-outline btn-sm',style:'margin-top:8px;margin-bottom:16px',onclick:()=>{
    lines.push({classification:'',personnel:1,st_hours:0,ot_hours:0,dt_hours:0,st_rate:0,ot_rate:0,dt_rate:0});
    renderQuoteRows();
    updateSummary();
  }},'+ Add Classification Line');
  main.insertBefore(addLineBtn,summary);

  $('#bq-markup').oninput=updateSummary;
  $('#bq-days').oninput=updateSummary;
  $('#bq-perdiem').oninput=updateSummary;

  // Action buttons
  const actions=h('div',{style:'display:flex;gap:12px;margin-top:20px;flex-wrap:wrap'});

  // Save quote only (no doc generation)
  actions.append(h('button',{className:'btn',onclick:async()=>{
    try {
      await api('/bids/'+bid.id+'/quote',{method:'POST',body:JSON.stringify({
        markup_pct:parseFloat($('#bq-markup').value)||0,
        project_length_days:parseInt($('#bq-days').value)||0,
        per_diem_rate:parseFloat($('#bq-perdiem').value)||0,
        lines:lines.map(l=>({
          classification:l.classification,
          personnel:parseInt(l.personnel)||0,
          st_hours:parseFloat(l.st_hours)||0,
          ot_hours:parseFloat(l.ot_hours)||0,
          dt_hours:parseFloat(l.dt_hours)||0,
          st_rate:parseFloat(l.st_rate)||0,
          ot_rate:parseFloat(l.ot_rate)||0,
          dt_rate:parseFloat(l.dt_rate)||0,
        })),
      })});
      alert('Quote saved!');
      navigate('bid-quote',{id:bid.id});
    } catch(e) { alert(e.message); }
  }},'Save Quote'));

  // Save + generate docs
  actions.append(h('button',{className:'btn-outline',onclick:async()=>{
    try {
      const lineData=lines.map(l=>({
        classification:l.classification,
        personnel:parseInt(l.personnel)||0,
        st_hours:parseFloat(l.st_hours)||0,
        ot_hours:parseFloat(l.ot_hours)||0,
        dt_hours:parseFloat(l.dt_hours)||0,
        st_rate:parseFloat(l.st_rate)||0,
        ot_rate:parseFloat(l.ot_rate)||0,
        dt_rate:parseFloat(l.dt_rate)||0,
      }));
      const markupPct=parseFloat($('#bq-markup').value)||0;
      const days=parseInt($('#bq-days').value)||0;
      const perDiem=parseFloat($('#bq-perdiem').value)||0;
      // Save quote first
      await api('/bids/'+bid.id+'/quote',{method:'POST',body:JSON.stringify({
        markup_pct:markupPct, project_length_days:days, per_diem_rate:perDiem, lines:lineData,
      })});
      // Generate docs (also passes lines as fallback)
      await api('/bids/'+bid.id+'/generate',{method:'POST',body:JSON.stringify({
        markup_pct:markupPct, per_diem_rate:perDiem, lines:lineData,
      })});
      alert('Quote saved & documents generated!');
      navigate('bid-quote',{id:bid.id});
    } catch(e) { alert(e.message); }
  }},'Save & Generate Docs'));

  if(bid.status==='draft') {
    actions.append(h('button',{className:'btn-green btn',onclick:async()=>{
      // Length-vs-hours soft warning gate
      const warnEl = $('#bq-length-warn');
      if (warnEl && warnEl.style.display !== 'none') {
        const ack = $('#bq-length-ack');
        if (!ack || !ack.checked) {
          return alert('Project length doesn\'t match quoted hours. Acknowledge the warning above before marking this bid won.');
        }
      }
      try {
        const v=await api('/bids/'+bid.id+'/initiate-won',{method:'POST'});
        showWonVerificationModal(bid, v.verification_fields);
      } catch(e) { alert(e.message); }
    }},'Mark Won'));
    // Quick Project — skips OCR + the verify modal entirely. Pulls
    // straight from the bid matrix (customer, location, scope, local,
    // bid amount, quote totals) and creates the project immediately.
    // Use when the bid data is trusted as-is. Mark Won remains for the
    // OCR-from-Word-doc verification path.
    actions.append(h('button',{className:'btn',style:'background:var(--primary)',onclick:async()=>{
      // Same length-vs-hours soft gate as Mark Won so a quick project
      // can't silently bypass the sanity check.
      const warnEl = $('#bq-length-warn');
      if (warnEl && warnEl.style.display !== 'none') {
        const ack = $('#bq-length-ack');
        if (!ack || !ack.checked) {
          return alert('Project length doesn\'t match quoted hours. Acknowledge the warning above before creating the project.');
        }
      }
      if (!confirm('Create a project directly from this bid\u2019s data?\n\nThis skips document scanning and the verify screen. The project number will be auto-generated (you can rename it later on the project).')) return;
      try {
        // Save quote + generate Excel/Word docs first so the bid has a
        // finalized matrix and Word quote on disk before the project is
        // created. Matches the "Save & Generate Docs" path so a one-click
        // Quick Project leaves the same trail of artifacts as the Mark
        // Won flow.
        const lineData=lines.map(l=>({
          classification:l.classification,
          personnel:parseInt(l.personnel)||0,
          st_hours:parseFloat(l.st_hours)||0,
          ot_hours:parseFloat(l.ot_hours)||0,
          dt_hours:parseFloat(l.dt_hours)||0,
          st_rate:parseFloat(l.st_rate)||0,
          ot_rate:parseFloat(l.ot_rate)||0,
          dt_rate:parseFloat(l.dt_rate)||0,
        }));
        const markupPct=parseFloat($('#bq-markup').value)||0;
        const days=parseInt($('#bq-days').value)||0;
        const perDiem=parseFloat($('#bq-perdiem').value)||0;
        await api('/bids/'+bid.id+'/quote',{method:'POST',body:JSON.stringify({
          markup_pct:markupPct, project_length_days:days, per_diem_rate:perDiem, lines:lineData,
        })});
        await api('/bids/'+bid.id+'/generate',{method:'POST',body:JSON.stringify({
          markup_pct:markupPct, per_diem_rate:perDiem, lines:lineData,
        })});
        const r = await api('/bids/'+bid.id+'/quick-project',{method:'POST'});
        const emailMsg = r.quote_email?.delivered
          ? ` Quote emailed to PM (via ${r.quote_email.provider}).`
          : ` Quote email skipped: ${r.quote_email?.reason || 'unknown'}.`;
        alert('Project created. Quote docs generated.' + emailMsg);
        navigate('project-detail',{id:r.project.id});
      } catch(e) { alert(e.message); }
    }},'Quick Project'));
    actions.append(h('button',{className:'btn-outline',onclick:async()=>{
      try { await api('/bids/'+bid.id+'/archive',{method:'POST'}); navigate('bids'); } catch(e){alert(e.message)}
    }},'Archive'));
  }
  main.append(actions);
}

function showBidInfoEditModal(bid, onSaved) {
  const overlay = h('div', {className: 'modal-overlay'});
  const modal = h('div', {className: 'modal', style: 'max-width:600px'});
  modal.append(h('h2', {}, 'Edit Bid — ' + bid.bid_number));
  modal.append(h('p', {style:'color:var(--text2);font-size:13px;margin-bottom:16px'},
    'Update the customer, location, contact, or scope. Changes apply only to this draft bid; once the bid is won, location and customer are locked.'));

  // Customer picker (smartFilter)
  const custField = smartFilter({
    id: 'be-cust', label: 'Customer', kind: 'customers',
    displayFn: c => c.name,
  });
  if (bid.customer_id) {
    Cache.getCustomers().then(custs => {
      const c = custs.find(x => x.id === bid.customer_id);
      if (c) custField.setValue(c);
    });
  }
  modal.append(custField.group);

  // Location picker (smartFilter)
  const locField = smartFilter({
    id: 'be-loc', label: 'Location', kind: 'locations',
    displayFn: l => `${l.name}${l.local_union ? ' — ' + fmtUnion(l.local_union) : ''}`,
  });
  if (bid.location_id) {
    Cache.getLocations().then(locs => {
      const l = locs.find(x => x.id === bid.location_id);
      if (l) locField.setValue(l);
    });
  }
  modal.append(locField.group);

  // Contact dropdown — depends on selected customer; populated after customer pick
  const contactGroup = h('div', {className:'form-group'});
  contactGroup.append(h('label', {}, 'Customer Contact (optional)'));
  const contactSel = h('select', {id: 'be-contact'});
  contactSel.append(h('option', {value:''}, '(no contact)'));
  contactGroup.append(contactSel);
  modal.append(contactGroup);

  async function refreshContacts(customerId) {
    contactSel.innerHTML = '';
    contactSel.append(h('option', {value:''}, '(no contact)'));
    if (!customerId) return;
    try {
      const r = await api('/contacts?customer_id=' + customerId);
      const contacts = r.contacts || [];
      contacts.forEach(c => {
        const opt = h('option', {value: c.id}, c.name + (c.email ? ' (' + c.email + ')' : ''));
        if (c.id === bid.customer_contact_id) opt.selected = true;
        contactSel.append(opt);
      });
    } catch {}
  }
  refreshContacts(bid.customer_id);

  // When customer changes, refresh contacts
  const custOriginalSelect = custField.input;
  // Override the selection wiring to also reload contacts
  // (smartFilter calls onselect when a row is picked; we attach a hook)
  const origPick = custField.input.onmousedown; // placeholder — actually onselect lives in smartFilter
  // Simpler: poll the hidden input on change
  custField.input.addEventListener('blur', () => {
    setTimeout(() => refreshContacts(custField.getId()), 250);
  });

  // Scope textarea
  const scopeGroup = h('div', {className: 'form-group'});
  scopeGroup.append(h('label', {}, 'Project Scope'));
  const scopeInput = h('textarea', {id: 'be-scope', rows: 3}, bid.project_scope || '');
  scopeInput.value = bid.project_scope || '';
  scopeGroup.append(scopeInput);
  modal.append(scopeGroup);

  // Buttons
  const btns = h('div', {style: 'display:flex;gap:12px;margin-top:16px'});
  btns.append(h('button', {
    className: 'btn',
    onclick: async () => {
      try {
        const customer_id = custField.getId() || null;
        const location_id = locField.getId() || null;
        const customer_contact_id = contactSel.value || null;
        const project_scope = scopeInput.value.trim();
        if (!project_scope) return alert('Scope cannot be empty');
        await api('/bids/' + bid.id, {
          method: 'PATCH',
          body: JSON.stringify({
            customer_id, location_id, customer_contact_id, project_scope,
          }),
        });
        overlay.remove();
        if (onSaved) onSaved();
      } catch (e) { alert(e.message); }
    },
  }, 'Save'));
  btns.append(h('button', {className: 'btn-outline', onclick: () => overlay.remove()}, 'Cancel'));
  modal.append(btns);

  overlay.append(modal);
  document.body.append(overlay);
}

function showWonVerificationModal(bid, fields) {
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal'});
  modal.append(h('h2',{},'Verify Bid Fields — Mark as Won'));
  modal.append(h('p',{style:'color:var(--text2);margin-bottom:16px'},'Review the extracted fields. Check each one and edit if needed. Submit to create the project.'));

  const form=h('div',{className:'form-grid'});
  const fieldEntries=Object.entries(fields);
  fieldEntries.forEach(([key,f])=>{
    const g=h('div',{className:'form-group'});
    const labelRow=h('div',{style:'display:flex;align-items:center;gap:8px'});
    const cb=h('input',{type:'checkbox',id:'vf-cb-'+key,checked:true,style:'width:auto'});
    labelRow.append(cb);
    labelRow.append(h('label',{for:'vf-'+key},key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())));
    if(f.source) labelRow.append(h('span',{style:'font-size:10px;color:var(--text3);margin-left:auto'},f.source));
    g.append(labelRow);
    const inp=h('input',{id:'vf-'+key,value:String(f.value||''),disabled:!f.editable});
    g.append(inp);
    form.append(g);
  });
  modal.append(form);

  // Project Number section — auto-suggested based on PM + location + year
  const pnSection=h('div',{style:'margin-top:16px;padding-top:16px;border-top:1px solid var(--border)'});
  pnSection.append(h('h3',{style:'margin-bottom:8px'},'Project Number'));
  pnSection.append(h('p',{style:'font-size:12px;color:var(--text2);margin-bottom:8px'},'Auto-suggested from PM code + location + year. Edit if needed before confirming.'));
  const pnInput=h('input',{id:'vf-project-number',placeholder:'Loading suggestion...',style:'font-family:monospace;font-weight:600'});
  pnSection.append(pnInput);
  const pnHint=h('p',{id:'vf-pn-hint',style:'font-size:11px;color:var(--text3);margin-top:4px'},'');
  pnSection.append(pnHint);
  modal.append(pnSection);

  // Fetch suggestion in the background
  (async()=>{
    try {
      // suggest-number was historically called with the bid's
      // estimator_id, but the resulting project gets created under the
      // bid's assigned PM (falling back to estimator). Use whichever
      // matches the project — assigned_pm_id first, estimator second.
      const pmIdForSuggest = bid.assigned_pm_id || bid.estimator_id;
      const r=await api('/projects/suggest-number?pm_id='+pmIdForSuggest+'&location_id='+bid.location_id+'&year='+(new Date().getFullYear()));
      // Endpoint returns { number, components } — earlier code read
      // r.suggestion which never exists, so the input stayed stuck on
      // "Loading suggestion...". Fall back gracefully if either is
      // missing.
      const suggested = r.number || r.suggestion;
      if (suggested) {
        pnInput.value=suggested;
        pnInput.placeholder = suggested;
        const c=r.components;
        if (c) pnHint.textContent=`PM: ${c.pm_code} · Year: ${c.year_short} · Location: ${c.location_code} · Sequence: ${c.sequence}`;
      } else if (r.error) {
        pnHint.textContent = r.error;
        pnHint.style.color = '#c62828';
        pnInput.placeholder='Type project number manually';
      }
    } catch(e) {
      pnHint.textContent=e.message || 'Could not suggest a project number';
      pnHint.style.color='#c62828';
      pnInput.placeholder='Type project number manually';
    }
  })();

  const btns=h('div',{style:'display:flex;gap:12px;margin-top:16px'});
  btns.append(h('button',{className:'btn btn-green',onclick:async()=>{
    const confirmed={};
    fieldEntries.forEach(([key])=>{
      const val=$('#vf-'+key).value;
      confirmed[key]=isNaN(val)||val===''?val:parseFloat(val);
    });
    // Include the project number if entered
    const projectNumber=$('#vf-project-number').value.trim();
    if (projectNumber) confirmed.project_number=projectNumber;
    try {
      const r=await api('/bids/'+bid.id+'/confirm-won',{method:'POST',body:JSON.stringify({confirmed_fields:confirmed})});
      overlay.remove();
      alert('Bid won! Project created: '+r.project.name);
      navigate('projects');
    } catch(e) { alert(e.message); }
  }},'Confirm & Create Project'));
  btns.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  modal.append(btns);
  overlay.append(modal);
  document.body.append(overlay);
}

async function renderProjects(main) {
  const hdr=h('div',{className:'page-header'});
  hdr.append(h('h1',{},'Projects'));
  main.append(hdr);

  // No top-of-page search bar — the per-column filter row beneath the
  // table headers handles search now (any column, type-to-filter).

  const content=h('div',{id:'proj-content'});
  main.append(content);

  await loadProjects();

  async function loadProjects() {
    const params=new URLSearchParams();
    params.set('limit','200');
    const {projects}=await api('/projects?'+params.toString());
    content.innerHTML='';

    // Day-count helper for "Days Active" column. Inclusive of today.
    function daysSince(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr);
      if (isNaN(d)) return null;
      return Math.floor((Date.now() - d.getTime()) / (24 * 60 * 60 * 1000));
    }

    // Margin % derivation from the rollup totals returned by Project.findAll
    function marginCell(p) {
      const revenue = parseFloat(p.revenue) || 0;
      if (revenue <= 0) return '—';
      const cost = parseFloat(p.po_cost) || 0; // Mileage/equipment/per-diem are not in the list rollup; this is PO-only
      const pct = ((revenue - cost) / revenue) * 100;
      const color = pct < 0 ? 'var(--red)' : (pct < 10 ? 'var(--yellow)' : 'var(--text)');
      return h('span', {style:`color:${color}`}, pct.toFixed(1) + '%');
    }

    // Headers — order matters for both display and the column-config UI.
    // `defaultHidden` below controls which start as toggled-off; the user
    // can reveal any of them via the Columns pop-up.
    const headers = [
      'Project #',     // primary number — always-show
      'Name',          // clickable → edit pop-up
      'Customer',
      'PM',
      'Status',
      'Start Date',    // NEW — schedulable. Empty = not yet scheduled. Default-shown.
      'Contract Value',
      'Billed %',
      'Type',
      'Location',      // unhidden by default per Pat
      'Address',       // unhidden by default per Pat
      'SPN',           // shows if any non-Primary numbers exist
      'Year',          // hidden default — usually redundant w/ Project #
      'Margin %',      // hidden default — derived from revenue - PO cost
      'Days Active',   // hidden default — days since project created
      'Last Invoice',  // hidden default — date of most recent non-cancelled invoice
      'Open POs',      // hidden default — count of non-cancelled, non-received POs
      'Equipment Out', // hidden default — count of equipment currently checked out
      'Won-from Bid #',// hidden default — bid number this project came from
      '',              // action column — Detail button
    ];

    content.append(makeConfigTable('projects',
      headers,
      projects.map(p=>[
        // Project # (Primary)
        p.project_number ? h('code',{style:'font-family:monospace;font-weight:600;color:var(--primary)'},p.project_number) : h('span',{style:'color:var(--text3)'},'—'),
        // Name (link to edit pop-up)
        h('a',{onclick:(e)=>{e.stopPropagation();showProjectEditModal(p.id,loadProjects);},style:'cursor:pointer;color:var(--primary);text-decoration:underline'},p.name),
        p.customer_name||'—',
        p.pm_name||'—',
        h('span',{className:'status status-'+p.status},p.status),
        // Start Date — set via project edit pop-up or schedule pop-up
        fmtDtClick(p.start_date),
        p.contract_value?fmtD(p.contract_value):'—',
        // Billed % cell — colored when over 100% to flag potential change orders
        (() => {
          const pct = parseFloat(p.percent_billed || 0);
          if (!p.contract_value) return '—';
          const color = pct >= 100 ? 'var(--yellow)' : (pct >= 90 ? 'var(--text)' : 'var(--text2)');
          return h('span', {style:`color:${color};font-weight:${pct >= 100 ? '700' : '400'}`}, pct.toFixed(1) + '%');
        })(),
        fmtCT(p.contract_type),
        // Location (name)
        p.location_name || '—',
        // Address (display_address — street/town/state, no zip)
        p.location_address || '—',
        // SPN — comma-separated supplement numbers if any. Empty when no SPNs created.
        p.spns || '—',
        // Year — hidden by default, kept available
        p.year || '—',
        // Margin % derivation
        marginCell(p),
        // Days Active
        (() => { const d = daysSince(p.created_at); return d == null ? '—' : String(d); })(),
        // Last Invoice date
        fmtDtClick(p.last_invoice_date),
        // Open POs count
        p.open_pos_count != null ? String(p.open_pos_count) : '0',
        // Equipment currently checked out to this project
        p.equipment_out_count != null ? String(p.equipment_out_count) : '0',
        // Won-from-bid number — populated only for projects that came from a bid
        p.won_from_bid_number || '—',
        // Detail button (action column)
        h('button',{className:'btn-outline btn-sm',onclick:()=>navigate('project-detail',{id:p.id})},'Detail'),
      ]),
      {
        // Hidden by default — surfaceable via the Columns pop-up. Pat asked
        // for these to ship as columns but not clutter the default view.
        defaultHidden: ['Year', 'Margin %', 'Days Active', 'Last Invoice', 'Open POs', 'Equipment Out', 'Won-from Bid #'],
      }
    ));
  }
}

async function renderProjectDetail(main) {
  const data=await api('/projects/'+S.params.id);
  const p=data.project, f=data.financials||{};

  main.append(h('div',{className:'page-header'},[
    h('h1',{},p.name),
    h('span',{className:'status status-'+p.status},p.status),
    h('button',{
      className:'btn-outline btn-sm',
      style:'margin-left:8px;padding:4px 12px',
      title:'Edit project details',
      onclick:()=>showProjectEditModal(p.id, ()=>renderProjectDetail(main)),
    },'✎ Edit'),
  ]));

  // Financial cards — each card maps to a feature area. When the
  // feature is toggled off in Superadmin → Feature Toggles, the card
  // disappears so users don't see broken/empty stats for features they
  // don't use. Contract Value always shows (it's a bid-derived field,
  // independent of invoices/POs/timesheets).
  const cards=h('div',{className:'cards'});
  cards.append(makeCard('Contract Value',fmtD(f.contract_value),''));
  if (featureEnabled('invoices_enabled')) {
    cards.append(makeCard('Revenue',fmtD(f.total_revenue),f.invoice_count+' invoices'));
  }
  // Total Cost rolls up PO+Equip+Miles+PerDiem; we only show it when at
  // least one of its contributing features is enabled. Equipment is
  // always on, so this is effectively "if POs or timesheets are on".
  if (featureEnabled('purchase_orders_enabled') || featureEnabled('timesheets_enabled')) {
    cards.append(makeCard('Total Cost',fmtD(f.total_cost),'PO+Equip+Miles+PerDiem'));
  }
  // Margin and WCI need invoice revenue to be meaningful
  if (featureEnabled('invoices_enabled')) {
    cards.append(makeCard('Margin',fmtD(f.margin_dollars),(f.margin_percent||0)+'%'));
    cards.append(makeCard('WCI',f.wci!==null?f.wci+' days':'—','Invoice to payment'));
  }
  if (featureEnabled('timesheets_enabled')) {
    cards.append(makeCard('Hours',((f.total_st_hours||0)+(f.total_ot_hours||0)+(f.total_dt_hours||0)).toFixed(1),'ST:'+f.total_st_hours+' OT:'+f.total_ot_hours+' DT:'+f.total_dt_hours));
    cards.append(makeCard('Mileage',fmtD(f.total_mileage_cost),''));
    if(f.total_per_diem>0) cards.append(makeCard('Per Diem',fmtD(f.total_per_diem),''));
  }
  if (featureEnabled('invoices_enabled') && f.overdue_invoice_count>0) {
    cards.append(makeCard('Overdue',f.overdue_invoice_count+' invoices','⚠️'));
  }
  main.append(cards);

  // Project Numbers — prominent primary, plus optional SPNs section
  const allNumbers = data.project_numbers || [];
  const primary = allNumbers.find(pn => pn.label === 'Primary');
  const spns = allNumbers.filter(pn => pn.label !== 'Primary');

  if (primary || spns.length > 0) {
    const numSection = h('div', {style:'margin:16px 0;padding:12px;background:var(--bg3);border-radius:6px'});
    if (primary) {
      numSection.append(h('div', {style:'display:flex;align-items:baseline;gap:12px'}, [
        h('span', {style:'font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600'}, 'Project Number'),
        h('code', {style:'font-family:monospace;font-size:18px;font-weight:700;color:var(--primary)'}, primary.number),
      ]));
    }
    if (spns.length > 0) {
      const spnRow = h('div', {style:'margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
      spnRow.append(h('span', {style:'font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;font-weight:600'}, 'SPN'));
      spns.forEach(spn => {
        spnRow.append(h('code', {style:'font-family:monospace;font-size:13px;background:var(--bg);padding:3px 8px;border-radius:3px'},
          spn.label && spn.label !== 'SPN' ? `${spn.label}: ${spn.number}` : spn.number));
      });
      numSection.append(spnRow);
    }
    main.append(numSection);
  }

  // Info — read-only, formatted contract type
  const info=h('div',{className:'form-grid',style:'margin-top:16px'});
  info.innerHTML=`
    <div class="form-group"><label>Address</label><input readonly value="${(p.address||'').replace(/"/g,'&quot;')}"></div>
    <div class="form-group"><label>Local Union</label><input readonly value="${fmtUnion(p.local_union)}"></div>
    <div class="form-group"><label>Contract Type</label><input readonly value="${fmtCT(p.contract_type)}"></div>
    <div class="form-group"><label>Payment Terms</label><input readonly value="${p.payment_terms||'Not set'}"></div>
  `;
  main.append(info);

  // ─── Project Notes section ──────────────────────────────────
  //
  // Payment / admin tracking notes. NOT broadcast to the field —
  // those go through the Scheduler's per-day notes + Email Day to
  // Staff button. This section is for PM/accounting/admin tracking
  // payment status, change-order context, vendor pricing notes, etc.
  // Eventually superseded by the Invoices feature once enabled.
  //
  // Visibility comes from the server (`can_edit_notes`) — field/shop
  // staff don't see this section at all.
  if (data.can_edit_notes) {
    const notesSection = h('div',{style:'margin-top:24px;padding:16px;background:var(--bg3);border-radius:8px'});
    notesSection.append(h('h3',{style:'margin:0 0 8px'},'Notes'));
    notesSection.append(h('p',{style:'color:var(--text3);font-size:11px;margin-bottom:8px'},
      'Payment and admin tracking notes. Internal to PM, accounting, and admin — NOT sent to the field. (For day-of crew instructions, use the Scheduler day pop-up.)'));

    const notesTA = h('textarea',{
      id: 'project-notes-ta',
      style: 'width:100%;min-height:90px;padding:8px;font-family:inherit;font-size:13px;resize:vertical',
      placeholder: 'Payment status, change-order discussion, vendor pricing context, etc.',
    });
    notesTA.value = p.notes || '';
    notesSection.append(notesTA);

    const saveBtn = h('button',{className:'btn btn-sm',style:'margin-top:8px',onclick:async()=>{
      try {
        await api('/projects/' + p.id, {
          method: 'PATCH',
          body: JSON.stringify({ notes: $('#project-notes-ta').value }),
        });
        saveBtn.textContent = '✓ Saved';
        setTimeout(()=>{ saveBtn.textContent = 'Save'; }, 1500);

    }},'Save');
    notesSection.append(saveBtn);
    main.append(notesSection);
  }

  // Action buttons — each gated on the feature flag for the action it
  // performs. With all three flags off, only the Close Project button
  // remains (when applicable), keeping the action row uncluttered.
  const actions=h('div',{style:'display:flex;gap:12px;margin-top:16px;flex-wrap:wrap'});

  if (featureEnabled('invoices_enabled')) {
    actions.append(h('button',{className:'btn',onclick:()=>showInvoiceGenModal(p)},'Generate Invoice'));
  }
  if (featureEnabled('purchase_orders_enabled')) {
    actions.append(h('button',{className:'btn',onclick:()=>showCreatePOModal(p,()=>renderProjectDetail(main))},'Create PO'));
  }
  if (featureEnabled('timesheets_enabled')) {
    actions.append(h('button',{className:'btn-outline',onclick:()=>showTimesheetExportModal(p)},'Export Timesheets'));
  }

  // Close button
  if(p.status==='active') {
    actions.append(h('button',{className:'btn-red',onclick:async()=>{
      if(confirm('Close this project?')) {
        const r=await api('/projects/'+p.id+'/close',{method:'POST'});
        if(r.warnings?.equipment_still_out) alert('Warning: Equipment still checked out:\n'+r.warnings.equipment_still_out.map(e=>e.name).join(', '));
        navigate('projects');
      }
    }},'Close Project'));
  }
  main.append(actions);

  // ─── Purchase Orders section ────────────────────────────────
  // Always visible — even when purchase_orders_enabled is OFF — so the
  // project detail tab can record POs + notes. When the feature is ON,
  // the full Create PO button above still handles document generation;
  // this section additionally exposes a notes column and a bare inline
  // add for the feature-off case. Data rolls up to financials either
  // way (same table).
  {

  poSection.append(poHdr);
  const poList=h('div',{id:'po-list-' + p.id});
  poSection.append(poList);

  // Bare inline add — shown when the full PO feature is off (no other
  // way to get a PO into the system to note against). When the feature
  // is on, the Create PO button above is the richer entry point so we
  // skip the bare form to avoid two competing creators.
  if (!poFeatureOn && data.can_edit_notes) {
    const addRow=h('div',{style:'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center'});
