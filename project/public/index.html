    if (onSaved) onSaved();
  }},'Close'));
  modal.append(closeRow);
}

// ═══════════════════════════════════════════════════════════
// SCHEDULER — By-Worker grid view
// ═══════════════════════════════════════════════════════════
//
// Rows = on-schedule workers; columns = days in the visible window.
// Each cell shows the project number(s) the worker is assigned to that
// day. Two display modes:
//
//   - SIMPLIFIED (default): cell shows the project number when a worker
//     has 1 assignment, "Multiple" in a bright color when ≥ 2. Row
//     stays at standard height.
//   - EXTENDED: row grows to stack each project number on its own line.
//     Numbers render in order_index sequence (1st, 2nd, 3rd, ...) and
//     can be dragged to reorder; reorder persists per worker per day.
//
// Window: same 6-week pad as the calendar so the two views stay in
// sync visually when the user toggles.

async function renderSchedulerByWorker(main) {
  // Weekly window — 7 days starting from weekAnchor (Sunday). Switched
  // from the previous 6-week pad so the grid fits one screen and the
  // navigation buttons step by week instead of by month.
  const gridStart = new Date(schedulerState.weekAnchor);
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridEnd.getDate() + 6);
  const fmt = (d) => d.toISOString().split('T')[0];

  // Mode toggle (extended / simplified)
  const modeRow = h('div',{style:'display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px'});
  modeRow.append(h('span',{style:'color:var(--text2)'},'Display:'));
  ['simplified','extended'].forEach(mode => {
    const b = h('button',{
      className: schedulerState.byWorkerMode === mode ? 'btn btn-sm' : 'btn-outline btn-sm',
      style: 'padding:4px 12px',
      onclick: () => { schedulerState.byWorkerMode = mode; main.innerHTML=''; renderScheduler(main); },
    }, mode.charAt(0).toUpperCase() + mode.slice(1));
    modeRow.append(b);
  });
  if (schedulerState.byWorkerMode === 'extended') {
    modeRow.append(h('span',{style:'color:var(--text3);font-size:11px;margin-left:8px'},
      'Drag to Reorder'));
  }
  main.append(modeRow);

  const wrap = h('div',{style:'background:var(--bg2);border-radius:8px;padding:12px;overflow-x:auto'});
  wrap.textContent = 'Loading…';
  main.append(wrap);

  let workers = [], assignments = [];
  try {
    const r = await api(`/scheduler/by-worker?from=${fmt(gridStart)}&to=${fmt(gridEnd)}`);
    workers = r.workers || [];
    assignments = r.assignments || [];
  } catch (err) {
    wrap.innerHTML = '';
    wrap.append(h('div',{style:'color:var(--red);padding:12px'}, 'Could not load: ' + err.message));
    return;
  }

  if (workers.length === 0) {
    wrap.innerHTML = '';
    wrap.append(h('div',{style:'background:var(--bg3);padding:24px;border-radius:8px;text-align:center;color:var(--text2)'}, [
      h('p',{style:'margin-bottom:8px'},'No on-schedule users found.'),
      h('p',{style:'font-size:12px;color:var(--text3)'},'Mark users as "On Schedule" via Admin → Users to populate this grid.'),
    ]));
    return;
  }

  wrap.innerHTML = '';

  // Pivot assignments → {workerId: {dateKey: [{id, project_id, project_number, project_name, order_index}]}}
  const byWorkerByDate = new Map();
  assignments.forEach(a => {
    const wid = a.worker_id;
    const dk = String(a.work_date).slice(0, 10);
    if (!byWorkerByDate.has(wid)) byWorkerByDate.set(wid, new Map());
    const dateMap = byWorkerByDate.get(wid);
    if (!dateMap.has(dk)) dateMap.set(dk, []);
    dateMap.get(dk).push(a);
  });
  // Sort each cell by order_index then id (stable)
  byWorkerByDate.forEach(dateMap => dateMap.forEach(arr => arr.sort((x,y) => (x.order_index - y.order_index) || x.id.localeCompare(y.id))));

  // Build grid: Worker col + 7 day cols.
  const dayCols = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(gridStart);
    d.setDate(d.getDate() + i);
    dayCols.push(d);
  }
  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // Color helper for project consistency across views
  function colorForProject(id) {
    let hh = 0;
    for (let i = 0; i < id.length; i++) hh = (hh * 31 + id.charCodeAt(i)) >>> 0;
    return `hsl(${hh % 360}, 40%, 36%)`;
  }

  const tbl = h('table',{style:'border-collapse:collapse;font-size:12px;width:100%'});
  // Header: weekday + date (clickable to sort)
  const thead = h('thead');
  const trDows = h('tr');
  trDows.append(h('th',{style:'position:sticky;left:0;background:var(--bg3);width:110px;min-width:110px;max-width:110px;padding:4px 8px;text-align:left;z-index:2'},'Worker'));
  dayCols.forEach(d => {
    trDows.append(h('th',{style:`
      background:var(--bg3);
      padding:4px;
      font-size:11px;
      color:var(--text2);
      font-weight:600;
      border-left:1px solid var(--border);
    `}, d.toLocaleDateString(undefined,{weekday:'short'})));
  });
  thead.append(trDows);
  const trDays = h('tr');
  trDays.append(h('th',{style:'position:sticky;left:0;background:var(--bg3);padding:2px 8px;text-align:left;z-index:2'},
    h('span',{style:'font-size:10px;color:var(--text3);font-weight:400'},'Click a date to sort')));
  dayCols.forEach(d => {
    const isToday = d.toDateString() === new Date().toDateString();
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const dk = dateKey(d);
    const isSortKey = schedulerState.sortByDateKey === dk;
    const arrow = isSortKey ? (schedulerState.sortDir === 'desc' ? ' ▼' : ' ▲') : '';
    trDays.append(h('th',{
      style:`
        background:${isToday ? 'var(--primary)' : 'var(--bg3)'};
        color:${isToday ? '#fff' : (isWeekend ? 'var(--text3)' : 'var(--text2)')};
        padding:4px;
        font-size:13px;
        font-weight:${isToday ? 700 : 600};
        cursor:pointer;
        ${isSortKey ? 'outline:2px solid var(--primary);outline-offset:-2px;' : ''}
      `,
      title: 'Click to sort workers by what they’re assigned to on this date (blanks first)',
      onclick: () => {
        if (schedulerState.sortByDateKey === dk) {
          schedulerState.sortDir = schedulerState.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          schedulerState.sortByDateKey = dk;
          schedulerState.sortDir = 'asc';
        }
        main.innerHTML=''; renderScheduler(main);
      },
    }, String(d.getDate()) + arrow));
  });
  thead.append(trDays);
  tbl.append(thead);

  const tbody = h('tbody');

  // Row height management: extended mode rows can grow tall; simplified
  // stays compact. We let CSS handle it via a class so re-renders don't
  // need to recompute heights.
  const rowBase = schedulerState.byWorkerMode === 'extended' ? 'min-height:36px;vertical-align:top' : 'height:28px';

  // Click-to-sort: when a date column header is clicked, reorder workers
  // by what's assigned to them on that date. Blank cells (no assignment)
  // sort first in 'asc' mode and last in 'desc' mode — so a scheduler
  // hunting for unstaffed slots can pull all the empties to the top.
  let sortedWorkers = workers.slice();
  if (schedulerState.sortByDateKey) {
    const dk = schedulerState.sortByDateKey;
    const keyFor = (w) => {
      const list = (byWorkerByDate.get(w.id) || new Map()).get(dk) || [];
      if (list.length === 0) return '';
      return list.map(a => a.project_number || a.project_name || '').sort().join('|');
    };
    sortedWorkers.sort((a, b) => {
      const ka = keyFor(a), kb = keyFor(b);
      const aBlank = ka === '', bBlank = kb === '';
      if (aBlank !== bBlank) {
        // asc: blanks first; desc: blanks last
        return (schedulerState.sortDir === 'desc') ? (aBlank ? 1 : -1) : (aBlank ? -1 : 1);
      }
      const cmp = ka.localeCompare(kb);
      return (schedulerState.sortDir === 'desc') ? -cmp : cmp;
    });
  }

  sortedWorkers.forEach(w => {
    const tr = h('tr',{style:'border-top:1px solid var(--border)'});
    const nameCell = h('td',{style:`position:sticky;left:0;background:var(--bg2);padding:6px 8px;font-weight:500;width:110px;min-width:110px;max-width:110px;font-size:12px;${rowBase};z-index:1`});
    nameCell.append(h('div',{style:'white-space:nowrap;overflow:hidden;text-overflow:ellipsis'}, w.first_name + ' ' + w.last_name));
    nameCell.append(h('div',{style:'font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis'}, (w.role || '').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())));
    tr.append(nameCell);

    const dateMap = byWorkerByDate.get(w.id) || new Map();
    dayCols.forEach(d => {
      const dk = dateKey(d);
      const list = dateMap.get(dk) || [];
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const td = h('td',{style:`
        padding:2px;
        text-align:center;
        background:${isWeekend ? 'var(--bg3)' : 'transparent'};
        ${rowBase};
        border-left:1px solid var(--border);
        position:relative;
        cursor:pointer;
      `,
        title: list.length === 0 ? 'Click to assign a project' : 'Click to add another project',
      });
      // Click anywhere in the cell that isn't a draggable chip → open
      // the project picker. The chip drag handlers stopPropagation via
      // their own event flow, but the existence-check on the closest
      // ancestor is a belt-and-suspenders guard so picking the cell next
      // to a chip doesn't accidentally fire when the chip absorbs the drop.
      td.addEventListener('click', (e) => {
        if (e.target.closest('[data-assignment-id]')) return;
        showByWorkerCellAssignPopup(w, dk, () => { main.innerHTML=''; renderScheduler(main); });
      });
      if (list.length > 0) {
        if (schedulerState.byWorkerMode === 'simplified') {
          // Single project: show its number. Multiple: bright "Multiple"
          // label. Color the cell by the (first) project's color so visual
          // continuity with the calendar is preserved.
          if (list.length === 1) {
            const a = list[0];
            td.style.background = colorForProject(a.project_id);
            td.style.color = '#fff';
            td.title = `${a.project_number || a.project_name || 'Project'} — ${a.project_name || ''}`;
            td.append(h('span',{style:'font-size:10px;font-weight:600'}, a.project_number || '?'));
          } else {
            td.style.background = '#d97706'; // amber-ish — clearly distinct from any project hue
            td.style.color = '#fff';
            td.style.fontWeight = '700';
            td.title = list.map(a => a.project_number || a.project_name).join(' • ');
            td.append(h('span',{style:'font-size:10px'}, 'Multiple'));
          }
        } else {
          // Extended: stack project numbers, each draggable for reorder
          const stack = h('div',{style:'display:flex;flex-direction:column;gap:2px;padding:2px'});
          list.forEach((a, idx) => {
            const chip = h('div',{
              draggable: true,
              'data-assignment-id': a.id,
              style: `
                background:${colorForProject(a.project_id)};
                color:#fff;
                padding:2px 4px;
                border-radius:3px;
                font-size:10px;
                font-weight:600;
                cursor:grab;
                user-select:none;
              `,
              title: a.project_name || '',
            }, a.project_number || '?');
            // Drag handlers — reorder within this cell only
            chip.addEventListener('dragstart', (e) => {
              e.dataTransfer.setData('text/plain', a.id);
              e.dataTransfer.effectAllowed = 'move';
              chip.style.opacity = '0.4';
            });
            chip.addEventListener('dragend', () => { chip.style.opacity = '1'; });
            chip.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
            chip.addEventListener('drop', async (e) => {
              e.preventDefault();
              const draggedId = e.dataTransfer.getData('text/plain');
              if (!draggedId || draggedId === a.id) return;
              // Build the new order: take current order, remove dragged
              // id, insert it at the drop target's index
              const currentIds = list.map(x => x.id);
              const fromIdx = currentIds.indexOf(draggedId);
              if (fromIdx === -1) return;
              currentIds.splice(fromIdx, 1);
              const toIdx = currentIds.indexOf(a.id);
              currentIds.splice(toIdx, 0, draggedId);
              try {
                await api('/scheduler/assignments/reorder', {
                  method: 'PATCH',
                  body: JSON.stringify({
                    worker_id: w.id, work_date: dk,
                    ordered_assignment_ids: currentIds,
                  }),
                });
                // Re-render to reflect new order
                main.innerHTML=''; renderScheduler(main);
              } catch (err) { alert(err.message); }
            });
            stack.append(chip);
          });
          td.append(stack);
        }
      }
      tr.append(td);
    });

    tbody.append(tr);
  });
  tbl.append(tbody);
  wrap.append(tbl);
}


// Top-level Email Day to Staff picker — replaces the per-day-popup
// button. Asks for a date, lists projects scheduled on that date with
// their assigned crew count, picks one, confirms, fires the email.
// ─────────────────────────────────────────────────────────────────────
//  Compose Email modal
// ─────────────────────────────────────────────────────────────────────
//
// Reusable modal that sits in front of the actual email-fire moment for
// Scheduler → Email Day to Staff and Saved Exports → Run now. Fetches a
// variable catalog from /api/email-compose/catalog for the given context,
// pre-fills To/Subject/Body from the template defaults, lets the user
// tweak everything (Body uses a contentEditable div with chip insertion
// via an Insert Variable button), and live-previews the resolved output
// in a pane below. On Send, the raw composed strings (still containing
// `{{var}}` tokens for any inserted chips) are passed to onSend so the
// caller can POST them as overrides — backend resolves at send time.
//
// Usage:
//   composeEmailModal({
//     context: 'email_day_to_staff',
//     ids:     { project_id: '...', date: '2026-05-18' },
//     onSend:  async (payload) => api('/projects/.../email-day', {
//                method:'POST', body: JSON.stringify({ date, ...payload }),
//              }),
//   });
//
// payload shape: { override_to, extra_cc, override_subject, override_body_html }
async function composeEmailModal({ context, ids, onSend, title = 'Send Email' }) {
  // 1. Fetch catalog (vars + defaults). If this fails, surface and bail.
  const catalogQs = new URLSearchParams({ context, ...(ids || {}) }).toString();
  let catalog;
  try {
    catalog = await api('/email-compose/catalog?' + catalogQs);
  } catch (e) {
    alert('Could not load compose catalog: ' + e.message);
    return;
  }

  // 2. Modal shell
  const overlay = h('div', { className: 'modal-overlay' });
  const modal = h('div', {
    className: 'modal',
    style: 'max-width:780px;max-height:92vh;display:flex;flex-direction:column;gap:8px',
  });
  modal.append(h('h2', { style: 'margin:0 0 4px' }, title));

  // 3. To row (chips)
  let toRecipients = (catalog.defaults && catalog.defaults.to) ? catalog.defaults.to.slice() : [];
  const toRow = h('div', { className: 'form-group' });
  toRow.append(h('label', {}, 'Send To'));
  const toChips = h('div', {
    style: 'min-height:32px;padding:4px;border:1px solid var(--border);border-radius:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--bg)',
  });
  function renderToChips() {
    toChips.innerHTML = '';
    toRecipients.forEach((r, i) => {
      const chip = h('span', {
        style: 'background:var(--bg3);border:1px solid var(--border);padding:2px 6px;border-radius:3px;font-size:12px;display:inline-flex;gap:6px;align-items:center',
      });
      chip.append(document.createTextNode(`${r.label || r.email} <${r.email}>`));
      chip.append(h('span', {
        style: 'cursor:pointer;color:var(--red);font-weight:700;font-size:14px;line-height:1',
        onclick: () => { toRecipients.splice(i, 1); renderToChips(); schedulePreview(); },
      }, '×'));
      toChips.append(chip);
    });
    const addBtn = h('button', {
      className: 'btn-outline btn-sm',
      style: 'padding:2px 8px;font-size:11px',
      onclick: (e) => { e.preventDefault(); promptAddRecipient(); },
    }, '+ Add');
    toChips.append(addBtn);
  }
  function promptAddRecipient() {
    const raw = window.prompt('Add recipient email:');
    if (!raw) return;
    raw.split(',').map(s => s.trim()).filter(Boolean).forEach(email => {
      toRecipients.push({ email, label: email });
    });
    renderToChips();
    schedulePreview();
  }
  toRow.append(toChips);
  modal.append(toRow);
  renderToChips();

  // 4. CC row (comma-separated free text)
  const ccRow = h('div', { className: 'form-group' });
  ccRow.append(h('label', {}, 'CC (comma-separated emails)'));
  const ccInp = h('input', { type: 'text', placeholder: 'e.g. boss@co.com, accounting@co.com' });
  ccInp.addEventListener('input', schedulePreview);
  ccRow.append(ccInp);
  modal.append(ccRow);

  // 5. Subject row (with Insert Variable)
  const subjRow = h('div', { className: 'form-group' });
  subjRow.append(h('label', {}, 'Subject'));
  const subjInp = h('input', { type: 'text', value: (catalog.defaults && catalog.defaults.subject) || '' });
  subjInp.addEventListener('input', schedulePreview);
  const subjInsert = h('button', {
    className: 'btn-outline btn-sm',
    style: 'padding:2px 8px;font-size:11px;margin-top:4px',
    onclick: (e) => { e.preventDefault(); openVarPicker({ target: 'subject' }); },
  }, '+ Insert variable');
  subjRow.append(subjInp);
  subjRow.append(subjInsert);
  modal.append(subjRow);

  // 6. Body row (contentEditable + Insert Variable)
  const bodyRow = h('div', { className: 'form-group' });
  bodyRow.append(h('label', {}, 'Body'));
  const bodyEditor = h('div', {
    contentEditable: 'true',
    style: 'min-height:180px;max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:8px;background:var(--bg);font-size:13px;line-height:1.5',
  });
  // Pre-fill from template body_html. Any `{{var}}` markers in the
  // template that match a catalog var get rendered as chips so the user
  // can interact with them as units; unmatched markers stay as literal
  // text and still resolve at send time via legacy-alias substitution.
  bodyEditor.innerHTML = chipifyHtml((catalog.defaults && catalog.defaults.body_html) || '', catalog.vars || []);
  // Force plain-text on paste — pasting from Word/web pastes a wall of
  // weird HTML otherwise, which then needs serialization gymnastics.
  bodyEditor.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  bodyEditor.addEventListener('input', schedulePreview);
  // Save the caret on blur so Insert Variable knows where to drop the chip
  // when the user clicks the picker button (which steals focus).
  let savedRange = null;
  bodyEditor.addEventListener('blur', () => {
    const sel = window.getSelection();
    if (sel.rangeCount && bodyEditor.contains(sel.anchorNode)) {
      savedRange = sel.getRangeAt(0).cloneRange();
    }
  });
  const bodyInsert = h('button', {
    className: 'btn-outline btn-sm',
    style: 'padding:2px 8px;font-size:11px;margin-top:4px',
    onclick: (e) => { e.preventDefault(); openVarPicker({ target: 'body' }); },
  }, '+ Insert variable');
  bodyRow.append(bodyEditor);
  bodyRow.append(bodyInsert);
  modal.append(bodyRow);

  // 7. Preview pane
  modal.append(h('label', { style: 'font-size:12px;color:var(--text2);margin-top:6px;display:block' }, 'Preview (variables resolved against live data)'));
  const preview = h('div', { style: 'margin-top:4px;padding:8px 10px;background:var(--bg3);border-radius:4px;font-size:12px;max-height:220px;overflow-y:auto' });
  preview.innerHTML = '<div style="color:var(--text3);font-style:italic">Preview will render here…</div>';
  modal.append(preview);

  // 8. Action row
  const actions = h('div', { style: 'display:flex;gap:8px;justify-content:flex-end;margin-top:10px' });
  const cancelBtn = h('button', { className: 'btn-outline', onclick: () => overlay.remove() }, 'Cancel');
  const sendBtn = h('button', { className: 'btn', onclick: doSend }, 'Send');
  actions.append(cancelBtn);
  actions.append(sendBtn);
  modal.append(actions);

  overlay.append(modal);
  document.body.append(overlay);

  // First preview render
  schedulePreview();

  // ─── helpers (closure) ───────────────────────────────────────────

  function serializeBody() {
    // Walk a clone of the editor; replace chip spans with `{{key}}` text
    // tokens. The browser already produces reasonable HTML for line breaks
    // (<br>, <div>) — we just rewrite chip nodes and pass everything else
    // through to the server which resolves the tokens against live data.
    const clone = bodyEditor.cloneNode(true);
    clone.querySelectorAll('span.evar[data-var]').forEach(span => {
      const txt = document.createTextNode('{{' + span.dataset.var + '}}');
      span.parentNode.replaceChild(txt, span);
    });
    return clone.innerHTML;
  }

  // Debounced preview render via /api/email-compose/preview
  let previewTimer = null;
  function schedulePreview() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview, 300);
  }
  async function updatePreview() {
    try {
      const r = await api('/email-compose/preview', {
        method: 'POST',
        body: JSON.stringify({
          context, ids,
          raw_subject: subjInp.value,
          raw_body_html: serializeBody(),
        }),
      });
      preview.innerHTML = '';
      preview.append(h('div', { style: 'font-family:monospace;font-size:11px;color:var(--text2);margin-bottom:6px' }, 'Subject: ' + r.subject));
      const body = h('div');
      body.innerHTML = r.html;
      preview.append(body);
    } catch (e) {
      preview.innerHTML = '<div style="color:var(--red)">Preview error: ' + (e.message || e) + '</div>';
    }
  }

  // Variable picker dropdown — fixed-positioned under the trigger button.
  function openVarPicker({ target }) {
    const existing = document.querySelector('.compose-var-picker');
    if (existing) existing.remove();

    const vars = catalog.vars || [];
    const picker = h('div', {
      className: 'compose-var-picker',
      style: 'position:fixed;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,0.3);max-height:260px;overflow-y:auto;width:340px;z-index:1000',
    });
    const search = h('input', { type: 'text', placeholder: 'Filter…', style: 'width:100%;margin-bottom:6px;padding:4px 6px;font-size:12px' });
    picker.append(search);
    const list = h('div');
    picker.append(list);

    function renderList(filter) {
      list.innerHTML = '';
      const f = (filter || '').toLowerCase();
      const matches = vars.filter(v => !f || v.label.toLowerCase().includes(f) || v.key.toLowerCase().includes(f));
      if (matches.length === 0) {
        list.append(h('div', { style: 'color:var(--text3);font-size:12px;padding:6px' }, 'No matches.'));
        return;
      }
      matches.forEach(v => {
        const row = h('div', {
          style: 'display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:3px;cursor:pointer;font-size:12px',
          onmouseenter: e => { e.currentTarget.style.background = 'var(--bg3)'; },
          onmouseleave: e => { e.currentTarget.style.background = 'transparent'; },
          onclick: () => { insertVar(target, v); picker.remove(); schedulePreview(); },
        });
        row.append(h('span', { style: 'font-weight:600' }, v.label));
        row.append(h('span', { style: 'color:var(--text3);font-family:monospace;font-size:11px' }, v.sample == null ? '' : String(v.sample).substring(0, 40)));
        list.append(row);
      });
    }
    search.addEventListener('input', () => renderList(search.value));
    renderList('');

    const anchor = target === 'subject' ? subjInsert : bodyInsert;
    const rect = anchor.getBoundingClientRect();
    picker.style.left = rect.left + 'px';
    picker.style.top = (rect.bottom + 4) + 'px';
    document.body.append(picker);
    setTimeout(() => search.focus(), 10);

    const closeOnOutsideClick = (e) => {
      if (!picker.contains(e.target) && e.target !== anchor) {
        picker.remove();
        document.removeEventListener('mousedown', closeOnOutsideClick);
      }
    };
    setTimeout(() => document.addEventListener('mousedown', closeOnOutsideClick), 0);
  }

  function insertVar(target, v) {
    if (target === 'subject') {
      // Plain text insertion at cursor in <input>
      const inp = subjInp;
      const start = inp.selectionStart != null ? inp.selectionStart : inp.value.length;
      const end = inp.selectionEnd != null ? inp.selectionEnd : inp.value.length;
      const before = inp.value.substring(0, start);
      const after = inp.value.substring(end);
      const token = `{{${v.key}}}`;
      inp.value = before + token + after;
      const pos = start + token.length;
      inp.setSelectionRange(pos, pos);
      inp.focus();
      return;
    }
    // Body: insert a chip at the saved caret (or end if no saved caret).
    bodyEditor.focus();
    if (savedRange && bodyEditor.contains(savedRange.startContainer)) {
      const sel0 = window.getSelection();
      sel0.removeAllRanges();
      sel0.addRange(savedRange);
    }
    const chip = makeChip(v);
    const sel = window.getSelection();
    if (sel.rangeCount && bodyEditor.contains(sel.anchorNode)) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(chip);
      const space = document.createTextNode(' ');
      chip.parentNode.insertBefore(space, chip.nextSibling);
      range.setStartAfter(space);
      range.setEndAfter(space);
      sel.removeAllRanges();
      sel.addRange(range);
      savedRange = range.cloneRange();
    } else {
      bodyEditor.appendChild(chip);
      bodyEditor.appendChild(document.createTextNode(' '));
    }
  }

  function makeChip(v) {
    const span = document.createElement('span');
    span.className = 'evar';
    span.contentEditable = 'false';
    span.dataset.var = v.key;
    span.textContent = v.label;
    span.style.cssText = 'background:var(--primary);color:#fff;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600;margin:0 2px;display:inline-block;cursor:default;user-select:none';
    return span;
  }

  // Replace `{{key}}` markers in pre-fill HTML with chip spans for keys
  // that exist in the catalog. Unknown keys pass through as literal text
  // (still resolve at send time via legacy-alias substitution).
  function chipifyHtml(rawHtml, vars) {
    if (!rawHtml) return '';
    const byKey = new Map(vars.map(v => [v.key, v]));
    return rawHtml.replace(/\{\{\s*([a-zA-Z_][\w]*(?:\.[a-zA-Z_][\w]*)*)\s*\}\}/g, (m, key) => {
      const v = byKey.get(key);
      if (!v) return m;
      const lbl = String(v.label).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `<span class="evar" contenteditable="false" data-var="${v.key}" style="background:var(--primary);color:#fff;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600;margin:0 2px;display:inline-block;cursor:default;user-select:none">${lbl}</span>`;
    });
  }

  async function doSend() {
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';
    const payload = {
      override_subject: subjInp.value,
      override_body_html: serializeBody(),
      override_to: toRecipients.map(r => r.email).filter(Boolean),
      extra_cc: ccInp.value.split(',').map(s => s.trim()).filter(Boolean),
    };
    try {
      const result = await onSend(payload);
      overlay.remove();
      if (result) {
        const parts = [];
        if (result.sent_to != null) parts.push(`sent to ${result.sent_to}`);
        if (result.delivered != null) parts.push(`delivered ${result.delivered}`);
        if (result.failed != null) parts.push(`failed ${result.failed}`);
        if (result.cc) parts.push(`cc ${result.cc}`);
        alert(parts.length > 0 ? 'Sent — ' + parts.join(', ') : 'Sent.');
      } else {
        alert('Sent.');
      }
    } catch (e) {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
      alert('Send failed: ' + (e.message || e));
    }
  }
}

async function showEmailDayPickerPopup() {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:520px;max-height:80vh;display:flex;flex-direction:column'});
  modal.append(h('h2',{},'Email Day to Staff'));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:12px'},
    'Pick a date and a project. Workers assigned that day get the project info, crew list, and day note.'));

  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const dateRow = h('div',{className:'form-group',style:'margin-bottom:10px'});
  dateRow.append(h('label',{},'Date'));
  const dateInput = h('input',{type:'date',value:todayStr});
  dateRow.append(dateInput);
  modal.append(dateRow);

  const listLabel = h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-bottom:4px'},'Projects on this date');
  modal.append(listLabel);
  const listWrap = h('div',{style:'display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;min-height:120px;margin-bottom:10px'});
  modal.append(listWrap);

  // Holds the most recent /scheduled-list result for the chosen date.
  // The Send button fans out across every project in this list.
  let loadedProjects = [];

  const closeRow = h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:10px'});
  const sendStatus = h('span',{style:'font-size:11px;color:var(--text3)'}, '');
  closeRow.append(sendStatus);
  const btnRow = h('div',{style:'display:flex;gap:8px'});
  btnRow.append(h('button',{className:'btn-outline btn-sm',onclick:()=>overlay.remove()},'Cancel'));
  const sendBtn = h('button',{className:'btn btn-sm'}, 'Send');
  sendBtn.onclick = async () => {
    const forDate = dateInput.value;
    if (loadedProjects.length === 0) { alert('No projects scheduled on this date.'); return; }
    // Summarize staffing state for the bulk confirm: how many rows are
    // un-staffed (red) and how many are partially staffed (yellow).
    let unstaffed = 0, partial = 0;
    loadedProjects.forEach(p => {
      const fs = (p.fully_staffed_dates || []).includes(forDate);
      if ((p._dayCrew || 0) === 0) unstaffed++;
      else if (!fs) partial++;
    });
    let msg = `Email day to staff for ${loadedProjects.length} project${loadedProjects.length===1?'':'s'} on ${forDate}?`;
    const warnBits = [];
    if (unstaffed) warnBits.push(`${unstaffed} not staffed (no emails will be sent for those)`);
    if (partial) warnBits.push(`${partial} not fully staffed by recommendation`);
    if (warnBits.length) msg += `\n\nWarnings: ${warnBits.join('; ')}.`;
    if (!confirm(msg)) return;

    sendBtn.disabled = true;
    sendStatus.textContent = 'Sending…';
    let totalSent = 0, failed = 0;
    await Promise.all(loadedProjects.map(async p => {
      try {
        const r = await api(`/projects/${p.id}/email-day`, {
          method:'POST', body: JSON.stringify({ date: forDate }),
        });
        totalSent += (r.sent_to || 0);
      } catch (err) {
        failed++;
        console.error('[email-day]', p.id, err.message);
      }
    }));
    sendBtn.disabled = false;
    sendStatus.textContent = '';
    let result = `Sent to ${totalSent} worker${totalSent===1?'':'s'} across ${loadedProjects.length} project${loadedProjects.length===1?'':'s'}.`;
    if (failed) result += ` ${failed} project${failed===1?'':'s'} failed — see console.`;
    alert(result);
    overlay.remove();
  };
  btnRow.append(sendBtn);
  closeRow.append(btnRow);
  modal.append(closeRow);
  overlay.append(modal); document.body.append(overlay);

  async function loadProjects(forDate) {
    listWrap.innerHTML='';
    listWrap.append(h('div',{style:'color:var(--text2);padding:8px;font-size:13px'},'Loading…'));
    loadedProjects = [];
    let projects = [];
    try {
      const r = await api(`/projects/scheduled-list?from=${forDate}&to=${forDate}`);
      projects = r.projects || [];
    } catch (err) {
      listWrap.innerHTML='';
      listWrap.append(h('div',{style:'color:var(--red);padding:8px'}, 'Could not load: '+err.message));
      return;
    }
    listWrap.innerHTML='';
    if (projects.length === 0) {
      listWrap.append(h('div',{style:'color:var(--text2);padding:8px;font-size:13px'},
        'No projects scheduled on this date.'));
      return;
    }
    // Per-project crew count for the date — one round-trip per project,
    // small N (only same-day projects).
    await Promise.all(projects.map(async p => {
      try {
        const a = await api('/projects/' + p.id + '/assignments');
        const count = (a.assignments || []).filter(x => String(x.work_date).slice(0,10) === forDate).length;
        p._dayCrew = count;
      } catch { p._dayCrew = 0; }
    }));
    loadedProjects = projects;
    projects.forEach(p => {
      // Three staffing states drive the row warning:
      //   red    — 0 workers assigned for this date
      //   yellow — crew exists but PM hasn't marked the day fully_staffed
      //   none   — fully_staffed_dates includes this date
      const fsSet = new Set(p.fully_staffed_dates || []);
      const isFullyStaffed = fsSet.has(forDate);
      const hasCrew = p._dayCrew > 0;
      const warnLevel = !hasCrew ? 'red' : (!isFullyStaffed ? 'yellow' : null);
      const warnColor = warnLevel === 'red' ? '#d94545' : warnLevel === 'yellow' ? '#d9a441' : null;
      const warnLabel = warnLevel === 'red'
        ? 'Not staffed for this day'
        : warnLevel === 'yellow' ? 'Not fully staffed by recommendation' : '';

      const row = h('div',{
        style:`padding:10px;background:var(--bg3);border-radius:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;${warnColor?`border-left:3px solid ${warnColor};`:''}`,
      });

      const left = h('div',{style:'display:flex;align-items:center;gap:8px;min-width:0;flex:1'});
      if (warnColor) {
        left.append(h('span',{
          style:`color:${warnColor};font-size:14px;line-height:1;flex-shrink:0`,
          title: warnLabel,
        }, '⚠'));
      }
      const labelCol = h('div',{style:'min-width:0'});
      labelCol.append(h('div',{style:'font-weight:600;font-size:13px'}, p.primary_number || p.name || 'Project'));
      labelCol.append(h('div',{style:'font-size:11px;color:var(--text2)'}, p.customer_name || '—'));
      if (warnLabel) {
        labelCol.append(h('div',{style:`font-size:11px;color:${warnColor};margin-top:2px`}, warnLabel));
      }
      left.append(labelCol);
      row.append(left);

      row.append(h('span',{style:'font-size:12px;color:var(--text3);white-space:nowrap;flex-shrink:0'},
        `${p._dayCrew} worker${p._dayCrew===1?'':'s'}`));

      // Per-row compose button — pops the compose modal scoped to this
      // single project + date so the user can tweak the email before it
      // fires. The bulk Send button at the bottom still works for "send
      // all without composing"; this is the "send one with custom text"
      // path.
      const composeBtn = h('button', {
        className: 'btn-outline btn-sm',
        style: 'padding:2px 8px;font-size:11px;flex-shrink:0',
        title: 'Compose & send to this project only',
        onclick: () => {
          composeEmailModal({
            context: 'email_day_to_staff',
            ids: { project_id: p.id, date: forDate },
            title: `Email — ${p.primary_number || p.name} on ${forDate}`,
            onSend: (payload) => api(`/projects/${p.id}/email-day`, {
              method: 'POST',
              body: JSON.stringify({ date: forDate, ...payload }),
            }),
          });
        },
      }, '✉ Compose');
      row.append(composeBtn);

      listWrap.append(row);
    });
  }

  dateInput.onchange = () => loadProjects(dateInput.value);
  loadProjects(todayStr);
}


// Picker for the By-Worker grid: click a cell, get a searchable list of
// projects active on that date, click one to assign this worker to it.
// Lighter-weight than the per-project popup — meant for the staff
// schedulers who think "worker first" rather than "project first".
async function showByWorkerCellAssignPopup(worker, dateKey, onSaved) {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:480px;max-height:80vh;display:flex;flex-direction:column'});
  modal.append(h('h2',{style:'margin-bottom:4px'}, `Assign ${worker.first_name} ${worker.last_name}`));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:10px'},
    `For ${dateKey} — pick a project to add this worker to.`));

  const search = h('input',{placeholder:'Search by number, name, or customer…',autocomplete:'off'});
  modal.append(search);

  const listWrap = h('div',{style:'margin-top:10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;min-height:120px'});
  listWrap.append(h('div',{style:'color:var(--text2);padding:8px;font-size:13px'}, 'Loading projects…'));
  modal.append(listWrap);

  const closeRow = h('div',{style:'display:flex;justify-content:flex-end;margin-top:10px;border-top:1px solid var(--border);padding-top:10px'});
  closeRow.append(h('button',{className:'btn-outline btn-sm',onclick:()=>overlay.remove()},'Cancel'));
  modal.append(closeRow);

  overlay.append(modal); document.body.append(overlay);

  let projects = [];
  try {
    // scheduled-list returns active projects whose working window overlaps
    // the date. Single-day query: from=to=dateKey.
    const r = await api(`/projects/scheduled-list?from=${dateKey}&to=${dateKey}`);
    projects = r.projects || [];
  } catch (err) {
    listWrap.innerHTML = '';
    listWrap.append(h('div',{style:'color:var(--red);padding:8px'}, 'Could not load: ' + err.message));
    return;
  }

  function renderList(filter='') {
    listWrap.innerHTML = '';
    const q = filter.toLowerCase().trim();
    const matched = projects.filter(p => {
      if (!q) return true;
      return (p.primary_number||'').toLowerCase().includes(q)
        || (p.name||'').toLowerCase().includes(q)
        || (p.customer_name||'').toLowerCase().includes(q);
    });
    if (matched.length === 0) {
      listWrap.append(h('div',{style:'color:var(--text2);padding:8px;font-size:13px'},
        projects.length === 0
          ? 'No projects scheduled on this date. Set a project’s start date on the calendar first.'
          : 'No matches.'));
      return;
    }
    matched.forEach(p => {
      const row = h('div',{
        style: 'padding:8px 10px;background:var(--bg3);border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px',
        onmouseover: () => { row.style.background = 'var(--bg4)'; },
        onmouseout: () => { row.style.background = 'var(--bg3)'; },
        onclick: async () => {
          try {
            await api(`/projects/${p.id}/assignments`, {
              method: 'POST',
              body: JSON.stringify({ worker_ids: [worker.id], dates: [dateKey] }),
            });
            overlay.remove();
            if (onSaved) onSaved();
          } catch (err) { alert(err.message); }
        },
      });
      const left = h('div');
      left.append(h('div',{style:'font-weight:600;font-size:13px'}, p.primary_number || p.name || 'Project'));
      left.append(h('div',{style:'font-size:11px;color:var(--text2)'},
        [p.customer_name || '—', p.name].filter(Boolean).join(' • ')));
      row.append(left);
      const target = parseInt(p.manpower, 10) || 0;
      if (target > 0) {
        row.append(h('span',{style:'font-size:11px;color:var(--text3);white-space:nowrap'}, `target ${target}`));
      }
      listWrap.append(row);
    });
  }

  renderList();
  search.oninput = () => renderList(search.value);
  setTimeout(() => search.focus(), 50);
}


// Worker assignment pop-up — multi-select on-schedule users + assign for
// the supplied date(s). Used by both the per-day and bulk assignment
// flows: pass [dateKey] for one day, or the full working-day list to
// assign for the project's whole span.
async function showAssignWorkersPopup(project, workingDates, onSaved) {
  const overlay = h('div',{className:'modal-overlay'});
  const modal = h('div',{className:'modal',style:'max-width:560px'});
  modal.append(h('h2',{},'Assign Workers'));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:14px'},
    `Selected workers will be assigned to all ${workingDates.length} working day${workingDates.length === 1 ? '' : 's'} of "${project.name || 'this project'}". Re-assigning a slot already filled is a silent no-op.`));

  const loading = h('p',{},'Loading on-schedule users…');
  modal.append(loading);

  let workers = [];
  try {
    const r = await api('/users/on-schedule');
    workers = r.users || [];
  } catch (err) {
    loading.textContent = 'Could not load workers: ' + err.message;
    overlay.append(modal); document.body.append(overlay);
    return;
  }
  loading.remove();

  if (workers.length === 0) {
    modal.append(h('p',{style:'color:var(--text2)'},
      'No on-schedule users available. Mark users as "On Schedule" via Admin → Users to surface them here.'));
  } else {
    // Search box + checkbox list. Filtered by typed text.
    const search = h('input',{type:'text',placeholder:'Search workers...',style:'width:100%;margin-bottom:8px'});
    modal.append(search);

    const list = h('div',{style:'max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:4px'});
    const checkboxes = [];
    function renderList() {
      list.innerHTML = '';
      const q = search.value.toLowerCase().trim();
      workers.forEach(w => {
        const fullName = `${w.first_name} ${w.last_name}`;
        if (q && !fullName.toLowerCase().includes(q) && !(w.role || '').toLowerCase().includes(q)) return;
        const row = h('label',{style:'display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;border-radius:4px;font-size:13px'});
        row.onmouseenter = () => row.style.background = 'var(--bg3)';
        row.onmouseleave = () => row.style.background = '';
        const cb = h('input',{type:'checkbox',style:'width:auto'});
        cb.dataset.workerId = w.id;
        // Preserve checked state across re-renders triggered by typing
        const existing = checkboxes.find(c => c.dataset.workerId === w.id);
        if (existing) cb.checked = existing.checked;
        checkboxes.push(cb);
        row.append(cb);
        row.append(h('span',{style:'flex:1'}, fullName));
        row.append(h('span',{style:'font-size:11px;color:var(--text3)'}, (w.role || '').replace(/_/g,' ')));
        list.append(row);
      });
      if (list.children.length === 0) {
        list.innerHTML = '<p style="color:var(--text3);font-size:12px;text-align:center;padding:12px">No matches.</p>';
      }
    }
    search.oninput = renderList;
    renderList();
    modal.append(list);
  }

  const actions = h('div',{style:'display:flex;gap:8px;justify-content:flex-end;margin-top:14px'});
  actions.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  actions.append(h('button',{className:'btn',onclick:async()=>{
    // Collect checked worker IDs from the live DOM (the checkboxes array
    // accumulates across re-renders so dedupe by id).
    const seen = new Set();
    const ids = [];
    document.querySelectorAll('input[type="checkbox"][data-worker-id]').forEach(cb => {
      if (cb.checked && !seen.has(cb.dataset.workerId)) {
        seen.add(cb.dataset.workerId);
        ids.push(cb.dataset.workerId);
      }
    });
    if (ids.length === 0) return alert('Pick at least one worker.');
    if (workingDates.length === 0) return alert('This project has no working dates yet — set start_date and length first.');
    try {
      const r = await api(`/projects/${project.id}/assignments`, {
        method: 'POST',
        body: JSON.stringify({ worker_ids: ids, dates: workingDates }),
      });
      overlay.remove();
      if (onSaved) onSaved();
    } catch (err) { alert(err.message); }
  }},'Assign'));
  modal.append(actions);

  overlay.append(modal);
  document.body.append(overlay);
}

// ═══════════════════════════════════════════════════════════
// INVOICES & PURCHASE ORDERS

async function renderInvoicesPage(main) {
  const hdr=h('div',{className:'page-header'});
  hdr.append(h('h1',{},'Invoices'));
  main.append(hdr);

  // Summary cards and filter bar removed — the per-column filter row
  // beneath the table headers handles search and status filtering for
  // every column. Status badge is colored, so visual scanning stays easy.

  const content=h('div',{id:'inv-content'});
  main.append(content);

  async function loadInvoices() {
    content.innerHTML='Loading...';
    const params=new URLSearchParams();
    params.set('limit','200');
    try {
      const {invoices}=await api('/financials/invoices?'+params.toString());
      content.innerHTML='';
      if(!invoices.length) { content.innerHTML='<p style="color:var(--text2)">No invoices found.</p>'; return; }
      content.append(makeConfigTable('invoices_list',
        ['Invoice #','Project #','Bid #','Date','Customer','Project','Amount','Due Date','Status','Paid Date'],
        invoices.map(inv=>[
          fmtRefDoc(inv.invoice_number, inv.external_reference),

// ═══════════════════════════════════════════════════════════
// DATA EXPORT (cross-table query builder)
// ═══════════════════════════════════════════════════════════
// Sources to suppress in the Data Export picker AND in the scheduled-export
// builder. The backend still exposes them; the UI hides them so the two
// surfaces stay in sync.
const HIDDEN_EXPORT_SOURCES = new Set(['timesheets']);
function filterExportSources(srcMap) {
  return Object.fromEntries(Object.entries(srcMap).filter(([k]) => !HIDDEN_EXPORT_SOURCES.has(k)));
}

async function renderExports(main) {
  main.append(h('div',{className:'page-header'},[h('h1',{},'Data Export')]));

  const sources = filterExportSources(await api('/exports/builder/sources'));

  // ── State (column-picker) ────────────────────────────────
  let selectedSource = null;
  let selectedColumns = []; // ordered keys — drag-to-reorder mutates in place
  let columnSearch = '';

  // ── Scheduled section (top of page) ──────────────────────
  const scheduledContainer = h('div',{id:'exp-scheduled',style:'margin-bottom:24px'});
  main.append(scheduledContainer);

  function fmtRel(when) {
    const ms = Date.now() - new Date(when).getTime();
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const hr = Math.floor(m / 60);
    if (hr < 24) return hr + 'h ago';
    const d = Math.floor(hr / 24);
    return d + 'd ago';
  }

  function statusBadge(s) {
    if (!s.last_run_at) return h('span',{style:'color:var(--text3);font-size:11px'},'never run');
    const color = s.last_status === 'ok' ? 'var(--green)'
      : s.last_status === 'partial' ? 'var(--yellow)'
      : s.last_status === 'no_rows' ? 'var(--text3)'
      : 'var(--red)';
    const node = h('span',{style:'color:'+color+';font-size:11px'}, s.last_status + ' · ' + fmtRel(s.last_run_at));
    if (s.last_error) node.title = s.last_error;
    return node;
  }

  function scheduleActions(s, refresh) {
    const wrap = h('div',{style:'display:flex;gap:4px;flex-wrap:wrap'});
    wrap.append(h('button',{className:'btn btn-sm',style:'padding:2px 8px',title:'Compose & run now — opens the compose modal so you can tweak To / CC / Subject / Body before sending',onclick:()=>{
      composeEmailModal({
        context: 'saved_export_run',
        ids: { saved_export_id: s.id },
        title: `Run "${s.name}"`,
        onSend: (payload) => api('/exports/schedules/' + s.id + '/trigger', {
          method: 'POST',
          body: JSON.stringify(payload),
        }).then(r => {
          // Surface the export-run stats in the modal's "Sent" alert. The
          // modal's default uses generic delivery counts; for saved
          // exports we also have rowCount/skipped that's worth showing.
          const extra = r.skipped ? `, skipped ${r.skipped}` : '';
          alert(`Run complete: ${r.rowCount} rows · delivered ${r.delivered}, failed ${r.failed}${extra}`);
          refresh();
          return null; // suppress modal's own alert (we already showed one)
        }),
      });
    }},'▶'));
    wrap.append(h('button',{className:'btn-outline btn-sm',style:'padding:2px 8px',title:'Edit',onclick:()=>{
      // Rows with per-user fan-out keep the older, wider modal so their
      // extra config (role / filter column / admin recipients / formats)
      // stays editable. The simple builder is used for the common case.
      if (s.fanout_mode === 'per_user_role') {
        showScheduleModal({ mode:'edit', existing:s, onSaved:refresh });
      } else {
        showScheduledExportBuilder({ mode:'edit', existing:s, onSaved:refresh });
      }
    }},'✎'));
    wrap.append(h('button',{className:'btn-outline btn-sm',style:'padding:2px 8px',title:s.enabled?'Pause':'Resume',onclick:async()=>{
      try { await api('/exports/schedules/'+s.id,{method:'PATCH',body:JSON.stringify({enabled:!s.enabled})}); refresh(); }
      catch (e) { alert(e.message); }
    }}, s.enabled ? '⏸' : '▶'));
    wrap.append(h('button',{className:'btn-red btn-sm',style:'padding:2px 8px',title:'Delete',onclick:async()=>{
      if (!confirm('Delete saved export "' + s.name + '"?')) return;
      try { await api('/exports/schedules/'+s.id,{method:'DELETE'}); refresh(); }
      catch (e) { alert(e.message); }
    }},'×'));
    return wrap;
  }

  async function loadAndRenderSchedules() {
    scheduledContainer.innerHTML = '';
    const card = h('div',{style:'background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px'});
    const header = h('div',{style:'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap'});
    header.append(h('div',{},[
      h('div',{style:'font-size:14px;font-weight:700'},'Saved & Scheduled Exports'),
      h('div',{style:'font-size:11px;color:var(--text3)'},'Auto-emailed on schedule, or trigger anytime'),
    ]));
    header.append(h('button',{className:'btn',style:'padding:6px 12px',onclick:()=>{
      showScheduledExportBuilder({ mode:'create', onSaved: loadAndRenderSchedules });
    }},'+ Create scheduled export'));
    card.append(header);
    let schedules = [];
    try { const r = await api('/exports/schedules'); schedules = r.schedules || []; }
    catch (e) {
      card.append(h('p',{style:'color:var(--red);font-size:12px'},'Could not load: ' + e.message));
      scheduledContainer.append(card);
      return;
    }
    if (schedules.length === 0) {
      card.append(h('p',{style:'color:var(--text3);font-size:12px;margin:6px 0'},
        'No saved exports yet. Click "+ Create scheduled export" above to start.'));
    } else {
      const rows = schedules.map(s => [
        h('span',{style: s.enabled ? '' : 'opacity:0.5'}, s.name),
        sources[s.source] ? sources[s.source].label : s.source,
        s.cron || '— manual only —',
        (s.recipients || []).length + ' recipient' + ((s.recipients || []).length === 1 ? '' : 's'),
        statusBadge(s),
        scheduleActions(s, loadAndRenderSchedules),
      ]);
      card.append(makeTable(['Name','Source','Schedule','Recipients','Status',''], rows));
    }
    scheduledContainer.append(card);
  }

  await loadAndRenderSchedules();

  // ── Top bar ──────────────────────────────────────────────
  const topBar = h('div',{style:'display:flex;gap:12px;align-items:end;margin-bottom:20px;flex-wrap:wrap'});
  const sourceSel = h('select',{id:'exp-source',style:'width:240px'});
  sourceSel.append(h('option',{value:''},'Choose source...'));
  Object.entries(sources).forEach(([key,src])=>sourceSel.append(h('option',{value:key},src.label)));
  topBar.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Data Source'),sourceSel]));
  const startInput = makeDateInput({id:'exp-start',style:'width:140px'});
  const endInput = makeDateInput({id:'exp-end',style:'width:140px'});
  topBar.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'From'),startInput]));
  topBar.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'To'),endInput]));
  main.append(topBar);

  // ── Layout ───────────────────────────────────────────────
  const panels = h('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:20px'});
  const leftPanel = h('div',{id:'exp-left'});
  const rightPanel = h('div',{id:'exp-right'});
  panels.append(leftPanel); panels.append(rightPanel);
  main.append(panels);

  // ── Helpers ──────────────────────────────────────────────
  function findColumnMeta(key) {
    if (!selectedSource) return { group:'', label:key };
    const src = sources[selectedSource];
    for (const g of src.groups) {
      const c = g.columns.find(c => c.key === key);
      if (c) return { group: g.group, label: c.label };
    }
    return { group:'', label:key };
  }

  // ── Right panel: selected columns w/ drag-to-reorder ────
  function renderRight() {
    rightPanel.innerHTML = '';
    rightPanel.append(h('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px'},[
      h('div',{style:'font-size:14px;font-weight:700'},'Selected Columns ('+selectedColumns.length+')'),
      h('span',{style:'font-size:11px;color:var(--text3)'},'Drag to reorder — CSV column order matches this list'),
    ]));

    if (selectedColumns.length === 0) {
      rightPanel.append(h('p',{style:'color:var(--text3);font-size:13px'},
        "Check columns on the left. They'll appear here in the order the CSV will use."));
      return;
    }

    const list = h('div',{style:'margin-bottom:16px;max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:6px;background:var(--bg2)'});

    selectedColumns.forEach((key, idx) => {
      const info = findColumnMeta(key);
      const chip = h('div',{
        draggable: 'true',
        style: 'display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:4px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;font-size:12px;cursor:grab;user-select:none',
      });

      chip.ondragstart = (e) => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(idx));
        chip.style.opacity = '0.4';
      };
      chip.ondragend = () => { chip.style.opacity = '1'; };
      chip.ondragover = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        chip.style.borderTop = '2px solid var(--primary)';
      };
      chip.ondragleave = () => { chip.style.borderTop = '1px solid var(--border)'; };
      chip.ondrop = (e) => {
        e.preventDefault();
        chip.style.borderTop = '1px solid var(--border)';
        const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (Number.isNaN(from) || from === idx) return;
        // "Drop on chip N" inserts before N. When moving downward, the
        // splice-out shifts every later index down by 1, so subtract 1
        // from the target to land in the visually-correct slot.
        const to = from < idx ? idx - 1 : idx;
        const moved = selectedColumns.splice(from, 1)[0];
        selectedColumns.splice(to, 0, moved);
        renderRight();
      };

      chip.append(h('span',{style:'color:var(--text3);font-weight:700;font-size:14px;line-height:1'}, '⋮⋮'));
      chip.append(h('span',{style:'color:var(--primary);font-weight:600'}, info.group + ': '));
      chip.append(document.createTextNode(info.label));
      chip.append(h('span',{style:'flex:1'}));
      chip.append(h('span',{
        style:'cursor:pointer;color:var(--red);padding:0 4px;font-weight:700;font-size:14px',
        onclick: () => {
          selectedColumns.splice(idx, 1);
          const cb = document.querySelector('input.exp-col[data-col="' + cssEscape(key) + '"]');
          if (cb) cb.checked = false;
          // Refresh the relevant group's "all" checkbox too
          updateGroupAllCheckboxes();
          renderRight();
        },
      },'×'));
      list.append(chip);
    });
    rightPanel.append(list);

    const actions = h('div',{style:'display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap'});
    actions.append(h('button',{className:'btn',onclick:() => doDownload('csv')},'Download CSV'));
    actions.append(h('button',{className:'btn',onclick:() => doDownload('xlsx')},'Download Excel'));
    actions.append(h('button',{className:'btn',onclick:() => doDownload('pdf')},'Download PDF'));
    actions.append(h('button',{className:'btn-outline',onclick:doPreview},'Preview'));
    actions.append(h('button',{className:'btn-outline',title:'Run the export now and email the result to me only — does not save a schedule',onclick:doEmailMe},'📧 Email to me'));
    actions.append(h('button',{className:'btn-outline',title:'Open the scheduled-export builder pre-filled with the current source + selected columns',onclick:()=>{
      if (!selectedSource || selectedColumns.length === 0) return alert('Pick a source and columns first');
      showScheduledExportBuilder({
        mode: 'create',
        prefillSource: selectedSource,
        prefillColumns: selectedColumns.slice(),
        prefillFilters: {
          start_date: readDateInput(startInput) || undefined,
          end_date: readDateInput(endInput) || undefined,
        },
        onSaved: loadAndRenderSchedules,
      });
    }},'Save as scheduled export'));
    actions.append(h('button',{className:'btn-outline',style:'margin-left:auto',onclick:()=>{
      selectedColumns = [];
      $$('#exp-left input.exp-col').forEach(cb=>{cb.checked=false;});
      updateGroupAllCheckboxes();
      renderRight();
    }},'Clear All'));
    rightPanel.append(actions);
    rightPanel.append(h('div',{id:'exp-preview-area'}));
  }

  // ── Left panel: grouped available columns + search ──────
  let groupAllCheckboxes = []; // { cb, members: [cbs] }

  function updateGroupAllCheckboxes() {
    groupAllCheckboxes.forEach(({cb, members}) => {
      cb.checked = members.length > 0 && members.every(c => c.checked);
    });
  }

  function renderLeft() {
    leftPanel.innerHTML = '';
    if (!selectedSource) {
      leftPanel.append(h('p',{style:'color:var(--text3);font-size:13px'},
        'Pick a data source above to see available columns, grouped by their relationship to the source.'));
      return;
    }

    leftPanel.append(h('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px'},[
      h('div',{style:'font-size:14px;font-weight:700'},'Available Columns'),
      h('span',{style:'font-size:11px;color:var(--text3)'},'Grouped by relationship'),
    ]));

    const search = h('input',{
      type:'text', placeholder:'Filter columns…',
      style:'width:100%;padding:6px 10px;margin-bottom:10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px',
    });
    search.value = columnSearch;
    search.oninput = () => { columnSearch = search.value.toLowerCase(); renderGroups(); };
    leftPanel.append(search);

    const groupsContainer = h('div',{id:'exp-groups'});
    leftPanel.append(groupsContainer);

    function renderGroups() {
      groupsContainer.innerHTML = '';
      groupAllCheckboxes = [];
      const src = sources[selectedSource];

      src.groups.forEach((group, gi) => {
        const visibleCols = columnSearch
          ? group.columns.filter(c => c.label.toLowerCase().includes(columnSearch))
          : group.columns;
        if (visibleCols.length === 0) return;

        const isOpenDefault = gi === 0 || !!columnSearch;
        const card = h('div',{style:'background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden'});
        const header = h('div',{style:'display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);cursor:pointer;user-select:none'});
        const allCb = h('input',{type:'checkbox',style:'width:auto'});
        const arrow = h('span',{style:'color:var(--text3);font-size:11px'}, isOpenDefault ? '▼' : '▶');
        header.append(allCb); header.append(arrow);
        header.append(h('span',{style:'font-weight:700;font-size:13px;color:var(--primary)'}, group.group));
        header.append(h('span',{style:'font-size:11px;color:var(--text3);margin-left:auto'},
          visibleCols.length + ' col' + (visibleCols.length === 1 ? '' : 's')));
        card.append(header);

        const body = h('div',{style:'padding:6px 12px;display:' + (isOpenDefault ? 'block' : 'none')});
        const colCbs = [];
        visibleCols.forEach(col => {
          const row = h('label',{style:'display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;cursor:pointer'});
          const cb = h('input',{type:'checkbox',className:'exp-col',style:'width:auto'});
          cb.dataset.col = col.key;
          cb.checked = selectedColumns.includes(col.key);
          cb.onchange = () => {
            const ix = selectedColumns.indexOf(col.key);
            if (cb.checked && ix === -1) selectedColumns.push(col.key);
            else if (!cb.checked && ix !== -1) selectedColumns.splice(ix, 1);
            updateGroupAllCheckboxes();
            renderRight();
          };
          colCbs.push(cb);
          row.append(cb); row.append(document.createTextNode(col.label));
          body.append(row);
        });
        card.append(body);

        header.onclick = (e) => {
          if (e.target === allCb) return;
          const show = body.style.display === 'none';
          body.style.display = show ? 'block' : 'none';
          arrow.textContent = show ? '▼' : '▶';
        };

        allCb.checked = colCbs.length > 0 && colCbs.every(c => c.checked);
        allCb.onclick = (e) => {
          e.stopPropagation();
          colCbs.forEach(cb => {
            if (cb.checked === allCb.checked) return;
            cb.checked = allCb.checked;
            const k = cb.dataset.col;
            const ix = selectedColumns.indexOf(k);
            if (cb.checked && ix === -1) selectedColumns.push(k);
            else if (!cb.checked && ix !== -1) selectedColumns.splice(ix, 1);
          });
          renderRight();
        };

        groupAllCheckboxes.push({ cb: allCb, members: colCbs });
        groupsContainer.append(card);
      });
    }

    renderGroups();
  }

  // CSS.escape may not exist everywhere; fall back to a minimal version for
  // safe attribute-selector usage on column keys (which contain dots).
  function cssEscape(s) {
    if (window.CSS && window.CSS.escape) return window.CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c);
  }

  sourceSel.onchange = () => {
    selectedSource = sourceSel.value;
    selectedColumns = [];
    columnSearch = '';
    renderLeft();
    renderRight();
  };

  async function doPreview() {
    if (!selectedSource || selectedColumns.length === 0) return alert('Select a source and columns');
    const area = document.getElementById('exp-preview-area');
    if (!area) return;
    area.innerHTML = 'Loading…';
    try {
      const result = await api('/exports/builder/preview',{method:'POST',body:JSON.stringify({
        source:selectedSource, columns:selectedColumns,
        filters:{
          start_date: readDateInput(startInput) || undefined,
          end_date: readDateInput(endInput) || undefined,
        },
      })});
      area.innerHTML = '';
      area.append(h('p',{style:'font-size:11px;color:var(--text3);margin-bottom:6px'},
        result.rows.length + ' of ' + result.total + ' rows'));
      area.append(makeTable(result.headers, result.rows.map(r => r.map(v => v == null ? '' : String(v).substring(0,40)))));
    } catch (e) {
      area.innerHTML = '<p style="color:var(--red)">' + (e.message || 'Preview failed') + '</p>';
    }
  }

  async function doDownload(format = 'csv') {
    if (!selectedSource || selectedColumns.length === 0) return alert('Select a source and columns');
    try {
      const resp = await fetch('/api/exports/builder/download?format=' + encodeURIComponent(format), {method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.token},
        body:JSON.stringify({
          source:selectedSource, columns:selectedColumns,
          filters:{
            start_date: readDateInput(startInput) || undefined,
            end_date: readDateInput(endInput) || undefined,
          },
        })});
      if (!resp.ok) {
        // Surface server-side validation (unknown format, missing source, etc.)
        // instead of letting the failure return a non-CSV/XLSX blob that
        // looks like a corrupt download.
        const txt = await resp.text();
        throw new Error('Download failed: ' + (txt || resp.status));
      }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = selectedSource + '_export_' + new Date().toISOString().split('T')[0] + '.' + format;
      document.body.append(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (e) { alert(e.message); }
  }

  // "Email to me" — opens a small chooser then POSTs to /builder/email-me.
  // The chooser is needed because the user hasn't told us which format(s)
  // they want yet (Download buttons are format-explicit; this one isn't).
  async function doEmailMe() {
    if (!selectedSource || selectedColumns.length === 0) return alert('Select a source and columns');
    const choice = await pickFormatsModal('Email export to me');
    if (!choice) return; // cancelled
    try {
      const resp = await api('/exports/builder/email-me', { method: 'POST', body: JSON.stringify({
        source: selectedSource,
        columns: selectedColumns,
        filters: {
          start_date: readDateInput(startInput) || undefined,
          end_date: readDateInput(endInput) || undefined,
        },
        formats: choice,
      })});
      alert(`Sent ${resp.delivered}/${resp.delivered + resp.failed} email(s) to ${resp.to} — ${resp.rowCount} row${resp.rowCount === 1 ? '' : 's'}.`);
    } catch (e) { alert(e.message); }
  }

  // Small inline modal that resolves with the chosen ['csv','xlsx','pdf'] subset
  // or null on cancel. Used by Email-to-me and Send-test-now flows.
  function pickFormatsModal(title) {
    return new Promise((resolve) => {
      const overlay = h('div',{className:'modal-overlay'});
      const modal = h('div',{className:'modal',style:'max-width:360px'});
      modal.append(h('h3',{style:'margin-top:0'},title));
      modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:10px'},
        'Pick the attachment format(s) — one email per format.'));
      const cbs = {};
      [['csv','CSV'],['xlsx','Excel'],['pdf','PDF']].forEach(([k,lbl], idx) => {
        const row = h('label',{style:'display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0;cursor:pointer'});
        const cb = h('input',{type:'checkbox',style:'width:auto'});
        cb.checked = idx === 1; // Excel default
        cbs[k] = cb;
        row.append(cb); row.append(document.createTextNode(lbl));
        modal.append(row);
      });
      const actions = h('div',{style:'display:flex;gap:8px;justify-content:flex-end;margin-top:14px'});
      actions.append(h('button',{className:'btn-outline',onclick:()=>{overlay.remove();resolve(null);}},'Cancel'));
      actions.append(h('button',{className:'btn',onclick:()=>{
        const picks = ['csv','xlsx','pdf'].filter(k => cbs[k].checked);
        if (picks.length === 0) return alert('Pick at least one format');
        overlay.remove();
        resolve(picks);
      }},'Send'));
      modal.append(actions);
      overlay.append(modal);
      document.body.append(overlay);
    });
  }

  // ── Schedule modal (create / edit a saved_export) ────────
  function showScheduleModal({ mode, existing, prefill, onSaved }) {
    const initial = existing || prefill || {};
    const overlay = h('div',{className:'modal-overlay'});
    const modal = h('div',{className:'modal',style:'max-width:600px'});
    modal.append(h('h2',{},(mode === 'edit' ? 'Edit' : 'Save') + ' Scheduled Export'));

    const nameInp = h('input',{type:'text',placeholder:'e.g. Weekly P&L',value:initial.name||'',style:'width:100%'});
    modal.append(h('div',{style:'margin-bottom:10px'},[
      h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-bottom:2px'},'Name'),
      nameInp,
    ]));

    const sourceLabel = (initial.source && sources[initial.source]) ? sources[initial.source].label : (initial.source || '—');
    const colCount = (initial.columns || []).length;
    modal.append(h('div',{style:'background:var(--bg3);padding:8px 10px;border-radius:4px;margin-bottom:10px;font-size:12px;color:var(--text2)'},[
      h('div',{},'Source: ' + sourceLabel),
      h('div',{},'Columns: ' + colCount + ' selected'
        + (mode === 'edit' ? ' (to change, pick source + columns in the builder below and use "Save current config")' : '')),
    ]));

    const cronInp = h('input',{type:'text',placeholder:'leave blank for manual-only',value:initial.cron||'',style:'width:100%'});
    const chips = h('div',{style:'display:flex;gap:6px;flex-wrap:wrap;margin-top:4px'});
    const PRESETS = [
      {label:'Manual only', cron:''},
      {label:'Daily 8am UTC', cron:'0 8 * * *'},
      {label:'Weekly Mon 8am UTC', cron:'0 8 * * 1'},
      {label:'Monthly 1st 8am UTC', cron:'0 8 1 * *'},
    ];
    PRESETS.forEach(p => {
      chips.append(h('button',{className:'btn-outline btn-sm',style:'padding:2px 8px;font-size:11px',onclick:(e)=>{e.preventDefault();cronInp.value=p.cron;}}, p.label));
    });
    modal.append(h('div',{style:'margin-bottom:10px'},[
      h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-bottom:2px'},'Schedule (cron, server timezone)'),
      cronInp, chips,
    ]));

    const recipsContainer = h('div',{style:'border:1px solid var(--border);border-radius:4px;padding:6px;background:var(--bg)'});
    modal.append(h('div',{style:'margin-bottom:10px'},[
      h('label',{style:'display:block;font-size:12px;color:var(--text2);margin-bottom:2px'},'Recipients'),
      recipsContainer,
    ]));
    const selectedRecipients = new Set(initial.recipients || []);
    mountRecipientPicker(recipsContainer, selectedRecipients, { placeholder: 'Type a name or email…' });

    const enabledCb = h('input',{type:'checkbox',style:'width:auto'});
    enabledCb.checked = initial.enabled !== false;
    modal.append(h('label',{style:'display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:14px;cursor:pointer'},[
      enabledCb,
      document.createTextNode('Enabled (scheduled runs fire when checked; manual trigger always works)'),
    ]));

    // ── Per-export email config (PR #18) ─────────────────────
    // Scheduled exports diverge from other email triggers: each row
    // carries its own subject + body inline (not a global template).
    // Leaving the fields blank falls back to the legacy
    // saved_export_email template (PR #19 wiring).
    const emailFold = h('details',{style:'margin-bottom:14px;border:1px solid var(--border);border-radius:4px;padding:8px 10px'});
    emailFold.append(h('summary',{style:'cursor:pointer;font-size:12px;font-weight:600'},'Email subject + body (optional)'));
    emailFold.append(h('p',{style:'color:var(--text2);font-size:11px;margin:6px 0 8px'},
      'Customise the delivery email for this export. {{name}}, {{source}}, {{rowCount}}, {{whenUtc}} are substituted at send time. Leave blank to use the system default.'));
    const emailSubj = h('input',{type:'text',value:initial.email_subject||'',placeholder:'Scheduled export — {{name}}',
      style:'width:100%;font-family:JetBrains Mono,monospace;font-size:12px;margin-bottom:6px'});
    const emailBody = h('textarea',{
      style:'width:100%;min-height:120px;font-family:JetBrains Mono,monospace;font-size:11px;padding:6px;resize:vertical',
      placeholder:'<p>Your scheduled ConstructPM export <strong>{{name}}</strong> ran at {{whenUtc}} UTC and the CSV is attached.</p>'});
    emailBody.value = initial.email_body_html || '';
    const emailBodyText = h('textarea',{
      style:'width:100%;min-height:80px;font-family:JetBrains Mono,monospace;font-size:11px;padding:6px;resize:vertical',
      placeholder:'Plain-text fallback for clients that don’t render HTML (optional).'});
    emailBodyText.value = initial.email_body_text || '';
    emailFold.append(h('label',{style:'display:block;font-size:11px;color:var(--text2);margin-bottom:2px'},'Subject'));
    emailFold.append(emailSubj);
    emailFold.append(h('label',{style:'display:block;font-size:11px;color:var(--text2);margin-bottom:2px'},'Body (HTML)'));
    emailFold.append(emailBody);
    emailFold.append(h('label',{style:'display:block;font-size:11px;color:var(--text2);margin:6px 0 2px'},'Body (plain text — optional fallback)'));
    emailFold.append(emailBodyText);
    modal.append(emailFold);

    // ── Fan-out config (PR #20) ──────────────────────────────
    // Optional: send the report scoped per-user (one filtered run per
    // user with role X) plus an admin-consolidated copy. Sources without
    // userScopeColumns hide the section entirely.
    const fanoutFold = h('details',{style:'margin-bottom:14px;border:1px solid var(--border);border-radius:4px;padding:8px 10px'});
    fanoutFold.append(h('summary',{style:'cursor:pointer;font-size:12px;font-weight:600'},'Send a scoped copy per user (optional)'));
    fanoutFold.append(h('p',{style:'color:var(--text2);font-size:11px;margin:6px 0 8px'},
      'Each user with the chosen role receives a copy of this export filtered to rows where the selected column matches their user id. Optionally a consolidated copy goes to the admin team.'));

    const fanoutEnabledCb = h('input',{type:'checkbox',style:'width:auto'});
    fanoutEnabledCb.checked = initial.fanout_mode === 'per_user_role';
    fanoutFold.append(h('label',{style:'display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:8px;cursor:pointer'},[
      fanoutEnabledCb, document.createTextNode('Enable per-user fan-out'),
    ]));

    const fanoutBody = h('div',{style:'display:'+(fanoutEnabledCb.checked?'block':'none')});
    fanoutEnabledCb.onchange = () => { fanoutBody.style.display = fanoutEnabledCb.checked ? 'block' : 'none'; };

    const roleLbl = h('label',{style:'display:block;font-size:11px;color:var(--text2);margin-top:4px'},'Role to fan out to');
    const roleSel = h('select',{style:'width:100%;font-size:12px;margin-bottom:6px'});
    const colLbl = h('label',{style:'display:block;font-size:11px;color:var(--text2);margin-top:4px'},'Filter column (which row column matches each user)');
    const colSel = h('select',{style:'width:100%;font-size:12px;margin-bottom:6px'});
    fanoutBody.append(roleLbl); fanoutBody.append(roleSel);
    fanoutBody.append(colLbl); fanoutBody.append(colSel);

    const formatsRow = h('div',{style:'margin-top:8px;font-size:12px'});
    formatsRow.append(h('div',{style:'color:var(--text2);font-size:11px;margin-bottom:4px'},'File formats to generate (applies to per-user + admin consolidated)'));
    const initialFormats = Array.isArray(initial.export_formats) && initial.export_formats.length > 0
      ? new Set(initial.export_formats) : new Set(['csv']);
    const fmtBoxes = {};
    ['csv', 'xlsx', 'pdf'].forEach(f => {
      const box = h('label',{style:'display:inline-flex;align-items:center;gap:4px;margin-right:12px;cursor:pointer'});
      const cb = h('input',{type:'checkbox',style:'width:auto'});
      cb.checked = initialFormats.has(f);
      fmtBoxes[f] = cb;
      box.append(cb); box.append(document.createTextNode(f.toUpperCase()));
      formatsRow.append(box);
    });
    fanoutBody.append(formatsRow);

    const adminCb = h('input',{type:'checkbox',style:'width:auto'});
    adminCb.checked = !!initial.admin_consolidation;
    fanoutBody.append(h('label',{style:'display:flex;align-items:center;gap:6px;font-size:12px;margin-top:10px;cursor:pointer'},[
      adminCb, document.createTextNode('Also send a consolidated copy (every user\'s section combined) to admin recipients below'),
    ]));

    const adminRecipsContainer = h('div',{style:'border:1px solid var(--border);border-radius:4px;padding:6px;background:var(--bg);margin-top:4px'});
    fanoutBody.append(h('label',{style:'display:block;font-size:11px;color:var(--text2);margin-top:4px'},'Admin consolidated recipients'));
    fanoutBody.append(adminRecipsContainer);
    const selectedAdminRecipients = new Set(initial.admin_recipients || []);
    mountRecipientPicker(adminRecipsContainer, selectedAdminRecipients, { placeholder: 'Type a name or email…' });

    fanoutFold.append(fanoutBody);
    modal.append(fanoutFold);

    // Populate role + column dropdowns when source is set (initial.source
    // is already known by the time the modal renders).
    (async () => {
      if (!initial.source) {
        roleSel.append(h('option',{value:''},'(pick a source first)'));
        colSel.append(h('option',{value:''},'(pick a source first)'));
        fanoutEnabledCb.disabled = true;
        return;
      }
      try {
        const cfg = await api('/exports/builder/fanout-config?source=' + encodeURIComponent(initial.source));
        const cols = cfg.userScopeColumns || [];
        const roles = cfg.roles || [];
        if (cols.length === 0) {
          colSel.append(h('option',{value:''},'(this source has no user-scope columns)'));
          fanoutEnabledCb.disabled = true;
        } else {
          cols.forEach(c => colSel.append(h('option',{value:c.col}, c.label + ' — ' + c.col)));
          if (initial.fanout_filter_column) colSel.value = initial.fanout_filter_column;
        }
        roles.forEach(r => roleSel.append(h('option',{value:r}, r)));
        if (initial.fanout_role) roleSel.value = initial.fanout_role;
        else {
          // Preselect a defaultRole if the chosen column declares one.
          const def = cols.find(c => c.col === colSel.value);
          if (def && def.defaultRole && roles.includes(def.defaultRole)) roleSel.value = def.defaultRole;
        }
      } catch (e) {
        roleSel.append(h('option',{value:''},'(failed to load roles)'));
      }
    })();

    const actions = h('div',{style:'display:flex;gap:8px;justify-content:flex-end'});
    actions.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
