    const poVend=h('input',{placeholder:'Vendor',style:'width:150px'});
    const poTot=h('input',{placeholder:'Total',type:'text',inputmode:'decimal',style:'width:100px'});
    const poNote=h('input',{placeholder:'Notes (optional)',style:'flex:1;min-width:160px'});
    addRow.append(poNum,poVend,poTot,poNote,h('button',{className:'btn btn-sm',onclick:async()=>{
      if(!poNum.value.trim()) return alert('PO # required');
      try {
        await api('/financials/purchase-orders',{method:'POST',body:JSON.stringify({
          project_id:p.id, po_number:poNum.value, vendor:poVend.value,
          total:poTot.value, notes:poNote.value })});
        renderProjectDetail(main);
      } catch(e){ alert(e.message); }
    }},'Add PO'));
    poSection.append(addRow);
  }
  main.append(poSection);

  (async () => {
    try {
      const poData = await api('/purchase-orders?project_id=' + p.id);
      const pos = poData.purchase_orders || [];
      poList.innerHTML='';
      if (pos.length === 0) {
        poList.append(h('p',{style:'color:var(--text2);font-size:13px;font-style:italic'},
          poFeatureOn ? 'No purchase orders yet. Click Create PO above to add one.' : 'No purchase orders yet.'));
        return;
      }
      poList.append(makeTable(['PO #','Vendor','Total','Status','Notes',''],pos.map(po=>{
        const noteCell=h('input',{value:po.notes||'',placeholder:'—',style:'width:100%;font-size:12px;background:transparent;border:1px solid transparent'});
        noteCell.onfocus=()=>{noteCell.style.border='1px solid var(--border)';};
        noteCell.onblur=async()=>{
          noteCell.style.border='1px solid transparent';
          if((po.notes||'')===noteCell.value) return;
          try{ await api('/financials/purchase-orders/'+po.id+'/notes',{method:'PATCH',body:JSON.stringify({notes:noteCell.value})}); po.notes=noteCell.value; }
          catch(e){ alert(e.message); noteCell.value=po.notes||''; }
        };
        return [
          (poFeatureOn && po.file_path)
            ? h('a',{href:'#',style:'color:var(--primary);text-decoration:underline;cursor:pointer;font-family:monospace',onclick:(e)=>{e.preventDefault();downloadPO(po.id,po.po_number);}},po.po_number)
            : h('span',{style:'font-family:monospace'},po.po_number),
          po.vendor_name || po.vendor || '—',
          fmtD(po.total),
          h('span',{className:'status status-'+po.status},po.status),
          data.can_edit_notes ? noteCell : (po.notes||'—'),
          poFeatureOn ? h('button',{className:'btn-outline btn-sm',onclick:()=>downloadPO(po.id,po.po_number)},'Download') : '',
        ];
      })));
    } catch(e) {
      poList.innerHTML='';
      poList.append(h('p',{style:'color:var(--red)'},'Could not load POs: '+e.message));
    }
  })();
  } // end PO section

  // ─── Invoices section ───────────────────────────────────────
  // Always visible — same rationale as Purchase Orders above. Rolls up
  // to financials via the shared invoices table.
  {
  const invFeatureOn = featureEnabled('invoices_enabled');
  const invSection=h('div',{style:'margin-top:24px'});
  invSection.append(h('h3',{style:'margin:0 0 8px'},'Invoices'));
  const invList=h('div');

  if (!invFeatureOn && data.can_edit_notes) {
    const addRow=h('div',{style:'display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center'});
    const iNum=h('input',{placeholder:'Invoice #',style:'width:130px'});
    const iAmt=h('input',{placeholder:'Amount',type:'text',inputmode:'decimal',style:'width:100px'});
    const iNote=h('input',{placeholder:'Notes (optional)',style:'flex:1;min-width:160px'});
    addRow.append(iNum,iAmt,iNote,h('button',{className:'btn btn-sm',onclick:async()=>{
      if(!iNum.value.trim()) return alert('Invoice # required');
      try {
        await api('/financials/invoices',{method:'POST',body:JSON.stringify({
          project_id:p.id, invoice_number:iNum.value, amount:iAmt.value, notes:iNote.value })});
        renderProjectDetail(main);
      } catch(e){ alert(e.message); }
    }},'Add Invoice'));
    invSection.append(addRow);
  }
  invSection.append(invList);
  main.append(invSection);

  (async () => {
    try {
      const invData = await api('/financials/invoices?project_id=' + p.id + '&limit=100');
      const invs = invData.invoices || [];
      invList.innerHTML='';
      if (invs.length === 0) {
        invList.append(h('p',{style:'color:var(--text2);font-size:13px;font-style:italic'},'No invoices yet.'));
        return;
      }
      invList.append(makeTable(
        ['Invoice #','Date','Amount','Status','Notes'],
        invs.map(inv => {
          const noteCell=h('input',{value:inv.notes||'',placeholder:'—',style:'width:100%;font-size:12px;background:transparent;border:1px solid transparent'});
          noteCell.onfocus=()=>{noteCell.style.border='1px solid var(--border)';};
          noteCell.onblur=async()=>{
            noteCell.style.border='1px solid transparent';
            if((inv.notes||'')===noteCell.value) return;
            try{ await api('/financials/invoices/'+inv.id+'/notes',{method:'PATCH',body:JSON.stringify({notes:noteCell.value})}); inv.notes=noteCell.value; }
            catch(e){ alert(e.message); noteCell.value=inv.notes||''; }
          };
          return [
            fmtRefDoc(inv.invoice_number, inv.external_reference),
            fmtDtClick(inv.invoice_date),
            fmtD(inv.amount),
            h('span',{className:'status status-'+inv.status}, inv.status),
            data.can_edit_notes ? noteCell : (inv.notes||'—'),
          ];
        })
      ));
    } catch(e) {
      invList.innerHTML='';
      invList.append(h('p',{style:'color:var(--red)'},'Could not load invoices: '+e.message));
    }
  })();
  } // end Invoices section

  // ─── Timesheets section ─────────────────────────────────────
  if (featureEnabled('timesheets_enabled')) {
  const tsSection=h('div',{style:'margin-top:24px'});
  const tsHdr=h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'});
  tsHdr.append(h('h3',{},'Timesheets'));
  tsHdr.append(h('button',{className:'btn-outline btn-sm',onclick:()=>showTimesheetExportModal(p)},'Export Timesheets'));
  tsSection.append(tsHdr);
  const tsList=h('div');
  tsSection.append(tsList);
  main.append(tsSection);

  (async () => {
    try {
      const tsData = await api('/timesheets?project_id=' + p.id + '&limit=100');
      const sheets = tsData.timesheets || tsData || [];
      tsList.innerHTML='';
      if (sheets.length === 0) {
        tsList.append(h('p',{style:'color:var(--text2);font-size:13px;font-style:italic'},'No timesheets yet.'));
        return;
      }
      tsList.append(makeTable(
        // Confirmed column dropped — `timesheets.approved` is never set
        // to true by the current extraction-confirmation flow, so the
        // column rendered `—` for every row. Anything appearing in this
        // list has already been confirmed by definition (extractions
        // become timesheet rows only post-confirmation), so the column
        // wasn't carrying signal anyway. Removed to reduce noise.
        ['Worker','Classification','Week Ending','ST','OT','DT','Miles'],
        sheets.map(t => [
          t.worker_name || '—',
          t.classification || '—',
          fmtDtClick(t.work_date || t.week_ending),
          (t.st_hours || 0).toString(),
          (t.ot_hours || 0).toString(),
          (t.dt_hours || 0).toString(),
          (t.miles_driven || 0).toString(),
        ])
      ));
    } catch(e) {
      tsList.innerHTML='';
      tsList.append(h('p',{style:'color:var(--red)'},'Could not load timesheets: '+e.message));
    }
  })();
  } // end feature gate: timesheets_enabled
}

// Helper — download PO Excel (uses fetch with auth, then opens blob)
async function downloadPO(poId, poNumber) {
  try {
    const r = await fetch('/api/purchase-orders/'+poId+'/download',{
      headers:{'Authorization':'Bearer '+S.token}
    });
    if (!r.ok) {
      const errText = await r.text();
      return alert('Download failed: '+errText);
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'PO-'+poNumber+'.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  } catch(e) {
    alert('Download error: '+e.message);
  }
}

async function showCreatePOModal(project, onSaved) {
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:850px;max-height:90vh;overflow-y:auto'});
  modal.append(h('h2',{},'Create Purchase Order'));
  modal.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:16px'},`For project: ${project.name}`));

  // Upload-instead-of-build shortcut. For when the firm already has a PO
  // doc (PDF / image) — the inbox extraction pipeline pulls vendor + line
  // items out of it. Pre-binds project_id so the user doesn't have to
  // re-select it on the verify screen.
  const altRow = h('div', {style:'background:var(--bg3);padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap'});
  altRow.append(h('span', {style:'color:var(--text2)'}, 'Already have a PO doc? Upload it and the AI will pull out the vendor + line items.'));
  altRow.append(h('button', {
    className:'btn-outline btn-sm',
    type:'button',
    onclick: () => {
      const fi = document.createElement('input');
      fi.type = 'file';
      fi.accept = '.pdf,.png,.jpg,.jpeg,.tiff,.webp';
      fi.onchange = async () => {
        const f = fi.files[0]; if (!f) return;
        const fd = new FormData();
        fd.append('files', f);
        fd.append('project_id', project.id);
        try {
          const r = await apiUpload('/inbox/purchase-orders', fd);
          const ok = r.results?.filter(x=>x.status==='processed').length || 0;
          alert(ok ? 'Uploaded — verify the extraction in your inbox to confirm it.' : 'Upload failed.');
          overlay.remove();
          if (ok) navigate('inbox');
        } catch(e) { alert(e.message); }
      };
      fi.click();
    },
  }, '📎 Upload PDF instead'));
  modal.append(altRow);

  // Vendor section — searchable dropdown + inline-add
  const vendorSection=h('div',{className:'form-group'});
  vendorSection.append(h('label',{},'Vendor'));
  const vendorRow=h('div',{style:'display:flex;gap:8px;align-items:center'});
  const vendorSearch=h('input',{id:'po-vendor-search',placeholder:'Type to search vendors...',list:'po-vendor-list',autocomplete:'off'});
  const vendorDataList=h('datalist',{id:'po-vendor-list'});
  let selectedVendorId=null;
  let vendors=[];
  vendorRow.append(vendorSearch);
  const addVendorBtn=h('button',{type:'button',className:'btn btn-sm',onclick:()=>{$('#po-vendor-inline').style.display='block';}},'+');
  vendorRow.append(addVendorBtn);
  vendorSection.append(vendorRow);
  vendorSection.append(vendorDataList);

  // Inline-add vendor form
  const vendorInline=h('div',{id:'po-vendor-inline',style:'display:none;margin-top:8px;padding:10px;background:var(--bg3);border-radius:6px'});
  vendorInline.innerHTML=`
    <input id="nv-name" placeholder="Vendor name (required)" style="margin-bottom:6px">
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <input id="nv-contact" placeholder="Contact name">
      <input id="nv-email" placeholder="Email" type="email">
    </div>
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <input id="nv-phone" placeholder="Phone">
      <input id="nv-street" placeholder="Street">
    </div>
    <div style="display:flex;gap:6px">
      <input id="nv-town" placeholder="Town">
      <input id="nv-state" placeholder="State" style="width:60px">
      <input id="nv-zip" placeholder="Zip" style="width:90px">
    </div>
  `;
  const saveVendorBtn=h('button',{className:'btn btn-sm',style:'margin-top:6px',type:'button',onclick:async()=>{
    const name=$('#nv-name').value.trim();
    if(!name) return alert('Vendor name required');
    try {
      const v=await api('/vendors',{method:'POST',body:JSON.stringify({
        name,
        contact_name:$('#nv-contact').value,
        email:$('#nv-email').value,
        phone:$('#nv-phone').value,
        street:$('#nv-street').value,
        town:$('#nv-town').value,
        state:$('#nv-state').value,
        zip:$('#nv-zip').value,
      })});
      vendors.push(v);
      Cache.pushVendor(v);
      vendorDataList.append(h('option',{value:v.name}));
      vendorSearch.value=v.name;
      selectedVendorId=v.id;
      vendorInline.style.display='none';
    } catch(e){ alert(e.message); }
  }},'Save Vendor');
  vendorInline.append(saveVendorBtn);
  vendorSection.append(vendorInline);
  modal.append(vendorSection);

  // Resolve selected vendor on change
  vendorSearch.addEventListener('input',()=>{
    const match=vendors.find(v=>v.name.toLowerCase()===vendorSearch.value.toLowerCase());
    selectedVendorId=match?match.id:null;
  });

  // Load vendors
  (async()=>{
    try {
      const vd=await api('/vendors?limit=500');
      vendors=vd.vendors||[];
      vendors.forEach(v=>vendorDataList.append(h('option',{value:v.name})));
    } catch{}
  })();

  // Delivery date + notes
  const meta=h('div',{className:'form-grid',style:'margin-top:12px'});
  meta.innerHTML=`
    <div class="form-group"><label>Expected Delivery Date</label><input id="po-delivery" type="date"></div>
    <div class="form-group"><label>Tax Amount</label><input id="po-tax" type="number" step="0.01" value="0"></div>
    <div class="form-group"><label>Shipping Amount</label><input id="po-shipping" type="number" step="0.01" value="0"></div>
  `;
  modal.append(meta);
  modal.append(h('div',{className:'form-group',style:'margin-top:12px'},[
    h('label',{},'Notes'),
    h('textarea',{id:'po-notes',rows:2,placeholder:'Delivery instructions, special requirements...'}),
  ]));

  // Line items table
  modal.append(h('h3',{style:'margin-top:16px;margin-bottom:8px'},'Line Items'));
  const liContainer=h('div',{id:'po-li-container'});
  modal.append(liContainer);

  const lineItems=[]; // mutable working set
  function renderLineItems() {
    liContainer.innerHTML='';
    const tbl=h('table',{style:'width:100%;border-collapse:collapse'});
    tbl.innerHTML=`<thead><tr style="background:var(--bg3)">
      <th style="text-align:left;padding:6px">Description</th>
      <th style="width:70px;padding:6px">Qty</th>
      <th style="width:60px;padding:6px">Unit</th>
      <th style="width:90px;padding:6px">Unit Price</th>
      <th style="width:90px;padding:6px;text-align:right">Total</th>
      <th style="width:40px"></th>
    </tr></thead>`;
    const tbody=h('tbody');
    lineItems.forEach((li,idx)=>{
      const tr=h('tr',{style:'border-bottom:1px solid var(--border)'});
      tr.innerHTML=`
        <td style="padding:4px"><input value="${(li.description||'').replace(/"/g,'&quot;')}" data-idx="${idx}" data-field="description" style="width:100%"></td>
        <td style="padding:4px"><input value="${li.quantity||''}" type="number" step="0.01" data-idx="${idx}" data-field="quantity" style="width:100%"></td>
        <td style="padding:4px"><input value="${(li.unit||'ea').replace(/"/g,'&quot;')}" data-idx="${idx}" data-field="unit" style="width:100%"></td>
        <td style="padding:4px"><input value="${li.unit_price||''}" type="number" step="0.01" data-idx="${idx}" data-field="unit_price" style="width:100%"></td>
        <td style="padding:4px;text-align:right;font-family:monospace">${fmtD((parseFloat(li.quantity)||0)*(parseFloat(li.unit_price)||0))}</td>
      `;
      const removeBtn=h('button',{type:'button',className:'btn-red btn-sm',style:'padding:2px 8px',onclick:()=>{lineItems.splice(idx,1);renderLineItems();updateTotals();}},'×');
      const removeTd=h('td',{style:'padding:4px'});
      removeTd.append(removeBtn);
      tr.append(removeTd);
      tbody.append(tr);
    });
    tbl.append(tbody);
    liContainer.append(tbl);
    // Wire input changes
    $$('input[data-idx]',liContainer).forEach(inp=>{
      inp.oninput=()=>{
        const i=parseInt(inp.dataset.idx,10);
        const f=inp.dataset.field;
        lineItems[i][f]=inp.value;
        // Recompute the row total cell
        const cells=tbody.children[i].children;
        cells[4].textContent=fmtD((parseFloat(lineItems[i].quantity)||0)*(parseFloat(lineItems[i].unit_price)||0));
        updateTotals();
      };
    });
  }

  // Add line button
  const addLineBtn=h('button',{type:'button',className:'btn-outline btn-sm',style:'margin-top:8px',onclick:()=>{
    lineItems.push({description:'',quantity:1,unit:'ea',unit_price:0});
    renderLineItems();
  }},'+ Add Line Item');
  modal.append(addLineBtn);

  // Totals display
  const totalsDiv=h('div',{style:'margin-top:16px;padding:12px;background:var(--bg3);border-radius:6px;font-family:monospace'});
  totalsDiv.innerHTML=`
    <div style="display:flex;justify-content:space-between"><span>Subtotal:</span><span id="po-subtotal">$0.00</span></div>
    <div style="display:flex;justify-content:space-between"><span>Tax:</span><span id="po-tax-display">$0.00</span></div>
    <div style="display:flex;justify-content:space-between"><span>Shipping:</span><span id="po-shipping-display">$0.00</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:bold;border-top:1px solid var(--border);margin-top:6px;padding-top:6px"><span>TOTAL:</span><span id="po-total">$0.00</span></div>
  `;
  modal.append(totalsDiv);

  function updateTotals() {
    const sub=lineItems.reduce((s,li)=>s+(parseFloat(li.quantity)||0)*(parseFloat(li.unit_price)||0),0);
    const tax=parseFloat($('#po-tax').value)||0;
    const ship=parseFloat($('#po-shipping').value)||0;
    $('#po-subtotal').textContent=fmtD(sub);
    $('#po-tax-display').textContent=fmtD(tax);
    $('#po-shipping-display').textContent=fmtD(ship);
    $('#po-total').textContent=fmtD(sub+tax+ship);
  }

  // Wire tax/shipping recompute
  setTimeout(()=>{
    $('#po-tax').oninput=updateTotals;
    $('#po-shipping').oninput=updateTotals;
    // Start with 1 empty line
    if(lineItems.length===0) {
      lineItems.push({description:'',quantity:1,unit:'ea',unit_price:0});
      renderLineItems();
    }
  },0);

  // Submit + cancel
  const btns=h('div',{style:'display:flex;gap:12px;margin-top:20px'});
  btns.append(h('button',{className:'btn btn-green',onclick:async()=>{
    if(lineItems.length===0||lineItems.every(li=>!li.description)) return alert('Add at least one line item');
    if(!vendorSearch.value.trim()) return alert('Vendor required');
    try {
      const r=await api('/purchase-orders',{method:'POST',body:JSON.stringify({
        project_id: project.id,
        vendor_id: selectedVendorId,
        vendor_name: selectedVendorId ? null : vendorSearch.value.trim(),
        delivery_date: $('#po-delivery').value || null,
        tax_amount: parseFloat($('#po-tax').value)||0,
        shipping_amount: parseFloat($('#po-shipping').value)||0,
        notes: $('#po-notes').value,
        line_items: lineItems.filter(li=>li.description||li.quantity||li.unit_price),
      })});
      overlay.remove();
      alert('PO created: '+r.po_number);
      if(onSaved) onSaved();
    } catch(e){ alert(e.message); }
  }},'Create PO'));
  btns.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  modal.append(btns);

  overlay.append(modal);
  document.body.append(overlay);
}

async function showInvoiceGenModal(project) {
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:750px;max-height:90vh;overflow-y:auto'});
  modal.append(h('h2',{},'Generate Invoice'));
  modal.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:16px'},'Select a timesheet period. The system will pull hours, apply locked rates + markup + mileage, and create an invoice.'));

  // Upload-instead-of-generate shortcut. For when the firm already has an
  // invoice doc (PDF or scan) and just wants to file it under this project.
  // Routes the file through the same inbox + extraction pipeline used for
  // unbound uploads — but pre-binds the project_id so no extraction match
  // step is needed.
  const altRow = h('div', {style:'background:var(--bg3);padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap'});
  altRow.append(h('span', {style:'color:var(--text2)'}, 'Already have an invoice doc? Upload it and the AI will extract the fields.'));
  altRow.append(h('button', {
    className:'btn-outline btn-sm',
    type:'button',
    onclick: () => {
      const fi = document.createElement('input');
      fi.type = 'file';
      fi.accept = '.pdf,.png,.jpg,.jpeg,.tiff,.webp';
      fi.onchange = async () => {
        const f = fi.files[0]; if (!f) return;
        const fd = new FormData();
        fd.append('files', f);
        fd.append('project_id', project.id);
        try {
          const r = await apiUpload('/inbox/invoices', fd);
          const ok = r.results?.filter(x=>x.status==='processed').length || 0;
          alert(ok ? 'Uploaded — verify the extraction in your inbox to confirm it.' : 'Upload failed.');
          overlay.remove();
          if (ok) navigate('inbox');
        } catch(e) { alert(e.message); }
      };
      fi.click();
    },
  }, '📎 Upload PDF instead'));
  modal.append(altRow);

  // Date range + template
  const dateRow=h('div',{style:'display:flex;gap:12px;align-items:end;margin-bottom:16px;flex-wrap:wrap'});
  const startGroup=h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Period Start'),makeDateInput({id:'ig-start'})]);
  const endGroup=h('div',{},[h('label',{style:'font-size:12px;color:var(--text2)'},'Period End'),makeDateInput({id:'ig-end'})]);
  dateRow.append(startGroup); dateRow.append(endGroup);

  // Auto-default the start date to the day after the last invoice's period end.
  // Falls back to invoice_date if the period note isn't parseable; null on
  // first-invoice case (user picks manually). Defer-set via setTimeout so the
  // input is in the DOM before we touch its .value.
  setTimeout(async () => {
    try {
      const r = await api('/projects/' + project.id + '/last-invoice-end');
      if (r && r.last_end_date) {
        const d = new Date(r.last_end_date);
        if (!isNaN(d)) {
          d.setDate(d.getDate() + 1);
          setDateInput('ig-start', d.toISOString().split('T')[0]);
          // Tell the user where the date came from so they know it's a guess
          const note = h('div',{style:'font-size:11px;color:var(--text3);margin-top:4px'},
            r.source === 'period_note'
              ? `Day after last invoice (${r.invoice_number}). Adjust if needed.`
              : `Best-effort default — based on ${r.invoice_number}'s invoice date. Adjust if needed.`);
          startGroup.append(note);
        }
      }
    } catch {}
    // Default end-date to today
    if (!readDateInput($('#ig-end'))) setDateInput('ig-end', new Date().toISOString().split('T')[0]);
  }, 0);

  // Template selector
  const tplGroup=h('div',{});
  tplGroup.append(h('label',{style:'font-size:12px;color:var(--text2)'},'Invoice Template'));
  const tplSel=h('select',{id:'ig-template',style:'width:200px'});
  tplSel.append(h('option',{value:''},'No document (data only)'));
  try {
    const {templates}=await api('/users/me/templates');
    templates.filter(t=>t.template_type==='invoice').forEach(t=>tplSel.append(h('option',{value:t.id},t.template_name||t.original_filename)));
    // Also check admin templates
    try {
      const adminTpls=await api('/admin/templates');
      if(adminTpls.templates) adminTpls.templates.filter(t=>t.template_type==='invoice').forEach(t=>tplSel.append(h('option',{value:t.id},(t.template_name||t.original_filename)+' (admin)')));
    } catch{}
  } catch{}
  tplGroup.append(tplSel);
  dateRow.append(tplGroup);

  dateRow.append(h('button',{className:'btn',onclick:doPreview},'Preview'));
  modal.append(dateRow);

  // Upload template shortcut
  const uploadRow=h('div',{style:'margin-bottom:16px'});
  if(['admin','project_manager'].includes(S.user?.role)) {
    const uploadLink=h('span',{style:'font-size:12px;color:var(--primary);cursor:pointer;text-decoration:underline',onclick:()=>{
      const fi=document.createElement('input');fi.type='file';fi.accept='.docx';
      fi.onchange=async()=>{
        const file=fi.files[0]; if(!file) return;
        const fd=new FormData();fd.append('template',file);fd.append('name',file.name);fd.append('type','invoice');
        try{
          await fetch('/api/users/me/templates',{method:'POST',headers:{'Authorization':'Bearer '+S.token},body:fd});
          alert('Invoice template uploaded. Reopen this dialog to select it.');
        }catch(e){alert(e.message)}
      };fi.click();
    }},'Upload new invoice template (.docx)');
    uploadRow.append(uploadLink);
    uploadRow.append(h('span',{style:'font-size:11px;color:var(--text3);margin-left:8px'},'Merge fields: {Invoice Number}, {Invoice Date}, {Invoice Total}, {Customer Name}, {Billing Address}, {Project Name}, {Line Items}, {Markup Amount}, {Mileage Total}, {Payment Terms}'));
  }
  modal.append(uploadRow);

  const previewArea=h('div',{id:'ig-preview'});
  modal.append(previewArea);

  const btnRow=h('div',{style:'display:flex;gap:8px;margin-top:16px'});
  const confirmBtn=h('button',{className:'btn',style:'display:none',id:'ig-confirm'},'Confirm & Create Invoice');
  btnRow.append(confirmBtn);
  btnRow.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  modal.append(btnRow);

  let previewData=null;

  async function doPreview() {
    const start=readDateInput($('#ig-start')), end=readDateInput($('#ig-end'));
    if(!start||!end) return alert('Select start and end dates');
    previewArea.innerHTML='Loading...';
    try {
      previewData=await api('/projects/'+project.id+'/invoice-preview',{method:'POST',body:JSON.stringify({start_date:start,end_date:end})});

      previewArea.innerHTML='';

      const cards=h('div',{className:'cards',style:'margin-bottom:16px'});
      cards.append(makeCard('Invoice #',previewData.invoice_number,''));
      cards.append(makeCard('Timesheets',previewData.timesheet_count+' entries',start+' to '+end));
      cards.append(makeCard('Labor',fmtD(previewData.labor_subtotal),'Before markup'));
      cards.append(makeCard('Markup',fmtD(previewData.markup_amount),previewData.markup_pct+'%'));
      cards.append(makeCard('Mileage',fmtD(previewData.mileage_total),''));
      cards.append(makeCard('Invoice Total',fmtD(previewData.invoice_total),''));
      previewArea.append(cards);

      previewArea.append(h('h3',{style:'margin-bottom:8px'},'Line Items'));
      previewArea.append(makeTable(
        ['Description','Amount'],
        previewData.line_items.map(li=>[li.description,fmtD(li.total)])
      ));

      if(previewData.customer) {
        previewArea.append(h('p',{style:'font-size:12px;color:var(--text2);margin-top:8px'},
          `Bill to: ${previewData.customer.name} — ${[previewData.customer.billing_street,previewData.customer.billing_town,previewData.customer.billing_state].filter(Boolean).join(', ')}`));
      }

      confirmBtn.style.display='block';
      confirmBtn.onclick=async()=>{
        try {
          const result=await api('/projects/'+project.id+'/generate-invoice',{method:'POST',body:JSON.stringify({
            start_date:start, end_date:end, template_id:$('#ig-template').value||null,
          })});

          // Replace preview area with a success block + download button.
          // Don't auto-navigate — the PM might need to download the doc to
          // email it before leaving this screen.
          previewArea.innerHTML = '';
          const success = h('div', {style:'background:var(--green-bg);border:1px solid var(--green);padding:14px;border-radius:6px;margin-bottom:12px'});
          success.append(h('div', {style:'font-weight:600;color:var(--green);margin-bottom:6px'},
            '✓ Invoice ' + result.invoice.invoice_number + ' created — ' + fmtD(result.invoice.amount)));
          if (result.document_path) {
            success.append(h('div', {style:'font-size:12px;color:var(--text2)'}, 'Document saved to: ' + result.document_path));
          } else {
            success.append(h('div', {style:'font-size:12px;color:var(--text2)'}, 'No document generated (no template selected) — only the database record was created.'));
          }
          previewArea.append(success);

          const actionRow = h('div', {style:'display:flex;gap:8px;flex-wrap:wrap'});
          if (result.document_path && result.invoice && result.invoice.id) {
            const dlBtn = h('button', {
              className: 'btn',
              type: 'button',
              onclick: async () => {
                try {
                  const r = await fetch('/api/projects/' + project.id + '/invoices/' + result.invoice.id + '/download',
                    { headers: { 'Authorization': 'Bearer ' + S.token } });
                  if (!r.ok) return alert('Download failed: ' + (await r.text()));
                  const blob = await r.blob();
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  // Try to read the server's filename from Content-Disposition; fall back to a sensible default
                  const cd = r.headers.get('Content-Disposition') || '';
                  const m = cd.match(/filename\*?=(?:UTF-8'')?["']?([^"';]+)/i);
                  a.download = m ? decodeURIComponent(m[1]) : (result.invoice.invoice_number.replace(/[^a-zA-Z0-9._-]/g,'_') + '.docx');
                  a.href = url;
                  document.body.append(a);
                  a.click();
                  a.remove();
                  setTimeout(() => URL.revokeObjectURL(url), 1000);
                } catch(e) { alert('Download error: ' + e.message); }
              },
            }, '⬇ Download Invoice');
            actionRow.append(dlBtn);
          }
          actionRow.append(h('button', {
            className: 'btn-outline',
            type: 'button',
            onclick: () => { overlay.remove(); navigate('project-detail',{id:project.id}); },
          }, 'Close & return to project'));
          previewArea.append(actionRow);

          // Hide the original confirm button — the action has been completed
          confirmBtn.style.display = 'none';
        }catch(e){alert(e.message)}
      };
    } catch(e) { previewArea.innerHTML='<p style="color:var(--red)">'+e.message+'</p>'; }
  }

  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.append(modal);
  document.body.append(overlay);
}

  const downloadDocxBtn=h('button',{className:'btn-outline',style:'display:none',id:'te-download-docx'},'Download Word');

  btnRow.append(downloadDocxBtn);
  btnRow.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));

  async function doPreview() {
    const start=readDateInput($('#te-start')), end=readDateInput($('#te-end'));

    previewArea.innerHTML='Loading...';
    try {
      const data=await api('/projects/'+project.id+'/timesheet-preview',{method:'POST',body:JSON.stringify({start_date:start,end_date:end})});
      previewArea.innerHTML='';

      const cards=h('div',{className:'cards',style:'margin-bottom:16px'});
      cards.append(makeCard('Workers',data.worker_count,''));
      cards.append(makeCard('Entries',data.total_entries,start+' to '+end));
      cards.append(makeCard('Sheets',data.workers.length+1,'Summary + 1 per worker/week'));
      previewArea.append(cards);

      // Worker summary table
      previewArea.append(makeTable(
        ['Worker','Classification','Week Ending','Days','ST','OT','DT','Miles','Per Diem','Labor','Total'],
        data.workers.map(w=>{
          const labor=(w.st_hours||0)*(w.st_rate||0)+(w.ot_hours||0)*(w.ot_rate||0)+(w.dt_hours||0)*(w.dt_rate||0);
          return [
            w.worker_name,w.classification,fmtDtClick(w.week_ending),w.days_worked||5,
            parseFloat(w.st_hours||0).toFixed(1),parseFloat(w.ot_hours||0).toFixed(1),parseFloat(w.dt_hours||0).toFixed(1),
            parseFloat(w.miles_driven||0).toFixed(0),
            parseFloat(w.per_diem_total||0)>0?fmtD(w.per_diem_total):'—',
            fmtD(labor),fmtD(labor+parseFloat(w.mileage_cost||0)+parseFloat(w.per_diem_total||0)),
          ];
        })
      ));

      downloadXlsxBtn.style.display='block';
      downloadDocxBtn.style.display='block';

      async function downloadFormat(format, ext) {
        try {
          const resp=await fetch('/api/projects/'+project.id+'/export-timesheets',{
            method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.token},
            body:JSON.stringify({
              start_date:start, end_date:end, format,
              template_id: format === 'docx' ? ($('#te-template').value||null) : null,
            }),
          });
          if (!resp.ok) {
            const errText = await resp.text();
            return alert('Export failed: ' + errText);
          }
          const blob=await resp.blob();
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url;
          a.download='Timesheets_'+project.name.replace(/[^a-zA-Z0-9]/g,'_')+'_'+start+'.'+ext;
          document.body.append(a);a.click();a.remove();
          URL.revokeObjectURL(url);
        } catch(e) { alert(e.message); }
      }

      downloadXlsxBtn.onclick = () => downloadFormat('xlsx', 'xlsx');
      downloadDocxBtn.onclick = () => downloadFormat('docx', 'docx');
    }catch(e){previewArea.innerHTML='<p style="color:var(--red)">'+e.message+'</p>';}
  }

  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.append(modal);
  document.body.append(overlay);
}

async function renderActiveProjects(main) {
  main.append(h('div',{className:'page-header'},[h('h1',{},'Active Projects')]));

  // Filters
  const filterRow=h('div',{style:'display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end'});
  let pmFilter='', custFilter='', weekFilter='';
  const data=await api('/projects/active/summary');

  // Week selector — always shown if there's data
  if (data.available_weeks?.length > 0) {
    const weekSel=h('select',{style:'width:200px',onchange:(e)=>{weekFilter=e.target.value;reload();}});
    data.available_weeks.forEach((wk, idx) => {
      const date = new Date(wk + 'T00:00:00');
      const label = `Week ending ${date.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}` + (idx === 0 ? ' (most recent)' : '');
      const opt = h('option', {value: wk}, label);
      if (wk === data.resolved_week) opt.selected = true;
      weekSel.append(opt);
    });
    weekFilter = data.resolved_week || '';
    filterRow.append(h('div',{},[h('label',{style:'font-size:12px;color:var(--text2);display:block'},'Week'),weekSel]));
  } else {
    // No timesheet data at all — show note
    filterRow.append(h('div',{style:'font-size:12px;color:var(--text3);font-style:italic'},'No timesheet data yet — week filter will appear once timesheets exist.'));
  }

  if(data.pm_list?.length>0) {
    const pmField = smartFilter({
      id: 'ap-pm', label: 'PM', kind: 'pms',
      displayFn: u => `${u.first_name} ${u.last_name}`,
      onselect: (u) => { pmFilter = u.id; reload(); },
    });
    pmField.input.placeholder = 'All Project Managers';
    pmField.group.style.minWidth = '220px';
    filterRow.append(pmField.group);
  }
  if(data.customer_list?.length>0) {
    const custField = smartFilter({
      id: 'ap-customer', label: 'Customer', kind: 'customers',
      displayFn: c => c.name,
      onselect: (c) => { custFilter = c.id; reload(); },
    });
    custField.input.placeholder = 'All Customers';
    custField.group.style.minWidth = '240px';
    filterRow.append(custField.group);
  }
  if(filterRow.children.length>0) main.append(filterRow);

  const content=h('div',{id:'ap-content'});
  main.append(content);

  async function reload() {
    const params=new URLSearchParams();
    if(pmFilter) params.set('pm_id',pmFilter);
    if(custFilter) params.set('customer_id',custFilter);
    if(weekFilter) params.set('week_ending',weekFilter);
    const d=await api('/projects/active/summary?'+params.toString());
    renderCards(d.projects);
  }
  renderCards(data.projects);

  function renderCards(projects) {
    content.innerHTML='';
    if(!projects.length) { content.append(h('p',{style:'color:var(--text3)'},'No active projects.')); return; }

    projects.forEach(p=>{
      const card=h('div',{className:'card',style:'margin-bottom:16px;padding:16px;cursor:pointer',onclick:()=>navigate('project-detail',{id:p.id})});
      // Header
      const hdr=h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px'});
      hdr.append(h('div',{},[
        h('span',{style:'font-weight:700;font-size:16px'},p.name),
        h('span',{style:'font-size:12px;color:var(--text3);margin-left:8px'},p.customer_name||''),
      ]));
      hdr.append(h('span',{style:'font-size:12px;color:var(--text2)'},'PM: '+(p.pm_name||'—')));
      card.append(hdr);

      // Weekly stats
      const stats=h('div',{className:'cards',style:'margin-bottom:12px'});
      const totalHrs=p.week_st+p.week_ot+p.week_dt;
      stats.append(makeCard('This Week',totalHrs.toFixed(0)+' hrs',p.week_workers+' workers'));
      stats.append(makeCard('ST/OT/DT',p.week_st.toFixed(0)+'/'+p.week_ot.toFixed(0)+'/'+p.week_dt.toFixed(0),''));
      stats.append(makeCard('Contract',p.contract_value?fmtD(p.contract_value):'—',fmtCT(p.contract_type)));
      // Billed % — useful early warning that change orders may be coming.
      // 100%+ means revenue exceeds contract value; consider change order documentation.
      if (p.contract_value > 0) {
        const billedPct = parseFloat(p.percent_billed || 0);
        const billedSuffix = billedPct >= 100 ? '⚠️ over contract' : (billedPct >= 90 ? 'near completion' : '');
        const cardEl = makeCard('Billed', billedPct.toFixed(1) + '%', billedSuffix);
        if (billedPct >= 100) cardEl.style && (cardEl.style.borderLeft = '4px solid var(--yellow)');
        stats.append(cardEl);
      }
      if(featureEnabled('oil_samples_enabled') && p.oil_samples_pending>0) {
        stats.append(makeCard('Oil Samples',p.oil_samples_pending+' pending','⚠️ Awaiting return'));
      }
      card.append(stats);

      // Recent notes — display in author's local time (foreman wrote it,
      // PM reading it should see "the foreman's clock")
      if(featureEnabled('field_notes_enabled') && p.recent_notes?.length>0) {
        card.append(h('div',{style:'font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px'},'Recent Field Notes'));
        p.recent_notes.forEach(n=>{
          const dateEl = fmtDtClick(n.note_date, {tz: n.author_timezone, label: 'Author\'s local time'});
          dateEl.style && (dateEl.style.color = 'var(--primary)');
          card.append(h('div',{style:'font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)'},
            [dateEl, document.createTextNode(' '), h('span',{style:'color:var(--text2)'},(n.foreman_name||'')+': '),document.createTextNode(n.note_text.substring(0,120)+(n.note_text.length>120?'...':''))]
          ));
        });
      }
      content.append(card);
    });
  }
}

        samples.map(s=>[
          s.equipment_id_field||'—',
          s.equipment_location||'—',
          s.project_name||'—',
          s.foreman_name||'—',
          fmtDtClick(s.sample_date || s.submitted_at),
          h('span',{className:'status status-'+(s.status==='returned'?'active':s.status==='pending_return'?'pending':'draft')},s.status.replace(/_/g,' ')),

          }},'Snooze'):'',
        ])

    } catch(e) { content.innerHTML='<p style="color:var(--red)">'+e.message+'</p>'; }
  }

// PROJECT EDIT MODAL (click any project row → full edit UI)
// ═══════════════════════════════════════════════════════════
async function showProjectEditModal(projectId, onSaved) {
  const data=await api('/projects/'+projectId);
  const p=data.project;
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:650px;max-height:90vh;overflow-y:auto'});
  modal.append(h('h2',{},'Edit Project'));

  // Load dropdowns
  let customers=[],locations=[],pms=[];
  try{customers=(await api('/customers')).customers||[];}catch{}
  try{locations=(await api('/locations')).locations||[];}catch{}
  try{pms=(await api('/users/pms')).users||[];}catch{}

  const form=h('div',{className:'form-grid'});

  // Name
  form.append(h('div',{className:'form-group full'},[h('label',{},'Project Name'),h('input',{id:'pe-name',value:p.name||''})]));

  // PM dropdown
  const pmSel=h('select',{id:'pe-pm'});
  pms.forEach(u=>{const o=h('option',{value:u.id},u.first_name+' '+u.last_name);if(u.id===p.pm_id)o.selected=true;pmSel.append(o);});
  form.append(h('div',{className:'form-group'},[h('label',{},'Project Manager'),pmSel]));

  // Customer dropdown
  const custSel=h('select',{id:'pe-cust'});
  custSel.append(h('option',{value:''},'—'));
  customers.forEach(c=>{const o=h('option',{value:c.id},c.name);if(c.id===p.customer_id)o.selected=true;custSel.append(o);});
  form.append(h('div',{className:'form-group'},[h('label',{},'Customer'),custSel]));

  // Location dropdown
  const locSel=h('select',{id:'pe-loc'});
  locSel.append(h('option',{value:''},'—'));
  locations.forEach(l=>{const o=h('option',{value:l.id},l.name);if(l.id===p.location_id)o.selected=true;locSel.append(o);});
  form.append(h('div',{className:'form-group'},[h('label',{},'Location'),locSel]));

  // Other fields
  const fields=[
    ['Year','pe-year','number',p.year||2026],
    ['Contract Value','pe-val','number',p.contract_value||''],
    ['Payment Terms','pe-terms','text',p.payment_terms||''],
    ['Miles from HQ','pe-miles','number',p.miles_from_hq||''],
    ['Local Union','pe-union','text',p.local_union||''],
    ['Per Diem Rate','pe-perdiem','number',p.per_diem_rate||0],
    // Project Length replaced "Man Hours" — same role as the field on
    // the bid (`project_length_days`). Carries over to the project on
    // bid-won (see migration 20260510_004); editable here so PMs can
    // adjust if reality diverges from the original estimate.
    ['Project Length (days)','pe-length','number',p.project_length_days||''],
    // Manpower — referenced by the scheduler grid as
    // a guideline. Editable here so PMs can override the bid number.
    ['Manpower','pe-manpower','number',p.manpower||''],
  ];
  fields.forEach(([label,id,type,val])=>{
    form.append(h('div',{className:'form-group'},[h('label',{},label),h('input',{id,type,value:val})]));
  });

  // Contract type
  const ctSel=h('select',{id:'pe-ct'});
  ['','contract','tm'].forEach(v=>{const o=h('option',{value:v},v?fmtCT(v):'Not set');if(v===p.contract_type)o.selected=true;ctSel.append(o);});
  form.append(h('div',{className:'form-group'},[h('label',{},'Contract Type'),ctSel]));

  // Status
  const stSel=h('select',{id:'pe-status'});
  ['active','on_hold','completed','cancelled'].forEach(v=>{
    const o=h('option',{value:v}, v.replace('_',' '));
    if (v===p.status) o.selected=true;
    stSel.append(o);
  });
  form.append(h('div',{className:'form-group'},[h('label',{},'Status'),stSel]));

  // Date helper — pg's `date` columns return as full ISO strings ("2026-
  // 05-15T00:00:00.000Z") in some driver configs, but the HTML date input
  // only accepts YYYY-MM-DD and silently empties the field for any other
  // format. This is why the start date appeared wiped on every reopen.
  // Slicing the leading 10 chars normalizes both forms.
  const fmtDateInput = (d) => {
    if (!d) return '';
    const s = String(d);
    return s.length >= 10 ? s.slice(0, 10) : s;
  };

  // Dates
  form.append(h('div',{className:'form-group'},[h('label',{},'Start Date'),makeDateInput({id:'pe-start',value:fmtDateInput(p.start_date)})]));
  form.append(h('div',{className:'form-group'},[h('label',{},'End Date'),makeDateInput({id:'pe-end',value:fmtDateInput(p.end_date)})]));

  // Address + description
  form.append(h('div',{className:'form-group full'},[h('label',{},'Address'),h('input',{id:'pe-addr',value:p.address||''})]));
  form.append(h('div',{className:'form-group full'},[h('label',{},'Description'),h('textarea',{id:'pe-desc',rows:3,style:'width:100%'},p.description||'')]));

  modal.append(form);

  // Buttons
  const btns=h('div',{style:'display:flex;gap:8px;margin-top:16px'});
  btns.append(h('button',{className:'btn',onclick:async()=>{
    try {
      await api('/projects/'+projectId,{method:'PATCH',body:JSON.stringify({
        name:$('#pe-name').value,
        pm_id:$('#pe-pm').value||undefined,
        customer_id:$('#pe-cust').value||null,
        location_id:$('#pe-loc').value||null,
        year:parseInt($('#pe-year').value)||2026,
        contract_value:parseFloat($('#pe-val').value)||null,
        payment_terms:$('#pe-terms').value||null,
        miles_from_hq:parseFloat($('#pe-miles').value)||null,
        local_union:$('#pe-union').value||null,
        per_diem_rate:parseFloat($('#pe-perdiem').value)||0,
        project_length_days: parseInt($('#pe-length').value, 10) || null,
        manpower: parseInt($('#pe-manpower').value, 10) || null,
        contract_type:$('#pe-ct').value||null,
        status:$('#pe-status').value,
        start_date:readDateInput($('#pe-start'))||null,
        end_date:readDateInput($('#pe-end'))||null,
        address:$('#pe-addr').value||null,
        description:$('#pe-desc').value||null,
      })});
      alert('Project updated');
      overlay.remove();
      if(onSaved) onSaved();
    }catch(e){alert(e.message)}
  }},'Save Changes'));
  btns.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  modal.append(btns);

  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.append(modal);document.body.append(overlay);
}

// ═══════════════════════════════════════════════════════════
// NOTIFICATIONS
// ═══════════════════════════════════════════════════════════
async function renderNotifications(main) {
  const hdr=h('div',{className:'page-header'});
  hdr.append(h('h1',{},'Notifications'));
  const btns=h('div',{style:'display:flex;gap:8px'});
  btns.append(h('button',{className:'btn-outline btn-sm',onclick:async()=>{await api('/notifications/dismiss-informational',{method:'POST'});render()}},'Dismiss All Informational'));
  btns.append(h('button',{className:'btn-outline btn-sm',onclick:async()=>{await api('/notifications/read-all',{method:'POST'});render()}},'Mark All Read'));
  hdr.append(btns);
  main.append(hdr);

  const data=await api('/notifications?limit=50');
  const notifs=data.notifications||data;

  if(!notifs.length) { main.append(h('p',{style:'color:var(--text2)'},'No notifications.')); return; }

  notifs.forEach(n=>{
    // Build the class list:
    //   - notif-actionable / notif-informational drives base ⚡ prefix logic
    //   - notif-warning adds yellow border + colored title for high/urgent priority
    //     (used for soft-warning informationals like "Invoice overdue", "Revenue ≥ contract")
    const isWarning = n.priority === 'high' || n.priority === 'urgent';
    const cls = 'notif-item'
      + (n.read ? '' : ' unread')
      + ' notif-' + (n.category || 'informational')
      + (isWarning ? ' notif-warning' : '');
    const item=h('div',{className:cls,onclick:async()=>{
      if(!n.read) await api('/notifications/'+n.id+'/read',{method:'PATCH'});
      if(n.reference_type==='project') navigate('project-detail',{id:n.reference_id});
      else if(n.reference_type==='bid') navigate('bid-quote',{id:n.reference_id});
      else if(n.reference_type==='extraction') navigate('notifications');
      // Schedule notifications go to the calendar AND auto-open the
      // edit pop-up for the project (Pat's design: PMs land on the
      // calendar with the right pop-up already open so they confirm
      // working days in one click without hunting for the card).
      // Schedule notifications open the schedule-edit pop-up DIRECTLY
      // as a modal — no Scheduler tab navigation. Pat's refinement: the
      // PM should be able to edit the calendar card's schedule from
      // wherever they are, in one click, without context-switching to
      // the Scheduler tab. After save, refresh whatever they're on.
      else if(n.reference_type==='project_schedule') {
        showScheduleEditPopup(n.reference_id, () => render());
      }
      else render();
    }});
    // Symbol: ⚡ for actionable, ⚠️ for warning, nothing for plain informational
    const symbol = isWarning ? '⚠️ ' : (n.category === 'actionable' ? '⚡ ' : '');
    item.append(h('div',{className:'notif-title'}, symbol + n.title));
    item.append(h('div',{className:'notif-body'},n.body||''));
    const timeEl = fmtDtClick(n.created_at);
    if (timeEl.classList) timeEl.classList.add('notif-time');
    item.append(timeEl);
    main.append(item);
  });
}

async function renderEquipmentTickets(main) {
  main.innerHTML = '';

  const subtabs = ['Equipment Request','Equipment Maintenance','Active Tickets'];

  const tabBar = h('div',{style:'display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px'});

  function selectTab(name){
    active = name;
    [...tabBar.children].forEach(c=>{
      const on = c.textContent === name;
      c.style.borderBottom = on ? '2px solid var(--primary)' : '2px solid transparent';
      c.style.color = on ? 'var(--text)' : 'var(--text2)';
      c.style.fontWeight = on ? '600' : '400';
    });
    body.innerHTML='';
    if(name==='Equipment Request') etRequest(body);
    else if(name==='Equipment Maintenance') etMaintenance(body);
    else etActiveTickets(body);
  }
  subtabs.forEach(name=>{
    tabBar.append(h('div',{
      style:'padding:10px 16px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent',
      onclick:()=>selectTab(name),
    }, name));
  });
  main.append(tabBar);
  main.append(body);
  selectTab(active);
}

// ── Subtab 1: Equipment Request ──────────────────────────────
async function etRequest(c){
  c.innerHTML='<p>Loading…</p>';
  let projects=[];
  try { const r=await api('/projects?limit=500'); projects=r.projects||r||[]; } catch{}

  c.innerHTML='';
  c.append(h('p',{style:'color:var(--text2);font-size:13px;margin-bottom:14px'},
    'Create an equipment ticket. Pick a project to auto-fill location + site contact, then add equipment lines (quantity defaults to 1).'));

  // ── Ticket / project header fields ──
  const grid=h('div',{className:'form-grid'});
  const projSel=h('select',{id:'etr-project'});

  projects.forEach(p=>projSel.append(h('option',{value:p.id},(p.primary_number||p.name||p.id))));
  const pickup=h('input',{id:'etr-pickup',placeholder:'Pick up person'});
  const requestor=h('input',{id:'etr-requestor',placeholder:'Requestor name',value:(S.user?`${S.user.firstName||S.user.first_name||''} ${S.user.lastName||S.user.last_name||''}`.trim():'')});
  const locName=h('input',{id:'etr-locname',placeholder:'Location name'});
  const locAddr=h('input',{id:'etr-locaddr',placeholder:'Location address'});
  const scName=h('input',{id:'etr-scname',placeholder:'Site contact name'});
  const scPhone=h('input',{id:'etr-scphone',placeholder:'Site contact phone'});

  // Auto-fill location + site contact when a project is chosen
  projSel.onchange=async()=>{
    if(!projSel.value){ return; }
    try {
      const r=await api('/projects/'+projSel.value);
      const p=r.project||r;
      locName.value=p.location_name||p.address||'';
      locAddr.value=p.address||'';
      scName.value=p.site_contact_name||'';
      scPhone.value=p.site_contact_phone||'';
    } catch{}
  };

  [['Project',projSel],['Pick Up Person',pickup],['Requestor',requestor],
   ['Location Name',locName],['Location Address',locAddr],
   ['Site Contact Name',scName],['Site Contact Phone',scPhone]].forEach(([lab,el])=>{
    grid.append(h('div',{className:'form-group'},[h('label',{},lab),el]));
  });
  c.append(grid);

  // ── Cascading equipment line items (quick-bid style) ──
  c.append(h('h3',{style:'margin:18px 0 8px'},'Equipment'));
  let opts={types:[],subtypes:[],names:[],items:[]};
  try { opts=await api('/equipment-tickets/equipment-options'); }
  catch{ try{ opts=await api('/equipment-tickets/equipment-options'); }catch{} }

  const lines=[{quantity:1,equipment_type:'',equipment_subtype:'',equipment_name:'',manufacturer:''}];
  const tbl=h('table',{className:'data-table',style:'width:100%'});
  const tb=h('tbody');
  tbl.innerHTML='<thead><tr><th style="width:60px">Qty</th><th>Type</th><th>Subtype</th><th>Equipment Name</th><th>Manufacturer</th><th></th></tr></thead>';
  tbl.append(tb);
  c.append(tbl);

  // Datalist-backed inputs so the picker filters as you type. The four
  // equipment fields are bidirectional: changing any one narrows the
  // pool of matching items, and if exactly one item is left we backfill
  // the other three from it. Lets users start from whichever field they
  // know best (name, manufacturer, subtype...) without re-picking the
  // cascade top-down.
  function datalistOptions(arr){
    return [...new Set(arr.filter(Boolean))].sort().map(v=>`<option value="${(v+'').replace(/"/g,'&quot;')}"></option>`).join('');
  }
  function matchingItems(line){
    return (opts.items||[]).filter(it =>
      (!line.equipment_type || it.equipment_type === line.equipment_type) &&
      (!line.equipment_subtype || it.equipment_subtype === line.equipment_subtype) &&
      (!line.equipment_name || it.equipment_name === line.equipment_name) &&
      (!line.manufacturer || it.manufacturer === line.manufacturer)
    );
  }
  function filteredOpts(line){
    const items = matchingItems(line);
    return {
      types: [...new Set(items.map(i=>i.equipment_type))],
      subtypes: [...new Set(items.map(i=>i.equipment_subtype))],
      names: [...new Set(items.map(i=>i.equipment_name))],
      manufacturers: [...new Set(items.map(i=>i.manufacturer))],
    };
  }
  function renderLines(){
    tb.innerHTML='';
    lines.forEach((ln,i)=>{
      const fo=filteredOpts(ln);
      const tr=h('tr');
      tr.innerHTML=`
        <td><input type="text" inputmode="numeric" value="${parseInt(ln.quantity)||1}" data-i="${i}" data-f="quantity" style="width:50px"></td>
        <td><input data-i="${i}" data-f="equipment_type" list="etr-types-${i}" value="${(ln.equipment_type||'').replace(/"/g,'&quot;')}" placeholder="Type to filter…" style="max-width:160px">
            <datalist id="etr-types-${i}">${datalistOptions(fo.types)}</datalist></td>
        <td><input data-i="${i}" data-f="equipment_subtype" list="etr-subs-${i}" value="${(ln.equipment_subtype||'').replace(/"/g,'&quot;')}" placeholder="Type to filter…" style="max-width:160px">
            <datalist id="etr-subs-${i}">${datalistOptions(fo.subtypes)}</datalist></td>
        <td><input data-i="${i}" data-f="equipment_name" list="etr-names-${i}" value="${(ln.equipment_name||'').replace(/"/g,'&quot;')}" placeholder="Type to filter…" style="max-width:220px">
            <datalist id="etr-names-${i}">${datalistOptions(fo.names)}</datalist></td>
        <td><input data-i="${i}" data-f="manufacturer" list="etr-mfrs-${i}" value="${(ln.manufacturer||'').replace(/"/g,'&quot;')}" placeholder="Type to filter…" style="max-width:160px">
            <datalist id="etr-mfrs-${i}">${datalistOptions(fo.manufacturers)}</datalist></td>
        <td><button class="btn-red btn-sm" data-del="${i}" style="padding:2px 8px">×</button></td>`;
      tb.append(tr);
    });

    // Bind. `change` fires when a datalist suggestion is committed (or
    // the field blurs); `input` covers free-type filtering. We only
    // re-render + auto-fill on `change` to avoid a render thrash on every
    // keystroke — the datalist itself handles live filtering already.
    tb.querySelectorAll('input[data-f]').forEach(el => {
      const commit = () => {
        const i = parseInt(el.dataset.i), f = el.dataset.f;
        if (f === 'quantity') {
          lines[i][f] = parseInt(el.value) || 1;
          return;
        }
        lines[i][f] = el.value;
        // After any equipment-field commit, look at all items matching
        // every filled field. If exactly one item is left, the user has
        // implicitly identified the row — fill the unset fields. This is
        // the bidirectional autofill: pick a name and type/subtype/mfr
        // fill in; pick a manufacturer and name/type/subtype fill in (if
        // unambiguous), etc.
        const fields = ['equipment_type','equipment_subtype','equipment_name','manufacturer'];
        const match = matchingItems(lines[i]);
        if (match.length === 1) {
          fields.forEach(k => {
            if (!lines[i][k] && match[0][k]) lines[i][k] = match[0][k];
          });
        }
        renderLines();
      };
      el.onchange = commit;
      // Also handle blur for the keyboard-typed case where the user
      // typed a value that matches a datalist option exactly but didn't
      // click it (some browsers don't fire `change` then).
      el.onblur = commit;
    });
    tb.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      lines.splice(parseInt(b.dataset.del),1);
      if (lines.length === 0) lines.push({quantity:1,equipment_type:'',equipment_subtype:'',equipment_name:'',manufacturer:''});
      renderLines();
    });
  }
  renderLines();

  const addBtn=h('button',{className:'btn-outline btn-sm',style:'margin-top:8px',onclick:()=>{
    lines.push({quantity:1,equipment_type:'',equipment_subtype:'',equipment_name:'',manufacturer:''});
    renderLines();
  }},'+ Add line');
  c.append(addBtn);

  const submit=h('button',{className:'btn',style:'margin-top:16px;display:block',onclick:async()=>{
    const valid=lines.filter(l=>l.equipment_name||l.equipment_type);
    if(valid.length===0) return alert('Add at least one equipment line.');
    try {
      const r=await api('/equipment-tickets',{method:'POST',body:JSON.stringify({
        project_id:$('#etr-project').value||null,
        pickup_person:$('#etr-pickup').value,
        requestor_name:$('#etr-requestor').value,
        location_name:$('#etr-locname').value,
        location_address:$('#etr-locaddr').value,
        site_contact_name:$('#etr-scname').value,
        site_contact_phone:$('#etr-scphone').value,
        lines:valid,
      })});
      alert('Ticket #'+r.ticket_number+' created.');
      navigate('equipment-tickets',{sub:'Active Tickets'});
    } catch(e){ alert(e.message); }
  }},'Submit Ticket');
  c.append(submit);
}

// ── Subtab 2: Equipment Maintenance ──────────────────────────
async function etMaintenance(c){
  c.innerHTML='<p>Loading…</p>';
  let equip=[];
  // /api/equipment returns { items, days_ahead }. The old fallback to
  // `r` itself produced a truthy non-array (the wrapper object) and the
  // tab silently rendered empty.
  try { const r=await api('/equipment'); equip=r.items||r.equipment||(Array.isArray(r)?r:[]); } catch{}

  // Threshold settings (for the warning colors)
  let thr={};
  try {
    const g=await api('/admin/globals');
    const list=Array.isArray(g)?g:(g.variables||g.globals||[]);
    list.forEach(v=>{ if(v.key&&v.key.startsWith('equipment.')) thr[v.key.replace('equipment.','')]=parseInt(v.value,10); });
  } catch{}
  const certG=thr.cert_green_days??30, certY=thr.cert_yellow_days??14, certR=thr.cert_red_days??3;

  function daysUntil(d){ if(!d) return null; const t=new Date(); t.setHours(0,0,0,0);
    const x=new Date(String(d).slice(0,10)+'T00:00:00'); return Math.round((x-t)/86400000); }
  function certColor(d){ const n=daysUntil(d); if(n===null) return null;
    if(n<=certR) return 'var(--red,#c62828)'; if(n<=certY) return '#e6a700'; if(n<=certG) return '#2e7d32'; return null; }

  c.innerHTML='';

  // Warning banner — count of equipment with a cert in the alert window
  const warned=equip.map(e=>({e,col:certColor(e.rolled_cert_date||e.certification_date)})).filter(x=>x.col);
  if(warned.length){
    const red=warned.filter(w=>w.col.includes('c62828')||w.col.includes('red')).length;
    const banner=h('div',{style:`padding:12px 16px;border-radius:8px;margin-bottom:16px;font-weight:600;color:#fff;background:${red>0?'var(--red,#c62828)':'#e6a700'}`},
      `⚠ ${warned.length} piece(s) of equipment need certification attention`);
    const detail=h('div',{style:'display:none;margin-top:8px;font-weight:400;font-size:12px'});
    warned.forEach(w=>detail.append(h('div',{},
      `#${w.e.barcode_id} · ${w.e.equipment_name} · ${w.e.equipment_type||'—'}${w.e.equipment_subtype?' / '+w.e.equipment_subtype:''} · cert ${String(w.e.rolled_cert_date||w.e.certification_date||'—').slice(0,10)}`)));
    banner.style.cursor='pointer';
    banner.onclick=()=>{ detail.style.display=detail.style.display==='none'?'block':'none'; };
    banner.append(detail);
    c.append(banner);
  }

  // Search
  const searchRow=h('div',{style:'display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap'});
  const sId=h('input',{placeholder:'Equipment ID',style:'width:140px'});
  const sType=h('input',{placeholder:'Type',style:'width:140px'});
  const sSub=h('input',{placeholder:'Subtype',style:'width:140px'});
  searchRow.append(sId,sType,sSub);
  c.append(searchRow);

  const listDiv=h('div');
  c.append(listDiv);

  function draw(){
    const fId=sId.value.toLowerCase(), fT=sType.value.toLowerCase(), fS=sSub.value.toLowerCase();
    const rows=equip.filter(e=>
      (!fId||String(e.barcode_id||'').toLowerCase().includes(fId))&&
      (!fT||String(e.equipment_type||'').toLowerCase().includes(fT))&&
      (!fS||String(e.equipment_subtype||'').toLowerCase().includes(fS)));
    listDiv.innerHTML='';
    if(rows.length===0){ listDiv.append(h('p',{style:'color:var(--text2);font-style:italic'},'No equipment matches.')); return; }
    listDiv.append(makeTable(['ID','Name','Type','Subtype','Service','Cert','Flag',''],rows.map(e=>{
      const flagDot = e.flag
        ? h('span',{title:'Click to clear flag',style:`display:inline-block;width:14px;height:14px;border-radius:50%;cursor:pointer;background:${e.flag==='red'?'var(--red,#c62828)':'#e6a700'}`,
            onclick:async()=>{ if(!confirm('Clear the flag on '+e.barcode_id+'?')) return;
              try{ await api('/equipment/'+e.id+'/clear-flag',{method:'POST'}); etMaintenance(c); }catch(err){alert(err.message);} }})
        : '—';
      return [
        e.barcode_id, e.equipment_name, e.equipment_type||'—', e.equipment_subtype||'—',
        String(e.service_date||'—').slice(0,10),
        h('span',{style:certColor(e.rolled_cert_date||e.certification_date)?`color:${certColor(e.rolled_cert_date||e.certification_date)};font-weight:600`:''},String(e.rolled_cert_date||e.certification_date||'—').slice(0,10)),
        flagDot,
        h('button',{className:'btn-outline btn-sm',onclick:()=>showMaintRecords(e)},'Records'),
      ];
    })));
  }
  [sId,sType,sSub].forEach(i=>i.oninput=draw);
  draw();
}

async function showMaintRecords(equip){
  const overlay=h('div',{className:'modal-overlay'});
  const modal=h('div',{className:'modal',style:'max-width:640px'});
  modal.append(h('p',{},'Loading…'));
  overlay.append(modal); document.body.append(overlay);
  let data;
  try { data=await api('/equipment/'+equip.id+'/maintenance-records'); }
  catch(e){ modal.innerHTML=''; modal.append(h('p',{style:'color:var(--red)'},e.message)); return; }

  modal.innerHTML='';
  modal.append(h('h2',{},`${equip.barcode_id} — Maintenance Record`));
  modal.append(h('p',{style:'color:var(--text2);font-size:12px;margin-bottom:12px'},
    `${equip.equipment_name} · ${equip.equipment_type||'—'}${equip.equipment_subtype?' / '+equip.equipment_subtype:''}`));

  // Add entry — date defaults today, name defaults current user (editable),
  // cert copied from most recent record
  const lastCert=data.records[0]?.cert_date||'';
  const addBox=h('div',{style:'background:var(--bg3);padding:12px;border-radius:6px;margin-bottom:14px'});
  const dDate=makeDateInput({id:'mr-date',value:new Date().toISOString().slice(0,10)});
  const dName=h('input',{id:'mr-name',value:(S.user?`${S.user.firstName||S.user.first_name||''} ${S.user.lastName||S.user.last_name||''}`.trim():''),placeholder:'Entered by'});
  const dCert=makeDateInput({id:'mr-cert',value:lastCert?String(lastCert).slice(0,10):''});
  const dNotes=h('textarea',{id:'mr-notes',placeholder:'Notes',style:'width:100%;min-height:54px;margin-top:6px'});
  const dFlag=h('select',{id:'mr-flag'});
  ['','red','yellow'].forEach(f=>dFlag.append(h('option',{value:f},f?('Flag: '+f):'No flag')));
  const ar=h('div',{className:'form-grid'});
  ar.append(h('div',{className:'form-group'},[h('label',{},'Date of service'),dDate]));
  ar.append(h('div',{className:'form-group'},[h('label',{},'Entered by'),dName]));
  ar.append(h('div',{className:'form-group'},[h('label',{},'Cert date'),dCert]));
  ar.append(h('div',{className:'form-group'},[h('label',{},'Flag'),dFlag]));
  addBox.append(ar); addBox.append(dNotes);
  addBox.append(h('button',{className:'btn btn-sm',style:'margin-top:8px',onclick:async()=>{
    try {
      await api('/equipment/'+equip.id+'/maintenance-records',{method:'POST',body:JSON.stringify({
        date_of_service:readDateInput($('#mr-date'))||null,
        entered_by_name:$('#mr-name').value,
        cert_date:readDateInput($('#mr-cert'))||null,
        notes:$('#mr-notes').value,
        flag:$('#mr-flag').value||null,
      })});
      overlay.remove(); showMaintRecords(equip);
    } catch(e){ alert(e.message); }
  }},'Add Entry'));
  modal.append(addBox);

  if(data.records.length===0){
    modal.append(h('p',{style:'color:var(--text2);font-style:italic'},'No maintenance records yet.'));
  } else {
    modal.append(makeTable(['Date','By','Cert','Flag','Notes'],data.records.map(r=>[
      String(r.date_of_service).slice(0,10),
      r.entered_by_name||'—',
      r.cert_date?String(r.cert_date).slice(0,10):'—',
      r.flag||'—',
      r.notes||'—',
    ])));
  }
  const close=h('div',{style:'display:flex;justify-content:flex-end;margin-top:14px'});
  close.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Close'));
  modal.append(close);
}

// ── Subtab 3: Active Tickets (McDonald's board) ──────────────
async function etActiveTickets(c){
  c.innerHTML='<p>Loading…</p>';
  let data={count:0,tickets:[]};
  try { data=await api('/equipment-tickets/active'); } catch(e){ c.innerHTML=''; c.append(h('p',{style:'color:var(--red)'},e.message)); return; }

  c.innerHTML='';
  const hdr=h('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px'});
  hdr.append(h('div',{style:'color:var(--text2);font-size:13px'},'Tap a ticket to expand. Mark as picked up when the crew collects it.'));
  hdr.append(h('div',{style:'background:var(--primary);color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;font-size:16px'},
    `${data.count} Active`));
  c.append(hdr);

  if(data.tickets.length===0){
    c.append(h('p',{style:'color:var(--text2);font-style:italic'},'No active tickets.'));
    return;
  }

  const board=h('div',{style:'display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start'});
  data.tickets.forEach(t=>{
    const card=h('div',{style:'background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;width:260px;cursor:pointer'});
    const top=h('div',{style:'display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px'});
    top.append(h('span',{},'#'+t.ticket_number+' · '+(t.project_number||'—')));
    top.append(h('span',{style:'background:var(--primary);color:#fff;border-radius:12px;padding:1px 9px;font-size:12px'},String(t.total_quantity)));
    card.append(top);
    if(t.status==='filled') card.append(h('div',{style:'font-size:11px;color:#2e7d32;margin-bottom:6px'},'✓ Filled'));
    const mini=h('table',{style:'width:100%;font-size:12px'});
    t.lines.slice(0,6).forEach(l=>{
      const tr=h('tr');
      tr.innerHTML=`<td style="width:30px">${l.quantity}</td><td>${l.equipment_name||l.equipment_type||'—'}</td>`;
      mini.append(tr);
    });
    card.append(mini);
    // Filled/scanned list at the bottom
    let filled=[];
    if(t.lines[0]){ try{ filled=typeof t.lines[0].filled_items==='string'?JSON.parse(t.lines[0].filled_items):(t.lines[0].filled_items||[]); }catch{} }
    if(filled.length){
      card.append(h('div',{style:'margin-top:8px;font-size:11px;color:var(--text2);border-top:1px solid var(--border);padding-top:6px'},
        'Scanned: '+filled.map(f=>f.equipment_number||f.barcode_id).filter(Boolean).join(', ')));
    }
    card.onclick=()=>showTicketFull(t.ticket_number);
    board.append(card);
  });
  c.append(board);
}

async function refreshEquipmentList(content, canManage) {
  content.innerHTML = '';

  // Add-equipment form (admin + shop_staff only)
  if (canManage) {
    const form = h('div',{style:'background:var(--bg3);padding:16px;border-radius:8px;margin-bottom:20px'});
    form.append(h('h3',{style:'margin-bottom:12px'},'Add New Equipment'));
    form.innerHTML += `<div class="form-grid">
      <div class="form-group"><label>Barcode / Serial *</label><input id="eq-barcode" placeholder="Required"></div>
      <div class="form-group"><label>Name *</label><input id="eq-name" placeholder="e.g. Milwaukee M18 Drill"></div>
      <div class="form-group"><label>Manufacturer</label><input id="eq-mfr"></div>
      <div class="form-group"><label>Type</label><input id="eq-type" placeholder="e.g. Power Tool" list="eq-type-suggestions"></div>
      <div class="form-group"><label>Sub-type</label><input id="eq-subtype" placeholder="e.g. Drill"></div>
      <div class="form-group"><label>Cost ($)</label><input id="eq-cost" type="number" step="0.01" min="0" value="0"></div>
      <div class="form-group"><label>Cert Date</label><input id="eq-cert" type="date"></div>
      <div class="form-group"><label>Cert Alert (days before expiry)</label><input id="eq-cert-alert" type="number" value="30" min="0"></div>
    </div>
    <datalist id="eq-type-suggestions"></datalist>`;

    const submitBtn = h('button',{className:'btn',style:'margin-top:8px',onclick:async()=>{
      const barcode = $('#eq-barcode').value.trim();
      const name = $('#eq-name').value.trim();
      if (!barcode) return alert('Barcode/serial is required.');
      if (!name) return alert('Name is required.');
      try {
        await api('/equipment',{method:'POST',body:JSON.stringify({
          barcode_id: barcode,
          equipment_name: name,
          manufacturer: $('#eq-mfr').value || null,
          equipment_type: $('#eq-type').value || null,
          equipment_subtype: $('#eq-subtype').value || null,
          equipment_cost: parseFloat($('#eq-cost').value) || 0,
          certification_date: $('#eq-cert').value || null,
          cert_expiry_alert_days: parseInt($('#eq-cert-alert').value, 10) || 30,
        })});
        await refreshEquipmentList(content, canManage);
      } catch (e) { alert(e.message); }
    }},'+ Create Equipment');
    form.append(submitBtn);
    content.append(form);
  }

  // Equipment list
  try {
    // Use the flat (non-grouped) list for the management view — sorting/
    // filtering is more useful when everything is in one table.
    const data = await api('/equipment');
    // /api/equipment returns { items, days_ahead }. Older callers expected
    // { equipment: [...] }; keep both as fallbacks so a future shape change
    // doesn't silently blank the page like it did before.
    const items = data.items || data.equipment || (Array.isArray(data) ? data : []);

    // Populate type-suggestions datalist for the add form
    if (canManage) {
      const types = [...new Set(items.map(e => e.equipment_type).filter(Boolean))].sort();
      const dl = document.getElementById('eq-type-suggestions');
      if (dl) types.forEach(t => dl.append(h('option',{value:t})));
    }

    if (items.length === 0) {
      content.append(h('p',{style:'color:var(--text2);font-style:italic;padding:8px'},
        canManage ? 'No equipment yet — add your first item above.' : 'No equipment yet.'));
      return;
    }

    const headers = ['Barcode','Name','Manufacturer','Type','Sub-type','Cost','Status','Cert Date'];
    if (canManage) headers.push('');  // action column
    content.append(makeConfigTable('equipment_management',
      headers,
      items.map(e => {
        const row = [
          h('span',{style:'font-family:JetBrains Mono;font-size:12px'}, e.barcode_id),
          e.equipment_name,
          e.manufacturer || '—',
          e.equipment_type || '—',
          e.equipment_subtype || '—',
          fmtD(e.equipment_cost),
          h('span',{className:'status status-'+e.status}, e.status),
          fmtDtClick(e.certification_date),
        ];
        if (canManage) {
          const actions = h('div', {style:'display:flex;gap:4px'});
          actions.append(h('button',{
            className:'btn-outline btn-sm',
            style:'padding:2px 8px',
            onclick:()=>showEquipmentEditPopup(e, ()=>refreshEquipmentList(content, canManage)),
          },'Edit'));
          actions.append(h('button',{
            className:'btn-red btn-sm',
            style:'padding:2px 8px',
            onclick:async()=>{
              if (!confirm(`Delete equipment "${e.equipment_name}" (${e.barcode_id})?\n\nThis cannot be undone. Equipment with checkout history may be retired instead.`)) return;
              try {
                await api('/equipment/'+e.id,{method:'DELETE'});
                await refreshEquipmentList(content, canManage);
              } catch (err) { alert(err.message); }
            },
          },'Delete'));
          row.push(actions);
        }
        return row;
      })
    ));
  } catch (err) {
    console.error('[Equipment]', err);
    content.append(h('div', {style:'background:var(--red-bg);border:1px solid var(--red);padding:12px;border-radius:6px;color:var(--red);font-size:13px'},
      'Could not load equipment: ' + (err.message || 'unknown error')));
  }
}

  const notesLabel = h('label',{style:'display:block;margin-top:8px'},'Notes');
  const notesArea = h('textarea',{id:'eqe-notes',rows:'3',style:'width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:6px'}, item.notes || '');

  actions.append(h('button',{className:'btn-outline',onclick:()=>overlay.remove()},'Cancel'));
  actions.append(h('button',{className:'btn',onclick:async()=>{
    try {
      await api('/equipment/'+item.id,{method:'PATCH',body:JSON.stringify({
        equipment_name: $('#eqe-name').value,
        manufacturer: $('#eqe-mfr').value || null,
        equipment_type: $('#eqe-type').value || null,
        equipment_subtype: $('#eqe-subtype').value || null,
        equipment_cost: parseFloat($('#eqe-cost').value) || 0,
        certification_date: $('#eqe-cert').value || null,
        cert_expiry_alert_days: parseInt($('#eqe-cert-alert').value, 10) || 30,
        notes: $('#eqe-notes').value || null,
      })});
      overlay.remove();
      if (onSaved) onSaved();
    } catch (err) { alert(err.message); }
  }},'Save Changes'));
  modal.append(actions);

  overlay.append(modal);
  document.body.append(overlay);
