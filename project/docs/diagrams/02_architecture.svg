<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="Arial, Helvetica, sans-serif">
<title>ConstructPM architecture</title>
<desc>Layered architecture: vanilla JS SPA frontend, Express routes, models and services, PostgreSQL, with feature-flag and notification cross-cutting layers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="60" y="30" width="560" height="84" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="80" y="56" font-size="14" font-weight="500" fill="#0C447C">Frontend — vanilla JS SPA (index.html)</text>
<text x="80" y="76" font-size="12" fill="#185FA5">render() router · S.params · feature gating · makeDateInput</text>
<text x="80" y="96" font-size="12" fill="#185FA5">bid · quote · scheduler · equipment tickets · admin · superadmin</text>
<line x1="340" y1="114" x2="340" y2="144" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="144" width="560" height="84" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="80" y="170" font-size="14" font-weight="500" fill="#04342C">Express routes (/api)</text>
<text x="80" y="190" font-size="12" fill="#0F6E56">bids · projects · contacts · financials · scheduler</text>
<text x="80" y="210" font-size="12" fill="#0F6E56">equipment · equipment-tickets · admin · auth</text>
<line x1="340" y1="228" x2="340" y2="258" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="258" width="270" height="84" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="80" y="284" font-size="14" font-weight="500" fill="#26215C">Models</text>
<text x="80" y="304" font-size="12" fill="#534AB7">Bid · Project · Equipment</text>
<text x="80" y="324" font-size="12" fill="#534AB7">RateSheet · CustomerContact</text>

<rect x="350" y="258" width="270" height="84" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="370" y="284" font-size="14" font-weight="500" fill="#26215C">Services</text>
<text x="370" y="304" font-size="12" fill="#534AB7">Storage · Notification</text>
<text x="370" y="324" font-size="12" fill="#534AB7">Extraction · PDF (pdf-lib)</text>
<line x1="195" y1="342" x2="195" y2="372" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="485" y1="342" x2="485" y2="372" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="372" width="560" height="64" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="396" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">PostgreSQL — Knex</text>
<text x="340" y="416" text-anchor="middle" font-size="12" fill="#5F5E5A">bids · projects · equipment · maintenance · tickets · global_variables</text>

<rect x="60" y="466" width="270" height="64" rx="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="195" y="490" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Feature flags</text>
<text x="195" y="510" text-anchor="middle" font-size="12" fill="#854F0B">superadmin toggles, tab gating</text>

<rect x="350" y="466" width="270" height="64" rx="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="485" y="490" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Notifications</text>
<text x="485" y="510" text-anchor="middle" font-size="12" fill="#854F0B">schedule, ticket, deep-link</text>
</svg>
