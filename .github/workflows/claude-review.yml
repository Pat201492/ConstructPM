name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request. Focus on:
            - Bugs, logic errors, and edge cases
            - Security issues (injection, auth, secrets, OWASP top 10)
            - Performance problems
            - Test coverage for the changes
            - Consistency with the rest of the codebase

            Post a single review comment summarizing findings. Be concise.
            If the PR looks good, say so briefly rather than padding with nits.
          claude_args: '--model claude-opus-4-7'
